<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پخش زنده مؤسسه تعالی</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');

:root{
    --navy:#14233b;
    --blue:#1769aa;
    --text:#1b2738;
    --muted:#7b8797;
    --line:#e6ebf1;
    --bg:#f8fafc;
    --white:#fff;
    --red:#e53935;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:'Vazirmatn',Tahoma,sans-serif;
    background:
        radial-gradient(circle at 50% 5%,rgba(23,105,170,.045),transparent 32%),
        var(--bg);
    color:var(--text);
    min-height:100vh;
}

/* Header */
header{
    height:72px;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(230,235,241,.9);
    display:flex;
    align-items:center;
    padding:0 6%;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color:var(--navy);
}

.logo img{
    width:42px;
    height:42px;
    object-fit:contain;
}

.logo span{
    font-size:16px;
    font-weight:600;
}

/* Main */
main{
    min-height:calc(100vh - 132px);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:48px 20px 45px;
}

.live-box{
    width:min(900px,100%);
    text-align:center;
}

/* Title */
.live-title{
    margin-bottom:22px;
}

.live-title .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-bottom:9px;
    color:var(--blue);
    font-size:11px;
    font-weight:600;
}

.live-title .eyebrow::before{
    content:"";
    width:6px;
    height:6px;
    border-radius:50%;
    background:#2c91d2;
}

.live-title h1{
    color:var(--navy);
    font-size:28px;
    font-weight:700;
    letter-spacing:-.8px;
    margin-bottom:6px;
}

.live-title p{
    color:var(--muted);
    font-size:13px;
}

/* Video */
.live-frame{
    position:relative;
    width:100%;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:18px;
    padding:7px;
    box-shadow:
        0 18px 45px rgba(20,35,59,.07),
        0 3px 10px rgba(20,35,59,.025);
}

/* LIVE */
.live-badge{
    position:absolute;
    top:18px;
    right:18px;
    z-index:10;

    display:flex;
    align-items:center;
    gap:7px;

    padding:6px 11px;
    border-radius:7px;

    background:rgba(18,25,38,.88);
    color:#fff;

    font-family:Arial,sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:.7px;

    box-shadow:0 5px 18px rgba(0,0,0,.16);
    backdrop-filter:blur(8px);
}

.live-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--red);
    animation:livePulse 1.6s infinite;
}

@keyframes livePulse{
    0%{
        box-shadow:0 0 0 0 rgba(229,57,53,.55);
    }
    70%{
        box-shadow:0 0 0 6px rgba(229,57,53,0);
    }
    100%{
        box-shadow:0 0 0 0 rgba(229,57,53,0);
    }
}

/* Aparat */
.h_iframe-aparat_embed_frame{
    position:relative;
    overflow:hidden;
    border-radius:12px;
    background:#edf1f5;
}

.h_iframe-aparat_embed_frame .ratio{
    display:block;
    width:100%;
    height:auto;
}

.h_iframe-aparat_embed_frame iframe{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    border:0;
}

/* Links */
.links{
    margin-top:20px;
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}

.links a{
    min-width:105px;
    text-decoration:none;
    color:#536174;
    background:rgba(255,255,255,.75);
    border:1px solid var(--line);
    padding:8px 15px;
    border-radius:8px;
    font-size:12px;
    transition:.2s;
}

.links a:hover{
    color:var(--blue);
    background:#fff;
    border-color:#c9ddeb;
    transform:translateY(-1px);
}

/* Footer */
footer{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#9aa4b2;
    font-size:10px;
    border-top:1px solid #edf0f4;
    background:#fff;
}

/* Mobile */
@media(max-width:600px){

    header{
        height:66px;
        padding:0 18px;
    }

    .logo img{
        width:37px;
        height:37px;
    }

    .logo span{
        font-size:13px;
    }

    main{
        padding:34px 13px 35px;
    }

    .live-title h1{
        font-size:22px;
    }

    .live-title p{
        font-size:11px;
    }

    .live-frame{
        padding:5px;
        border-radius:13px;
    }

    .h_iframe-aparat_embed_frame{
        border-radius:9px;
    }

    .live-badge{
        top:12px;
        right:12px;
        padding:5px 9px;
        font-size:10px;
    }

    .live-dot{
        width:6px;
        height:6px;
    }

    .links{
        margin-top:16px;
    }

    .links a{
        min-width:auto;
        padding:7px 12px;
        font-size:11px;
    }
}
</style>
</head>

<body>

<header>
    <a href="https://tashacol.ir/" class="logo">
        <img src="https://tashacol.github.io/ir/icone.png" alt="مؤسسه تعالی">
        <span>مؤسسه تعالی اندیشه و رشد</span>
    </a>
</header>

<main>

    <section class="live-box">

        <div class="live-title">

            <div class="eyebrow">
                پخش زنده
            </div>

            <h1>پخش زنده مؤسسه تعالی</h1>

            <p>پخش زنده برنامه‌های مؤسسه</p>

        </div>

        <div class="live-frame">

            <div class="live-badge">
                <span class="live-dot"></span>
                LIVE
            </div>

            <div class="h_iframe-aparat_embed_frame">

                <span class="ratio" style="padding-top:57%"></span>

                <iframe
                    scrolling="no"
                    allowfullscreen="true"
                    webkitallowfullscreen="true"
                    mozallowfullscreen="true"
                    src="https://www.aparat.com/embed/live/irdadgostar">
                </iframe>

            </div>

        </div>

        <div class="links">

            <a href="https://tashacol.ir/">
                صفحه اصلی
            </a>

            <a href="https://tashacol.ir/site-map/doreha.html">
                دوره‌های آموزشی
            </a>

            <a href="https://tashacol.ir/site-map/resane.html">
                رسانه
            </a>

        </div>

    </section>

</main>

<footer>
    مؤسسه تعالی اندیشه و رشد
</footer>

</body>
</html>
