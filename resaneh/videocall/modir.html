<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود مدیر</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Tahoma, sans-serif; background: #0f172a; color: #e2e8f0;
           display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .box { background: #1e293b; padding: 40px; border-radius: 16px;
           box-shadow: 0 8px 30px rgba(0,0,0,0.5); text-align: center;
           width: 90%; max-width: 400px; }
    h1 { margin-bottom: 20px; font-size: 24px; }
    input { width: 100%; padding: 14px; margin-bottom: 16px;
            border: 2px solid #334155; border-radius: 8px;
            background: #0f172a; color: #fff; font-size: 16px; }
    .btn-primary { width: 100%; padding: 14px; background: #2563eb;
             color: white; border: none; border-radius: 8px;
             font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-primary:hover { background: #1d4ed8; }
    .error { color: #f87171; margin-top: 12px; font-size: 14px; }
    .hidden { display: none !important; }
    #meet { width: 100%; height: 100vh; position: fixed; top: 0; left: 0; }

    /* نوار کنترل */
    .controls-bar {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      display: flex; align-items: center; gap: 14px;
      padding: 12px 20px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 100px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      z-index: 999999;
    }
    .ctrl-btn {
      position: relative; width: 56px; height: 56px;
      border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.08); color: #f1f5f9;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none; padding: 0;
    }
    .ctrl-btn svg { width: 24px; height: 24px; pointer-events: none; }
    .ctrl-btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); }
    .ctrl-btn:active { transform: translateY(0) scale(0.96); }
    .ctrl-btn.off { background: linear-gradient(145deg, #ef4444, #dc2626); box-shadow: 0 4px 14px rgba(239, 68, 68, 0.5); }
    .ctrl-btn.danger { background: linear-gradient(145deg, #ef4444, #b91c1c); box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4); }
    .ctrl-btn.danger:hover { background: linear-gradient(145deg, #f87171, #dc2626); }
    .ctrl-btn.primary-accent { background: linear-gradient(145deg, #3b82f6, #2563eb); box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4); }
    .ctrl-btn.primary-accent:hover { background: linear-gradient(145deg, #60a5fa, #3b82f6); }
    .ctrl-btn::before {
      content: attr(data-tooltip);
      position: absolute; top: -42px; left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: rgba(15, 23, 42, 0.95); color: #f1f5f9;
      font-size: 12px; padding: 6px 12px; border-radius: 8px;
      white-space: nowrap; opacity: 0; pointer-events: none;
      transition: all 0.2s ease; border: 1px solid rgba(255, 255, 255, 0.1);
      font-family: Tahoma, sans-serif;
    }
    .ctrl-btn:hover::before { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* منوی سه نقطه */
    .more-menu {
      position: fixed; bottom: 100px; left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 24, 39, 0.95);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px; padding: 8px;
      min-width: 260px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      z-index: 999998;
    }
    .menu-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; width: 100%;
      background: transparent; border: none;
      color: #e2e8f0; font-size: 14px;
      font-family: Tahoma, sans-serif;
      border-radius: 8px; cursor: pointer;
      transition: 0.2s; text-align: right;
    }
    .menu-item:hover { background: rgba(255, 255, 255, 0.08); }
    .menu-item svg { width: 18px; height: 18px; flex-shrink: 0; }
    .menu-item.active { color: #fca5a5; background: rgba(239, 68, 68, 0.1); }
    .menu-divider { height: 1px; background: rgba(255, 255, 255, 0.06); margin: 6px 8px; }

    /* پنل شرکت‌کنندگان */
    #participantsPanel {
      position: fixed; top: 20px; left: 20px;
      width: 320px; max-height: 65vh; overflow-y: auto;
      background: rgba(17, 24, 39, 0.92);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px; padding: 18px;
      z-index: 999999;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    #participantsPanel h3 {
      font-size: 15px; margin-bottom: 14px; color: #f1f5f9;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 12px;
      display: flex; justify-content: space-between; align-items: center;
    }
    #participantsPanel .close-btn {
      background: transparent; border: none; color: #94a3b8;
      font-size: 18px; cursor: pointer; padding: 4px 8px;
      border-radius: 6px;
    }
    #participantsPanel .close-btn:hover { color: #f87171; }
    .participant-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px; margin-bottom: 8px;
      font-size: 13px;
    }
    .participant-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: 8px; color: #e2e8f0; }
    .kick-btn {
      background: rgba(239, 68, 68, 0.15); color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 14px; border-radius: 8px;
      cursor: pointer; font-size: 12px;
      font-family: Tahoma, sans-serif; font-weight: bold;
    }
    .kick-btn:hover { background: #dc2626; color: white; }

    @media (max-width: 500px) {
      .controls-bar { gap: 10px; padding: 10px 14px; bottom: 15px; }
      .ctrl-btn { width: 48px; height: 48px; }
      .ctrl-btn svg { width: 20px; height: 20px; }
      .ctrl-btn::before { display: none; }
      #participantsPanel { width: calc(100% - 30px); left: 15px; top: 15px; }
      .more-menu { min-width: 220px; }
    }
  </style>
</head>
<body>
  <div class="box" id="loginBox">
    <h1>🔐 ورود مدیر</h1>
    <input type="password" id="adminPassword" placeholder="رمز عبور">
    <button class="btn-primary" onclick="adminLogin()">ورود به اتاق مشاوره</button>
    <p class="error" id="errorMsg"></p>
  </div>

  <div id="meet" class="hidden"></div>

  <!-- نوار کنترل مدیر -->
  <div class="controls-bar hidden" id="customControls">
    <button class="ctrl-btn" id="btnMic" data-tooltip="میکروفون" onclick="toggleMic()">
      <svg id="iconMicOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
      <svg id="iconMicOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/>
        <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>

    <button class="ctrl-btn" id="btnCam" data-tooltip="دوربین" onclick="toggleCam()">
      <svg id="iconCamOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="23 7 16 12 23 17 23 7"/>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
      </svg>
      <svg id="iconCamOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
        <path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
    </button>

    <button class="ctrl-btn primary-accent" id="btnMore" data-tooltip="گزینه‌های بیشتر" onclick="toggleMoreMenu(event)">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <circle cx="12" cy="5" r="2"/>
        <circle cx="12" cy="12" r="2"/>
        <circle cx="12" cy="19" r="2"/>
      </svg>
    </button>

    <button class="ctrl-btn primary-accent" data-tooltip="شرکت‌کنندگان" onclick="toggleParticipantsPanel()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
    </button>

    <button class="ctrl-btn danger" data-tooltip="پایان تماس" onclick="hangup()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91" transform="rotate(135 12 12)"/>
      </svg>
    </button>
  </div>

  <!-- منوی سه نقطه -->
  <div class="more-menu hidden" id="moreMenu">
    <button class="menu-item" onclick="resetCamera()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="23 7 16 12 23 17 23 7"/>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
      </svg>
      <span>برگرداندن دوربین</span>
    </button>
    <div class="menu-divider"></div>
    <button class="menu-item" id="menuAudioOut" onclick="toggleIncomingAudio()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
      </svg>
      <span id="menuAudioOutLabel">قطع صدای ورودی</span>
    </button>
    <button class="menu-item" id="menuVideoIn" onclick="toggleIncomingVideo()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="23 7 16 12 23 17 23 7"/>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
      </svg>
      <span id="menuVideoInLabel">قطع ویدیوی دریافتی</span>
    </button>
  </div>

  <!-- پنل شرکت‌کنندگان -->
  <div id="participantsPanel" class="hidden">
    <h3>
      <span>👥 شرکت‌کنندگان</span>
      <button class="close-btn" onclick="toggleParticipantsPanel()">✕</button>
    </h3>
    <div id="participantsList"></div>
  </div>

  <script src="https://8x8.vc/vpaas-magic-cookie-2595f123dff048dba8c17bb1a441a83a/external_api.js"></script>
  <script>
    const SCRIPT_URL = "https://live-api.irtashacol.workers.dev/";
    const APP_ID = "vpaas-magic-cookie-2595f123dff048dba8c17bb1a441a83a";
    const ROOM_NAME = "consult-room";

    let api = null;
    let audioMuted = false;
    let videoMuted = false;
    let incomingAudioMuted = false;
    let incomingVideoHidden = false;
    let participants = [];
    let lobbyActivated = false;

    async function adminLogin() {
      const password = document.getElementById('adminPassword').value;
      const errorMsg = document.getElementById('errorMsg');
      if (!password) { errorMsg.textContent = "رمز را وارد کنید"; return; }

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'admin_login', password: password })
        });
        const data = await response.json();

        if (data.success) {
          document.getElementById('loginBox').classList.add('hidden');
          document.getElementById('meet').classList.remove('hidden');
          document.getElementById('customControls').classList.remove('hidden');
          startJitsi(data.token);
        } else {
          errorMsg.textContent = data.error || "خطا";
        }
      } catch (err) {
        errorMsg.textContent = "خطای ارتباط: " + err.message;
      }
    }

    function activateLobby() {
      if (!api || lobbyActivated) return;
      try {
        api.executeCommand('toggleLobby', true);
        lobbyActivated = true;
        console.log('✅ Lobby activated successfully');
      } catch(e) {
        console.error('❌ Lobby activation error:', e);
      }
    }

    function startJitsi(token) {
      const options = {
        roomName: ROOM_NAME,
        width: "100%", height: "100%",
        parentNode: document.getElementById("meet"),
        jwt: token,
        configOverwrite: {
          startWithAudioMuted: false,
          startWithVideoMuted: false,
          prejoinConfig: { enabled: false },
          toolbarButtons: [],
          disableDeepLinking: true,
          notifications: [],
          disableInviteFunctions: true,
          fileRecordingsEnabled: false,
          liveStreamingEnabled: false,
          lobby: {
            autoKnock: false,
            enableChat: true
          }
        },
        interfaceConfigOverwrite: { TOOLBAR_BUTTONS: [] }
      };
      api = new JitsiMeetExternalAPI("8x8.vc", options);

      api.addEventListener('videoConferenceJoined', () => {
        console.log('✅ Admin joined conference');
        setTimeout(activateLobby, 1500);
        setTimeout(activateLobby, 4000);
      });

      api.addEventListener('participantRoleChanged', (event) => {
        console.log('Role changed:', event.role);
        if (event.role === 'moderator') {
          setTimeout(activateLobby, 800);
        }
      });

      api.addEventListener('knockingParticipant', (event) => {
        console.log('🚪 Someone is knocking:', event);
      });

      api.addEventListener('audioMuteStatusChanged', (e) => {
        audioMuted = e.muted;
        updateMicButton();
      });

      api.addEventListener('videoMuteStatusChanged', (e) => {
        videoMuted = e.muted;
        updateCamButton();
      });

      api.addEventListener('participantJoined', () => {
        setTimeout(refreshParticipants, 500);
        setTimeout(activateLobby, 1000);
      });

      api.addEventListener('participantLeft', () => {
        setTimeout(refreshParticipants, 500);
        lobbyActivated = false;
        setTimeout(activateLobby, 1500);
      });

      setTimeout(refreshParticipants, 3000);
    }

    function updateMicButton() {
      const btn = document.getElementById('btnMic');
      const on = document.getElementById('iconMicOn');
      const off = document.getElementById('iconMicOff');
      if (audioMuted) {
        btn.classList.add('off'); on.style.display = 'none'; off.style.display = 'block';
      } else {
        btn.classList.remove('off'); on.style.display = 'block'; off.style.display = 'none';
      }
    }

    function updateCamButton() {
      const btn = document.getElementById('btnCam');
      const on = document.getElementById('iconCamOn');
      const off = document.getElementById('iconCamOff');
      if (videoMuted) {
        btn.classList.add('off'); on.style.display = 'none'; off.style.display = 'block';
      } else {
        btn.classList.remove('off'); on.style.display = 'block'; off.style.display = 'none';
      }
    }

    function toggleMic() { if (api) api.executeCommand('toggleAudio'); }
    function toggleCam() { if (api) api.executeCommand('toggleVideo'); }

    function toggleMoreMenu(event) {
      if (event) event.stopPropagation();
      document.getElementById('moreMenu').classList.toggle('hidden');
    }
    function closeMoreMenu() {
      setTimeout(() => document.getElementById('moreMenu').classList.add('hidden'), 120);
    }

    function resetCamera() {
      if (api && videoMuted) api.executeCommand('toggleVideo');
      closeMoreMenu();
    }

    function toggleIncomingAudio() {
      if (!api) return;
      incomingAudioMuted = !incomingAudioMuted;
      try { api.executeCommand('toggleAudioOutput'); } catch(e) { console.log(e); }
      updateMoreMenuLabels();
      closeMoreMenu();
    }

    function toggleIncomingVideo() {
      if (!api) return;
      incomingVideoHidden = !incomingVideoHidden;
      try {
        api.executeCommand('setReceiverVideoConstraint', incomingVideoHidden ? 0 : 360);
      } catch(e) { console.log(e); }
      updateMoreMenuLabels();
      closeMoreMenu();
    }

    function updateMoreMenuLabels() {
      const audioLabel = document.getElementById('menuAudioOutLabel');
      const videoLabel = document.getElementById('menuVideoInLabel');
      const audioBtn = document.getElementById('menuAudioOut');
      const videoBtn = document.getElementById('menuVideoIn');
      if (audioLabel) audioLabel.textContent = incomingAudioMuted ? 'وصل کردن صدای ورودی' : 'قطع صدای ورودی';
      if (videoLabel) videoLabel.textContent = incomingVideoHidden ? 'وصل کردن ویدیوی دریافتی' : 'قطع ویدیوی دریافتی';
      if (audioBtn) audioBtn.classList.toggle('active', incomingAudioMuted);
      if (videoBtn) videoBtn.classList.toggle('active', incomingVideoHidden);
    }

    document.addEventListener('click', (e) => {
      const menu = document.getElementById('moreMenu');
      const btn = document.getElementById('btnMore');
      if (!menu || !btn) return;
      if (menu.classList.contains('hidden')) return;
      if (!menu.contains(e.target) && !btn.contains(e.target)) menu.classList.add('hidden');
    });

    function hangup() {
      if (!api) return;
      if (confirm('آیا می‌خواهید جلسه را پایان دهید؟')) {
        api.executeCommand('hangup');
        setTimeout(() => window.location.reload(), 800);
      }
    }

    function toggleParticipantsPanel() {
      const panel = document.getElementById('participantsPanel');
      panel.classList.toggle('hidden');
      if (!panel.classList.contains('hidden')) refreshParticipants();
    }

    function refreshParticipants() {
      if (!api) return;
      try {
        participants = api.getParticipantsInfo() || [];
        renderParticipants();
      } catch (e) { console.log('Err:', e); }
    }

    function renderParticipants() {
      const container = document.getElementById('participantsList');
      if (!container) return;
      container.innerHTML = '';

      if (participants.length === 0) {
        const p = document.createElement('p');
        p.style.color = '#94a3b8';
        p.style.fontSize = '13px';
        p.style.textAlign = 'center';
        p.style.padding = '10px';
        p.textContent = 'شرکت‌کننده‌ای وجود ندارد';
        container.appendChild(p);
        return;
      }

      participants.forEach(p => {
        const displayName = p.displayName || 'بدون نام';
        const isModerator = p.role === 'moderator';

        const item = document.createElement('div');
        item.className = 'participant-item';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'name';
        nameSpan.textContent = displayName + (isModerator ? ' 👑' : '');
        item.appendChild(nameSpan);

        if (!isModerator) {
          const kickBtn = document.createElement('button');
          kickBtn.className = 'kick-btn';
          kickBtn.textContent = 'اخراج';
          kickBtn.addEventListener('click', () => kickUser(p.participantId, displayName));
          item.appendChild(kickBtn);
        }
        container.appendChild(item);
      });
    }

    function kickUser(participantId, name) {
      if (!api) return;
      if (confirm('آیا مطمئن هستید که می‌خواهید "' + name + '" را اخراج کنید؟')) {
        api.executeCommand('kickParticipant', participantId);
        setTimeout(refreshParticipants, 1000);
        lobbyActivated = false;
        setTimeout(activateLobby, 2000);
      }
    }

    document.getElementById('adminPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') adminLogin();
    });
  </script>
</body>
</html>
