    <!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <title>ورود به جلسه | سیستم تماس تصویری</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand-1: #6366f1;
      --brand-2: #8b5cf6;
      --brand-3: #06b6d4;
      --text: #1e293b;
      --muted: #64748b;
      --card: rgba(255, 255, 255, 0.85);
      --border: rgba(148, 163, 184, 0.25);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      inset: 0;
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      background: #f8fafc;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.18), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.15), transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.08), transparent 60%),
        linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
      z-index: -1;
    }

    #loginBox {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
      animation: fadeIn 0.6s ease;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px 32px;
      box-shadow:
        0 25px 50px -12px rgba(99, 102, 241, 0.15),
        0 4px 12px rgba(0, 0, 0, 0.04),
        0 0 0 1px rgba(255, 255, 255, 0.6) inset;
      text-align: center;
      animation: slideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .brand-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px -8px rgba(99, 102, 241, 0.55);
      position: relative;
    }

    .brand-logo::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(255,255,255,0.3), transparent 60%);
    }

    .brand-logo svg {
      width: 36px;
      height: 36px;
      color: #fff;
      position: relative;
      z-index: 1;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      color: #1e293b;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
      line-height: 1.5;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      line-height: 1.8;
    }

    .brand-subtitle span {
      display: inline-block;
      padding: 4px 12px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.12), rgba(139, 92, 246, 0.12));
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 100px;
      color: #4f46e5;
      font-size: 12px;
      font-weight: 600;
    }

    .form-label {
      display: block;
      text-align: right;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 16px;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 46px 14px 16px;
      background: #fff;
      border: 1.5px solid rgba(148, 163, 184, 0.3);
      border-radius: 14px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      transition: all 0.25s ease;
      outline: none;
    }

    .input-wrapper input::placeholder { color: #94a3b8; }

    .input-wrapper input:focus {
      border-color: var(--brand-1);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
    }

    .input-icon {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      pointer-events: none;
      transition: color 0.25s;
    }

    .input-wrapper input:focus + .input-icon { color: var(--brand-1); }

    .btn-primary {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px -6px rgba(99, 102, 241, 0.55);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 52px;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -6px rgba(99, 102, 241, 0.7);
    }

    .btn-primary:active:not(:disabled) { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.75; cursor: not-allowed; }

    .btn-primary .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .btn-primary.loading .spinner { display: block; }
    .btn-primary.loading .btn-text { display: none; }

    .error {
      color: #dc2626;
      margin-top: 14px;
      font-size: 13px;
      font-weight: 500;
      min-height: 18px;
      line-height: 1.6;
    }

    .hidden { display: none !important; }

    #loadingScreen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 80;
      gap: 24px;
      animation: fadeIn 0.4s ease;
      transition: opacity 0.5s ease;
    }

    #loadingScreen.fade-out { opacity: 0; pointer-events: none; }

    .loader-ring {
      width: 70px;
      height: 70px;
      position: relative;
    }

    .loader-ring::before,
    .loader-ring::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
    }

    .loader-ring::before {
      border-top-color: var(--brand-1);
      border-right-color: var(--brand-2);
      animation: spin 1s linear infinite;
    }

    .loader-ring::after {
      inset: 10px;
      border-bottom-color: var(--brand-3);
      border-left-color: var(--brand-2);
      animation: spin 0.7s linear infinite reverse;
    }

    .loader-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brand-1);
    }

    .loader-icon svg {
      width: 28px;
      height: 28px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .loader-text {
      color: #334155;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      line-height: 2;
    }

    .loader-text small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      margin-top: 6px;
    }

    .loader-dots {
      display: inline-block;
      width: 20px;
      text-align: right;
    }

    .loader-dots::after {
      content: '';
      animation: dots 1.4s steps(4, end) infinite;
    }

    #meet {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 50;
      background: #000;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    #meet.visible { opacity: 1; }

    #meet iframe {
      width: 100% !important;
      height: 100% !important;
      border: 0 !important;
      display: block !important;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.9); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }

    @media (max-width: 480px) {
      .login-card { padding: 32px 24px 26px; border-radius: 20px; }
      .brand-title { font-size: 18px; }
      .brand-logo { width: 64px; height: 64px; }
      .brand-logo svg { width: 32px; height: 32px; }
    }
  </style>
</head>
<body>

  <div id="loginBox">
    <div class="login-card">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 10l4.553-2.276A1 1 0 0 1 21 8.618v6.764a1 1 0 0 1-1.447.894L15 14v-4z"/>
          <rect x="3" y="6" width="12" height="12" rx="2" ry="2"/>
        </svg>
      </div>

      <h1 class="brand-title">مؤسسه تعالی اندیشه و رشد</h1>
      <div class="brand-subtitle">
        <span>سیستم تماس تصویری</span>
      </div>

      <label class="form-label">نام شما</label>
      <div class="input-wrapper">
        <input type="text" id="guestName" placeholder="نام خود را وارد کنید" autocomplete="name">
        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>

      <button class="btn-primary" id="loginBtn" onclick="guestLogin()">
        <span class="btn-text">ورود به جلسه</span>
        <span class="spinner"></span>
      </button>

      <p class="error" id="errorMsg"></p>
    </div>
  </div>

  <div id="loadingScreen" class="hidden">
    <div class="loader-ring">
      <div class="loader-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 10l4.553-2.276A1 1 0 0 1 21 8.618v6.764a1 1 0 0 1-1.447.894L15 14v-4z"/>
          <rect x="3" y="6" width="12" height="12" rx="2" ry="2"/>
        </svg>
      </div>
    </div>
    <div class="loader-text">
      <span id="loadingMessage">در حال اتصال به جلسه</span><span class="loader-dots"></span>
      <small id="loadingSub">لطفاً چند لحظه صبر کنید</small>
    </div>
  </div>

  <div id="meet"></div>

  <script src="https://8x8.vc/vpaas-magic-cookie-2595f123dff048dba8c17bb1a441a83a/external_api.js"></script>
  <script>
    const SCRIPT_URL = "https://live-api.irtashacol.workers.dev/";
    const APP_ID = "vpaas-magic-cookie-2595f123dff048dba8c17bb1a441a83a";
    const ROOM_NAME = "consult-room";
    const FULL_ROOM_NAME = APP_ID + "/" + ROOM_NAME;

    let api = null;

    function getRealHeight() {
      return window.visualViewport ? window.visualViewport.height : window.innerHeight;
    }

    function resizeMeet() {
      const meetEl = document.getElementById('meet');
      if (meetEl) {
        const h = getRealHeight();
        meetEl.style.height = h + 'px';
        meetEl.style.width = window.innerWidth + 'px';
        if (api && typeof api.executeCommand === 'function') {
          try {
            api.executeCommand('resize', { width: window.innerWidth, height: h });
          } catch(e) {}
        }
      }
    }

    window.addEventListener('resize', resizeMeet);
    window.addEventListener('orientationchange', () => setTimeout(resizeMeet, 300));
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', resizeMeet);
      window.visualViewport.addEventListener('scroll', resizeMeet);
    }

    function setLoadingMessage(msg, sub) {
      document.getElementById('loadingMessage').textContent = msg;
      if (sub) document.getElementById('loadingSub').textContent = sub;
    }

    function showLoadingScreen() {
      const el = document.getElementById('loadingScreen');
      el.classList.remove('hidden');
      el.classList.remove('fade-out');
      el.style.display = 'flex';
      el.style.opacity = '1';
    }

    function hideLoadingScreen() {
      const el = document.getElementById('loadingScreen');
      if (el.style.display === 'none') return;
      el.classList.add('fade-out');
      setTimeout(() => { el.style.display = 'none'; }, 500);
    }

    function revealMeet() {
      document.getElementById('meet').classList.add('visible');
    }

    function setLoginLoading(isLoading) {
      const btn = document.getElementById('loginBtn');
      const input = document.getElementById('guestName');
      if (isLoading) {
        btn.classList.add('loading');
        btn.disabled = true;
        input.disabled = true;
      } else {
        btn.classList.remove('loading');
        btn.disabled = false;
        input.disabled = false;
      }
    }

    async function guestLogin() {
      const userName = document.getElementById('guestName').value.trim() || "مراجع";
      const errorMsg = document.getElementById('errorMsg');

      errorMsg.textContent = "";
      setLoginLoading(true);

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'guest_login', userName: userName })
        });
        const data = await response.json();

        if (data.success) {
          document.getElementById('loginBox').classList.add('hidden');
          showLoadingScreen();
          setLoadingMessage("در حال اتصال به اتاق مشاوره", "لطفاً چند لحظه صبر کنید");

          // Jitsi رو زیر لودینگ لود کن
          resizeMeet();
          startJitsi(data.token);

          // ✅ راه‌حل: بعد از ۳ ثانیه لودینگ رو محو کن و صفحه Jitsi رو نشون بده
          // (حتی اگر کاربر هنوز در اتاق انتظار باشه)
          setTimeout(() => {
            hideLoadingScreen();
            revealMeet();
            setLoadingMessage("در اتاق انتظار هستید", "منتظر تأیید مدیر باشید");
          }, 3000);
        } else {
          setLoginLoading(false);
          errorMsg.textContent = "خطا در ورود. لطفاً دوباره تلاش کنید";
        }
      } catch (err) {
        setLoginLoading(false);
        errorMsg.textContent = "خطا در ارتباط با سرور: " + err.message;
      }
    }

    function startJitsi(token) {
      const h = getRealHeight();
      const options = {
        roomName: FULL_ROOM_NAME,
        width: window.innerWidth,
        height: h,
        parentNode: document.getElementById("meet"),
        jwt: token,
        configOverwrite: {
          startWithAudioMuted: true,
          startWithVideoMuted: false,
          prejoinConfig: { enabled: false },
          toolbar: {
            alwaysVisible: true,
            timeout: 0,
            autoHideWhileChatIsOpen: false,
            buttons: [
              'microphone', 'camera', 'chat',
              'participants-pane', 'raisehand', 'tileview',
              'filmstrip', 'fullscreen', 'settings', 'hangup'
            ]
          },
          toolbarConfig: { alwaysVisible: true, timeout: 0 },
          disableMobileAppPromo: true,
          disableTileEnlargement: false,
          requireDisplayName: false,
          enableWelcomePage: false,
          enableClosePage: false,
          mobile: { autoHideToolbar: false }
        },
        interfaceConfigOverwrite: {
          TOOLBAR_ALWAYS_VISIBLE: true,
          TOOLBAR_TIMEOUT: 2147483647,
          SHOW_JITSI_WATERMARK: false,
          SHOW_WATERMARK_FOR_GUESTS: false,
          MOBILE_APP_PROMO: false,
          DISABLE_JOIN_LEAVE_NOTIFICATIONS: false,
          VERTICAL_FILMSTRIP: false,
          FILMSTRIP_BREAKPOINTS: [],
          DEFAULT_BACKGROUND: "#f8fafc",
          DISABLE_FOCUS_INDICATOR: true
        }
      };

      api = new JitsiMeetExternalAPI("8x8.vc", options);

      // وقتی مدیر تأیید کرد و وارد اتاق اصلی شد
      api.addEventListener('videoConferenceJoined', () => {
        resizeMeet();
        // اطمینان از مخفی بودن لودینگ و نمایش Jitsi
        hideLoadingScreen();
        revealMeet();
      });

      setInterval(() => {
        const curH = getRealHeight();
        if (Math.abs(parseInt(document.getElementById('meet').style.height) - curH) > 5) {
          resizeMeet();
        }
      }, 2000);
    }

    document.getElementById('guestName').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') guestLogin();
    });
  </script>
</body>
</html>
