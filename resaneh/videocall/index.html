  <!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به مشاوره</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Tahoma, sans-serif; background: #f0f4f8;
           display: flex; justify-content: center; align-items: center; min-height: 100vh; }

    /* ========== صفحه ورود ========== */
    .box { background: white; padding: 40px; border-radius: 16px;
           box-shadow: 0 8px 30px rgba(0,0,0,0.1); text-align: center;
           width: 90%; max-width: 400px; }
    h1 { margin-bottom: 20px; font-size: 24px; color: #1a365d; }
    input { width: 100%; padding: 14px; margin-bottom: 16px;
            border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
    .btn-primary { width: 100%; padding: 14px; background: #2563eb;
             color: white; border: none; border-radius: 8px;
             font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-primary:hover { background: #1d4ed8; }
    .error { color: #f87171; margin-top: 12px; font-size: 14px; }
    .hidden { display: none !important; }
    #meet { width: 100%; height: 100vh; position: fixed; top: 0; left: 0; }

    /* ========== نوار کنترل حرفه‌ای ========== */
    .controls-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 20px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 100px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5),
                  0 0 0 1px rgba(255, 255, 255, 0.05) inset;
      z-index: 999999;
      transition: all 0.3s ease;
    }

    .ctrl-btn {
      position: relative;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
      padding: 0;
    }

    .ctrl-btn svg {
      width: 24px;
      height: 24px;
      transition: transform 0.25s ease;
      pointer-events: none;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }
    .ctrl-btn:hover svg { transform: scale(1.1); }
    .ctrl-btn:active { transform: translateY(0) scale(0.96); }

    .ctrl-btn.off {
      background: linear-gradient(145deg, #ef4444, #dc2626);
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.5);
    }
    .ctrl-btn.off:hover {
      background: linear-gradient(145deg, #f87171, #ef4444);
      box-shadow: 0 8px 20px rgba(239, 68, 68, 0.7);
    }

    .ctrl-btn.danger {
      background: linear-gradient(145deg, #ef4444, #b91c1c);
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
    }
    .ctrl-btn.danger:hover {
      background: linear-gradient(145deg, #f87171, #dc2626);
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.7);
    }

    .ctrl-btn::before {
      content: attr(data-tooltip);
      position: absolute;
      top: -42px;
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: rgba(15, 23, 42, 0.95);
      color: #f1f5f9;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 8px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-family: Tahoma, sans-serif;
    }
    .ctrl-btn:hover::before {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 500px) {
      .controls-bar { gap: 10px; padding: 10px 14px; bottom: 15px; }
      .ctrl-btn { width: 48px; height: 48px; }
      .ctrl-btn svg { width: 20px; height: 20px; }
      .ctrl-btn::before { display: none; }
    }
  </style>
</head>
<body>
  <div class="box" id="loginBox">
    <h1>📞 ورود به اتاق مشاوره</h1>
    <input type="text" id="guestName" placeholder="نام خود را وارد کنید">
    <button class="btn-primary" onclick="guestLogin()">ورود به جلسه</button>
    <p class="error" id="errorMsg"></p>
  </div>

  <div id="meet" class="hidden"></div>

  <!-- نوار کنترل حرفه‌ای مراجع -->
  <div class="controls-bar hidden" id="customControls">
    <button class="ctrl-btn" id="btnMic" data-tooltip="میکروفون" onclick="toggleMic()">
      <svg id="iconMicOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
      <svg id="iconMicOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/>
        <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>

    <button class="ctrl-btn" id="btnCam" data-tooltip="دوربین" onclick="toggleCam()">
      <svg id="iconCamOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="23 7 16 12 23 17 23 7"/>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
      </svg>
      <svg id="iconCamOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
        <path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
    </button>

    <button class="ctrl-btn danger" data-tooltip="پایان تماس" onclick="hangup()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91" transform="rotate(135 12 12)"/>
      </svg>
    </button>
  </div>

  <script src="https://8x8.vc/vpaas-magic-cookie-2595f123dff048dba8c17bb1a441a83a/external_api.js"></script>
  <script>
    const SCRIPT_URL = "https://live-api.irtashacol.workers.dev/";
    const APP_ID = "vpaas-magic-cookie-2595f123dff048dba8c17bb1a441a83a";
    const ROOM_NAME = "consult-room";
    const FULL_ROOM_NAME = APP_ID + "/" + ROOM_NAME;

    let api = null;
    let audioMuted = true;
    let videoMuted = false;

    async function guestLogin() {
      const userName = document.getElementById('guestName').value.trim() || "مراجع";
      const errorMsg = document.getElementById('errorMsg');

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'guest_login', userName: userName })
        });
        const data = await response.json();

        if (data.success) {
          document.getElementById('loginBox').classList.add('hidden');
          document.getElementById('meet').classList.remove('hidden');
          document.getElementById('customControls').classList.remove('hidden');
          startJitsi(data.token);
        } else {
          errorMsg.textContent = "خطا در ورود";
        }
      } catch (err) {
        errorMsg.textContent = "خطای ارتباط: " + err.message;
      }
    }

    function startJitsi(token) {
      const options = {
        roomName: FULL_ROOM_NAME,
        width: "100%",
        height: "100%",
        parentNode: document.getElementById("meet"),
        jwt: token,
        configOverwrite: {
          startWithAudioMuted: true,
          startWithVideoMuted: false,
          prejoinConfig: { enabled: false },
          toolbarButtons: [],
          disableDeepLinking: true,
          notifications: [],
          disableInviteFunctions: true,
          fileRecordingsEnabled: false,
          liveStreamingEnabled: false
        },
        interfaceConfigOverwrite: { TOOLBAR_BUTTONS: [] }
      };
      api = new JitsiMeetExternalAPI("8x8.vc", options);

      api.addEventListener('audioMuteStatusChanged', (e) => {
        audioMuted = e.muted;
        updateMicButton();
      });

      api.addEventListener('videoMuteStatusChanged', (e) => {
        videoMuted = e.muted;
        updateCamButton();
      });

      // وضعیت اولیه (چون مراجع با میکروفون خاموش شروع می‌کنه)
      setTimeout(() => {
        updateMicButton();
        updateCamButton();
      }, 1500);
    }

    function updateMicButton() {
      const btn = document.getElementById('btnMic');
      const on = document.getElementById('iconMicOn');
      const off = document.getElementById('iconMicOff');
      if (audioMuted) {
        btn.classList.add('off');
        on.style.display = 'none';
        off.style.display = 'block';
      } else {
        btn.classList.remove('off');
        on.style.display = 'block';
        off.style.display = 'none';
      }
    }

    function updateCamButton() {
      const btn = document.getElementById('btnCam');
      const on = document.getElementById('iconCamOn');
      const off = document.getElementById('iconCamOff');
      if (videoMuted) {
        btn.classList.add('off');
        on.style.display = 'none';
        off.style.display = 'block';
      } else {
        btn.classList.remove('off');
        on.style.display = 'block';
        off.style.display = 'none';
      }
    }

    function toggleMic() { if (api) api.executeCommand('toggleAudio'); }
    function toggleCam() { if (api) api.executeCommand('toggleVideo'); }

    function hangup() {
      if (!api) return;
      if (confirm('آیا می‌خواهید از جلسه خارج شوید؟')) {
        api.executeCommand('hangup');
        setTimeout(() => window.location.reload(), 800);
      }
    }
  </script>
</body>
</html>
