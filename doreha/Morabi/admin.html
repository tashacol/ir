<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدیریت سامانه</title>
<style>
:root {
  --navy: #123b5d;
  --blue: #1e6b93;
  --ink: #17212b;
  --muted: #64748b;
  --line: #e2e8f0;
  --bg: #f4f7fa;
  --card: #ffffff;
  --ok: #138a5b;
  --warn: #b7791f;
  --danger: #b42318;
  --radius: 18px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: Tahoma, Arial, sans-serif;
  line-height: 1.8;
}
a { color: var(--blue); text-decoration: none; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .55; cursor: not-allowed; }

.shell { max-width: 1180px; margin: 0 auto; padding: 24px; }
.topbar { background: var(--navy); color: #fff; }
.topbar .inner {
  max-width: 1180px;
  margin: auto;
  padding: 18px 24px;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: center;
}
.brand { font-weight: 800; font-size: 1.08rem; }
.nav { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 18px; }
.nav a {
  color: #fff;
  background: var(--navy);
  padding: 8px 12px;
  border-radius: 10px;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px;
  box-shadow: 0 8px 24px rgba(15, 23, 42, .05);
}
.grid {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 16px;
}
.span12 { grid-column: span 12; }
.span8 { grid-column: span 8; }
.span6 { grid-column: span 6; }
.span4 { grid-column: span 4; }
.span3 { grid-column: span 3; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.title { margin: 0 0 8px; }
.btn {
  border: 0;
  border-radius: 12px;
  padding: 10px 16px;
  font-weight: 700;
}
.btn.primary { background: var(--navy); color: #fff; }
.btn.secondary { background: #e9f2f7; color: var(--navy); }
.btn.ghost { background: #fff; border: 1px solid var(--line); color: var(--ink); }
.btn.danger { background: #fff0ee; color: var(--danger); border: 1px solid #ffd4cf; }
.btn.ok { background: #e8f7ef; color: var(--ok); border: 1px solid #b7e2ca; }
.field { margin-bottom: 15px; }
.field label { display: block; font-weight: 700; margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%;
  border: 1px solid #cbd5e1;
  background: #fff;
  border-radius: 12px;
  padding: 11px 13px;
  outline: 0;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: #7ba8c1;
  box-shadow: 0 0 0 3px rgba(30, 107, 147, .10);
}
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-full { grid-column: 1 / -1; }
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: #eef2f6;
  color: #475569;
  font-size: .82rem;
  font-weight: 700;
}
.badge.ok { background: #e8f7ef; color: var(--ok); }
.badge.warn { background: #fff7e6; color: var(--warn); }
.badge.danger { background: #fff0ee; color: var(--danger); }
.notice {
  padding: 13px 15px;
  background: #f8fafc;
  border: 1px solid var(--line);
  border-radius: 14px;
}
.notice.warn { background: #fff8eb; border-color: #f5dca3; }
.notice.danger { background: #fff2f1; border-color: #f2c8c4; }
.kpi {
  padding: 18px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: #fbfdff;
}
.kpi b { font-size: 1.55rem; display: block; }
.progress {
  height: 10px;
  border-radius: 99px;
  background: #e9eef3;
  overflow: hidden;
}
.progress > div {
  height: 100%;
  background: var(--blue);
  border-radius: 99px;
}
.lesson {
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 16px;
  margin-top: 10px;
  background: #fff;
}
.lesson.locked { background: #f8fafc; }
.lesson.completed { border-color: #b7e2ca; }
.option {
  display: block;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  margin: 8px 0;
  background: #fff;
}
.option:hover { background: #f8fbfd; }
.option input { margin-left: 8px; }
.table { width: 100%; border-collapse: collapse; }
.table th, .table td {
  border-bottom: 1px solid var(--line);
  padding: 10px;
  text-align: right;
  vertical-align: top;
}
.table th { color: #475569; background: #f8fafc; }
.modal-back {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, .55);
  display: grid;
  place-items: center;
  padding: 18px;
  z-index: 50;
}
.modal {
  width: min(780px, 100%);
  max-height: 92vh;
  overflow: auto;
  background: #fff;
  border-radius: 22px;
  padding: 24px;
}
.toast {
  position: fixed;
  left: 18px;
  bottom: 18px;
  max-width: 360px;
  z-index: 100;
  padding: 13px 16px;
  border-radius: 13px;
  background: #17212b;
  color: #fff;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
}
.toast.ok { background: #0f6f4a; }
.toast.danger { background: #9b2119; }
.loading {
  padding: 22px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  color: var(--muted);
}
.hero {
  padding: 28px;
  background: linear-gradient(135deg, #123b5d, #1f6f96);
  color: #fff;
  border-radius: 24px;
}
.hero h1 { margin: 0 0 8px; }
.footer { text-align: center; color: #718096; padding: 28px 0 10px; }
.ltr { direction: ltr; text-align: left; }
.success-text { color: var(--ok); }

@media (max-width: 900px) {
  .span8, .span6, .span4, .span3 { grid-column: span 12; }
  .form-grid { grid-template-columns: 1fr; }
  .topbar .inner { align-items: flex-start; flex-direction: column; }
  .shell { padding: 16px; }
  .card { padding: 18px; }
}
</style>
</head>
<body>
<div class="top">
<div class="in">
<div>
<div class="brand">پورتال آموزشی تعالی اندیشه و رشد — مدیریت</div>
<small>دسترسی مدیریتی محدود و ثبت‌شده</small>
</div>
<div id="topActions">
</div>
</div>
</div>
<main class="shell">
<div id="app">
</div>
</main>
<script>

const APP = {
    apiUrl: 'https://script.google.com/macros/s/AKfycbw1FTU_lPex1r869-Gd9PvCDn67nHTmZMsfRjqCnvv9MQlgbqLcrZUuJE23tpRumiQ/exec',
    timeZone: 'Asia/Tehran',
    pages: {
        index: './index.html',
        register: './register.html',
        lessons: './lessons.html',
        status: './status.html',
        survey: './survey.html',
        certificate: './certificate.html',
        verify: './verify.html',
        admin: './admin.html'
    }
};
const $ = (id) => document.getElementById(id);
const tokenKey = 'edu_admin_token';
function esc(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}
function appError(error) {
    return new Error(error && error.message ? error.message : String(error));
}
function callWithAppsScript(name, args) {
    return new Promise((resolve, reject) => {
        google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler((error) => reject(appError(error)))[name](...args);
    });
}
function callWithBridge(name, args) {
    return new Promise((resolve, reject) => {
        const requestId = 'req_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        const frameName = 'api_' + requestId;
        const frame = document.createElement('iframe');
        frame.name = frameName;
        frame.title = 'API transport';
        frame.hidden = true;
        const cleanup = () => {
            window.removeEventListener('message', onMessage);
            frame.remove();
        };
        const onMessage = (event) => {
            const data = event.data;
            if (!data || data.requestId !== requestId)
                return;
            if (event.source !== frame.contentWindow)
                return;
            cleanup();
            if (data.ok)
                resolve(data.result);
            else
                reject(new Error(data.error || 'خطای نامشخص در ارتباط با سرور.'));
        };
        window.addEventListener('message', onMessage);
        document.body.appendChild(frame);
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = APP.apiUrl;
        form.target = frameName;
        form.hidden = true;
        const fields = {
            requestId,
            origin: window.location.origin,
            action: name,
            payload: JSON.stringify(args)
        };
        Object.entries(fields).forEach(([key, value]) => {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = value;
            form.appendChild(input);
        });
        document.body.appendChild(form);
        form.submit();
        form.remove();
        window.setTimeout(() => {
            if (document.body.contains(frame)) {
                cleanup();
                reject(new Error('ارتباط با سرور زمان‌بر شد. دوباره تلاش کنید.'));
            }
        }, 45000);
    });
}
function call(name, ...args) {
    if (window.google &&
        google.script &&
        typeof google.script.run === 'object') {
        return callWithAppsScript(name, args);
    }
    return callWithBridge(name, args);
}
function t() { return sessionStorage.getItem(tokenKey) || ''; }
function setT(value) { sessionStorage.setItem(tokenKey, String(value || '')); }
function clrT() { sessionStorage.removeItem(tokenKey); }
function fmt(value) {
    if (!value)
        return '—';
    const date = new Date(value);
    if (Number.isNaN(date.getTime()))
        return '—';
    return date.toLocaleString('fa-IR', {
        dateStyle: 'medium',
        timeStyle: 'short',
        timeZone: APP.timeZone
    });
}
function dateTimeInput(value) {
    if (!value)
        return '';
    const date = new Date(value);
    if (Number.isNaN(date.getTime()))
        return '';
    const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: APP.timeZone,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false
    }).formatToParts(date).reduce((obj, part) => {
        obj[part.type] = part.value;
        return obj;
    }, {});
    return `${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}`;
}
function toast(message, kind = '') {
    const element = document.createElement('div');
    element.className = 'toast ' + kind;
    element.textContent = message;
    document.body.appendChild(element);
    window.setTimeout(() => element.remove(), 5000);
}
function pageUrl(page) {
    const inAppsScript = Boolean(window.google &&
        google.script &&
        typeof google.script.run === 'object');
    if (inAppsScript) {
        return APP.apiUrl + '?page=' + encodeURIComponent(page);
    }
    return APP.pages[page] || APP.pages.index;
}
function logout() {
    clrT();
    window.location.assign(pageUrl('admin'));
}
function topNav() {
    return `
    <div class="row">
      <a class="btn secondary" href="${pageUrl('index')}">صفحه اصلی</a>
      <button class="btn ghost" type="button" onclick="logout()">خروج</button>
    </div>
  `;
}
</script>
<script>

function jsArg(value) { return esc(JSON.stringify(String(value ?? ''))); }
let dashboard = null, cohorts = [];
async function login() { try {
    const r = await call('loginAdmin', $('u').value, $('p').value);
    setT(r.token);
    await render();
}
catch (e) {
    toast(e.message, 'danger');
} }
async function render() {
    if (!t()) {
        showLogin();
        return;
    }
    try {
        dashboard = await call('getAdminDashboard', t());
        cohorts = dashboard.cohorts || [];
        $('topActions').innerHTML = topNav();
        $('app').innerHTML = `<div class="hero">
<h1>داشبورد مدیریت</h1>
<div>کنترل دوره‌ها، ثبت‌نام‌ها، محتوای آموزشی، تکالیف، درخواست‌های گواهی و تنظیمات.</div>
</div>
<div style="height:16px">
</div>${dashboardHtml()}`;
        await refreshRequests();
    }
    catch (e) {
        clrT();
        showLogin();
        toast(e.message, 'danger');
    }
}
function showLogin() { $('topActions').innerHTML = ''; $('app').innerHTML = `<div class="card" style="max-width:560px;margin:35px auto">
<h1 style="margin-top:0">ورود مدیر</h1>
<p class="muted">برای ورود از نام کاربری و رمز مدیریتی استفاده کنید.</p>
<div class="field">
<label>نام کاربری</label>
<input id="u" class="code" autocomplete="username">
</div>
<div class="field">
<label>رمز عبور</label>
<input id="p" type="password" autocomplete="current-password">
</div>
<button class="btn primary" onclick="login()">ورود به پنل مدیریت</button>
<div class="notice warn" style="margin-top:14px">
<b>راه‌اندازی اولین مدیر</b>
<br>پس از اجرای <span class="code">setupWorkbook()</span>، تابع <span class="code">setupAdminCredentials(username,
    password)</span> را یک‌بار از محیط Apps Script اجرا کنید.</div>
</div>`; }
function dashboardHtml() { return `<div class="grid">
<div class="s3 kpi">
<span class="muted">کاربران</span>
<b>${dashboard.totalUsers}</b>
</div>
<div class="s3 kpi">
<span class="muted">گواهی‌های صادرشده</span>
<b>${dashboard.totalCertificates}</b>
</div>
<div class="s3 kpi">
<span class="muted">دوره‌ها</span>
<b>${cohorts.length}</b>
</div>
<div class="s3 kpi">
<span class="muted">درخواست گواهی</span>
<b id="reqKpi">…</b>
</div>
<div class="s12 card">
<div class="row between">
<div>
<h2 style="margin:0">دوره‌ها و ثبت‌نام‌ها</h2>
<div class="muted small">مدیریت کد دوره، تاریخ‌ها، ظرفیت و گزارش دانشجویان</div>
</div>
<button class="btn secondary" onclick="cohortModal()">+ ساخت دوره</button>
</div>
<div class="table-wrap" style="margin-top:14px">
<table class="table">
<tr>
<th>دوره</th>
<th>کد</th>
<th>وضعیت</th>
<th>ظرفیت</th>
<th>ثبت‌نام</th>
<th>تکمیل</th>
<th>در خطر</th>
<th>عملیات</th>
</tr>${cohorts.map(c => `<tr><td><b>${esc(c.title)}</b><div class="muted small">${esc(c.yearLabel)}</div></td><td class="code">${esc(c.courseCode)}</td><td>${badge(c.status)}</td><td>${c.capacity}</td><td>${c.registered}</td><td>${c.completed}</td><td>${c.atRisk}</td><td><div class="row"><button class="btn ghost" onclick=\"report(${jsArg(c.cohortId)})\">گزارش</button><button class="btn ghost" onclick=\"content(${jsArg(c.cohortId)})\">محتوا</button><button class="btn ghost" onclick=\"editCohort(${jsArg(c.cohortId)})\">ویرایش</button>${c.status === 'DRAFT' ? `<button class="btn secondary" onclick=\"genLessons(${jsArg(c.cohortId)})\">ساخت جلسات</button>` : ''}</div></td></tr>`).join('')}</table>
</div>
</div>
<div class="s12 card">
<div class="row between">
<div>
<h2 style="margin:0">درخواست‌های گواهی</h2>
<div class="muted small">تأیید نهایی مدیر قبل از ساخت Google Docs/PDF انجام می‌شود.</div>
</div>
<button class="btn ghost" onclick="refreshRequests()">به‌روزرسانی</button>
</div>
<div id="reqs" style="margin-top:12px">
</div>
</div>
<div class="s6 card">
<h2 style="margin-top:0">جستجوی دانشجو</h2>
<div class="row">
<input id="search" style="flex:1;min-width:220px;border:1px solid #cbd5e1;border-radius:12px;padding:10px" placeholder="نام، کد ملی، تلفن یا UserID">
<button class="btn secondary" onclick="searchUsers()">جستجو</button>
</div>
<div id="users" style="margin-top:12px">
</div>
</div>
<div class="s6 card">
<h2 style="margin-top:0">حساب مدیر</h2>
<div class="field">
<label>نام کاربری جدید</label>
<input id="newAdminUser" class="code">
</div>
<div class="field">
<label>رمز عبور جدید</label>
<input id="newAdminPass" type="password">
</div>
<button class="btn primary" onclick="changeOwn()">ذخیره تغییرات</button>
<div class="notice" style="margin-top:13px">نام کاربری مدیر با نقش و حساب ثبت‌شده در <span class="code">ADMINS</span> ذخیره می‌شود.</div>
</div>
<div class="s12 card">
<div class="row between">
<div>
<h2 style="margin:0">تنظیمات مدیریتی</h2>
<div class="muted small">قوانین قابل تنظیم سامانه؛ تنظیمات حساس فقط برای SUPERADMIN قابل نمایش است.</div>
</div>
<button class="btn ghost" onclick="loadSettings()">نمایش تنظیمات</button>
</div>
<div id="settings" style="margin-top:12px">
</div>
</div>
</div>`; }
function badge(s) { s = String(s || '');
    const k = s === 'ACTIVE' || s === 'REGISTRATION_OPEN' || s === 'COMPLETED' || s === 'ISSUED' ? 'ok' : s === 'AT_RISK' || s === 'EXTENDED' || s === 'DRAFT' || s === 'REQUESTED' ? 'warn' : s === 'EXPIRED' || s === 'DELETED' || s === 'DISABLED' ? 'danger' : '';
        return `<span class="badge ${k}">${esc(s || '—')}</span>`; }
async function refreshRequests() { try {
    const r = await call('getAdminCertificateRequests', t());
    $('reqKpi').textContent = r.length;
    $('reqs').innerHTML = r.length ? r.map(x => `<div class="notice" style="margin-bottom:9px">
<div class="row between">
<div>
<b>${esc(x.fullName)}</b>
<div class="muted small">${esc(x.courseCode)} · ${esc(x.courseTitle)} · ${fmt(x.requestedAt)}</div>
<div class="small">کد ملی: <span class="code">${esc(x.nationalId)}</span>
</div>
</div>
<div class="row">
<button class="btn primary" onclick=\"approve(${jsArg(x.requestId)})\">تأیید و صدور گواهی</button>
<button class="btn danger" onclick=\"reject(${jsArg(x.requestId)})\">رد</button>
</div>
</div>
</div>`).join('') : '<div class="empty">درخواست در انتظار بررسی وجود ندارد.</div>';
}
catch (e) {
    toast(e.message, 'danger');
} }
async function approve(id) { const note = prompt('یادداشت مدیر (اختیاری):') || '';
    if (!confirm('گواهی صادر و اطلاعات عملیاتی این enrollment پاک‌سازی می‌شود. ادامه می‌دهید؟'))
    return; try {
    const r = await call('approveCertificate', t(), id, note);
    toast(r.message, 'ok');
    render();
}
catch (e) {
    toast(e.message, 'danger');
} }
async function reject(id) { const note = prompt('دلیل رد درخواست:') || ''; try {
    await call('rejectCertificate', t(), id, note);
    toast('درخواست رد شد.', 'ok');
    refreshRequests();
}
catch (e) {
    toast(e.message, 'danger');
} }
async function searchUsers() { try {
    const r = await call('getAdminUsers', t(), $('search').value || '');
    $('users').innerHTML = r.length ? `<div class="table-wrap">
<table class="table">
<tr>
<th>نام</th>
<th>کد ملی</th>
<th>تلفن</th>
<th>وضعیت</th>
<th>عملیات</th>
</tr>${r.map(u => `<tr><td>${esc(u.fullName)}</td><td class="code">${esc(u.nationalId)}</td><td class="code">${esc(u.phone || '—')}</td><td>${badge(u.status)}</td><td><button class="btn ghost" onclick=\"editUser(${jsArg(u.userId)},${jsArg(u.nationalId)},${jsArg(u.status)})\">تغییر ورود</button></td></tr>`).join('')}</table>
</div>` : '<div class="empty">موردی پیدا نشد.</div>';
}
catch (e) {
    toast(e.message, 'danger');
} }
async function editUser(id, nid, status) { showModal(`<h2 style="margin-top:0">مدیریت دسترسی دانشجو</h2>
<div class="field">
<label>نام کاربری / کد ملی</label>
<input id="eu_nid" class="code" value="${esc(nid)}">
</div>
<div class="field">
<label>رمز جدید</label>
<input id="eu_pw" type="password" placeholder="رمز جدید را وارد کنید">
</div>
<div class="field">
<label>وضعیت حساب</label>
<select id="eu_status">
<option value="ACTIVE">ACTIVE — فعال</option>
<option value="CERTIFIED">CERTIFIED — دارای گواهی</option>
<option value="DISABLED">DISABLED — غیرفعال</option>
</select>
</div>

async function downloadAssignment(id) { try {
    const r = await call('getAssignmentFile', t(), id);
    const raw = atob(r.base64), a = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++)
        a[i] = raw.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([a], { type: r.mimeType || 'application/octet-stream' })), el = document.createElement('a');
    el.href = url;
    el.download = r.fileName;
    document.body.appendChild(el);
    el.click();
    el.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
}
catch (e) {
    toast(e.message, 'danger');
} }

function assignmentForm(id) { const a = id ? window.__content.data.assignments.find(x => String(x.AssignmentID) === String(id)) : { AssignmentID: '',
    LessonID: window.__content.data.lessons[0]?.LessonID || '', Title: '', Instructions: '', Required: true, SubmissionType: 'FILE', MaxFileSizeMB: 8,
        AllowedMimeTypes: 'application/pdf,image/jpeg,image/png' }; if (!a)
    return; showModal(`<h2 style="margin-top:0">ویرایش تکلیف</h2>
<div class="form-grid">
<div class="field">
<label>LessonID</label>
<input id="al" class="code" value="${esc(a.LessonID || '')}">
</div>
<div class="field">
<label>عنوان</label>
<input id="at" value="${esc(a.Title || '')}">
</div>
<div class="field full">
<label>راهنما</label>
<textarea id="ai" rows="4">${esc(a.Instructions || '')}</textarea>
</div>
<div class="field">
<label>الزامی</label>
<select id="ar">
<option value="true">بله</option>
<option value="false">خیر</option>
</select>
</div>
<div class="field">
<label>حداکثر حجم (MB)</label>
<input id="am" type="number" min="1" max="8" value="${Number(a.MaxFileSizeMB || 8)}">
</div>
<div class="field full">
<label>فرمت‌های مجاز MIME</label>
<input id="ax" class="code" value="${esc(a.AllowedMimeTypes || 'application/pdf,image/jpeg,image/png')}">
</div>
</div>
<div class="row">
<button class="btn primary" onclick=\"saveAssignmentForm(${jsArg(a.AssignmentID)})\">ذخیره</button>
<button class="btn ghost" onclick="closeModal()">انصراف</button>
</div>`); $('ar').value = String(a.Required).toLowerCase(); }
async function saveAssignmentForm(id) { try {
    await call('saveAssignment', t(), id, { lessonId: $('al').value, title: $('at').value, instructions: $('ai').value,
        required: $('ar').value === 'true', submissionType: 'FILE', maxFileSizeMB: Number($('am').value || 8), allowedMimeTypes: $('ax').value,
            active: true });
    toast('تکلیف ذخیره شد.', 'ok');
    closeModal();
    window.__content.data = await call('getAdminCourseContent', t(), window.__content.courseId);
    renderContentTab('assignments');
}
catch (e) {
    toast(e.message, 'danger');
} }
function surveyForm(id) { const q = id && window.__content.survey ? window.__content.survey.find(x => String(x.QuestionId) === String(id)) : { QuestionId: '',
    OrderNo: (window.__content.survey || []).length + 1, Type: 'TEXT', QuestionText: '', Required: true, OptionsJson: '[]' };
        showModal(`<h2 style="margin-top:0">${id ? 'ویرایش سؤال نظرسنجی' : 'افزودن سؤال نظرسنجی'}</h2>
<div class="form-grid">
<div class="field">
<label>ترتیب</label>
<input id="svo" type="number" min="1" value="${Number(q.OrderNo || 1)}">
</div>
<div class="field">
<label>نوع</label>
<select id="svt">
<option value="TEXT">TEXT — متن آزاد</option>
<option value="SCALE">SCALE — امتیاز 1 تا 5</option>
<option value="SINGLE">SINGLE — یک گزینه</option>
<option value="MULTI">MULTI — چند گزینه</option>
</select>
</div>
<div class="field full">
<label>متن سؤال</label>
<textarea id="svq" rows="4">${esc(q.QuestionText || '')}</textarea>
</div>
<div class="field full">
<label>گزینه‌ها (هر گزینه در یک خط؛ برای SINGLE/MULTI)</label>
<textarea id="svox" rows="4">
</textarea>
</div>
<div class="field">
<label>اجباری</label>
<select id="svr">
<option value="true">بله</option>
<option value="false">خیر</option>
</select>
</div>
</div>
<div class="row">
<button class="btn primary" onclick=\"saveSurveyForm(${jsArg(q.QuestionId || '')})\">ذخیره</button>
<button class="btn ghost" onclick="closeModal()">انصراف</button>
</div>`); $('svt').value = q.Type || 'TEXT'; $('svr').value = String(q.Required).toLowerCase(); try {
    const opts = JSON.parse(q.OptionsJson || '[]');
    $('svox').value = Array.isArray(opts) ? opts.join('\n') : '';
}
catch (e) { } }
async function saveSurveyForm(id) { try {
    const opts = $('svox').value.split('\n').map(s => s.trim()).filter(Boolean);
    await call('saveSurveyQuestion', t(), id || null, { cohortId: window.__content.courseId, orderNo: Number($('svo').value || 1),
        type: $('svt').value, questionText: $('svq').value, required: $('svr').value === 'true', options: opts, active: true });
    toast('سؤال نظرسنجی ذخیره شد.', 'ok');
    closeModal();
    window.__content.survey = await call('getAdminSurveyQuestions', t(), window.__content.courseId);
    renderContentTab('survey');
}
catch (e) {
    toast(e.message, 'danger');
} }
async function delSurvey(id) { if (!confirm('سؤال نظرسنجی حذف شود؟'))
    return; try {
    await call('deleteSurveyQuestion', t(), id);
    toast('سؤال حذف شد.', 'ok');
    window.__content.survey = await call('getAdminSurveyQuestions', t(), window.__content.courseId);
    renderContentTab('survey');
}
catch (e) {
    toast(e.message, 'danger');
} }
function breakForm(id) { const b = id ? window.__content.breaks.find(x => String(x.BreakID) === String(id)) : {};
    showModal(`<h2 style="margin-top:0">${id ? 'ویرایش تعطیلی' : 'افزودن تعطیلی / هفته مرخصی'}</h2>
<div class="form-grid">
<div class="field">
<label>شروع</label>
<input id="bs" type="datetime-local" class="code" value="${dateTimeInput(b?.StartAt)}">
</div>
<div class="field">
<label>پایان</label>
<input id="be" type="datetime-local" class="code" value="${dateTimeInput(b?.EndAt)}">
</div>
<div class="field">
<label>عنوان</label>
<input id="bt" value="${esc(b?.Title || 'هفته مرخصی')}">
</div>
<div class="field">
<label>علت</label>
<input id="br" value="${esc(b?.Reason || 'تعطیلی برنامه‌ریزی‌شده')}">
</div>
</div>
<div class="row">
<button class="btn primary" onclick=\"saveBreakForm(${jsArg(id || '')})\">ذخیره</button>
<button class="btn ghost" onclick="closeModal()">انصراف</button>
</div>`); }
async function saveBreakForm(id) { try {
    await call('saveCohortBreak', t(), id || null, { cohortId: window.__content.courseId, startAt: $('bs').value, endAt: $('be').value,
        title: $('bt').value, reason: $('br').value, active: true });
    toast('بازه تعطیلی ذخیره شد.', 'ok');
    closeModal();
    window.__content.breaks = await call('getAdminCohortBreaks', t(), window.__content.courseId);
    renderContentTab('breaks');
}
catch (e) {
    toast(e.message, 'danger');
} }
async function delBreak(id) { if (!confirm('این بازه حذف شود؟'))
    return; try {
    await call('deleteCohortBreak', t(), id);
    toast('بازه حذف شد.', 'ok');
    window.__content.breaks = await call('getAdminCohortBreaks', t(), window.__content.courseId);
    renderContentTab('breaks');
}
catch (e) {
    toast(e.message, 'danger');
} }
async function loadSettings() { try {
    const r = await call('getAdminSettings', t());
    $('settings').innerHTML = `<div class="table-wrap">
<table class="table">
<tr>
<th>Key</th>
<th>Value</th>
<th>توضیح</th>
<th>عملیات</th>
</tr>${r.map(x => `<tr><td class="code">${esc(x.Key)}</td><td class="code">${esc(x.Value)}</td><td>${esc(x.Description)}</td><td>${['APP_NAME', 'DEFAULT_EXTENSION_DAYS', 'GRACE_WARNING_START_DAY', 'FINAL_WARNING_HOURS', 'AT_RISK_INACTIVITY_DAYS', 'SUPPORT_PHONE', 'CERT_MANAGER_EMAILS'].includes(String(x.Key)) ? `<button class="btn ghost" onclick=\"editSetting(${jsArg(x.Key)},${jsArg(x.Value || '')})\">تغییر</button>` : '—'}</td></tr>`).join('')}</table>
</div>`;
}
catch (e) {
    toast(e.message, 'danger');
} }
async function editSetting(k, v) { const n = prompt(`مقدار جدید برای ${k}:`, v); if (n === null)
    return; try {
    await call('saveAdminSetting', t(), k, n);
    toast('تنظیمات ذخیره شد.', 'ok');
    loadSettings();
}
catch (e) {
    toast(e.message, 'danger');
} }
render();
</script>
</body>
</html>
