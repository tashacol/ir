<!doctype html>
<html lang="fa" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>گواهی</title>
<style>
:root {
  --navy: #123b5d;
  --blue: #1e6b93;
  --ink: #17212b;
  --muted: #64748b;
  --line: #e2e8f0;
  --bg: #f4f7fa;
  --card: #ffffff;
  --ok: #138a5b;
  --warn: #b7791f;
  --danger: #b42318;
  --radius: 18px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: Tahoma, Arial, sans-serif;
  line-height: 1.8;
}
a { color: var(--blue); text-decoration: none; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .55; cursor: not-allowed; }

.shell { max-width: 1180px; margin: 0 auto; padding: 24px; }
.topbar { background: var(--navy); color: #fff; }
.topbar .inner {
  max-width: 1180px;
  margin: auto;
  padding: 18px 24px;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: center;
}
.brand { font-weight: 800; font-size: 1.08rem; }
.nav { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 18px; }
.nav a {
  color: #fff;
  background: var(--navy);
  padding: 8px 12px;
  border-radius: 10px;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px;
  box-shadow: 0 8px 24px rgba(15, 23, 42, .05);
}
.grid {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 16px;
}
.span12 { grid-column: span 12; }
.span8 { grid-column: span 8; }
.span6 { grid-column: span 6; }
.span4 { grid-column: span 4; }
.span3 { grid-column: span 3; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.title { margin: 0 0 8px; }
.btn {
  border: 0;
  border-radius: 12px;
  padding: 10px 16px;
  font-weight: 700;
}
.btn.primary { background: var(--navy); color: #fff; }
.btn.secondary { background: #e9f2f7; color: var(--navy); }
.btn.ghost { background: #fff; border: 1px solid var(--line); color: var(--ink); }
.btn.danger { background: #fff0ee; color: var(--danger); border: 1px solid #ffd4cf; }
.btn.ok { background: #e8f7ef; color: var(--ok); border: 1px solid #b7e2ca; }
.field { margin-bottom: 15px; }
.field label { display: block; font-weight: 700; margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%;
  border: 1px solid #cbd5e1;
  background: #fff;
  border-radius: 12px;
  padding: 11px 13px;
  outline: 0;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: #7ba8c1;
  box-shadow: 0 0 0 3px rgba(30, 107, 147, .10);
}
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-full { grid-column: 1 / -1; }
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: #eef2f6;
  color: #475569;
  font-size: .82rem;
  font-weight: 700;
}
.badge.ok { background: #e8f7ef; color: var(--ok); }
.badge.warn { background: #fff7e6; color: var(--warn); }
.badge.danger { background: #fff0ee; color: var(--danger); }
.notice {
  padding: 13px 15px;
  background: #f8fafc;
  border: 1px solid var(--line);
  border-radius: 14px;
}
.notice.warn { background: #fff8eb; border-color: #f5dca3; }
.notice.danger { background: #fff2f1; border-color: #f2c8c4; }
.kpi {
  padding: 18px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: #fbfdff;
}
.kpi b { font-size: 1.55rem; display: block; }
.progress {
  height: 10px;
  border-radius: 99px;
  background: #e9eef3;
  overflow: hidden;
}
.progress > div {
  height: 100%;
  background: var(--blue);
  border-radius: 99px;
}
.lesson {
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 16px;
  margin-top: 10px;
  background: #fff;
}
.lesson.locked { background: #f8fafc; }
.lesson.completed { border-color: #b7e2ca; }
.option {
  display: block;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  margin: 8px 0;
  background: #fff;
}
.option:hover { background: #f8fbfd; }
.option input { margin-left: 8px; }
.table { width: 100%; border-collapse: collapse; }
.table th, .table td {
  border-bottom: 1px solid var(--line);
  padding: 10px;
  text-align: right;
  vertical-align: top;
}
.table th { color: #475569; background: #f8fafc; }
.modal-back {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, .55);
  display: grid;
  place-items: center;
  padding: 18px;
  z-index: 50;
}
.modal {
  width: min(780px, 100%);
  max-height: 92vh;
  overflow: auto;
  background: #fff;
  border-radius: 22px;
  padding: 24px;
}
.toast {
  position: fixed;
  left: 18px;
  bottom: 18px;
  max-width: 360px;
  z-index: 100;
  padding: 13px 16px;
  border-radius: 13px;
  background: #17212b;
  color: #fff;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
}
.toast.ok { background: #0f6f4a; }
.toast.danger { background: #9b2119; }
.loading {
  padding: 22px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  color: var(--muted);
}
.hero {
  padding: 28px;
  background: linear-gradient(135deg, #123b5d, #1f6f96);
  color: #fff;
  border-radius: 24px;
}
.hero h1 { margin: 0 0 8px; }
.footer { text-align: center; color: #718096; padding: 28px 0 10px; }
.ltr { direction: ltr; text-align: left; }
.success-text { color: var(--ok); }

@media (max-width: 900px) {
  .span8, .span6, .span4, .span3 { grid-column: span 12; }
  .form-grid { grid-template-columns: 1fr; }
  .topbar .inner { align-items: flex-start; flex-direction: column; }
  .shell { padding: 16px; }
  .card { padding: 18px; }
}
</style>
</head>
<body>
<div class="topbar">
<div class="inner">
<div>
<div class="brand">پورتال آموزشی تعالی اندیشه و رشد</div>
</div>
</div>
</div>
<main class="shell">
<div id="app">
<div class="card">در حال بارگذاری…</div>
</div>
</main>
<script>

const APP = {
    apiUrl: 'https://script.google.com/macros/s/AKfycbw1FTU_lPex1r869-Gd9PvCDn67nHTmZMsfRjqCnvv9MQlgbqLcrZUuJE23tpRumiQ/exec',
    timeZone: 'Asia/Tehran',
    pages: {
        index: './index.html',
        register: './register.html',
        lessons: './lessons.html',
        status: './status.html',
        survey: './survey.html',
        certificate: './certificate.html',
        verify: './verify.html',
        admin: './admin.html'
    }
};
const $ = (id) => document.getElementById(id);
const tokenKey = 'edu_portal_token';
function esc(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}
function jsArg(value) {
  return esc(JSON.stringify(String(value ?? '')));
}

function apiError(error) {
    return new Error(error && error.message ? error.message : String(error));
}
function callWithAppsScript(name, args) {
    return new Promise((resolve, reject) => {
        google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler((error) => reject(apiError(error)))[name](...args);
    });
}
function callWithBridge(name, args) {
    return new Promise((resolve, reject) => {
        const requestId = 'req_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        const frameName = 'api_' + requestId;
        const frame = document.createElement('iframe');
        frame.name = frameName;
        frame.title = 'API transport';
        frame.hidden = true;
        const cleanup = () => {
            window.removeEventListener('message', onMessage);
            frame.remove();
        };
        const onMessage = (event) => {
            const data = event.data;
            if (!data || data.requestId !== requestId)
                return;
            if (event.source !== frame.contentWindow)
                return;
            cleanup();
            if (data.ok) {
                resolve(data.result);
            }
            else {
                reject(new Error(data.error || 'خطای نامشخص در ارتباط با سرور.'));
            }
        };
        window.addEventListener('message', onMessage);
        document.body.appendChild(frame);
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = APP.apiUrl;
        form.target = frameName;
        form.hidden = true;
        const fields = {
            requestId,
            origin: window.location.origin,
            action: name,
            payload: JSON.stringify(args)
        };
        Object.entries(fields).forEach(([key, value]) => {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = value;
            form.appendChild(input);
        });
        document.body.appendChild(form);
        form.submit();
        form.remove();
        window.setTimeout(() => {
            if (document.body.contains(frame)) {
                cleanup();
                reject(new Error('ارتباط با سرور زمان‌بر شد. دوباره تلاش کنید.'));
            }
        }, 45000);
    });
}
function call(name, ...args) {
    if (window.google &&
        google.script &&
        typeof google.script.run === 'object') {
        return callWithAppsScript(name, args);
    }
    return callWithBridge(name, args);
}
function token() {
    return localStorage.getItem(tokenKey) || '';
}
function setToken(value) {
    localStorage.setItem(tokenKey, String(value || ''));
}
function clearToken() {
    localStorage.removeItem(tokenKey);
    localStorage.removeItem('edu_selected_cohort');
}
function selectedCohort() {
    return localStorage.getItem('edu_selected_cohort') || '';
}
function setSelectedCohort(value) {
    if (value)
        localStorage.setItem('edu_selected_cohort', String(value));
}
function pageUrl(page) {
    const inAppsScript = Boolean(window.google &&
        google.script &&
        typeof google.script.run === 'object');
    if (inAppsScript) {
        return APP.apiUrl + '?page=' + encodeURIComponent(page);
    }
    return APP.pages[page] || APP.pages.index;
}
function go(page) {
    window.location.assign(pageUrl(page));
}
function toast(message, kind = '') {
    const element = document.createElement('div');
    element.className = 'toast ' + kind;
    element.textContent = message;
    document.body.appendChild(element);
    window.setTimeout(() => element.remove(), 4500);
}
function fmt(value) {
    if (!value)
        return '—';
    const date = new Date(value);
    if (Number.isNaN(date.getTime()))
        return '—';
    return date.toLocaleString('fa-IR', {
        dateStyle: 'medium',
        timeStyle: 'short',
        timeZone: APP.timeZone
    });
}
function dateOnly(value) {
    if (!value)
        return '—';
    const date = new Date(value);
    if (Number.isNaN(date.getTime()))
        return '—';
    return date.toLocaleDateString('fa-IR', {
        dateStyle: 'medium',
        timeZone: APP.timeZone
    });
}
function b64Download(base64, mimeType, fileName) {
    const raw = atob(base64);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i += 1) {
        bytes[i] = raw.charCodeAt(i);
    }
    const url = URL.createObjectURL(new Blob([bytes], { type: mimeType || 'application/octet-stream' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = fileName || 'download';
    document.body.appendChild(link);
    link.click();
    link.remove();
    window.setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function normalizeDigits(value) {
    return String(value || '')
        .replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
        .replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
}
function nationalIdValid(value) {
    value = normalizeDigits(value).replace(/\D/g, '');
    if (value.length !== 10 || /^([0-9])\1{9}$/.test(value))
        return false;
    let sum = 0;
    for (let i = 0; i < 9; i += 1) {
        sum += Number(value[i]) * (10 - i);
    }
    const remainder = sum % 11;
    const check = Number(value[9]);
    return remainder < 2 ? check === remainder : check === 11 - remainder;
}
function nav() {
    return `
    <div class="nav">
      <a href="${pageUrl('index')}">مرکز من</a>
      <a href="${pageUrl('lessons')}">پنل درسی</a>
      <a href="${pageUrl('status')}">وضعیت تحصیلی</a>
      <a href="${pageUrl('survey')}">نظرسنجی</a>
      <a href="${pageUrl('certificate')}">گواهی</a>
    </div>
  `;
}
async function requireStudentPage() {
    if (!token()) {
        go('index');
        return null;
    }
    try {
        return await call('getDashboard', token());
    }
    catch (error) {
        clearToken();
        go('index');
        return null;
    }
}
</script>
<script>

async function init() { const d = await requireStudentPage(); if (!d)
    return; document.getElementById('app').innerHTML = `${nav()}<div class="page-head">
<h1 class="title">درخواست و دریافت گواهی</h1>
<p class="muted">گواهی پس از پایان رسمی دوره و بررسی شرایط، به درخواست دانشجو و با تایید مدیر صادر می‌شود.</p>
</div>${d.enrollments.map(e => `<div class="card" style="margin-bottom:16px"><div class="row between"><div><span class="badge">${esc(e.courseCode)}</span><h2>${esc(e.courseTitle)}</h2></div><span class="badge ${e.certificateEligibility === 'YES' ? 'ok' : ''}">${e.certificateEligibility === 'YES' ? 'واجد شرایط' : 'در انتظار تکمیل'}</span></div><div class="notice">${esc(e.nextAction)}</div><div class="row" style="margin-top:12px">${e.canRequestCertificate ? `<button class="btn primary" onclick="req(${jsArg(e.cohortId)})">ارسال درخواست به مدیر</button>` : ''}${e.certificateRequestStatus === 'REQUESTED' ? '<span class="badge warn">در انتظار بررسی مدیر</span>' : ''}</div></div>`).join('')}<div class="card">
<h2 class="title">گواهی‌های صادرشده</h2>${d.certificates.length ? d.certificates.map(c => `<div class="lesson"><div class="row between"><div><span class="badge ok">صادر شده</span><h3>${esc(c.courseTitle)}</h3><div class="muted small">${esc(c.certificateNumber)} · ${dateOnly(c.issueDate)} · ${c.hours} ساعت</div></div><button class="btn primary" onclick="download(${jsArg(c.certificateId)})">دانلود PDF</button></div>${c.verificationUrl ? `<div class="small" style="margin-top:9px">
<a href="${esc(c.verificationUrl)}" target="_blank">استعلام گواهی</a>
</div>` : ''}</div>`).join('') : '<div class="notice">گواهی صادرشده‌ای ندارید.</div>'}</div>`; }
async function req(c) { try {
    const r = await call('requestCertificate', token(), c);
    toast(r.message, 'ok');
    init();
}
catch (e) {
    toast(e.message, 'danger');
} }
async function download(id) { try {
    const r = await call('getCertificatePdf', token(), id);
    b64Download(r.base64, r.mimeType, r.fileName);
}
catch (e) {
    toast(e.message, 'danger');
} }
init();
</script>
</body>
</html>
