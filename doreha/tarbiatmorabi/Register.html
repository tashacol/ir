<!doctype html><html lang="fa" dir="rtl"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ثبت‌نام</title><style>
:root{--navy:#123b5d;--blue:#1e6b93;--ink:#17212b;--muted:#64748b;--line:#e2e8f0;--bg:#f4f7fa;--card:#fff;--ok:#138a5b;--warn:#b7791f;--danger:#b42318;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,Arial,sans-serif;line-height:1.8}a{color:var(--blue);text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:0 auto;padding:24px}.topbar{background:var(--navy);color:#fff}.topbar .inner{max-width:1180px;margin:auto;padding:18px 24px;display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{font-weight:800;font-size:1.08rem}.nav{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 18px}.nav a{color:#fff;background:var(--navy);padding:8px 12px;border-radius:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 8px 24px rgba(15,23,42,.05)}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}.span3{grid-column:span 3}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted)}.small{font-size:.88rem}.title{margin:0 0 8px}.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700}.btn.primary{background:var(--navy);color:#fff}.btn.secondary{background:#e9f2f7;color:var(--navy)}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.danger{background:#fff0ee;color:var(--danger);border:1px solid #ffd4cf}.btn:disabled{opacity:.5;cursor:not-allowed}.field{margin-bottom:15px}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;background:#fff;border-radius:12px;padding:11px 13px;outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7ba8c1;box-shadow:0 0 0 3px rgba(30,107,147,.10)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-full{grid-column:1/-1}.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#eef2f6;color:#475569;font-size:.82rem;font-weight:700}.badge.ok{background:#e8f7ef;color:var(--ok)}.badge.warn{background:#fff7e6;color:var(--warn)}.badge.danger{background:#fff0ee;color:var(--danger)}.notice{padding:13px 15px;background:#f8fafc;border:1px solid var(--line);border-radius:14px}.notice.warn{background:#fff8eb;border-color:#f5dca3}.notice.danger{background:#fff2f1;border-color:#f2c8c4}.kpi{padding:18px;border-radius:16px;border:1px solid var(--line);background:#fbfdff}.kpi b{font-size:1.55rem;display:block}.progress{height:10px;border-radius:99px;background:#e9eef3;overflow:hidden}.progress>div{height:100%;background:var(--blue);border-radius:99px}.lesson{border:1px solid var(--line);border-radius:15px;padding:16px;margin-top:10px;background:#fff}.lesson.locked{background:#f8fafc}.lesson.completed{border-color:#b7e2ca}.option{display:block;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:#fff}.option:hover{background:#f8fbfd}.option input{margin-left:8px}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid var(--line);padding:10px;text-align:right;vertical-align:top}.table th{color:#475569;background:#f8fafc}.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(780px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:24px}.toast{position:fixed;left:18px;bottom:18px;max-width:360px;z-index:100;padding:13px 16px;border-radius:13px;background:#17212b;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.18)}.toast.ok{background:#0f6f4a}.toast.danger{background:#9b2119}.spinner{display:inline-block;width:15px;height:15px;border:2px solid #d4dee7;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}@keyframes spin{to{transform:rotate(360deg)}}.hero{padding:28px;background:linear-gradient(135deg,#123b5d,#1f6f96);color:#fff;border-radius:24px}.hero h1{margin:0 0 8px}.footer{text-align:center;color:#718096;padding:28px 0 10px}.ltr{direction:ltr;text-align:left}.success-text{color:var(--ok)}@media(max-width:900px){.span8,.span6,.span4,.span3{grid-column:span 12}.form-grid{grid-template-columns:1fr}.topbar .inner{align-items:flex-start;flex-direction:column}.shell{padding:16px}.card{padding:18px}}
</style></head><body><div class="topbar"><div class="inner"><div><div class="brand">پورتال آموزشی تعالی اندیشه و رشد</div></div></div></div><main class="shell" style="max-width:920px"><div class="page-head"><h1 class="title">ثبت‌نام دوره</h1><p class="muted">حداقل سن ۱۸ سال و حداکثر ظرفیت هر دوره ۶۰ نفر است.</p></div><div class="card"><div class="form-grid"><div class="field"><label>نام و نام خانوادگی *</label><input id="fullName"></div><div class="field"><label>کد ملی *</label><input id="nid" class="ltr" inputmode="numeric" maxlength="10" placeholder="0012345678"></div><div class="field"><label>تاریخ تولد *</label><input id="birthDate" class="ltr" type="date"></div><div class="field"><label>شماره تماس *</label><input id="phone" class="ltr" inputmode="tel" placeholder="09123456789"></div><div class="field"><label>تحصیلات *</label><select id="education"><option value="">انتخاب کنید</option><option>دیپلم</option><option>کاردانی</option><option>کارشناسی</option><option>کارشناسی ارشد</option><option>دکتری</option><option>سایر</option></select></div><div class="field"><label>ایمیل (اختیاری)</label><input id="email" class="ltr" type="email"></div><div class="field"><label>کد دوره *</label><select id="courseCode"><option value="">در حال بارگذاری...</option></select></div><div class="field"><label>رمز عبور *</label><input id="pw" type="password"><div class="muted small">حداقل ۸ کاراکتر، شامل حرف و عدد.</div></div><div class="field form-full"><label>تکرار رمز عبور *</label><input id="pw2" type="password"></div><div class="form-full"><label class="row" style="align-items:flex-start"><input id="consent" type="checkbox" style="margin-top:7px"><span>شرایط ثبت‌نام و سیاست نگهداری/حذف اطلاعات را مطالعه کرده‌ام و موافقم.</span></label></div></div><div id="courseInfo" class="notice">کد دوره را انتخاب کنید.</div><button class="btn primary" style="margin-top:16px" onclick="submitReg()">ثبت‌نام نهایی</button> <button class="btn ghost" onclick="go('index')">بازگشت</button></div></main><script>
const $=id=>document.getElementById(id),tokenKey='edu_portal_token';
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function call(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e&&e.message?e.message:String(e))))[name](...args))}
function token(){return localStorage.getItem(tokenKey)||''}function setToken(t){localStorage.setItem(tokenKey,t)}function clearToken(){localStorage.removeItem(tokenKey)}function go(page){location.href='?page='+encodeURIComponent(page)}
function toast(msg,kind=''){const e=document.createElement('div');e.className='toast '+kind;e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),4500)}
function fmt(v){if(!v)return'—';const d=new Date(v);return isNaN(d)?'—':d.toLocaleString('fa-IR',{dateStyle:'medium',timeStyle:'short'})}function dateOnly(v){if(!v)return'—';const d=new Date(v);return isNaN(d)?'—':d.toLocaleDateString('fa-IR')}
function b64Download(b64,mime,name){const raw=atob(b64),a=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);const url=URL.createObjectURL(new Blob([a],{type:mime})),el=document.createElement('a');el.href=url;el.download=name;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function nationalIdValid(v){v=String(v||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'');if(v.length!==10||/^([0-9])\1{9}$/.test(v))return false;let s=0;for(let i=0;i<9;i++)s+=Number(v[i])*(10-i);const r=s%11,c=Number(v[9]);return r<2?c===r:c===11-r}
function nav(){return '<div class="nav"><a href="?page=index">مرکز من</a><a href="?page=lessons">پنل درسی</a><a href="?page=status">وضعیت تحصیلی</a><a href="?page=survey">نظرسنجی</a><a href="?page=certificate">گواهی</a></div>'}
async function requireStudentPage(){if(!token()){go('index');return null}try{return await call('getDashboard',token())}catch(e){clearToken();go('index');return null}}
</script><script>
let courses=[];async function initReg(){try{courses=await call('getRegistrationCourses');const s=$('courseCode');s.innerHTML=courses.length?'<option value="">انتخاب دوره</option>'+courses.map(c=>`<option value="${esc(c.courseCode)}">${esc(c.courseCode)} — ${esc(c.courseTitle)} (باقی‌مانده: ${c.remaining})</option>`).join(''):'<option value="">فعلاً ثبت‌نامی باز نیست</option>';s.onchange=showCourse}catch(e){toast(e.message,'danger')}}function showCourse(){const c=courses.find(x=>x.courseCode===$('courseCode').value);$('courseInfo').innerHTML=c?`<b>${esc(c.courseTitle)}</b><br>شروع: ${dateOnly(c.startAt)} · پایان: ${dateOnly(c.endAt)} · ${c.hours} ساعت · ظرفیت باقی‌مانده: ${c.remaining}`:'کد دوره را انتخاب کنید.'}
async function submitReg(){try{const d={fullName:$('fullName').value,nationalId:$('nid').value,birthDate:$('birthDate').value,phone:$('phone').value,education:$('education').value,email:$('email').value,password:$('pw').value,courseCode:$('courseCode').value,consent:$('consent').checked};if(d.password!==$('pw2').value)throw new Error('تکرار رمز عبور یکسان نیست.');if(!nationalIdValid(d.nationalId))throw new Error('کد ملی معتبر نیست.');const r=await call('registerStudent',d);document.querySelector('main').innerHTML=`<div class="hero"><h1>ثبت‌نام انجام شد</h1><p>${esc(r.message)}</p><button class="btn secondary" onclick="go('index')">ورود</button></div>`}catch(e){toast(e.message,'danger')}}initReg();
</script></body></html>
