  <!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیر</title>
<style>
  * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(135deg, #2c1810, #4a2818);
    padding: 12px;
  }
  .container { max-width: 700px; margin: 0 auto; }
  .header {
    background: #fff; border-radius: 14px; padding: 16px;
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.2);
  }
  .header h1 { margin: 0; font-size: 17px; color: #4a2818; }
  .header a {
    color: #4a2818; text-decoration: none; font-size: 13px;
    padding: 6px 12px; border-radius: 6px; background: #f5ede8;
  }

  .tabs {
    display: flex; gap: 6px; margin-bottom: 12px;
    background: rgba(255,255,255,.15); padding: 5px; border-radius: 12px;
  }
  .tab {
    flex: 1; padding: 11px 6px; border-radius: 8px; border: none;
    background: transparent; color: #fff; font-family: inherit;
    font-size: 12px; font-weight: bold; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tab.active { background: #fff; color: #4a2818; }

  .panel {
    background: #fff; border-radius: 14px; padding: 18px;
    box-shadow: 0 6px 24px rgba(0,0,0,.15);
  }
  .panel h2 { margin: 0 0 16px; font-size: 15px; color: #4a2818; }
  label { display: block; font-size: 13px; color: #333; margin: 10px 0 5px; }
  input, select, textarea {
    width: 100%; padding: 10px; font-size: 14px;
    border: 2px solid #ddd; border-radius: 8px;
    font-family: inherit; background: #fafafa;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #4a2818; background: #fff; }
  textarea { min-height: 60px; resize: vertical; }
  button.btn {
    width: 100%; padding: 12px; font-size: 14px; font-weight: bold;
    background: #4a2818; color: #fff; border: none; border-radius: 8px;
    cursor: pointer; font-family: inherit; margin-top: 14px;
  }
  button.btn:disabled { opacity: .6; }
  button.btn.green { background: #2e7d32; }

  .msg {
    margin-top: 12px; padding: 10px; border-radius: 8px;
    font-size: 13px; text-align: center; display: none;
  }
  .msg.err { background: #ffe5e5; color: #c00; display: block; }
  .msg.ok  { background: #e5ffe5; color: #080; display: block; }
  .msg.info { background: #d1ecf1; color: #0c5460; display: block; }

  .row2 { display: flex; gap: 8px; }
  .row2 > * { flex: 1; }
  .row3 { display: flex; gap: 8px; }
  .row3 > * { flex: 1; }

  .course-item, .request-item {
    background: #f9f5f2; border-radius: 10px; padding: 12px;
    margin-bottom: 10px; border-right: 4px solid #4a2818;
  }
  .course-item .name { font-weight: bold; color: #4a2818; font-size: 14px; margin-bottom: 4px; }
  .course-item .meta { font-size: 12px; color: #666; }
  .course-item .actions { margin-top: 8px; display: flex; gap: 6px; }
  .course-item .actions button {
    flex: 1; padding: 6px; font-size: 12px; border-radius: 6px;
    border: none; cursor: pointer; font-family: inherit;
  }
  .status-open   { color: #2e7d32; font-weight: bold; }
  .status-closed { color: #c62828; font-weight: bold; }
  .status-done   { color: #555; font-weight: bold; }

  .q-box {
    background: #f9f5f2; border-radius: 10px; padding: 12px;
    margin: 10px 0;
  }
  .q-box .qtitle { font-weight: bold; color: #4a2818; font-size: 13px; margin-bottom: 8px; }

  .empty { text-align: center; padding: 30px; color: #888; font-size: 13px; }

  .loading { text-align: center; padding: 20px; color: #888; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎛 پنل مدیر</h1>
    <a href="index.html" onclick="sessionStorage.clear()">خروج</a>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="courses">📚 دوره‌ها</button>
    <button class="tab" data-tab="content">✏️ محتوا</button>
    <button class="tab" data-tab="certs">🎓 گواهی</button>
  </div>

  <!-- تب دوره‌ها -->
  <div class="panel" id="tab-courses">
    <h2>افزودن دوره جدید</h2>
    <label>کد دوره (یکتا):</label>
    <input id="c-code" placeholder="مثال: 1403-C" dir="ltr">
    <label>نام دوره:</label>
    <input id="c-name" placeholder="مثال: دوره مربیگری جوان">
    <div class="row2">
      <div>
        <label>تاریخ شروع (میلادی):</label>
        <input id="c-start" type="date" dir="ltr">
      </div>
      <div>
        <label>تاریخ پایان:</label>
        <input id="c-end" type="date" dir="ltr">
      </div>
    </div>
    <label>مدت دوره:</label>
    <input id="c-duration" placeholder="مثال: ۱۲۰ ساعت">
    <label>وضعیت:</label>
    <select id="c-status">
      <option value="باز">باز</option>
      <option value="بسته">بسته</option>
      <option value="پایان یافته">پایان یافته</option>
    </select>
    <button class="btn" id="createCourseBtn">ساخت دوره</button>
    <div class="msg" id="courseMsg"></div>

    <h2 style="margin-top:24px">دوره‌های موجود</h2>
    <div id="courseList"><div class="loading">در حال بارگذاری...</div></div>
  </div>

  <!-- تب محتوا -->
  <div class="panel" id="tab-content" style="display:none">
    <h2>ورود محتوای درسی</h2>
    <label>دوره:</label>
    <select id="m-course"></select>

    <div class="row2">
      <div>
        <label>هفته:</label>
        <input id="m-week" type="number" min="1" value="1">
      </div>
      <div>
        <label>روز:</label>
        <select id="m-day">
          <option value="1">شنبه (۱)</option>
          <option value="2">یکشنبه (۲)</option>
          <option value="3">دوشنبه (۳)</option>
          <option value="4">سه‌شنبه (۴)</option>
        </select>
      </div>
    </div>

    <button class="btn" id="loadContentBtn" style="background:#666">بارگذاری محتوای موجود</button>

    <label style="margin-top:18px">عنوان درس:</label>
    <input id="m-title" placeholder="مثال: مقدمات مربیگری">

    <label>لینک جزوه (PDF):</label>
    <input id="m-pdf" dir="ltr" placeholder="https://...">

    <label>لینک ویدیو:</label>
    <input id="m-video" dir="ltr" placeholder="https://...">

    <div id="questionsArea"></div>

    <button class="btn green" id="saveContentBtn">ذخیره محتوا</button>
    <div class="msg" id="contentMsg"></div>
  </div>

  <!-- تب گواهی -->
  <div class="panel" id="tab-certs" style="display:none">
    <h2>درخواست‌های گواهی</h2>
    <div id="certList"><div class="loading">در حال بارگذاری...</div></div>
    <div class="msg" id="certMsg"></div>
  </div>
</div>

<script src="assets/api.js"></script>
<script>
/* ---------- تب‌ها ---------- */
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
    document.getElementById('tab-' + t.dataset.tab).style.display = 'block';
    if (t.dataset.tab === 'courses') loadCourses();
    if (t.dataset.tab === 'content') loadContentCourses();
    if (t.dataset.tab === 'certs') loadCertRequests();
  });
});

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.className = 'msg ' + (type || 'ok');
  el.textContent = text;
  if (type !== 'info') {
    setTimeout(() => { el.className = 'msg'; }, 4000);
  }
}

/* ---------- تب دوره‌ها ---------- */

async function loadCourses() {
  const list = document.getElementById('courseList');
  try {
    const res = await api('adminListCourses', {});
    if (!res.courses.length) {
      list.innerHTML = '<div class="empty">هیچ دوره‌ای ثبت نشده</div>';
      return;
    }
    list.innerHTML = '';
    res.courses.forEach(c => {
      let statusClass = 'status-open';
      if (c.status === 'بسته') statusClass = 'status-closed';
      if (c.status === 'پایان یافته') statusClass = 'status-done';

      const div = document.createElement('div');
      div.className = 'course-item';
      div.innerHTML =
        '<div class="name">' + c.name + ' <span style="color:#888;font-size:11px">(' + c.code + ')</span></div>' +
        '<div class="meta">' + c.start + ' تا ' + c.end + ' • ' + c.duration + '</div>' +
        '<div class="meta">وضعیت: <span class="' + statusClass + '">' + c.status + '</span> • ' + c.capacity + ' ثبت‌نام</div>' +
        '<div class="actions">' +
          '<button data-act="open" data-code="' + c.code + '" style="background:#c8e6c9;color:#2e7d32">باز کن</button>' +
          '<button data-act="close" data-code="' + c.code + '" style="background:#ffcdd2;color:#c62828">ببند</button>' +
          '<button data-act="users" data-code="' + c.code + '" style="background:#bbdefb;color:#1565c0">دانشجوها</button>' +
        '</div>';
      list.appendChild(div);
    });

    list.querySelectorAll('button[data-act]').forEach(b => {
      b.addEventListener('click', () => courseAction(b.dataset.act, b.dataset.code));
    });
  } catch (e) {
    list.innerHTML = '<div class="empty">خطا: ' + e.message + '</div>';
  }
}

async function courseAction(act, code) {
  if (act === 'open' || act === 'close') {
    const status = act === 'open' ? 'باز' : 'بسته';
    try {
      await api('adminUpdateCourseStatus', { code: code, status: status });
      showMsg('courseMsg', '✅ وضعیت به "' + status + '" تغییر کرد', 'ok');
      loadCourses();
    } catch (e) {
      showMsg('courseMsg', 'خطا: ' + e.message, 'err');
    }
  } else if (act === 'users') {
    try {
      const res = await api('adminCourseUsers', { courseCode: code });
      if (!res.users.length) {
        alert('هیچ دانشجویی در این دوره نیست');
        return;
      }
      let txt = 'دانشجویان دوره ' + code + ':\n\n';
      res.users.forEach(u => {
        txt += '• ' + u.name + ' — ' + u.nationalId + '\n';
      });
      alert(txt);
    } catch (e) {
      showMsg('courseMsg', 'خطا: ' + e.message, 'err');
    }
  }
}

document.getElementById('createCourseBtn').onclick = async () => {
  const code = document.getElementById('c-code').value.trim();
  const name = document.getElementById('c-name').value.trim();
  const start = document.getElementById('c-start').value;
  const end = document.getElementById('c-end').value;
  const duration = document.getElementById('c-duration').value.trim();
  const status = document.getElementById('c-status').value;

  if (!code || !name || !start || !end) {
    showMsg('courseMsg', 'همه فیلدها لازم است', 'err');
    return;
  }

  const btn = document.getElementById('createCourseBtn');
  btn.disabled = true;
  btn.textContent = 'در حال ساخت...';

  try {
    await api('adminCreateCourse', {
      code, name, start, end, duration, status
    });
    showMsg('courseMsg', '✅ دوره ساخته شد', 'ok');
    document.getElementById('c-code').value = '';
    document.getElementById('c-name').value = '';
    document.getElementById('c-start').value = '';
    document.getElementById('c-end').value = '';
    document.getElementById('c-duration').value = '';
    loadCourses();
  } catch (e) {
    const map = {
      DUPLICATE_CODE: 'این کد دوره قبلاً ثبت شده',
      END_BEFORE_START: 'تاریخ پایان قبل از شروع است',
      BAD_START: 'تاریخ شروع نامعتبر',
      BAD_END: 'تاریخ پایان نامعتبر'
    };
    showMsg('courseMsg', map[e.message] || ('خطا: ' + e.message), 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'ساخت دوره';
  }
};

/* ---------- تب محتوا ---------- */

async function loadContentCourses() {
  const sel = document.getElementById('m-course');
  try {
    const res = await api('adminListCourses', {});
    sel.innerHTML = '';
    res.courses.forEach(c => {
      const o = document.createElement('option');
      o.value = c.code;
      o.textContent = c.name + ' (' + c.code + ')';
      sel.appendChild(o);
    });
  } catch (e) {}
}

function buildQuestionBoxes(qData) {
  const area = document.getElementById('questionsArea');
  area.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const q = qData && qData.questions ? qData.questions[i] : {};
    const ans = qData && qData.answers ? qData.answers[i] : '';
    const box = document.createElement('div');
    box.className = 'q-box';
    box.innerHTML =
      '<div class="qtitle">سؤال ' + (i + 1) + '</div>' +
      '<input placeholder="متن سؤال" id="q' + i + '" value="' + esc(q.q || '') + '">' +
      '<input placeholder="گزینه ۱" id="o' + i + '_1" style="margin-top:6px" value="' + esc(q.o1 || '') + '">' +
      '<input placeholder="گزینه ۲" id="o' + i + '_2" style="margin-top:6px" value="' + esc(q.o2 || '') + '">' +
      '<input placeholder="گزینه ۳" id="o' + i + '_3" style="margin-top:6px" value="' + esc(q.o3 || '') + '">' +
      '<label style="margin-top:8px">پاسخ صحیح:</label>' +
      '<select id="a' + i + '">' +
        '<option value="1"' + (ans === 1 ? ' selected' : '') + '>گزینه ۱</option>' +
        '<option value="2"' + (ans === 2 ? ' selected' : '') + '>گزینه ۲</option>' +
        '<option value="3"' + (ans === 3 ? ' selected' : '') + '>گزینه ۳</option>' +
      '</select>';
    area.appendChild(box);
  }
}

function esc(s) {
  return String(s || '').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

document.getElementById('loadContentBtn').onclick = async () => {
  const courseCode = document.getElementById('m-course').value;
  const week = Number(document.getElementById('m-week').value);
  const day = Number(document.getElementById('m-day').value);

  if (!courseCode || !week || !day) {
    showMsg('contentMsg', 'همه فیلدها را پر کنید', 'err');
    return;
  }

  try {
    const res = await api('adminGetContent', { courseCode, week, day });
    if (!res.content) {
      document.getElementById('m-title').value = '';
      document.getElementById('m-pdf').value = '';
      document.getElementById('m-video').value = '';
      buildQuestionBoxes(null);
      showMsg('contentMsg', 'محتوایی برای این روز نیست. میتوانید بسازید.', 'info');
    } else {
      document.getElementById('m-title').value = res.content.title || '';
      document.getElementById('m-pdf').value = res.content.pdfUrl || '';
      document.getElementById('m-video').value = res.content.videoUrl || '';
      buildQuestionBoxes(res.content);
      showMsg('contentMsg', 'محتوای موجود بارگذاری شد', 'info');
    }
  } catch (e) {
    showMsg('contentMsg', 'خطا: ' + e.message, 'err');
  }
};

document.getElementById('saveContentBtn').onclick = async () => {
  const courseCode = document.getElementById('m-course').value;
  const week = Number(document.getElementById('m-week').value);
  const day = Number(document.getElementById('m-day').value);
  const title = document.getElementById('m-title').value.trim();
  const pdfUrl = document.getElementById('m-pdf').value.trim();
  const videoUrl = document.getElementById('m-video').value.trim();

  const questions = [];
  for (let i = 0; i < 3; i++) {
    questions.push({
      q: document.getElementById('q' + i).value.trim(),
      o1: document.getElementById('o' + i + '_1').value.trim(),
      o2: document.getElementById('o' + i + '_2').value.trim(),
      o3: document.getElementById('o' + i + '_3').value.trim(),
      answer: Number(document.getElementById('a' + i).value)
    });
  }

  if (!courseCode) { showMsg('contentMsg', 'دوره را انتخاب کنید', 'err'); return; }
  if (!title) { showMsg('contentMsg', 'عنوان را وارد کنید', 'err'); return; }
  for (let i = 0; i < 3; i++) {
    if (!questions[i].q) { showMsg('contentMsg', 'متن سؤال ' + (i+1) + ' خالی است', 'err'); return; }
  }

  const btn = document.getElementById('saveContentBtn');
  btn.disabled = true;
  btn.textContent = 'در حال ذخیره...';

  try {
    const res = await api('adminSaveContent', {
      courseCode, week, day, title, pdfUrl, videoUrl, questions
    });
    showMsg('contentMsg', res.updated ? '✅ محتوا به‌روز شد' : '✅ محتوای جدید ذخیره شد', 'ok');
  } catch (e) {
    showMsg('contentMsg', 'خطا: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'ذخیره محتوا';
  }
};

/* ---------- تب گواهی ---------- */

async function loadCertRequests() {
  const list = document.getElementById('certList');
  try {
    const res = await api('adminCertRequests', {});
    if (!res.requests.length) {
      list.innerHTML = '<div class="empty">هیچ درخواستی وجود ندارد</div>';
      return;
    }
    list.innerHTML = '';
    res.requests.forEach(r => {
      r.courses.forEach(c => {
        const div = document.createElement('div');
        div.className = 'request-item';
        div.innerHTML =
          '<div class="name">' + r.name + ' <span style="color:#888;font-size:11px">(' + r.nationalId + ')</span></div>' +
          '<div class="meta">دوره: ' + c + '</div>' +
          '<div class="actions" style="margin-top:8px">' +
            '<button class="btn green" style="margin:0;padding:8px;font-size:13px" data-nid="' + r.nationalId + '" data-course="' + c + '">✅ صدور گواهی</button>' +
          '</div>';
        list.appendChild(div);
      });
    });

    list.querySelectorAll('button[data-nid]').forEach(b => {
      b.addEventListener('click', () => issueCert(b.dataset.nid, b.dataset.course, b));
    });
  } catch (e) {
    list.innerHTML = '<div class="empty">خطا: ' + e.message + '</div>';
  }
}

async function issueCert(nid, courseCode, btn) {
  if (!confirm('گواهی برای ' + nid + ' در دوره ' + courseCode + ' صادر شود؟')) return;
  btn.disabled = true;
  btn.textContent = 'در حال صدور...';

  try {
    const res = await api('adminIssueCert', { nationalId: nid, courseCode: courseCode });
    showMsg('certMsg', '✅ گواهی صادر شد: ' + res.certNumber, 'ok');
    loadCertRequests();
  } catch (e) {
    const map = {
      ALREADY_ISSUED: 'قبلاً برای این کاربر صادر شده',
      USER_NOT_FOUND: 'کاربر پیدا نشد',
      COURSE_NOT_IN_USER: 'کاربر در این دوره نیست'
    };
    showMsg('certMsg', map[e.message] || ('خطا: ' + e.message), 'err');
    btn.disabled = false;
    btn.textContent = '✅ صدور گواهی';
  }
}

/* ---------- شروع ---------- */
loadCourses();
loadContentCourses();
buildQuestionBoxes(null);
</script>
</body>
</html>
