<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل کاربری</title>
<style>
  * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    padding: 20px;
  }
  .container { max-width: 500px; margin: 0 auto; }
  .header {
    background: #fff; border-radius: 16px; padding: 20px;
    text-align: center; margin-bottom: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.15);
  }
  .header h1 { margin: 0 0 6px; color: #1e3c72; font-size: 20px; }
  .header p { margin: 0; color: #666; font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    background: #fff; border-radius: 16px; padding: 24px 14px;
    text-align: center; text-decoration: none; color: #1e3c72;
    box-shadow: 0 6px 24px rgba(0,0,0,.12);
    transition: transform .15s; cursor: pointer;
    border: none; font-family: inherit;
  }
  .card:active { transform: scale(.97); }
  .card .icon { font-size: 32px; margin-bottom: 8px; }
  .card .label { font-size: 14px; font-weight: bold; }
  .logout {
    display: block; text-align: center; color: #fff;
    margin-top: 20px; text-decoration: none; font-size: 14px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 id="uname">در حال بارگذاری...</h1>
    <p id="ucourse"></p>
  </div>

  <div class="grid">
    <a class="card" href="course.html">
      <div class="icon">📚</div>
      <div class="label">پنل درسی</div>
    </a>
    <a class="card" href="status.html">
      <div class="icon">📊</div>
      <div class="label">وضعیت تحصیلی</div>
    </a>
    <a class="card" href="survey.html">
      <div class="icon">📝</div>
      <div class="label">نظرسنجی</div>
    </a>
    <a class="card" href="cert_download.html">
      <div class="icon">🎓</div>
      <div class="label">دانلود گواهی</div>
    </a>
  </div>

  <a class="logout" href="index.html" onclick="sessionStorage.clear()">خروج</a>
</div>

<script src="assets/api.js"></script>
<script>
(async function () {
  try {
    const res = await api('me', {});
    const u = res.user;
    document.getElementById('uname').textContent = u.name || 'کاربر';
    document.getElementById('ucourse').textContent = 'دوره: ' + (u.course || '—');
  } catch (e) {
    document.getElementById('uname').textContent = 'خطا در بارگذاری';
  }
})();
</script>
</body>
</html>
