   <!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل کاربری</title>
<style>
  * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    padding: 20px;
  }
  .container { max-width: 500px; margin: 0 auto; }
  .header {
    background: #fff; border-radius: 16px; padding: 20px;
    text-align: center; margin-bottom: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.15);
  }
  .header h1 { margin: 0 0 6px; color: #1e3c72; font-size: 20px; }
  .header p { margin: 0; color: #666; font-size: 14px; }
  .course-box {
    background: #fff; border-radius: 16px; padding: 16px;
    margin-bottom: 16px; box-shadow: 0 6px 24px rgba(0,0,0,.12);
  }
  .course-box label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
  .course-box select {
    width: 100%; padding: 12px; font-size: 15px;
    border: 2px solid #ddd; border-radius: 8px;
    background: #f9fbff; font-family: inherit;
  }
  .course-box select:focus { outline: none; border-color: #2a5298; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    background: #fff; border-radius: 16px; padding: 24px 14px;
    text-align: center; text-decoration: none; color: #1e3c72;
    box-shadow: 0 6px 24px rgba(0,0,0,.12);
    transition: transform .15s; cursor: pointer;
    border: none; font-family: inherit;
  }
  .card:active { transform: scale(.97); }
  .card .icon { font-size: 32px; margin-bottom: 8px; }
  .card .label { font-size: 14px; font-weight: bold; }
  .logout {
    display: block; text-align: center; color: #fff;
    margin-top: 20px; text-decoration: none; font-size: 14px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 id="uname">در حال بارگذاری...</h1>
    <p id="ucourse"></p>
  </div>

  <div class="course-box" id="courseBox" style="display:none">
    <label>دوره فعال را انتخاب کنید:</label>
    <select id="courseSel"></select>
  </div>

  <div class="grid" id="grid" style="display:none">
    <a class="card" href="course.html">
      <div class="icon">📚</div>
      <div class="label">پنل درسی</div>
    </a>
    <a class="card" href="status.html">
      <div class="icon">📊</div>
      <div class="label">وضعیت تحصیلی</div>
    </a>
    <a class="card" href="survey.html">
      <div class="icon">📝</div>
      <div class="label">نظرسنجی</div>
    </a>
    <a class="card" href="cert_download.html">
      <div class="icon">🎓</div>
      <div class="label">دانلود گواهی</div>
    </a>
  </div>

  <a class="logout" href="index.html" onclick="sessionStorage.clear()">خروج</a>
</div>

<script src="assets/api.js"></script>
<script>
(async function () {
  try {
    const meRes = await api('me', {});
    const u = meRes.user;
    document.getElementById('uname').textContent = u.name || 'کاربر';

    const codes = u.courses || [];
    if (!codes.length) {
      document.getElementById('ucourse').textContent = 'هیچ دوره‌ای ثبت نشده';
      return;
    }

    const listRes = await api('myCourses', {});
    const courses = listRes.courses || [];

    const sel = document.getElementById('courseSel');
    sel.innerHTML = '';
    courses.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.code;
      opt.textContent = c.name + ' (' + c.code + ')';
      sel.appendChild(opt);
    });

    const saved = sessionStorage.getItem('activeCourse');
    if (saved && codes.indexOf(saved) >= 0) sel.value = saved;
    sessionStorage.setItem('activeCourse', sel.value);

    document.getElementById('ucourse').textContent = courses.length + ' دوره ثبت‌نام شده';
    document.getElementById('grid').style.display = 'grid';

    if (courses.length > 1) {
      document.getElementById('courseBox').style.display = 'block';
      sel.addEventListener('change', () => {
        sessionStorage.setItem('activeCourse', sel.value);
      });
    }
  } catch (e) {
    document.getElementById('uname').textContent = 'خطا: ' + e.message;
  }
})();
</script>
</body>
</html>
