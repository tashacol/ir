<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نام در دوره</title>
    <!-- استفاده از فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --primary: #005b9f;
            --bg: #f4f7f6;
            --error: #e74c3c;
            --success: #2ecc71;
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #333;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
            box-sizing: border-box;
            font-size: 15px;
        }
        input:focus, select:focus {
            border-color: var(--primary);
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-family: inherit;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #00447a; }
        .btn:disabled { background-color: #a0c4e1; cursor: not-allowed; }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
            text-align: center;
            font-size: 14px;
        }
        .error { background: #fadbd8; color: #78281f; }
        .success { background: #d5f5e3; color: #186a3b; }
        .loader {
            display: none;
            border: 3px solid #f3f3f3;
            border-top: 3px solid white;
            border-radius: 50%;
            width: 15px;
            height: 15px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* استایل خاص برای تاریخ تولد */
        .date-group { display: flex; gap: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>ثبت نام در دوره آموزشی</h2>
    <form id="registerForm">
        
        <div class="form-group">
            <label>نام و نام خانوادگی:</label>
            <input type="text" id="name" required maxlength="50" placeholder="مثال: علی رضایی">
        </div>

        <div class="form-group">
            <label>کد ملی (نام کاربری):</label>
            <!-- استفاده از inputmode برای نمایش کیبورد عددی -->
            <input type="text" id="melli" required inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="۱۰ رقم بدون خط تیره">
        </div>

        <div class="form-group">
            <label>شماره موبایل:</label>
            <input type="text" id="phone" required inputmode="numeric" pattern="09[0-9]{9}" maxlength="11" placeholder="09123456789">
        </div>

        <div class="form-group">
            <label>تاریخ تولد (حداقل ۱۸ سال):</label>
            <div class="date-group">
                <input type="text" id="b-day" placeholder="روز (مثلاً 12)" inputmode="numeric" maxlength="2" required>
                <input type="text" id="b-month" placeholder="ماه (مثلاً 05)" inputmode="numeric" maxlength="2" required>
                <input type="text" id="b-year" placeholder="سال (مثلاً 1380)" inputmode="numeric" maxlength="4" required>
            </div>
        </div>

        <div class="form-group">
            <label>آخرین مدرک تحصیلی:</label>
            <select id="edu" required>
                <option value="">انتخاب کنید...</option>
                <option value="دیپلم">دیپلم</option>
                <option value="کاردانی">کاردانی</option>
                <option value="کارشناسی">کارشناسی</option>
                <option value="کارشناسی ارشد">کارشناسی ارشد</option>
                <option value="دکتری">دکتری</option>
                <option value="حوزوی">حوزوی</option>
            </select>
        </div>

        <div class="form-group">
            <label>دوره مورد نظر:</label>
            <select id="courseCode" required>
                <option value="">در حال بارگذاری دوره‌ها...</option>
                <!-- از طریق اسکریپت پر می‌شود -->
            </select>
        </div>

        <button type="submit" class="btn" id="submitBtn">
            <span id="btnText">ثبت نام</span>
            <div class="loader" id="btnLoader"></div>
        </button>

        <div id="msgBox" class="message"></div>
    </form>
</div>

<script>
    // ==========================================
    // آدرس وب اپ اسکریپت گوگل را اینجا قرار دهید
    // ==========================================
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwgblCuABnk9DM1PU-RSe1bomr4MzOpLsvYo7RJm1CA23PBfLbmI5FY1J7PHhgYZSpH/exec";

    const form = document.getElementById('registerForm');
    const msgBox = document.getElementById('msgBox');
    const submitBtn = document.getElementById('submitBtn');
    const courseSelect = document.getElementById('courseCode');
    const currentYear = 1405; // سال جاری برای محاسبه سن

    // بارگذاری دوره‌های فعال در هنگام باز شدن صفحه
    window.onload = function() {
        if(APPS_SCRIPT_URL === "لینک_وب_اپ_اسکریپت_مرحله_قبل_را_اینجا_بگذارید"){
            showMessage("لطفا لینک گوگل اسکریپت را در فایل HTML قرار دهید.", false);
            return;
        }
        fetch(APPS_SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                courseSelect.innerHTML = '<option value="">انتخاب کنید...</option>';
                data.forEach(course => {
                    let opt = document.createElement('option');
                    opt.value = course.code;
                    opt.innerHTML = course.name + " (" + course.code + ")";
                    courseSelect.appendChild(opt);
                });
            })
            .catch(err => {
                courseSelect.innerHTML = '<option value="">خطا در دریافت دوره‌ها</option>';
            });
    };

    function showMessage(text, isSuccess) {
        msgBox.style.display = "block";
        msgBox.innerHTML = text;
        msgBox.className = "message " + (isSuccess ? "success" : "error");
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        msgBox.style.display = "none";

        // 1. اعتبارسنجی های سمت کاربر (جلوگیری از ارسال دیتای غلط)
        const melli = document.getElementById('melli').value;
        const phone = document.getElementById('phone').value;
        const bYear = parseInt(document.getElementById('b-year').value);
        const bMonth = document.getElementById('b-month').value.padStart(2, '0');
        const bDay = document.getElementById('b-day').value.padStart(2, '0');

        if(melli.length !== 10) return showMessage("کد ملی باید دقیقا ۱۰ رقم باشد.", false);
        if(!phone.startsWith("09") || phone.length !== 11) return showMessage("شماره موبایل اشتباه است.", false);
        
        const age = currentYear - bYear;
        if(age < 18) return showMessage("برای ثبت نام باید حداقل ۱۸ سال داشته باشید.", false);

        // تجمیع تاریخ تولد
        const dob = bYear + "/" + bMonth + "/" + bDay;

        // آماده سازی داده ها برای ارسال
        const payload = {
            name: document.getElementById('name').value,
            melli: melli,
            phone: phone,
            dob: dob,
            edu: document.getElementById('edu').value,
            courseCode: courseSelect.value
        };

        // تغییر ظاهر دکمه
        submitBtn.disabled = true;
        document.getElementById('btnText').style.display = "none";
        document.getElementById('btnLoader').style.display = "block";

        // ارسال به سرور گوگل
        fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(result => {
            submitBtn.disabled = false;
            document.getElementById('btnText').style.display = "inline-block";
            document.getElementById('btnLoader').style.display = "none";
            
            showMessage(result.message, result.success);
            
            if(result.success) {
                form.reset();
                // در اینجا می‌توانید کاربر را پس از 3 ثانیه به صفحه ورود (index.html) هدایت کنید
                // setTimeout(() => { window.location.href = 'index.html'; }, 3000);
            }
        })
        .catch(error => {
            submitBtn.disabled = false;
            document.getElementById('btnText').style.display = "inline-block";
            document.getElementById('btnLoader').style.display = "none";
            showMessage("خطا در ارتباط با سرور. لطفا اتصال اینترنت را چک کنید.", false);
        });
    });
</script>

</body>
</html>
