  <!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>نظرسنجی | مؤسسه تعالی اندیشه و رشد</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://tashacol.ir/1754843708220.png" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">

<style>
:root {
  --primary: #0052cc;
  --accent: #0065ff;
  --text: #172b4d;
  --muted: #6b778c;
  --bg-card: rgba(255,255,255,0.98);
  --border: rgba(223,225,229,0.7);
  --danger: #de350b;
  --success: #00875a;
  --warning: #ff991f;
  --purple: #6554c0;
  --accent-purple: #8777d9;
  --star: #f5b301;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }

body {
  font-family: 'Vazirmatn', 'Tahoma', sans-serif;
  color: var(--text);
  min-height: 100vh;
  padding: 12px;
  background:
    linear-gradient(135deg, rgba(50,45,110,0.9), rgba(80,70,150,0.85)),
    url('https://tashacol.ir/1l5jlse9%20(1).jpeg') center/cover no-repeat fixed;
  background-color: #322d6e;
}

.container { max-width: 600px; margin: 0 auto; }

/* ───── Topbar ───── */
.topbar {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  animation: cardIn .4s ease both;
  gap: 10px;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.topbar h1 {
  margin: 0;
  font-size: .98rem;
  color: var(--text);
  font-weight: 800;
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.topbar h1 i { color: var(--purple); font-size: 1.1rem; }
.topbar h1 span {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar a {
  color: var(--accent);
  text-decoration: none;
  font-size: .82rem;
  font-weight: 700;
  padding: 8px 12px;
  border-radius: 8px;
  transition: background .2s;
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}
.topbar a:hover { background: rgba(0,101,255,0.08); }

/* ───── Alerts ───── */
.alert {
  padding: 14px 16px;
  border-radius: 14px;
  margin-bottom: 14px;
  font-size: .88rem;
  line-height: 1.75;
  font-weight: 600;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  animation: cardIn .45s ease both;
  border: 1.5px solid;
}
.alert i { font-size: 1.2rem; flex-shrink: 0; margin-top: 2px; }
.alert.danger { background: #ffebee; color: #b71c1c; border-color: #ffcdd2; }
.alert.ok     { background: #e8f5e9; color: #1b5e20; border-color: #c8e6c9; }
.alert.info   { background: #e1f5fe; color: #01579b; border-color: #b3e5fc; }
.alert.danger i { color: #d32f2f; }
.alert.ok i     { color: #2e7d32; }
.alert.info i   { color: #0288d1; }

/* ───── Card ───── */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 24px;
  margin-bottom: 14px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.18);
  animation: cardIn .5s ease both;
  animation-delay: .05s;
}
.card h2 {
  margin: 0 0 8px;
  color: var(--text);
  font-size: 1.1rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card h2 i { color: var(--purple); }
.card .sub {
  color: var(--muted);
  font-size: .84rem;
  font-weight: 500;
  margin-bottom: 20px;
  line-height: 1.7;
}

/* ───── Stars ───── */
.stars-wrap {
  background: linear-gradient(135deg, rgba(101,84,192,0.06), rgba(135,119,217,0.06));
  border-radius: 14px;
  padding: 20px 16px;
  margin-bottom: 20px;
  text-align: center;
  border: 1.5px dashed rgba(101,84,192,0.25);
}
.stars-wrap .lbl {
  display: block;
  font-size: .82rem;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 12px;
}
.stars {
  display: flex;
  justify-content: center;
  gap: 8px;
  direction: ltr;
}
.star {
  font-size: 2.6rem;
  cursor: pointer;
  color: #dfe3e8;
  transition: all .2s cubic-bezier(.4,0,.2,1);
  user-select: none;
  line-height: 1;
  text-shadow: 0 2px 6px rgba(0,0,0,0.05);
}
.star:hover { transform: scale(1.15); }
.star.active {
  color: var(--star);
  text-shadow: 0 4px 14px rgba(245,179,1,0.45);
  transform: scale(1.08);
}
.star.pop { animation: popStar .3s ease; }
@keyframes popStar {
  0% { transform: scale(1.08); }
  50% { transform: scale(1.35); }
  100% { transform: scale(1.08); }
}

.rating-text {
  text-align: center;
  margin-top: 10px;
  font-size: .82rem;
  font-weight: 700;
  color: var(--purple);
  min-height: 20px;
  transition: all .3s;
}

/* ───── Textarea ───── */
.field { margin-bottom: 18px; }
.field label {
  display: block;
  font-size: .85rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
}
.field textarea {
  width: 100%;
  min-height: 130px;
  padding: 14px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-family: inherit;
  font-size: .92rem;
  color: var(--text);
  background: rgba(250,251,252,0.9);
  resize: vertical;
  outline: none;
  transition: border-color .25s, box-shadow .25s, background .25s;
  line-height: 1.7;
  font-weight: 500;
}
.field textarea::placeholder { color: #b0b8c4; font-weight: 400; }
.field textarea:focus {
  border-color: var(--accent-purple);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(135,119,217,0.14);
}

.char-count {
  text-align: left;
  font-size: .72rem;
  color: var(--muted);
  margin-top: 4px;
  font-weight: 600;
  direction: ltr;
}

/* ───── Button ───── */
.btn {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 52px;
  background: linear-gradient(135deg, var(--accent-purple), var(--purple));
  box-shadow: 0 8px 22px rgba(101,84,192,0.3);
  transition: transform .2s, box-shadow .3s;
}
.btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(101,84,192,0.4);
}
.btn:active:not(:disabled) { transform: translateY(0) scale(.99); }
.btn:disabled { cursor: not-allowed; opacity: .85; }

/* ───── Message ───── */
.msg {
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 10px;
  font-size: .87rem;
  font-weight: 600;
  text-align: center;
  display: none;
  animation: msgIn .3s ease both;
}
.msg.show { display: flex; align-items: center; justify-content: center; gap: 8px; }
.msg.err { background: rgba(222,53,11,0.1); color: var(--danger); }
.msg.ok  { background: rgba(0,135,90,0.1); color: var(--success); }
@keyframes msgIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ───── Success State ───── */
.success-state {
  text-align: center;
  padding: 30px 20px;
  animation: cardIn .5s ease both;
}
.success-state .icon-wrap {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: linear-gradient(135deg, #00875a, #36b37e);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  box-shadow: 0 12px 30px rgba(0,135,90,0.35);
  animation: popIcon .6s ease both;
}
@keyframes popIcon {
  0% { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.15); }
  100% { transform: scale(1); opacity: 1; }
}
.success-state .icon-wrap i {
  font-size: 2.6rem;
  color: #fff;
}
.success-state h3 {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--success);
  margin-bottom: 8px;
}
.success-state p {
  font-size: .88rem;
  color: var(--muted);
  line-height: 1.7;
  font-weight: 500;
}

/* ───── Skeleton ───── */
.skeleton-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 24px;
  margin-bottom: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.1);
}
.sk {
  background: linear-gradient(90deg, #eef1f4 25%, #e0e4e8 37%, #eef1f4 63%);
  background-size: 400% 100%;
  animation: shimmer 1.4s ease-in-out infinite;
  border-radius: 8px;
}
@keyframes shimmer {
  0%   { background-position: 100% 50%; }
  100% { background-position: 0 50%; }
}
.sk-line { height: 14px; margin-bottom: 12px; }
.sk-line.w40 { width: 40%; }
.sk-line.w60 { width: 60%; }
.sk-line.w100 { width: 100%; }
.sk-block { height: 130px; border-radius: 12px; margin-bottom: 16px; }
.sk-circle {
  width: 90px; height: 90px;
  border-radius: 50%;
  margin: 0 auto 20px;
}

/* ───── Cube Loader ───── */
.cube-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,25,50,0.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  animation: fadeIn .2s ease;
}
.cube-overlay.show { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.cube {
  width: 46px; height: 46px;
  position: relative;
  transform-style: preserve-3d;
  animation: rotateCube 2.4s infinite linear;
}
.cube .face {
  position: absolute;
  width: 46px; height: 46px;
  background: linear-gradient(135deg, rgba(101,84,192,0.95), rgba(135,119,217,0.95));
  border: 1px solid rgba(255,255,255,0.35);
  box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
}
.cube .front  { transform: translateZ(23px); }
.cube .back   { transform: translateZ(-23px) rotateY(180deg); }
.cube .right  { transform: rotateY(90deg) translateZ(23px); }
.cube .left   { transform: rotateY(-90deg) translateZ(23px); }
.cube .top    { transform: rotateX(90deg) translateZ(23px); }
.cube .bottom { transform: rotateX(-90deg) translateZ(23px); }
@keyframes rotateCube {
  0%   { transform: rotateX(0) rotateY(0); }
  100% { transform: rotateX(360deg) rotateY(360deg); }
}
.cube-overlay .caption {
  color: #fff;
  font-size: .85rem;
  font-weight: 600;
  margin-top: 24px;
  text-align: center;
}

@media (max-width: 480px) {
  body { padding: 10px; }
  .card { padding: 20px 18px; }
  .star { font-size: 2.2rem; }
}
</style>
</head>
<body>

<div class="container">
  <div class="topbar">
    <h1>
      <i class="fas fa-clipboard-list"></i>
      <span>نظرسنجی دوره</span>
    </h1>
    <a href="dashboard.html">
      <i class="fas fa-arrow-right"></i>
      بازگشت
    </a>
  </div>

  <!-- Skeleton -->
  <div id="skeleton">
    <div class="skeleton-card">
      <div class="sk sk-line w60"></div>
      <div class="sk sk-line w40"></div>
      <div class="sk sk-circle"></div>
      <div class="sk sk-block"></div>
      <div class="sk sk-line w100" style="height:48px"></div>
    </div>
  </div>

  <!-- محتوای اصلی -->
  <div id="main" style="display:none">

    <div id="state"></div>

    <div class="card" id="formCard" style="display:none">
      <h2><i class="fas fa-pen-fancy"></i> نظر شما درباره این دوره</h2>
      <p class="sub">صادقانه نظر بدهید. این بازخورد به بهبود کیفیت دوره‌های بعدی کمک می‌کند.</p>

      <div class="stars-wrap">
        <span class="lbl">امتیاز کلی خود را انتخاب کنید</span>
        <div class="stars" id="stars">
          <span class="star" data-v="1">★</span>
          <span class="star" data-v="2">★</span>
          <span class="star" data-v="3">★</span>
          <span class="star" data-v="4">★</span>
          <span class="star" data-v="5">★</span>
        </div>
        <div class="rating-text" id="ratingText"></div>
      </div>

      <div class="field">
        <label><i class="fas fa-comment-dots" style="color:var(--purple);margin-left:6px"></i> نظر یا پیشنهاد شما</label>
        <textarea id="text" maxlength="2000" placeholder="تجربه‌ی خود را بنویسید: نقاط قوت، نقاط ضعف، پیشنهادات برای بهتر شدن..."></textarea>
        <div class="char-count"><span id="charCount">0</span> / 2000</div>
      </div>

      <button class="btn" id="submitBtn">
        <i class="fas fa-paper-plane"></i>
        ارسال نظرسنجی
      </button>

      <div class="msg" id="msg"></div>
    </div>

  </div>
</div>

<div class="cube-overlay" id="overlay">
  <div style="text-align:center">
    <div class="cube">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
    <div class="caption">در حال ارسال...</div>
  </div>
</div>

<script src="assets/api.js"></script>
<script>
const COURSE_CODE = sessionStorage.getItem('activeCourse');
let RATING = 0;

const overlay = document.getElementById('overlay');
function showOverlay() { overlay.classList.add('show'); }

const RATING_LABELS = {
  1: 'خیلی ضعیف',
  2: 'ضعیف',
  3: 'متوسط',
  4: 'خوب',
  5: 'عالی'
};

/* ─── ستاره‌ها ─── */
document.querySelectorAll('.star').forEach(s => {
  s.addEventListener('click', () => {
    RATING = Number(s.dataset.v);
    document.querySelectorAll('.star').forEach(x => {
      const v = Number(x.dataset.v);
      x.classList.toggle('active', v <= RATING);
      if (v === RATING) {
        x.classList.add('pop');
        setTimeout(() => x.classList.remove('pop'), 300);
      }
    });
    document.getElementById('ratingText').textContent = RATING_LABELS[RATING] || '';
  });
  s.addEventListener('mouseenter', () => {
    if (RATING > 0) return;
    document.querySelectorAll('.star').forEach(x => {
      x.classList.toggle('active', Number(x.dataset.v) <= Number(s.dataset.v));
    });
  });
});
document.getElementById('stars').addEventListener('mouseleave', () => {
  document.querySelectorAll('.star').forEach(x => {
    x.classList.toggle('active', Number(x.dataset.v) <= RATING);
  });
});

/* ─── شمارنده کاراکتر ─── */
document.getElementById('text').addEventListener('input', (e) => {
  document.getElementById('charCount').textContent = e.target.value.length;
});

/* ─── بارگذاری وضعیت ─── */
async function load() {
  const skeleton = document.getElementById('skeleton');
  const main = document.getElementById('main');

  if (!COURSE_CODE) {
    skeleton.style.display = 'none';
    main.style.display = 'block';
    document.getElementById('state').innerHTML =
      '<div class="alert danger"><i class="fas fa-exclamation-triangle"></i><span>دوره‌ای انتخاب نشده. <a href="dashboard.html" style="color:inherit;text-decoration:underline">بازگشت به داشبورد</a></span></div>';
    return;
  }

  try {
    const res = await api('surveyStatus', { courseCode: COURSE_CODE });
    skeleton.style.display = 'none';
    main.style.display = 'block';

    if (!res.isFinished) {
      document.getElementById('state').innerHTML =
        '<div class="alert danger"><i class="fas fa-lock"></i><span>برای ثبت نظرسنجی، ابتدا باید تمام روزهای دوره را با موفقیت بگذرانید.</span></div>';
      return;
    }
    if (res.alreadySubmitted) {
      document.getElementById('state').innerHTML =
        '<div class="card success-state">' +
          '<div class="icon-wrap"><i class="fas fa-check"></i></div>' +
          '<h3>نظرسنجی شما قبلاً ثبت شده است</h3>' +
          '<p>متشکریم که نظر خود را با ما به اشتراک گذاشتید.<br>بازخورد شما به بهبود کیفیت دوره‌ها کمک می‌کند.</p>' +
        '</div>';
      return;
    }

    document.getElementById('formCard').style.display = 'block';
  } catch (e) {
    skeleton.style.display = 'none';
    main.style.display = 'block';
    document.getElementById('state').innerHTML =
      '<div class="alert danger"><i class="fas fa-exclamation-triangle"></i><span>خطا: ' + e.message + '</span></div>';
  }
}

/* ─── ارسال ─── */
document.getElementById('submitBtn').onclick = async () => {
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');
  const text = document.getElementById('text').value.trim();

  if (RATING < 1) {
    msg.className = 'msg show err';
    msg.innerHTML = '<i class="fas fa-exclamation-circle"></i> امتیاز خود را انتخاب کنید';
    return;
  }
  if (text.length < 5) {
    msg.className = 'msg show err';
    msg.innerHTML = '<i class="fas fa-exclamation-circle"></i> متن نظر خیلی کوتاه است';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال ارسال...';
  msg.className = 'msg';

  try {
    await api('submitSurvey', {
      courseCode: COURSE_CODE,
      text: text,
      rating: RATING
    });

    showOverlay();

    // نمایش حالت موفق
    document.getElementById('state').innerHTML =
      '<div class="card success-state">' +
        '<div class="icon-wrap"><i class="fas fa-check"></i></div>' +
        '<h3>نظرسنجی شما با موفقیت ثبت شد</h3>' +
        '<p>متشکریم که وقت گذاشتید و نظر خود را ثبت کردید.<br>نظر شما در بهبود دوره‌های بعدی مؤثر خواهد بود.</p>' +
      '</div>';
    document.getElementById('formCard').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });

  } catch (e) {
    const map = {
      NOT_FINISHED: 'ابتدا باید دوره را کامل کنید',
      ALREADY_SUBMITTED: 'قبلاً نظرسنجی داده‌اید',
      EMPTY_TEXT: 'متن نظر خالی است',
      INVALID_RATING: 'امتیاز معتبر نیست'
    };
    msg.className = 'msg show err';
    msg.innerHTML = '<i class="fas fa-times-circle"></i> ' + (map[e.message] || ('خطا: ' + e.message));
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> ارسال نظرسنجی';
  } finally {
    setTimeout(() => overlay.classList.remove('show'), 1500);
  }
};

load();
</script>
</body>
</html>
