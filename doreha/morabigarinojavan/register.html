<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ثبت‌نام</title>
<style>
  * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    padding: 20px; display: flex; justify-content: center;
  }
  .box {
    background: #fff; border-radius: 16px; padding: 24px;
    width: 100%; max-width: 440px; box-shadow: 0 10px 40px rgba(0,0,0,.2);
  }
  h1 { text-align: center; margin: 0 0 20px; color: #1e3c72; font-size: 20px; }
  label { display: block; margin: 12px 0 5px; font-size: 14px; color: #333; }
  input, select {
    width: 100%; padding: 11px; font-size: 15px;
    border: 2px solid #ddd; border-radius: 8px;
    background: #fff;
  }
  input:focus, select:focus { outline: none; border-color: #2a5298; }
  input[dir="ltr"] { text-align: left; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  button {
    width: 100%; padding: 14px; font-size: 16px; font-weight: bold;
    background: #2a5298; color: #fff; border: none; border-radius: 8px;
    cursor: pointer; margin-top: 18px;
  }
  button:disabled { opacity: .6; }
  .msg {
    margin-top: 14px; padding: 10px; border-radius: 8px;
    font-size: 14px; text-align: center; display: none;
  }
  .msg.err { background: #ffe5e5; color: #c00; display: block; }
  .msg.ok  { background: #e5ffe5; color: #080; display: block; }
  .back { text-align: center; margin-top: 16px; font-size: 14px; }
  .back a { color: #2a5298; text-decoration: none; }
  .hint { font-size: 12px; color: #888; margin-top: 4px; text-align: center; }
</style>
</head>
<body>
<div class="box">
  <h1>ثبت‌نام در دوره</h1>

  <label>نام و نام خانوادگی</label>
  <input id="name" type="text" placeholder="مثال: علی رضایی">

  <label>کد ملی</label>
  <input id="nid" type="tel" inputmode="numeric" maxlength="10" placeholder="۱۰ رقم" dir="ltr">

  <label>تاریخ تولد</label>
  <div class="row">
    <div>
      <select id="by"></select>
      <div class="hint">سال</div>
    </div>
    <div>
      <select id="bm"></select>
      <div class="hint">ماه</div>
    </div>
    <div>
      <select id="bd"></select>
      <div class="hint">روز</div>
    </div>
  </div>

  <label>شماره تماس</label>
  <input id="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="09xxxxxxxxx" dir="ltr">

  <label>تحصیلات</label>
  <select id="edu">
    <option value="">انتخاب کنید</option>
    <option>زیر دیپلم</option>
    <option>دیپلم</option>
    <option>کاردانی</option>
    <option>کارشناسی</option>
    <option>کارشناسی ارشد</option>
    <option>دکترا</option>
  </select>

  <label>دوره</label>
  <select id="course">
    <option value="">در حال بارگذاری...</option>
  </select>

  <button id="btn">ثبت‌نام</button>
  <div id="msg" class="msg"></div>

  <div class="back">
    <a href="index.html">بازگشت به صفحه ورود</a>
  </div>
</div>

<script src="assets/api.js"></script>
<script>
function jalaliToGregorian(jy, jm, jd) {
  jy += 1595;
  let days = -355668 + (365 * jy) + (Math.floor(jy / 33) * 8) +
             Math.floor(((jy % 33) + 3) / 4) + jd +
             (jm < 7 ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
  let gy = 400 * Math.floor(days / 146097);
  days %= 146097;
  if (days > 36524) {
    gy += 100 * Math.floor(--days / 36524);
    days %= 36524;
    if (days >= 365) days++;
  }
  gy += 4 * Math.floor(days / 1461);
  days %= 1461;
  if (days > 365) {
    gy += Math.floor((days - 1) / 365);
    days = (days - 1) % 365;
  }
  let gd = days + 1;
  const leap = (gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0);
  const sal = [0, 31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  let gm;
  for (gm = 0; gm < 13; gm++) {
    if (gd <= sal[gm]) break;
    gd -= sal[gm];
  }
  return [gy, gm, gd];
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }

(function initDate() {
  const by = document.getElementById('by');
  const bm = document.getElementById('bm');
  const bd = document.getElementById('bd');
  const cy = 1405;
  for (let y = cy - 70; y <= cy - 10; y++) {
    by.innerHTML += `<option value="${y}">${y}</option>`;
  }
  for (let m = 1; m <= 12; m++) {
    bm.innerHTML += `<option value="${m}">${m}</option>`;
  }
  for (let d = 1; d <= 31; d++) {
    bd.innerHTML += `<option value="${d}">${d}</option>`;
  }
  by.value = cy - 25;
  bm.value = 1;
  bd.value = 1;
})();

async function loadCourses() {
  const sel = document.getElementById('course');
  try {
    const res = await api('listOpenCourses', {});
    sel.innerHTML = '<option value="">انتخاب کنید</option>';
    if (!res.courses.length) {
      sel.innerHTML = '<option value="">هیچ دوره‌ای باز نیست</option>';
      return;
    }
    res.courses.forEach(c => {
      sel.innerHTML += `<option value="${c.code}">${c.name} (${c.code}) — ${c.remaining} ظرفیت</option>`;
    });
  } catch (e) {
    sel.innerHTML = '<option value="">خطا در بارگذاری</option>';
  }
}
loadCourses();

const btn = document.getElementById('btn');
const msg = document.getElementById('msg');
function show(t, isErr) {
  msg.textContent = t;
  msg.className = 'msg ' + (isErr ? 'err' : 'ok');
}

btn.addEventListener('click', async () => {
  const name = document.getElementById('name').value.trim();
  const nid  = document.getElementById('nid').value.trim();
  const by   = Number(document.getElementById('by').value);
  const bm   = Number(document.getElementById('bm').value);
  const bd   = Number(document.getElementById('bd').value);
  const phone = document.getElementById('phone').value.trim();
  const edu = document.getElementById('edu').value;
  const course = document.getElementById('course').value;

  msg.className = 'msg';

  if (name.length < 3)   return show('نام را کامل وارد کنید', true);
  if (!/^\d{10}$/.test(nid)) return show('کد ملی باید ۱۰ رقم باشد', true);
  if (!/^09\d{9}$/.test(phone)) return show('شماره تماس معتبر نیست', true);
  if (!edu)              return show('تحصیلات را انتخاب کنید', true);
  if (!course)           return show('دوره را انتخاب کنید', true);

  const [gy, gm, gd] = jalaliToGregorian(by, bm, bd);
  const dobISO = `${gy}-${pad(gm)}-${pad(gd)}`;

  const birth = new Date(dobISO);
  const now = new Date();
  let age = now.getFullYear() - birth.getFullYear();
  const mm = now.getMonth() - birth.getMonth();
  if (mm < 0 || (mm === 0 && now.getDate() < birth.getDate())) age--;
  if (age < 18) return show('شما زیر ۱۸ سال هستید و مجاز به ثبت‌نام نیستید', true);

  btn.disabled = true;
  btn.textContent = 'در حال ارسال...';

  try {
    await api('register', {
      name, nationalId: nid, dob: dobISO,
      phone, education: edu, courseCode: course
    });
    show('ثبت‌نام با موفقیت انجام شد! در حال انتقال به ورود...', false);
    setTimeout(() => location.href = 'index.html', 1500);
  } catch (err) {
    const map = {
      INVALID_NID:        'کد ملی معتبر نیست',
      INVALID_NAME:       'نام وارد شده کوتاه است',
      INVALID_DOB:        'تاریخ تولد معتبر نیست',
      INVALID_PHONE:      'شماره تماس معتبر نیست',
      UNDER_AGE:          'شما زیر ۱۸ سال هستید',
      COURSE_NOT_FOUND:   'دوره پیدا نشد',
      COURSE_CLOSED:      'این دوره بسته شده است',
      COURSE_FULL:        'ظرفیت دوره تکمیل است',
      ALREADY_REGISTERED: 'قبلاً در این دوره ثبت‌نام کرده‌اید',
      NO_COURSE:          'دوره انتخاب نشده'
    };
    show(map[err.message] || 'خطا: ' + err.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'ثبت‌نام';
  }
});
</script>
</body>
</html>
