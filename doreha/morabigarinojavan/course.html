<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>پنل درسی | مؤسسه تعالی اندیشه و رشد</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://tashacol.ir/1754843708220.png" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">

<style>
:root {
  --primary: #0052cc;
  --accent: #0065ff;
  --text: #172b4d;
  --muted: #6b778c;
  --bg-card: rgba(255,255,255,0.98);
  --border: rgba(223,225,229,0.7);
  --danger: #de350b;
  --success: #00875a;
  --warning: #ff991f;
  --locked: #b3bac5;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }

body {
  font-family: 'Vazirmatn', 'Tahoma', sans-serif;
  color: var(--text);
  min-height: 100vh;
  padding: 12px;
  background:
    linear-gradient(135deg, rgba(30,60,114,0.9), rgba(42,82,152,0.85)),
    url('https://tashacol.ir/1l5jlse9%20(1).jpeg') center/cover no-repeat fixed;
  background-color: #1e3c72;
}

.container { max-width: 720px; margin: 0 auto; }

/* ───── Topbar ───── */
.topbar {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  animation: cardIn .4s ease both;
  gap: 10px;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.topbar h1 {
  margin: 0;
  font-size: .98rem;
  color: var(--text);
  font-weight: 800;
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  overflow: hidden;
}
.topbar h1 i {
  color: var(--accent);
  font-size: 1.1rem;
  flex-shrink: 0;
}
.topbar h1 span {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar a {
  color: var(--accent);
  text-decoration: none;
  font-size: .82rem;
  font-weight: 700;
  padding: 8px 12px;
  border-radius: 8px;
  transition: background .2s;
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}
.topbar a:hover { background: rgba(0,101,255,0.08); }

/* ───── Weeks Scroll ───── */
.weeks {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 2px 10px;
  margin-bottom: 10px;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.weeks::-webkit-scrollbar { display: none; }

.wbtn {
  flex-shrink: 0;
  padding: 9px 18px;
  border-radius: 22px;
  background: rgba(255,255,255,0.22);
  color: #fff;
  border: 1.5px solid rgba(255,255,255,0.25);
  font-size: .82rem;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: all .25s;
  white-space: nowrap;
}
.wbtn:hover {
  background: rgba(255,255,255,0.35);
}
.wbtn.active {
  background: #fff;
  color: var(--primary);
  border-color: #fff;
  box-shadow: 0 6px 16px rgba(0,0,0,0.15);
}

/* ───── Days Grid ───── */
.days {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}
.dbtn {
  padding: 14px 6px 10px;
  border-radius: 14px;
  border: 1.5px solid var(--border);
  background: #fff;
  color: var(--text);
  font-family: inherit;
  font-size: .82rem;
  cursor: pointer;
  text-align: center;
  position: relative;
  transition: all .25s;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
  min-height: 96px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
}
.dbtn:hover:not(.locked) {
  transform: translateY(-3px);
  border-color: var(--accent);
  box-shadow: 0 8px 20px rgba(0,82,204,0.18);
}
.dbtn.active {
  background: linear-gradient(135deg, var(--accent), var(--primary));
  color: #fff;
  border-color: var(--primary);
  box-shadow: 0 8px 22px rgba(0,82,204,0.35);
  transform: translateY(-3px);
}
.dbtn.active .day-name,
.dbtn.active .day-lbl,
.dbtn.active .day-date { color: #fff; }
.dbtn.active .day-date { opacity: .85; }

.dbtn.locked {
  opacity: .55;
  cursor: not-allowed;
  background: #f4f5f7;
}
.dbtn.passed {
  border-color: rgba(0,135,90,0.4);
}

.dbtn .day-name {
  font-weight: 800;
  font-size: .88rem;
  color: var(--text);
  display: block;
}
.dbtn .day-lbl {
  font-size: .72rem;
  color: var(--muted);
  margin-top: 2px;
  font-weight: 600;
}
.dbtn .day-date {
  font-size: .68rem;
  color: #999;
  direction: ltr;
  margin-top: 3px;
  font-weight: 500;
}
.dbtn .check {
  position: absolute;
  top: 6px; left: 8px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--success);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .65rem;
  box-shadow: 0 2px 6px rgba(0,135,90,0.4);
}
.dbtn .lock {
  position: absolute;
  top: 6px; left: 8px;
  color: var(--locked);
  font-size: .78rem;
}
.dbtn.active .check { background: #fff; color: var(--success); }
.dbtn.active .lock { color: rgba(255,255,255,0.7); }

/* ───── Content Area ───── */
.content {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.18);
  animation: cardIn .5s ease both;
  animation-delay: .1s;
  min-height: 220px;
}
.content h2 {
  margin: 0 0 12px;
  color: var(--text);
  font-size: 1.05rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 8px;
}
.content h2 i { color: var(--accent); }
.content .subtitle {
  color: var(--muted);
  font-size: .88rem;
  margin: 0 0 14px;
  font-weight: 500;
}

/* ───── Links ───── */
.links {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.links a {
  flex: 1;
  min-width: 140px;
  padding: 13px 14px;
  border-radius: 12px;
  text-decoration: none;
  text-align: center;
  font-size: .9rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all .25s;
  border: 1.5px solid transparent;
}
.links a.pdf {
  background: rgba(0,135,90,0.1);
  color: var(--success);
  border-color: rgba(0,135,90,0.25);
}
.links a.pdf:hover {
  background: rgba(0,135,90,0.18);
  transform: translateY(-2px);
}
.links a.video {
  background: rgba(222,53,11,0.08);
  color: var(--danger);
  border-color: rgba(222,53,11,0.2);
}
.links a.video:hover {
  background: rgba(222,53,11,0.15);
  transform: translateY(-2px);
}

/* ───── Question Box ───── */
.q-section-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: .95rem;
  font-weight: 800;
  color: var(--text);
  margin: 20px 0 14px;
  padding-bottom: 8px;
  border-bottom: 1.5px dashed var(--border);
}
.q-section-title i { color: var(--warning); }

.q {
  background: #f7f9fc;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
  border-right: 4px solid var(--accent);
  transition: all .25s;
}
.q .qtxt {
  font-weight: 700;
  font-size: .92rem;
  margin-bottom: 12px;
  color: var(--text);
  line-height: 1.6;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.q .qtxt .num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: .78rem;
  flex-shrink: 0;
  font-weight: 800;
}

.opt {
  display: flex;
  align-items: center;
  padding: 11px 14px;
  margin-bottom: 8px;
  background: #fff;
  border-radius: 10px;
  cursor: pointer;
  border: 2px solid #e0e4e8;
  font-size: .88rem;
  transition: all .2s;
  font-weight: 500;
  user-select: none;
}
.opt:last-child { margin-bottom: 0; }
.opt:hover { border-color: var(--accent); background: #f7fbff; }
.opt input {
  margin-left: 10px;
  width: 18px;
  height: 18px;
  accent-color: var(--accent);
  cursor: pointer;
  flex-shrink: 0;
}
.opt.selected {
  border-color: var(--accent);
  background: rgba(0,101,255,0.08);
  font-weight: 700;
}

/* ───── Submit ───── */
.submit {
  width: 100%;
  padding: 15px;
  font-size: 1rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--primary));
  color: #fff;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-family: inherit;
  margin-top: 8px;
  box-shadow: 0 8px 22px rgba(0,82,204,0.28);
  transition: transform .2s, box-shadow .3s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 52px;
}
.submit:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(0,82,204,0.35);
}
.submit:disabled { cursor: not-allowed; opacity: .85; }

/* ───── Message ───── */
.msg {
  margin-top: 14px;
  padding: 13px 16px;
  border-radius: 11px;
  font-size: .88rem;
  font-weight: 600;
  text-align: center;
  display: none;
  animation: msgIn .3s ease both;
}
.msg.show { display: flex; align-items: center; justify-content: center; gap: 8px; }
.msg.err  { background: rgba(222,53,11,0.1); color: var(--danger); border: 1px solid rgba(222,53,11,0.2); }
.msg.ok   { background: rgba(0,135,90,0.1); color: var(--success); border: 1px solid rgba(0,135,90,0.2); }
@keyframes msgIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ───── Empty State ───── */
.empty {
  text-align: center;
  padding: 44px 20px;
  color: var(--muted);
}
.empty i {
  font-size: 2.8rem;
  opacity: .4;
  margin-bottom: 14px;
  display: block;
}
.empty p { font-size: .92rem; font-weight: 600; }
.empty .sub { font-size: .82rem; margin-top: 6px; opacity: .8; }

/* ───── Skeleton ───── */
.sk-day {
  min-height: 96px;
  border-radius: 14px;
  background: linear-gradient(90deg, rgba(255,255,255,.3) 25%, rgba(255,255,255,.15) 37%, rgba(255,255,255,.3) 63%);
  background-size: 400% 100%;
  animation: shimmer 1.4s ease-in-out infinite;
}
@keyframes shimmer {
  0%   { background-position: 100% 50%; }
  100% { background-position: 0 50%; }
}
.sk-line {
  height: 14px;
  border-radius: 6px;
  background: #eef1f4;
  margin-bottom: 12px;
}
.sk-line.w60 { width: 60%; }
.sk-line.w80 { width: 80%; }
.sk-line.w100 { width: 100%; }
.sk-block {
  height: 90px;
  border-radius: 12px;
  background: #eef1f4;
  margin-bottom: 12px;
}

/* ───── Cube Loader ───── */
.cube-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,25,50,0.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  animation: fadeIn .2s ease;
}
.cube-overlay.show { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.cube {
  width: 46px; height: 46px;
  position: relative;
  transform-style: preserve-3d;
  animation: rotateCube 2.4s infinite linear;
}
.cube .face {
  position: absolute;
  width: 46px; height: 46px;
  background: linear-gradient(135deg, rgba(101,84,192,0.95), rgba(135,119,217,0.95));
  border: 1px solid rgba(255,255,255,0.35);
  box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
}
.cube .front  { transform: translateZ(23px); }
.cube .back   { transform: translateZ(-23px) rotateY(180deg); }
.cube .right  { transform: rotateY(90deg) translateZ(23px); }
.cube .left   { transform: rotateY(-90deg) translateZ(23px); }
.cube .top    { transform: rotateX(90deg) translateZ(23px); }
.cube .bottom { transform: rotateX(-90deg) translateZ(23px); }
@keyframes rotateCube {
  0%   { transform: rotateX(0) rotateY(0); }
  100% { transform: rotateX(360deg) rotateY(360deg); }
}
.cube-overlay .caption {
  color: #fff;
  font-size: .85rem;
  font-weight: 600;
  margin-top: 24px;
  opacity: .9;
  text-align: center;
}

@media (max-width: 480px) {
  body { padding: 10px; }
  .content { padding: 18px; }
  .dbtn { min-height: 90px; padding: 12px 4px 8px; }
  .dbtn .day-name { font-size: .82rem; }
  .dbtn .day-lbl { font-size: .68rem; }
  .topbar { padding: 12px 14px; }
}
</style>
</head>
<body>

<div class="container">
  <div class="topbar">
    <h1>
      <i class="fas fa-book-open-reader"></i>
      <span id="courseTitle">پنل درسی</span>
    </h1>
    <a href="dashboard.html">
      <i class="fas fa-arrow-right"></i>
      بازگشت
    </a>
  </div>

  <div class="weeks" id="weeks"></div>
  <div class="days" id="days"></div>

  <div class="content" id="content">
    <div class="empty">
      <i class="fas fa-hand-pointer"></i>
      <p>یک روز را انتخاب کنید</p>
      <p class="sub">ابتدا هفته، سپس روز مورد نظر را بزنید</p>
    </div>
  </div>
</div>

<div class="cube-overlay" id="overlay">
  <div style="text-align:center">
    <div class="cube">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
    <div class="caption">در حال انتقال...</div>
  </div>
</div>

<script src="assets/api.js"></script>
<script>
const overlay = document.getElementById('overlay');
function showOverlay() { overlay.classList.add('show'); }

let STRUCT = null;
let COURSE_CODE = null;
const WEEKDAY_NAMES = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه'];

/* ─── تبدیل میلادی → شمسی ─── */
function toJalali(gy, gm, gd) {
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365 * gy) + Math.floor((gy2 + 3) / 4) -
             Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) -
             80 + gd + g_d_m[gm - 1];
  jy += 33 * Math.floor(days / 12053);
  days %= 12053;
  jy += 4 * Math.floor(days / 1461);
  days %= 1461;
  if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  const jm = (days < 186) ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
  const jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
  return `${jy}/${String(jm).padStart(2,'0')}/${String(jd).padStart(2,'0')}`;
}
function dateLabel(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return toJalali(y, m, d);
}

/* ─── Skeleton اولیه ─── */
function renderSkeleton() {
  const weeksEl = document.getElementById('weeks');
  const daysEl = document.getElementById('days');
  weeksEl.innerHTML = '<div class="sk-day" style="width:90px;min-height:36px;border-radius:22px"></div>'.repeat(5);
  daysEl.innerHTML = '<div class="sk-day"></div>'.repeat(4);
}

/* ─── شروع ─── */
async function init() {
  COURSE_CODE = sessionStorage.getItem('activeCourse');
  if (!COURSE_CODE) {
    document.getElementById('content').innerHTML =
      '<div class="empty"><i class="fas fa-exclamation-triangle" style="color:#ff991f"></i>' +
      '<p>دوره‌ای انتخاب نشده</p>' +
      '<p class="sub"><a href="dashboard.html" style="color:#0065ff;text-decoration:none;font-weight:700">بازگشت به داشبورد</a></p></div>';
    return;
  }

  renderSkeleton();

  try {
    const listRes = await api('myCourses', {});
    const c = (listRes.courses || []).find(x => x.code === COURSE_CODE);
    if (c) document.getElementById('courseTitle').textContent = c.name;
  } catch (e) {}

  loadStructure();
}

/* ─── بارگذاری ساختار ─── */
async function loadStructure() {
  const weeksEl = document.getElementById('weeks');
  const daysEl = document.getElementById('days');
  const contentEl = document.getElementById('content');

  try {
    const res = await api('courseStructure', { courseCode: COURSE_CODE });
    STRUCT = res.schedule;

    if (!STRUCT.length) {
      weeksEl.innerHTML = '';
      daysEl.innerHTML = '';
      contentEl.innerHTML =
        '<div class="empty"><i class="fas fa-calendar-times"></i>' +
        '<p>هنوز برنامه‌ای برای این دوره تعریف نشده است</p>' +
        '<p class="sub">منتظر اعلام مدیر باشید</p></div>';
      return;
    }

    const weekSet = [...new Set(STRUCT.map(x => x.w))].sort((a,b)=>a-b);
    weeksEl.innerHTML = '';
    weekSet.forEach(w => {
      const b = document.createElement('button');
      b.className = 'wbtn';
      b.textContent = 'هفته ' + w;
      b.dataset.week = w;
      b.onclick = () => selectWeek(w);
      weeksEl.appendChild(b);
    });

    let firstOpen = weekSet.find(w => STRUCT.some(x => x.w === w && !x.locked));
    if (!firstOpen) firstOpen = weekSet[weekSet.length - 1];
    selectWeek(firstOpen);

  } catch (e) {
    weeksEl.innerHTML = '';
    daysEl.innerHTML = '';
    contentEl.innerHTML =
      '<div class="empty"><i class="fas fa-exclamation-triangle" style="color:#de350b"></i>' +
      '<p>خطا در بارگذاری</p>' +
      '<p class="sub">' + e.message + '</p></div>';
  }
}

/* ─── انتخاب هفته ─── */
function selectWeek(w) {
  document.querySelectorAll('.wbtn').forEach(b => {
    b.classList.toggle('active', Number(b.dataset.week) === w);
  });

  const dayItems = STRUCT.filter(x => x.w === w).sort((a,b)=>a.d-b.d);
  const daysEl = document.getElementById('days');
  daysEl.innerHTML = '';

  dayItems.forEach(item => {
    const b = document.createElement('button');
    b.className = 'dbtn';
    if (item.locked) b.classList.add('locked');
    if (item.passed) b.classList.add('passed');

    let badge = '';
    if (item.passed) {
      badge = '<span class="check"><i class="fas fa-check"></i></span>';
    } else if (item.locked) {
      badge = '<span class="lock"><i class="fas fa-lock"></i></span>';
    }

    let lbl;
    if (item.locked) lbl = 'قفل';
    else if (item.passed) lbl = 'تکمیل';
    else lbl = 'باز';

    b.innerHTML =
      badge +
      '<span class="day-name">' + (WEEKDAY_NAMES[item.d-1] || 'روز '+item.d) + '</span>' +
      '<span class="day-lbl">' + lbl + '</span>' +
      '<span class="day-date">' + dateLabel(item.date) + '</span>';

    if (!item.locked) {
      b.onclick = () => selectDay(w, item.d, b);
    }
    daysEl.appendChild(b);
  });

  document.getElementById('content').innerHTML =
    '<div class="empty"><i class="fas fa-hand-pointer"></i><p>یک روز را انتخاب کنید</p></div>';
}

/* ─── انتخاب روز ─── */
async function selectDay(w, d, btn) {
  document.querySelectorAll('.dbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const contentEl = document.getElementById('content');
  contentEl.innerHTML =
    '<div class="sk-line w60"></div>' +
    '<div class="sk-line w100" style="height:48px;margin-bottom:16px"></div>' +
    '<div class="sk-block"></div>' +
    '<div class="sk-block"></div>' +
    '<div class="sk-block"></div>';

  try {
    const res = await api('courseDay', { courseCode: COURSE_CODE, week: w, day: d });
    renderDay(res, w, d);
  } catch (e) {
    const map = {
      LOCKED: 'این روز هنوز باز نشده است',
      NO_CONTENT: 'محتوای این روز هنوز ثبت نشده',
      NOT_FOUND: 'روز پیدا نشد',
      FORBIDDEN_COURSE: 'شما به این دوره دسترسی ندارید'
    };
    contentEl.innerHTML =
      '<div class="empty"><i class="fas fa-exclamation-circle" style="color:#ff991f"></i>' +
      '<p>' + (map[e.message] || e.message) + '</p></div>';
  }
}

/* ─── نمایش محتوا ─── */
function renderDay(res, w, d) {
  const el = document.getElementById('content');

  let html = '<h2><i class="fas fa-book"></i> هفته ' + w + ' — ' + (WEEKDAY_NAMES[d-1] || ('روز '+d)) + '</h2>';
  if (res.title) html += '<p class="subtitle">' + res.title + '</p>';

  if (res.pdfUrl || res.videoUrl) {
    html += '<div class="links">';
    if (res.pdfUrl)   html += '<a class="pdf" href="' + res.pdfUrl + '" target="_blank" rel="noopener"><i class="fas fa-file-pdf"></i> دانلود جزوه</a>';
    if (res.videoUrl) html += '<a class="video" href="' + res.videoUrl + '" target="_blank" rel="noopener"><i class="fas fa-play-circle"></i> تماشای ویدیو</a>';
    html += '</div>';
  }

  if (res.alreadyPassed) {
    html +=
      '<div class="msg ok show" style="margin:0">' +
      '<i class="fas fa-check-circle"></i> شما این روز را قبلاً با موفقیت گذراندید' +
      '</div>';
    el.innerHTML = html;
    return;
  }

  html += '<div class="q-section-title"><i class="fas fa-question-circle"></i> آزمون — هر ۳ پاسخ باید درست باشد</div>';

  res.questions.forEach((q, qi) => {
    const opts = [q.o1, q.o2, q.o3];
    html += '<div class="q"><div class="qtxt"><span class="num">' + (qi+1) + '</span><span>' + (q.q || '(بدون متن)') + '</span></div>';
    opts.forEach((o, oi) => {
      html +=
        '<label class="opt" data-q="' + qi + '" data-o="' + (oi+1) + '">' +
        '<input type="radio" name="q' + qi + '" value="' + (oi+1) + '"> ' +
        (o || '(خالی)') +
        '</label>';
    });
    html += '</div>';
  });

  html += '<button class="submit" id="submitBtn"><i class="fas fa-paper-plane"></i> ارسال پاسخ‌ها</button>';
  html += '<div class="msg" id="ansMsg"></div>';
  el.innerHTML = html;

  el.querySelectorAll('.opt').forEach(lbl => {
    lbl.addEventListener('click', () => {
      const q = lbl.dataset.q;
      el.querySelectorAll('.opt[data-q="' + q + '"]').forEach(x => x.classList.remove('selected'));
      lbl.classList.add('selected');
    });
  });

  document.getElementById('submitBtn').onclick = () => submitAnswers(w, d);
}

/* ─── ارسال پاسخ ─── */
async function submitAnswers(w, d) {
  const el = document.getElementById('content');
  const msg = document.getElementById('ansMsg');
  const btn = document.getElementById('submitBtn');

  const answers = [null, null, null];
  for (let i = 0; i < 3; i++) {
    const sel = el.querySelector('input[name="q' + i + '"]:checked');
    if (!sel) {
      msg.className = 'msg show err';
      msg.innerHTML = '<i class="fas fa-exclamation-circle"></i> به همه‌ی سؤالات پاسخ دهید';
      return;
    }
    answers[i] = Number(sel.value);
  }

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال بررسی...';
  msg.className = 'msg';

  try {
    await api('courseAnswer', { courseCode: COURSE_CODE, week: w, day: d, answers });
    msg.className = 'msg show ok';
    msg.innerHTML = '<i class="fas fa-check-circle"></i> آفرین! همه‌ی پاسخ‌ها درست بود';
    btn.innerHTML = '<i class="fas fa-check"></i> تکمیل شد';
    setTimeout(() => loadStructure(), 1200);
  } catch (e) {
    if (e.message === 'WRONG_ANSWERS') {
      msg.className = 'msg show err';
      msg.innerHTML = '<i class="fas fa-times-circle"></i> یکی از پاسخ‌ها اشتباه است. مجدد تلاش کنید';
    } else {
      msg.className = 'msg show err';
      msg.innerHTML = '<i class="fas fa-exclamation-circle"></i> خطا: ' + e.message;
    }
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> ارسال پاسخ‌ها';
  }
}

init();
</script>
