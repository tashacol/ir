 <!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>استعلام گواهی | مؤسسه تعالی اندیشه و رشد</title>
<meta name="description" content="استعلام اعتبار گواهی‌های صادرشده توسط مؤسسه تعالی اندیشه و رشد. کد ملی را وارد کنید و گواهی خود را دانلود کنید.">
<meta name="robots" content="index, follow">
<link rel="icon" href="https://tashacol.ir/1754843708220.png" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">

<style>
:root {
  --primary: #0052cc;
  --accent: #0065ff;
  --text: #172b4d;
  --muted: #6b778c;
  --bg-card: rgba(255,255,255,0.98);
  --border: rgba(223,225,229,0.7);
  --danger: #de350b;
  --success: #00875a;
  --gold-1: #d4a72c;
  --gold-2: #f4c430;
  --gold-3: #b8851e;
  --input-bg: rgba(250,251,252,0.9);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }

body {
  font-family: 'Vazirmatn', 'Tahoma', sans-serif;
  color: var(--text);
  min-height: 100vh;
  padding: 16px;
  background:
    linear-gradient(135deg, rgba(20,50,100,0.9), rgba(30,70,140,0.85)),
    url('https://tashacol.ir/1l5jlse9%20(1).jpeg') center/cover no-repeat fixed;
  background-color: #143264;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.container { max-width: 560px; width: 100%; margin: 0 auto; }

.topbar {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  gap: 10px;
}
.topbar h1 {
  margin: 0;
  font-size: .98rem;
  color: var(--text);
  font-weight: 800;
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.topbar h1 i { color: var(--accent); font-size: 1.1rem; }
.topbar h1 span {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar a {
  color: var(--accent);
  text-decoration: none;
  font-size: .82rem;
  font-weight: 700;
  padding: 8px 12px;
  border-radius: 8px;
  transition: background .2s;
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}
.topbar a:hover { background: rgba(0,101,255,0.08); }

.search-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 26px 22px;
  margin-bottom: 14px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.18);
  position: relative;
  overflow: hidden;
}
.search-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}
.search-header {
  text-align: center;
  margin-bottom: 22px;
}
.search-header .badge-icon {
  width: 72px;
  height: 72px;
  border-radius: 20px;
  background: linear-gradient(135deg, var(--accent), var(--primary));
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
  color: #fff;
  font-size: 1.9rem;
  box-shadow: 0 10px 24px rgba(0,82,204,0.35);
  position: relative;
}
.search-header .badge-icon::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 26px;
  border: 2px solid var(--accent);
  opacity: .18;
  animation: pulseRing 2.5s ease-in-out infinite;
}
@keyframes pulseRing {
  0%, 100% { transform: scale(1); opacity: .18; }
  50% { transform: scale(1.1); opacity: .05; }
}
.search-header h2 {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 8px;
}
.search-header p {
  font-size: .84rem;
  color: var(--muted);
  line-height: 1.7;
  font-weight: 500;
  max-width: 380px;
  margin: 0 auto;
}

.field { position: relative; margin-bottom: 16px; }
.field .icon {
  position: absolute;
  top: 50%; right: 16px;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 1.05rem;
  pointer-events: none;
  transition: color .25s;
}
.field input {
  width: 100%;
  padding: 15px 48px 15px 15px;
  background: var(--input-bg);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-size: 1.05rem;
  font-family: inherit;
  outline: none;
  transition: border-color .25s, box-shadow .25s, background .25s;
  text-align: right;
  letter-spacing: 3px;
  font-weight: 700;
}
.field input::placeholder {
  color: #b0b8c4;
  letter-spacing: normal;
  font-weight: 400;
}
.field input:focus {
  border-color: var(--accent);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(0,101,255,0.14);
}
.field input:focus ~ .icon { color: var(--accent); }

.btn {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  font-size: 1.02rem;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 52px;
  background: linear-gradient(135deg, var(--accent), var(--primary));
  box-shadow: 0 8px 22px rgba(0,82,204,0.28);
  transition: transform .2s, box-shadow .3s;
}
.btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(0,82,204,0.35);
}
.btn:active:not(:disabled) { transform: translateY(0) scale(.99); }
.btn:disabled { cursor: wait; opacity: .9; }

.btn-loader {
  display: none;
  align-items: center;
  gap: 6px;
}
.btn.loading .btn-text { display: none; }
.btn.loading .btn-loader { display: flex; }
.btn-loader .dot {
  width: 9px; height: 9px;
  background: #fff;
  border-radius: 50%;
  animation: bounce 1.2s infinite ease-in-out;
}
.btn-loader .dot:nth-child(2) { animation-delay: -.16s; }
.btn-loader .dot:nth-child(3) { animation-delay: -.32s; }
@keyframes bounce {
  0%, 80%, 100% { transform: scale(.5); opacity: .5; }
  40% { transform: scale(1); opacity: 1; }
}

.msg {
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 10px;
  font-size: .87rem;
  font-weight: 600;
  text-align: center;
  display: none;
}
.msg.show { display: flex; align-items: center; justify-content: center; gap: 8px; }
.msg.err  { background: rgba(222,53,11,0.1); color: var(--danger); border: 1px solid rgba(222,53,11,0.2); }
.msg.ok   { background: rgba(0,135,90,0.1); color: var(--success); border: 1px solid rgba(0,135,90,0.2); }

.results { margin-top: 6px; }

.result-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 14px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.18);
  animation: resultIn .5s ease both;
  position: relative;
  overflow: hidden;
}
.result-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, transparent, var(--gold-1), transparent);
}
@keyframes resultIn {
  from { opacity: 0; transform: translateY(20px) scale(.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.result-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding-bottom: 16px;
  border-bottom: 1.5px dashed rgba(212,167,44,0.35);
  margin-bottom: 16px;
}
.result-header .verified-badge {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--success), #36b37e);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 1.5rem;
  flex-shrink: 0;
  box-shadow: 0 8px 20px rgba(0,135,90,0.35);
  position: relative;
}
.result-header .verified-badge::after {
  content: '';
  position: absolute;
  inset: -5px;
  border-radius: 50%;
  border: 2px solid var(--success);
  opacity: .25;
  animation: pulseRing 2s ease-in-out infinite;
}
.result-header .title-block { flex: 1; min-width: 0; }
.result-header .title-block h3 {
  font-size: 1rem;
  font-weight: 800;
  color: var(--success);
  margin-bottom: 3px;
}
.result-header .title-block p {
  font-size: .8rem;
  color: var(--muted);
  font-weight: 600;
}

.result-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  font-size: .87rem;
  border-bottom: 1px solid #f0f2f5;
}
.result-row:last-child { border-bottom: none; }
.result-row .lbl {
  color: var(--muted);
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
.result-row .lbl i {
  color: var(--gold-1);
  width: 16px;
  text-align: center;
  font-size: .92rem;
}
.result-row .val {
  color: var(--text);
  font-weight: 800;
  max-width: 60%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  direction: ltr;
}
.result-row .val.fa { direction: rtl; }

.cert-number-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  background: rgba(212,167,44,0.12);
  color: var(--gold-3);
  border-radius: 20px;
  font-size: .78rem;
  font-weight: 800;
  font-family: 'Courier New', monospace;
  direction: ltr;
  border: 1px solid rgba(212,167,44,0.3);
}

.download-wrap {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1.5px dashed rgba(212,167,44,0.35);
}
.btn-download {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 11px;
  font-size: .92rem;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  background: linear-gradient(135deg, var(--gold-2), var(--gold-1), var(--gold-3));
  background-size: 200% 200%;
  box-shadow: 0 8px 22px rgba(212,167,44,0.35);
  animation: shimmerGold 4s ease-in-out infinite;
  transition: transform .2s, box-shadow .3s;
}
@keyframes shimmerGold {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
.btn-download:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(212,167,44,0.5);
}
.btn-download:disabled { cursor: wait; opacity: .8; }

.empty-state {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 40px 24px;
  text-align: center;
  box-shadow: 0 12px 40px rgba(0,0,0,0.15);
  animation: resultIn .5s ease both;
}
.empty-state .icon-wrap {
  width: 86px;
  height: 86px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ffebee, #ffcdd2);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  color: var(--danger);
  font-size: 2.4rem;
}
.empty-state h3 {
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 8px;
}
.empty-state p {
  font-size: .87rem;
  color: var(--muted);
  line-height: 1.8;
  font-weight: 500;
}

.footer-note {
  text-align: center;
  margin-top: 20px;
  padding: 14px;
  color: rgba(255,255,255,0.85);
  font-size: .78rem;
  line-height: 1.7;
  font-weight: 500;
}
.footer-note i { color: #ffd700; margin-left: 4px; }

.success-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,25,50,0.6);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9998;
  animation: fadeIn .3s ease;
}
.success-overlay.show { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.success-inner {
  text-align: center;
  animation: resultIn .5s ease both;
}
.success-inner .check-circle {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: linear-gradient(135deg, #00875a, #36b37e);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  box-shadow: 0 12px 30px rgba(0,135,90,0.4);
}
.success-inner .check-circle i {
  font-size: 2.6rem;
  color: #fff;
}
.success-inner p {
  color: #fff;
  font-size: .95rem;
  font-weight: 700;
}

.cube-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,25,50,0.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  animation: fadeIn .2s ease;
}
.cube-overlay.show { display: flex; }
.cube {
  width: 46px; height: 46px;
  position: relative;
  transform-style: preserve-3d;
  animation: rotateCube 2.4s infinite linear;
}
.cube .face {
  position: absolute;
  width: 46px; height: 46px;
  background: linear-gradient(135deg, rgba(212,167,44,0.95), rgba(244,196,48,0.95));
  border: 1px solid rgba(255,255,255,0.35);
  box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
}
.cube .front  { transform: translateZ(23px); }
.cube .back   { transform: translateZ(-23px) rotateY(180deg); }
.cube .right  { transform: rotateY(90deg) translateZ(23px); }
.cube .left   { transform: rotateY(-90deg) translateZ(23px); }
.cube .top    { transform: rotateX(90deg) translateZ(23px); }
.cube .bottom { transform: rotateX(-90deg) translateZ(23px); }
@keyframes rotateCube {
  0%   { transform: rotateX(0) rotateY(0); }
  100% { transform: rotateX(360deg) rotateY(360deg); }
}
.cube-overlay .caption {
  color: #fff;
  font-size: .85rem;
  font-weight: 600;
  margin-top: 24px;
  text-align: center;
}

@media (max-width: 480px) {
  body { padding: 12px; }
  .search-card { padding: 22px 18px; }
  .result-card { padding: 20px 18px; }
}
</style>
</head>
<body>

<div class="container">
  <div class="topbar">
    <h1>
      <i class="fas fa-shield-alt"></i>
      <span>استعلام گواهی</span>
    </h1>
    <a href="index.html">
      <i class="fas fa-arrow-right"></i>
      بازگشت
    </a>
  </div>

  <div class="search-card">
    <div class="search-header">
      <div class="badge-icon">
        <i class="fas fa-search"></i>
      </div>
      <h2>بررسی اعتبار و دانلود گواهی</h2>
      <p>کد ملی خود را وارد کنید تا گواهی‌های صادرشده را ببینید و در صورت نیاز فایل PDF را دانلود کنید.</p>
    </div>

    <form id="verifyForm" autocomplete="off">
      <div class="field">
        <input id="nid" type="tel" inputmode="numeric" maxlength="10" placeholder="کد ملی (۱۰ رقم)" autocomplete="off">
        <i class="fas fa-id-card icon"></i>
      </div>

      <button type="submit" class="btn" id="btn">
        <span class="btn-text"><i class="fas fa-search"></i> بررسی و نمایش گواهی‌ها</span>
        <span class="btn-loader">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </span>
      </button>

      <div class="msg" id="msg"></div>
    </form>
  </div>

  <div class="results" id="results"></div>

  <div class="footer-note">
    <i class="fas fa-lock"></i> اطلاعات فقط برای استعلام عمومی در دسترس است و مورد سوءاستفاده قرار نمی‌گیرد
  </div>
</div>

<div class="success-overlay" id="successOverlay">
  <div class="success-inner">
    <div class="check-circle"><i class="fas fa-check"></i></div>
    <p>دانلود گواهی آغاز شد!</p>
  </div>
</div>

<div class="cube-overlay" id="overlay">
  <div style="text-align:center">
    <div class="cube">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
    <div class="caption" id="overlayCaption">در حال ساخت گواهی PDF...</div>
  </div>
</div>

<script src="assets/api.js"></script>
<script>
const form = document.getElementById('verifyForm');
const btn = document.getElementById('btn');
const msg = document.getElementById('msg');
const results = document.getElementById('results');
const overlay = document.getElementById('overlay');
const overlayCap = document.getElementById('overlayCaption');

function showMsg(text, type) {
  msg.innerHTML = '<i class="fas ' + (type === 'ok' ? 'fa-check-circle' : 'fa-exclamation-circle') + '"></i> ' + text;
  msg.className = 'msg show ' + (type || 'err');
}
function clearMsg() {
  msg.className = 'msg';
  msg.innerHTML = '';
}
function showOverlay(caption) {
  overlayCap.textContent = caption || 'در حال ساخت گواهی...';
  overlay.classList.add('show');
}
function hideOverlay() { overlay.classList.remove('show'); }

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearMsg();
  results.innerHTML = '';

  const nid = document.getElementById('nid').value.trim();

  if (!/^\d{10}$/.test(nid)) {
    showMsg('کد ملی باید ۱۰ رقم و فقط عدد باشد', 'err');
    return;
  }

  btn.disabled = true;
  btn.classList.add('loading');
  showOverlay('در حال استعلام...');

  try {
    const res = await api('verifyCert', { nationalId: nid });
    hideOverlay();

    if (!res.found) {
      showMsg('برای این کد ملی هیچ گواهی معتبری یافت نشد', 'err');
      results.innerHTML =
        '<div class="empty-state">' +
          '<div class="icon-wrap"><i class="fas fa-search-minus"></i></div>' +
          '<h3>گواهی یافت نشد</h3>' +
          '<p>کد ملی وارد شده در سامانه گواهی‌های مؤسسه تعالی ثبت نشده است.<br>در صورت داشتن گواهی، با پشتیبانی تماس بگیرید.</p>' +
        '</div>';
      return;
    }

    showMsg(res.certificates.length + ' گواهی معتبر یافت شد', 'ok');

    res.certificates.forEach((c, idx) => {
      const div = document.createElement('div');
      div.className = 'result-card';
      div.style.animationDelay = (idx * 0.08) + 's';
      div.innerHTML =
        '<div class="result-header">' +
          '<div class="verified-badge"><i class="fas fa-check"></i></div>' +
          '<div class="title-block">' +
            '<h3>گواهی معتبر است</h3>' +
            '<p>' + escapeHtml(c.courseName) + '</p>' +
          '</div>' +
        '</div>' +
        '<div class="result-row">' +
          '<span class="lbl"><i class="fas fa-user"></i> نام و نام خانوادگی</span>' +
          '<span class="val fa">' + escapeHtml(c.fullName) + '</span>' +
        '</div>' +
        '<div class="result-row">' +
          '<span class="lbl"><i class="fas fa-book"></i> کد دوره</span>' +
          '<span class="val">' + escapeHtml(c.courseCode) + '</span>' +
        '</div>' +
        '<div class="result-row">' +
          '<span class="lbl"><i class="fas fa-hashtag"></i> شماره گواهی</span>' +
          '<span class="cert-number-chip"><i class="fas fa-certificate"></i> ' + escapeHtml(c.certNumber) + '</span>' +
        '</div>' +
        '<div class="result-row">' +
          '<span class="lbl"><i class="fas fa-calendar-check"></i> تاریخ صدور</span>' +
          '<span class="val">' + escapeHtml(c.issueDate) + '</span>' +
        '</div>' +
        '<div class="download-wrap">' +
          '<button class="btn-download" data-nid="' + escapeHtml(nid) + '" data-course="' + escapeHtml(c.courseCode) + '" data-cert="' + escapeHtml(c.certNumber) + '">' +
            '<i class="fas fa-download"></i> دانلود فایل PDF گواهی' +
          '</button>' +
        '</div>';
      results.appendChild(div);
    });

    results.querySelectorAll('.btn-download').forEach(b => {
      b.addEventListener('click', () => downloadCert(b.dataset.nid, b.dataset.course, b.dataset.cert, b));
    });

  } catch (err) {
    hideOverlay();
    const map = {
      INVALID_NID: 'کد ملی معتبر نیست',
      RATE_LIMITED: 'تعداد درخواست‌ها زیاد. کمی صبر کنید'
    };
    showMsg(map[err.message] || ('خطا: ' + err.message), 'err');
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
  }
});

async function downloadCert(nid, courseCode, certNumber, btnEl) {
  const original = btnEl.innerHTML;
  btnEl.disabled = true;
  btnEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال ساخت PDF...';
  showOverlay('در حال ساخت گواهی PDF...');

  try {
    const res = await api('downloadCertPublic', {
      nationalId: nid,
      courseCode: courseCode
    });

    const binary = atob(res.base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const blob = new Blob([bytes], { type: res.mimeType || 'application/pdf' });

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = res.fileName || ('certificate_' + certNumber + '.pdf');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    hideOverlay();

    const successOverlay = document.getElementById('successOverlay');
    successOverlay.classList.add('show');
    setTimeout(() => successOverlay.classList.remove('show'), 2200);

    btnEl.disabled = false;
    btnEl.innerHTML = '<i class="fas fa-check-circle"></i> دانلود مجدد';

  } catch (e) {
    hideOverlay();
    const map = {
      NO_CERT: 'گواهی صادر نشده است',
      COURSE_NOT_FOUND: 'دوره پیدا نشد',
      INVALID_NID: 'کد ملی معتبر نیست',
      RATE_LIMITED: 'تعداد درخواست‌ها زیاد. کمی صبر کنید'
    };
    alert(map[e.message] || ('خطا: ' + e.message));
    btnEl.disabled = false;
    btnEl.innerHTML = original;
  }
}
</script>
