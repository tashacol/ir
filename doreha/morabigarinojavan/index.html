   <!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورود به سامانه</title>
<style>
  * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
  body {
    margin: 0; min-height: 100vh; display: flex;
    align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    padding: 20px;
    transition: background .3s;
  }
  body.admin-mode {
    background: linear-gradient(135deg, #2c1810, #4a2818);
  }
  .box {
    background: #fff; border-radius: 16px; padding: 30px;
    width: 100%; max-width: 380px;
    box-shadow: 0 10px 40px rgba(0,0,0,.2);
  }

  .mode-badge {
    text-align: center; padding: 8px; border-radius: 8px;
    margin-bottom: 18px; font-size: 13px; font-weight: bold;
    display: none;
  }
  .mode-badge.show { display: block; }
  .mode-badge.admin {
    background: #4a2818; color: #fff;
  }
  .mode-badge.user {
    background: #e3f2fd; color: #1565c0;
  }

  h1 { text-align: center; margin: 0 0 6px; color: #1e3c72; font-size: 22px; }
  .subtitle { text-align: center; margin: 0 0 22px; color: #888; font-size: 13px; }

  body.admin-mode h1 { color: #4a2818; }
  body.admin-mode .subtitle { color: #8a6a58; }

  label { display: block; margin-bottom: 6px; font-size: 14px; color: #333; }
  input {
    width: 100%; padding: 12px; font-size: 16px; direction: ltr;
    border: 2px solid #ddd; border-radius: 8px; text-align: center;
    margin-bottom: 14px; letter-spacing: 2px;
    background: #fafafa;
  }
  input:focus { outline: none; border-color: #2a5298; background: #fff; }
  body.admin-mode input:focus { border-color: #4a2818; }

  button[type="submit"] {
    width: 100%; padding: 14px; font-size: 16px; font-weight: bold;
    background: #2a5298; color: #fff; border: none; border-radius: 8px;
    cursor: pointer; font-family: inherit;
  }
  body.admin-mode button[type="submit"] { background: #4a2818; }
  button[type="submit"]:active { transform: scale(.98); }
  button[type="submit"]:disabled { opacity: .6; }

  .msg {
    margin-top: 14px; padding: 10px; border-radius: 8px;
    font-size: 14px; text-align: center; display: none;
  }
  .msg.err { background: #ffe5e5; color: #c00; display: block; }
  .msg.ok  { background: #e5ffe5; color: #080; display: block; }

  .link { text-align: center; margin-top: 16px; font-size: 14px; }
  .link a { color: #2a5298; text-decoration: none; }
  body.admin-mode .link a { color: #4a2818; }

  .switch-area {
    text-align: center; margin-top: 22px;
    padding-top: 16px; border-top: 1px dashed #e0e0e0;
  }
  .switch-area button {
    background: transparent; color: #999;
    padding: 8px 14px; font-size: 12px;
    font-family: inherit; width: auto;
    border: 1px solid #e0e0e0; border-radius: 20px;
    cursor: pointer;
  }
  .switch-area button:hover { color: #1e3c72; border-color: #1e3c72; }
  body.admin-mode .switch-area button:hover { color: #4a2818; border-color: #4a2818; }
</style>
</head>
<body>
<div class="box">
  <div class="mode-badge" id="modeBadge"></div>

  <h1 id="title">ورود به سامانه</h1>
  <p class="subtitle" id="subtitle">با کد ملی خود وارد شوید</p>

  <form id="loginForm" autocomplete="off">
    <label>کد ملی</label>
    <input id="nid" type="tel" inputmode="numeric" maxlength="10" placeholder="۱۰ رقم" autocomplete="off">

    <div id="pwField" style="display:none">
      <label>رمز مدیر</label>
      <input id="pw" type="password" placeholder="رمز مدیر را وارد کنید" dir="ltr" autocomplete="new-password">
    </div>

    <button type="submit" id="btn">ورود</button>
    <div id="msg" class="msg"></div>
  </form>

  <div class="link" id="registerLink">
    <a href="register.html">ثبت‌نام نکرده‌اید؟ کلیک کنید</a>
  </div>

  <div class="switch-area" id="switchArea">
    <button type="button" id="switchBtn">🔒 ورود مدیران</button>
  </div>
</div>

<script src="assets/api.js"></script>
<script>
const body      = document.body;
const modeBadge = document.getElementById('modeBadge');
const title     = document.getElementById('title');
const subtitle  = document.getElementById('subtitle');
const pwField   = document.getElementById('pwField');
const registerLink = document.getElementById('registerLink');
const switchArea = document.getElementById('switchArea');
const form      = document.getElementById('loginForm');
const btn       = document.getElementById('btn');
const msg       = document.getElementById('msg');
const nidInput  = document.getElementById('nid');
const pwInput   = document.getElementById('pw');

let adminMode = false;

function showMsg(text, type) {
  msg.textContent = text;
  msg.className = 'msg ' + (type || 'err');
}

function clearMsg() {
  msg.className = 'msg';
  msg.textContent = '';
}

function setAdminMode(on) {
  adminMode = on;
  clearMsg();

  if (on) {
    body.classList.add('admin-mode');
    modeBadge.className = 'mode-badge show admin';
    modeBadge.textContent = '🔒 حالت ورود مدیران';
    title.textContent = 'ورود مدیران';
    subtitle.textContent = 'کد ملی و رمز مدیر را وارد کنید';
    pwField.style.display = 'block';
    registerLink.style.display = 'none';
    switchArea.innerHTML = '<button type="button" id="switchBtn">← بازگشت به ورود کاربران</button>';
    document.getElementById('switchBtn').onclick = () => setAdminMode(false);
  } else {
    body.classList.remove('admin-mode');
    modeBadge.className = 'mode-badge';
    modeBadge.textContent = '';
    title.textContent = 'ورود به سامانه';
    subtitle.textContent = 'با کد ملی خود وارد شوید';
    pwField.style.display = 'none';
    registerLink.style.display = 'block';
    switchArea.innerHTML = '<button type="button" id="switchBtn">🔒 ورود مدیران</button>';
    document.getElementById('switchBtn').onclick = () => setAdminMode(true);
  }

  pwInput.value = '';
  nidInput.value = '';
  nidInput.focus();
}

document.getElementById('switchBtn').onclick = () => setAdminMode(true);

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearMsg();

  const nid = nidInput.value.trim();
  const pw  = pwInput.value;

  if (!/^\d{10}$/.test(nid)) {
    showMsg('کد ملی باید ۱۰ رقم باشد', 'err');
    return;
  }
  if (adminMode && !pw) {
    showMsg('رمز مدیر را وارد کنید', 'err');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'در حال بررسی...';

  try {
    // ─── دو route کاملاً جدا ───
    const action = adminMode ? 'loginAdmin' : 'loginStudent';
    const res = await api(action, { nationalId: nid, password: pw });
    setToken(res.token);

    if (res.role === 'admin') {
      showMsg('ورود مدیر موفق. در حال انتقال...', 'ok');
      setTimeout(() => location.href = 'admin.html', 700);
    } else {
      sessionStorage.setItem('user', JSON.stringify(res.user || {}));
      showMsg('خوش آمدید ' + (res.user?.name || ''), 'ok');
      setTimeout(() => location.href = 'dashboard.html', 700);
    }
  } catch (err) {
    let map;
    if (adminMode) {
      map = {
        INVALID_NID: 'کد ملی باید ۱۰ رقم باشد',
        BAD_ADMIN_CREDENTIALS: 'نام کاربری یا رمز اشتباه است',
        RATE_LIMITED: 'تعداد تلاش زیاد. کمی صبر کنید'
      };
    } else {
      map = {
        INVALID_NID: 'کد ملی باید ۱۰ رقم باشد',
        NOT_REGISTERED: 'شما ثبت‌نام نکرده‌اید',
        RATE_LIMITED: 'تعداد تلاش زیاد. کمی صبر کنید'
      };
    }
    showMsg(map[err.message] || ('خطا: ' + err.message), 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'ورود';
  }
});

// focus اولیه
nidInput.focus();
</script>
</body>
</html>
