<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<!-- SEO -->
<title>ورود به پنل کاربری | مؤسسه تعالی اندیشه و رشد</title>
<meta name="description" content="وارد پنل کاربری اختصاصی خود در مؤسسه تعالی اندیشه و رشد شوید. دسترسی به وضعیت تحصیلی، پنل درسی، دانلود گواهی و نظرسنجی.">
<meta name="keywords" content="مؤسسه تعالی, موسسه تعالی اندیشه و رشد, پنل کاربران, ورود به پنل, پنل دانشجویان, tashacol">
<meta name="robots" content="index, follow">
<meta property="og:title" content="ورود به پنل کاربری | مؤسسه تعالی اندیشه و رشد">
<meta property="og:type" content="website">
<meta property="og:locale" content="fa_IR">
<link rel="icon" href="https://tashacol.ir/1754843708220.png" type="image/png">

<!-- Fonts & Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">

<style>
:root {
  --primary: #0052cc;
  --accent: #0065ff;
  --accent-admin: #b8851e;
  --primary-admin: #8a5a10;
  --text: #172b4d;
  --muted: #6b778c;
  --bg-card: rgba(255,255,255,0.98);
  --border: rgba(223,225,229,0.7);
  --input-bg: rgba(250,251,252,0.9);
  --danger: #de350b;
  --success: #00875a;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { min-height: 100%; }

body {
  font-family: 'Vazirmatn', 'Tahoma', sans-serif;
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background:
    linear-gradient(135deg, rgba(30,60,114,0.85), rgba(42,82,152,0.85)),
    url('https://tashacol.ir/1l5jlse9%20(1).jpeg') center/cover no-repeat fixed;
  background-color: #1e3c72;
  transition: background .6s ease;
}

body.admin-mode {
  background:
    linear-gradient(135deg, rgba(60,35,15,0.88), rgba(90,55,25,0.85)),
    url('https://tashacol.ir/1l5jlse9%20(1).jpeg') center/cover no-repeat fixed;
  background-color: #3c230f;
}

/* ───── Card ───── */
.card {
  width: 100%;
  max-width: 420px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 22px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 24px 60px rgba(0,0,0,0.25), 0 4px 12px rgba(0,0,0,0.08);
  padding: 38px 30px 28px;
  animation: cardIn .5s ease both;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: .8;
}
body.admin-mode .card::before {
  background: linear-gradient(90deg, transparent, var(--accent-admin), transparent);
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(20px) scale(.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ───── Mode Badge ───── */
.mode-badge {
  display: none;
  text-align: center;
  padding: 9px 12px;
  border-radius: 10px;
  margin-bottom: 18px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .3px;
  animation: badgeIn .35s ease both;
}
.mode-badge.show { display: flex; align-items: center; justify-content: center; gap: 8px; }
.mode-badge.admin {
  background: linear-gradient(135deg, var(--primary-admin), var(--accent-admin));
  color: #fff;
  box-shadow: 0 6px 18px rgba(138,90,16,0.35);
}
@keyframes badgeIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ───── Logo ───── */
.logo-wrap { text-align: center; margin-bottom: 18px; }
.logo-wrap img {
  width: 130px; height: auto; display: block; margin: 0 auto;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.08));
}

/* ───── Header ───── */
.head { text-align: center; margin-bottom: 26px; }
.head h2 {
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 8px;
  letter-spacing: -.2px;
}
body.admin-mode .head h2 { color: #3c230f; }
.head .sub {
  font-size: .78rem;
  color: var(--muted);
  font-weight: 500;
  margin-bottom: 14px;
}
.divider {
  width: 70px; height: 3px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  margin: 0 auto;
  border-radius: 3px;
}
body.admin-mode .divider {
  background: linear-gradient(90deg, transparent, var(--accent-admin), transparent);
}

/* ───── Form ───── */
.field { position: relative; margin-bottom: 20px; animation: fieldIn .4s ease both; animation-delay: .05s; }
.field.pw { animation-delay: .12s; }
@keyframes fieldIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.field .icon {
  position: absolute;
  top: 50%; right: 16px;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 1.1rem;
  pointer-events: none;
  transition: color .3s;
}
.field input {
  width: 100%;
  padding: 15px 48px 15px 15px;
  background: var(--input-bg);
  border: 1.5px solid var(--border);
  border-radius: 13px;
  color: var(--text);
  font-size: 1.05rem;
  font-family: inherit;
  outline: none;
  transition: border-color .25s, box-shadow .25s, background .25s;
  text-align: right;
  letter-spacing: 2px;
  font-weight: 600;
}
.field input[type="password"] { letter-spacing: 3px; }
.field input::placeholder {
  color: #b0b8c4;
  letter-spacing: normal;
  font-weight: 400;
}
.field input:focus {
  border-color: var(--accent);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(0,101,255,0.14);
}
body.admin-mode .field input:focus {
  border-color: var(--accent-admin);
  box-shadow: 0 0 0 4px rgba(184,133,30,0.18);
}
.field input:focus ~ .icon { color: var(--accent); }
body.admin-mode .field input:focus ~ .icon { color: var(--accent-admin); }

/* ───── Button ───── */
.btn {
  width: 100%;
  padding: 15px;
  font-size: 1.05rem;
  font-weight: 700;
  color: #fff;
  border: none;
  border-radius: 13px;
  cursor: pointer;
  font-family: inherit;
  background: linear-gradient(135deg, var(--accent), var(--primary));
  box-shadow: 0 8px 22px rgba(0,82,204,0.28);
  transition: transform .2s, box-shadow .3s;
  position: relative;
  min-height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
body.admin-mode .btn {
  background: linear-gradient(135deg, var(--accent-admin), var(--primary-admin));
  box-shadow: 0 8px 22px rgba(138,90,16,0.3);
}
.btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(0,82,204,0.35);
}
body.admin-mode .btn:hover:not(:disabled) {
  box-shadow: 0 12px 28px rgba(138,90,16,0.4);
}
.btn:active:not(:disabled) { transform: translateY(0) scale(.99); }
.btn:disabled { cursor: wait; opacity: .9; }

.btn .btn-text { transition: opacity .2s; }
.btn .btn-loader { display: none; align-items: center; gap: 6px; }
.btn.loading .btn-text { display: none; }
.btn.loading .btn-loader { display: flex; }

/* Loading dots */
.btn-loader .dot {
  width: 9px; height: 9px;
  background: #fff;
  border-radius: 50%;
  animation: bounce 1.2s infinite ease-in-out;
}
.btn-loader .dot:nth-child(2) { animation-delay: -.16s; }
.btn-loader .dot:nth-child(3) { animation-delay: -.32s; }
@keyframes bounce {
  0%, 80%, 100% { transform: scale(.5); opacity: .5; }
  40% { transform: scale(1); opacity: 1; }
}

/* ───── Message ───── */
.msg {
  margin-top: 16px;
  padding: 12px 14px;
  border-radius: 10px;
  font-size: .87rem;
  font-weight: 600;
  text-align: center;
  display: none;
  animation: msgIn .3s ease both;
}
.msg.show { display: flex; align-items: center; justify-content: center; gap: 8px; }
.msg.err  { background: rgba(222,53,11,0.1); color: var(--danger); border: 1px solid rgba(222,53,11,0.2); }
.msg.ok   { background: rgba(0,135,90,0.1); color: var(--success); border: 1px solid rgba(0,135,90,0.2); }
@keyframes msgIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ───── Footer Links ───── */
.footer {
  display: flex;
  justify-content: space-around;
  align-items: flex-start;
  margin-top: 26px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  gap: 6px;
}
.footer a, .footer button {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-decoration: none;
  color: var(--muted);
  font-size: .72rem;
  font-weight: 600;
  transition: color .25s, transform .25s;
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  padding: 4px 8px;
  border-radius: 8px;
  flex: 1;
}
.footer a i, .footer button i {
  font-size: 1.35rem;
  margin-bottom: 7px;
  width: 26px;
  text-align: center;
  transition: transform .25s;
}
.footer a:hover, .footer button:hover {
  color: var(--accent);
  transform: translateY(-2px);
}
.footer a:hover i, .footer button:hover i { transform: scale(1.1); }
body.admin-mode .footer a:hover, body.admin-mode .footer button:hover {
  color: var(--accent-admin);
}

.footer.hide { display: none; }

/* ───── Full-screen Cube Loader ───── */
.cube-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,25,50,0.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  animation: fadeIn .2s ease;
}
.cube-overlay.show { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.cube {
  width: 46px;
  height: 46px;
  position: relative;
  transform-style: preserve-3d;
  animation: rotateCube 2.4s infinite linear;
}
.cube .face {
  position: absolute;
  width: 46px;
  height: 46px;
  background: linear-gradient(135deg, rgba(0,82,204,0.95), rgba(0,101,255,0.95));
  border: 1px solid rgba(255,255,255,0.35);
  box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
}
.cube .front  { transform: translateZ(23px); }
.cube .back   { transform: translateZ(-23px) rotateY(180deg); }
.cube .right  { transform: rotateY(90deg) translateZ(23px); }
.cube .left   { transform: rotateY(-90deg) translateZ(23px); }
.cube .top    { transform: rotateX(90deg) translateZ(23px); }
.cube .bottom { transform: rotateX(-90deg) translateZ(23px); }

@keyframes rotateCube {
  0%   { transform: rotateX(0) rotateY(0); }
  100% { transform: rotateX(360deg) rotateY(360deg); }
}

.cube-overlay .caption {
  color: #fff;
  font-size: .85rem;
  font-weight: 600;
  margin-top: 24px;
  opacity: .9;
  text-align: center;
}

/* ───── Responsive ───── */
@media (max-width: 480px) {
  body { padding: 0; align-items: stretch; }
  .card {
    max-width: 100%;
    min-height: 100vh;
    border-radius: 0;
    padding: 40px 24px 26px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    box-shadow: none;
    border: none;
  }
  .footer { margin-top: 22px; }
}
</style>
</head>
<body>

<div class="card" id="card">
  <div class="mode-badge" id="badge"></div>

  <div class="logo-wrap">
    <img src="https://tashacol.ir/1754843708220.png" alt="مؤسسه تعالی اندیشه و رشد">
  </div>

  <div class="head">
    <h2 id="title">پیشخوان برخط مؤسسه تعالی</h2>
    <div class="sub" id="subtitle">با کد ملی خود وارد شوید</div>
    <div class="divider"></div>
  </div>

  <form id="loginForm" autocomplete="off">
    <div class="field">
      <i class="fas fa-id-card icon"></i>
      <input id="nid" type="tel" inputmode="numeric" maxlength="10" placeholder="کد ملی (۱۰ رقم)" autocomplete="off">
    </div>

    <div class="field pw" id="pwField" style="display:none">
      <i class="fas fa-lock icon"></i>
      <input id="pw" type="password" placeholder="رمز مدیر" dir="ltr" autocomplete="new-password">
    </div>

    <button type="submit" class="btn" id="btn">
      <span class="btn-text">ورود به پنل</span>
      <span class="btn-loader">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </span>
    </button>

    <div class="msg" id="msg"></div>
  </form>

  <div class="footer" id="footerUser">
    <a href="register.html">
      <i class="fas fa-user-plus"></i>
      <span>ثبت‌نام</span>
    </a>
    <a href="verify.html">
      <i class="fas fa-shield-alt"></i>
      <span>استعلام گواهی</span>
    </a>
    <button type="button" id="adminBtn">
      <i class="fas fa-user-shield"></i>
      <span>ورود مدیران</span>
    </button>
  </div>

  <div class="footer hide" id="footerAdmin">
    <button type="button" id="backBtn" style="flex:1">
      <i class="fas fa-arrow-right"></i>
      <span>بازگشت به ورود کاربران</span>
    </button>
  </div>
</div>

<div class="cube-overlay" id="overlay">
  <div style="text-align:center">
    <div class="cube">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
    <div class="caption" id="overlayCaption">در حال انتقال...</div>
  </div>
</div>

<script src="assets/api.js"></script>
<script>
const body         = document.body;
const badge        = document.getElementById('badge');
const title        = document.getElementById('title');
const subtitle     = document.getElementById('subtitle');
const pwField      = document.getElementById('pwField');
const footerUser   = document.getElementById('footerUser');
const footerAdmin  = document.getElementById('footerAdmin');
const adminBtn     = document.getElementById('adminBtn');
const backBtn      = document.getElementById('backBtn');
const form         = document.getElementById('loginForm');
const btn          = document.getElementById('btn');
const msg          = document.getElementById('msg');
const nidInput     = document.getElementById('nid');
const pwInput      = document.getElementById('pw');
const overlay      = document.getElementById('overlay');
const overlayCap   = document.getElementById('overlayCaption');

let adminMode = false;

function showMsg(text, type) {
  msg.innerHTML = '<i class="fas ' + (type === 'ok' ? 'fa-check-circle' : 'fa-exclamation-circle') + '"></i> ' + text;
  msg.className = 'msg show ' + (type || 'err');
}
function clearMsg() {
  msg.className = 'msg';
  msg.innerHTML = '';
}
function showOverlay(caption) {
  overlayCap.textContent = caption || 'در حال انتقال...';
  overlay.classList.add('show');
}

function setAdminMode(on) {
  adminMode = on;
  clearMsg();

  if (on) {
    body.classList.add('admin-mode');
    badge.className = 'mode-badge show admin';
    badge.innerHTML = '<i class="fas fa-user-shield"></i> حالت ورود مدیران';
    title.textContent = 'ورود مدیران';
    subtitle.textContent = 'کد ملی و رمز مدیر را وارد کنید';
    pwField.style.display = 'block';
    footerUser.classList.add('hide');
    footerAdmin.classList.remove('hide');
    setTimeout(() => pwInput.focus(), 200);
  } else {
    body.classList.remove('admin-mode');
    badge.className = 'mode-badge';
    badge.innerHTML = '';
    title.textContent = 'پیشخوان برخط مؤسسه تعالی';
    subtitle.textContent = 'با کد ملی خود وارد شوید';
    pwField.style.display = 'none';
    footerUser.classList.remove('hide');
    footerAdmin.classList.add('hide');
    pwInput.value = '';
  }
  nidInput.value = '';
  nidInput.focus();
}

adminBtn.addEventListener('click', () => setAdminMode(true));
backBtn.addEventListener('click', () => setAdminMode(false));

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearMsg();

  const nid = nidInput.value.trim();
  const pw  = pwInput.value;

  if (!/^\d{10}$/.test(nid)) {
    showMsg('کد ملی باید ۱۰ رقم و فقط عدد باشد', 'err');
    return;
  }
  if (adminMode && !pw) {
    showMsg('رمز مدیر را وارد کنید', 'err');
    return;
  }

  btn.disabled = true;
  btn.classList.add('loading');

  try {
    const action = adminMode ? 'loginAdmin' : 'loginStudent';
    const res = await api(action, { nationalId: nid, password: pw });
    setToken(res.token);

    if (res.role === 'admin') {
      showMsg('ورود موفق. در حال انتقال...', 'ok');
      showOverlay('در حال ورود به پنل مدیر...');
      setTimeout(() => location.href = 'admin.html', 700);
    } else {
      sessionStorage.setItem('user', JSON.stringify(res.user || {}));
      showMsg('خوش آمدید ' + (res.user?.name || ''), 'ok');
      showOverlay('در حال ورود به پنل کاربری...');
      setTimeout(() => location.href = 'dashboard.html', 700);
    }
  } catch (err) {
    let map;
    if (adminMode) {
      map = {
        INVALID_NID: 'کد ملی باید ۱۰ رقم باشد',
        BAD_ADMIN_CREDENTIALS: 'کد ملی یا رمز اشتباه است',
        RATE_LIMITED: 'تعداد تلاش زیاد. کمی صبر کنید',
        AUTH_REQUIRED: 'ابتدا وارد شوید'
      };
    } else {
      map = {
        INVALID_NID: 'کد ملی باید ۱۰ رقم باشد',
        NOT_REGISTERED: 'شما ثبت‌نام نکرده‌اید',
        RATE_LIMITED: 'تعداد تلاش زیاد. کمی صبر کنید',
        AUTH_REQUIRED: 'ابتدا وارد شوید'
      };
    }
    showMsg(map[err.message] || ('خطا: ' + err.message), 'err');
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
  }
});

nidInput.focus();
</script>
</body>
</html>
