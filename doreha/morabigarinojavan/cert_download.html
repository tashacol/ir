<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دانلود گواهی</title>
<style>
  * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    padding: 14px;
  }
  .container { max-width: 560px; margin: 0 auto; }
  .topbar {
    background: #fff; border-radius: 12px; padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.15);
  }
  .topbar h1 { margin: 0; font-size: 16px; color: #1e3c72; }
  .topbar a { color: #2a5298; text-decoration: none; font-size: 14px; }

  .card {
    background: #fff; border-radius: 14px; padding: 24px;
    box-shadow: 0 6px 24px rgba(0,0,0,.12); text-align: center;
  }
  .icon { font-size: 64px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 12px; color: #1e3c72; font-size: 18px; }
  .card p { color: #666; font-size: 14px; line-height: 1.8; margin: 0 0 12px; }

  .info {
    background: #f7f9fc; border-radius: 10px; padding: 14px;
    margin: 16px 0; text-align: right;
  }
  .row {
    display: flex; justify-content: space-between;
    padding: 6px 0; font-size: 13px;
  }
  .row .lbl { color: #666; }
  .row .val { color: #1e3c72; font-weight: bold; }

  button {
    width: 100%; padding: 14px; font-size: 15px; font-weight: bold;
    background: #2e7d32; color: #fff; border: none; border-radius: 8px;
    cursor: pointer; font-family: inherit; margin-top: 8px;
  }
  button:disabled { opacity: .6; }

  .msg {
    margin-top: 12px; padding: 10px; border-radius: 8px;
    font-size: 13px; text-align: center; display: none;
  }
  .msg.err { background: #ffe5e5; color: #c00; display: block; }
  .msg.ok  { background: #e5ffe5; color: #080; display: block; }
  .msg.info { background: #d1ecf1; color: #0c5460; display: block; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h1>🎓 دانلود گواهی</h1>
    <a href="dashboard.html">← بازگشت</a>
  </div>

  <div class="card" id="card">
    <div class="icon">⏳</div>
    <h2>در حال بارگذاری...</h2>
  </div>
</div>

<script src="assets/api.js"></script>
<script>
const COURSE_CODE = sessionStorage.getItem('activeCourse');

async function load() {
  const card = document.getElementById('card');

  if (!COURSE_CODE) {
    card.innerHTML = '<div class="icon">❌</div><h2>دوره انتخاب نشده</h2><p>به داشبورد برگردید و یک دوره انتخاب کنید.</p>';
    return;
  }

  try {
    const res = await api('certInfo', { courseCode: COURSE_CODE });

    if (!res.hasCert) {
      card.innerHTML =
        '<div class="icon">⌛</div>' +
        '<h2>هنوز گواهی صادر نشده</h2>' +
        '<p>ابتدا باید دوره را کامل کنید، درخواست گواهی بدهید و مدیر آن را تایید کند.</p>';
      return;
    }

    card.innerHTML =
      '<div class="icon">🎓</div>' +
      '<h2>گواهی آماده است!</h2>' +
      '<div class="info">' +
        '<div class="row"><span class="lbl">نام:</span><span class="val">' + res.fullName + '</span></div>' +
        '<div class="row"><span class="lbl">شماره گواهی:</span><span class="val">' + res.certNumber + '</span></div>' +
        '<div class="row"><span class="lbl">تاریخ صدور:</span><span class="val">' + res.issueDate + '</span></div>' +
      '</div>' +
      '<p style="font-size:12px;color:#888">فایل به صورت PDF دانلود می‌شود. هیچ نسخه‌ای روی سرور باقی نمی‌ماند.</p>' +
      '<button id="dlBtn">📥 دانلود گواهی PDF</button>' +
      '<div class="msg" id="msg"></div>';

    document.getElementById('dlBtn').onclick = download;

  } catch (e) {
    card.innerHTML = '<div class="icon">❌</div><h2>خطا</h2><p>' + e.message + '</p>';
  }
}

async function download() {
  const btn = document.getElementById('dlBtn');
  const msg = document.getElementById('msg');

  btn.disabled = true;
  btn.textContent = 'در حال ساخت گواهی...';
  msg.className = 'msg info';
  msg.textContent = 'لطفاً چند لحظه صبر کنید...';

  try {
    const res = await api('downloadCert', { courseCode: COURSE_CODE });

    const binary = atob(res.base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const blob = new Blob([bytes], { type: res.mimeType || 'application/pdf' });

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = res.fileName || 'certificate.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    msg.className = 'msg ok';
    msg.textContent = '✅ دانلود آغاز شد.';
    btn.disabled = false;
    btn.textContent = '📥 دانلود مجدد';

  } catch (e) {
    const map = {
      NO_CERT: 'گواهی صادر نشده است',
      COURSE_NOT_FOUND: 'دوره پیدا نشد',
      FORBIDDEN_COURSE: 'دسترسی ندارید'
    };
    msg.className = 'msg err';
    msg.textContent = map[e.message] || ('خطا: ' + e.message);
    btn.disabled = false;
    btn.textContent = '📥 تلاش مجدد';
  }
}

load();
</script>
</body>
</html>
