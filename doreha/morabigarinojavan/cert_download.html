 <!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>دانلود گواهی | مؤسسه تعالی</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://tashacol.ir/1754843708220.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
<style>
:root{--primary:#0052cc;--accent:#0065ff;--text:#172b4d;--muted:#6b778c;--bg-card:rgba(255,255,255,0.98);--border:rgba(223,225,229,0.7);--danger:#de350b;--success:#00875a;--gold-1:#d4a72c;--gold-2:#f4c430;--gold-3:#b8851e}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Vazirmatn','Tahoma',sans-serif;color:var(--text);min-height:100vh;padding:12px;background:linear-gradient(135deg,rgba(70,50,15,0.9),rgba(120,85,25,0.85)),url('https://tashacol.ir/1l5jlse9%20(1).jpeg') center/cover no-repeat fixed;background-color:#46320f}
.container{max-width:600px;margin:0 auto}
.topbar{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,0.15);gap:10px}
.topbar h1{margin:0;font-size:.98rem;color:var(--text);font-weight:800;flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.topbar h1 i{color:var(--gold-1);font-size:1.1rem}
.topbar h1 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar a{color:var(--primary);text-decoration:none;font-size:.82rem;font-weight:700;padding:8px 12px;border-radius:8px;transition:background .2s;display:flex;align-items:center;gap:5px;flex-shrink:0}
.topbar a:hover{background:rgba(184,133,30,0.1)}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;padding:28px 24px;margin-bottom:14px;box-shadow:0 12px 40px rgba(0,0,0,0.18);animation:cardIn .5s ease both;text-align:center;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,var(--gold-1),transparent)}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.cert-icon{width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:2.8rem;color:#fff;position:relative;animation:popIcon .6s ease both}
.cert-icon.ready{background:linear-gradient(135deg,var(--gold-1),var(--gold-2));box-shadow:0 12px 30px rgba(212,167,44,0.45)}
.cert-icon.waiting{background:linear-gradient(135deg,#94a3b8,#cbd5e1);box-shadow:0 12px 30px rgba(148,163,184,0.35)}
.cert-icon.error{background:linear-gradient(135deg,var(--danger),#f87171);box-shadow:0 12px 30px rgba(222,53,11,0.35)}
.cert-icon::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid;border-color:inherit;opacity:.25;animation:pulseRing 2s ease-in-out infinite}
@keyframes pulseRing{0%,100%{transform:scale(1);opacity:.25}50%{transform:scale(1.12);opacity:.08}}
@keyframes popIcon{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.card h2{margin:0 0 10px;color:var(--text);font-size:1.15rem;font-weight:800}
.card p.desc{color:var(--muted);font-size:.88rem;line-height:1.8;margin-bottom:20px;font-weight:500}
.info-box{background:linear-gradient(135deg,rgba(212,167,44,0.08),rgba(244,196,48,0.05));border:1.5px dashed rgba(212,167,44,0.4);border-radius:14px;padding:18px;margin:18px 0 22px;text-align:right}
.info-box .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:.88rem;border-bottom:1px solid rgba(212,167,44,0.15)}
.info-box .row:last-child{border-bottom:none;padding-bottom:0}
.info-box .row:first-child{padding-top:0}
.info-box .lbl{color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.info-box .lbl i{color:var(--gold-1);width:16px;text-align:center;font-size:.9rem}
.info-box .val{color:var(--text);font-weight:800;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}
.info-box .val.fa{direction:rtl}
.steps-list{background:rgba(107,119,140,0.06);border-radius:14px;padding:16px;text-align:right;margin:16px 0}
.steps-list .step{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:.85rem;color:var(--text);font-weight:600;line-height:1.6}
.steps-list .step:not(:last-child){border-bottom:1px solid rgba(107,119,140,0.1)}
.steps-list .step .num{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--primary));display:flex;align-items:center;justify-content:center;color:#fff;font-size:.75rem;font-weight:800;flex-shrink:0}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;background:linear-gradient(135deg,var(--gold-2),var(--gold-1),var(--gold-3));background-size:200% 200%;box-shadow:0 10px 26px rgba(212,167,44,0.4);transition:transform .2s,box-shadow .3s,background-position .5s;animation:shimmerGold 4s ease-in-out infinite;text-decoration:none}
@keyframes shimmerGold{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 32px rgba(212,167,44,0.5)}
.btn:active:not(:disabled){transform:translateY(0) scale(.99)}
.btn:disabled{cursor:wait;opacity:.85}
.btn.secondary{background:linear-gradient(135deg,#36b37e,#00875a);animation:none;box-shadow:0 10px 26px rgba(0,135,90,0.35)}
.btn.secondary:hover:not(:disabled){box-shadow:0 14px 32px rgba(0,135,90,0.45)}
.msg{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:.87rem;font-weight:600;text-align:center;display:none;animation:msgIn .3s ease both}
.msg.show{display:flex;align-items:center;justify-content:center;gap:8px}
.msg.err{background:rgba(222,53,11,0.1);color:var(--danger);border:1px solid rgba(222,53,11,0.2)}
.msg.ok{background:rgba(0,135,90,0.1);color:var(--success);border:1px solid rgba(0,135,90,0.2)}
@keyframes msgIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.notice{margin-top:16px;padding:12px 14px;background:rgba(107,119,140,0.08);border-radius:10px;font-size:.76rem;color:var(--muted);line-height:1.7;text-align:center;font-weight:500}
.notice i{color:var(--gold-1);margin-left:4px}
.skeleton-card{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;padding:28px 24px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,0.1);text-align:center}
.sk{background:linear-gradient(90deg,#eef1f4 25%,#e0e4e8 37%,#eef1f4 63%);background-size:400% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
.sk-circle{width:100px;height:100px;border-radius:50%;margin:0 auto 22px}
.sk-line{height:14px;margin:0 auto 12px}
.sk-line.w40{width:40%}
.sk-line.w60{width:60%}
.sk-line.w80{width:80%}
.sk-box{height:130px;border-radius:14px;margin:20px auto}
.cube-overlay{position:fixed;inset:0;background:rgba(15,25,50,0.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:9999}
.cube-overlay.show{display:flex}
.cube{width:46px;height:46px;position:relative;transform-style:preserve-3d;animation:rotateCube 2.4s infinite linear}
.cube .face{position:absolute;width:46px;height:46px;background:linear-gradient(135deg,rgba(212,167,44,0.95),rgba(244,196,48,0.95));border:1px solid rgba(255,255,255,0.35);box-shadow:inset 0 0 10px rgba(255,255,255,0.2)}
.cube .front{transform:translateZ(23px)}
.cube .back{transform:translateZ(-23px) rotateY(180deg)}
.cube .right{transform:rotateY(90deg) translateZ(23px)}
.cube .left{transform:rotateY(-90deg) translateZ(23px)}
.cube .top{transform:rotateX(90deg) translateZ(23px)}
.cube .bottom{transform:rotateX(-90deg) translateZ(23px)}
@keyframes rotateCube{0%{transform:rotateX(0) rotateY(0)}100%{transform:rotateX(360deg) rotateY(360deg)}}
.cube-overlay .caption{color:#fff;font-size:.85rem;font-weight:600;margin-top:24px;text-align:center}
.success-overlay{position:fixed;inset:0;background:rgba(15,25,50,0.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:9998}
.success-overlay.show{display:flex}
.success-inner{text-align:center;animation:cardIn .5s ease both}
.success-inner .check-circle{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#00875a,#36b37e);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 12px 30px rgba(0,135,90,0.4)}
.success-inner .check-circle i{font-size:2.6rem;color:#fff}
.success-inner p{color:#fff;font-size:.95rem;font-weight:700}
@media(max-width:480px){body{padding:10px}.card{padding:24px 20px}.cert-icon{width:88px;height:88px;font-size:2.4rem}}
</style>
</head>
<body>

<div class="container">
  <div class="topbar">
    <h1><i class="fas fa-award"></i><span>دانلود گواهی</span></h1>
    <a href="dashboard.html"><i class="fas fa-arrow-right"></i> بازگشت</a>
  </div>

  <div id="skeleton">
    <div class="skeleton-card">
      <div class="sk sk-circle"></div>
      <div class="sk sk-line w60"></div>
      <div class="sk sk-line w40"></div>
      <div class="sk sk-box"></div>
      <div class="sk sk-line w80" style="height:48px"></div>
    </div>
  </div>

  <div id="main" style="display:none">
    <div class="card" id="card"></div>
  </div>
</div>

<div class="success-overlay" id="successOverlay">
  <div class="success-inner">
    <div class="check-circle"><i class="fas fa-check"></i></div>
    <p>دانلود گواهی آغاز شد!</p>
  </div>
</div>

<div class="cube-overlay" id="overlay">
  <div style="text-align:center">
    <div class="cube">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
    <div class="caption" id="overlayCaption">در حال ساخت گواهی PDF...</div>
  </div>
</div>

<script src="assets/api.js"></script>
<script>
const COURSE_CODE = sessionStorage.getItem('activeCourse');
const overlay = document.getElementById('overlay');
const overlayCap = document.getElementById('overlayCaption');

function showOverlay(caption) {
  overlayCap.textContent = caption || 'در حال ساخت گواهی PDF...';
  overlay.classList.add('show');
}
function hideOverlay() { overlay.classList.remove('show'); }

async function load() {
  const skeleton = document.getElementById('skeleton');
  const main = document.getElementById('main');
  const card = document.getElementById('card');

  if (!COURSE_CODE) {
    skeleton.style.display = 'none';
    main.style.display = 'block';
    card.innerHTML =
      '<div class="cert-icon error"><i class="fas fa-exclamation-triangle"></i></div>' +
      '<h2>دوره انتخاب نشده</h2>' +
      '<p class="desc">به داشبورد برگردید و یک دوره انتخاب کنید.</p>' +
      '<a class="btn secondary" href="dashboard.html"><i class="fas fa-arrow-right"></i> بازگشت به داشبورد</a>';
    return;
  }

  try {
    const res = await api('certInfo', { courseCode: COURSE_CODE });

    skeleton.style.display = 'none';
    main.style.display = 'block';

    if (!res.hasCert) {
      card.innerHTML =
        '<div class="cert-icon waiting"><i class="fas fa-hourglass-half"></i></div>' +
        '<h2>هنوز گواهی صادر نشده</h2>' +
        '<p class="desc">برای دریافت گواهی باید مراحل زیر را طی کنید:</p>' +
        '<div class="steps-list">' +
          '<div class="step"><span class="num">۱</span><span>تکمیل تمام روزهای دوره در «پنل درسی»</span></div>' +
          '<div class="step"><span class="num">۲</span><span>ثبت درخواست صدور گواهی از «وضعیت تحصیلی»</span></div>' +
          '<div class="step"><span class="num">۳</span><span>تایید درخواست توسط مدیر مؤسسه</span></div>' +
        '</div>' +
        '<a class="btn secondary" href="status.html"><i class="fas fa-tasks"></i> مشاهده وضعیت تحصیلی</a>' +
        '<div class="notice"><i class="fas fa-info-circle"></i>پس از تایید مدیر، گواهی شما در همین صفحه قابل دانلود خواهد بود</div>';
      return;
    }

    card.innerHTML =
      '<div class="cert-icon ready"><i class="fas fa-award"></i></div>' +
      '<h2>گواهی شما آماده است</h2>' +
      '<p class="desc">می‌توانید فایل PDF گواهی خود را همین حالا دانلود کنید.</p>' +
      '<div class="info-box">' +
        '<div class="row"><span class="lbl"><i class="fas fa-user"></i> نام و نام خانوادگی</span><span class="val fa">' + (res.fullName || '—') + '</span></div>' +
        '<div class="row"><span class="lbl"><i class="fas fa-hashtag"></i> شماره گواهی</span><span class="val">' + (res.certNumber || '—') + '</span></div>' +
        '<div class="row"><span class="lbl"><i class="fas fa-calendar-check"></i> تاریخ صدور</span><span class="val">' + (res.issueDate || '—') + '</span></div>' +
      '</div>' +
      '<button class="btn" id="dlBtn"><span class="btn-text"><i class="fas fa-download"></i> دانلود گواهی PDF</span></button>' +
      '<div class="msg" id="msg"></div>' +
      '<div class="notice"><i class="fas fa-shield-alt"></i>فایل به صورت لحظه‌ای ساخته می‌شود و هیچ نسخه‌ای روی سرور ذخیره نمی‌گردد</div>';

    document.getElementById('dlBtn').onclick = download;

  } catch (e) {
    skeleton.style.display = 'none';
    main.style.display = 'block';
    card.innerHTML =
      '<div class="cert-icon error"><i class="fas fa-times"></i></div>' +
      '<h2>خطا در بارگذاری</h2>' +
      '<p class="desc">' + e.message + '</p>' +
      '<a class="btn secondary" href="dashboard.html"><i class="fas fa-arrow-right"></i> بازگشت</a>';
  }
}

async function download() {
  const btn = document.getElementById('dlBtn');
  const msg = document.getElementById('msg');

  btn.disabled = true;
  btn.querySelector('.btn-text').innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال ساخت...';
  showOverlay('در حال ساخت گواهی PDF...');
  msg.className = 'msg';

  try {
    const res = await api('downloadCert', { courseCode: COURSE_CODE });

    const binary = atob(res.base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const blob = new Blob([bytes], { type: res.mimeType || 'application/pdf' });

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = res.fileName || 'certificate.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    hideOverlay();

    const successOverlay = document.getElementById('successOverlay');
    successOverlay.classList.add('show');
    setTimeout(() => successOverlay.classList.remove('show'), 2200);

    msg.className = 'msg show ok';
    msg.innerHTML = '<i class="fas fa-check-circle"></i> دانلود با موفقیت انجام شد';
    btn.disabled = false;
    btn.querySelector('.btn-text').innerHTML = '<i class="fas fa-download"></i> دانلود مجدد';

  } catch (e) {
    hideOverlay();
    const map = {
      NO_CERT: 'گواهی صادر نشده است',
      COURSE_NOT_FOUND: 'دوره پیدا نشد',
      FORBIDDEN_COURSE: 'شما به این دوره دسترسی ندارید'
    };
    msg.className = 'msg show err';
    msg.innerHTML = '<i class="fas fa-times-circle"></i> ' + (map[e.message] || ('خطا: ' + e.message));
    btn.disabled = false;
    btn.querySelector('.btn-text').innerHTML = '<i class="fas fa-download"></i> تلاش مجدد';
  }
}

load();
</script>
</body>
</html>
