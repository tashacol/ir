 <!DOCTYPE html> 
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>معرفی کتاب تعالی | گنجینه‌ای برای تحول</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
    --bg-body: #f0f4f8;
    --bg-card: #ffffff;
    --primary: #1a5276;
    --primary-light: #2471a3;
    --primary-dark: #0e3a52;
    --accent: #e67e22;
    --accent-light: #f5b041;
    --text-main: #1b2631;
    --text-sub: #5d6d7e;
    --border: #d5dbdb;
    --radius: 18px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.1);
    --shadow-hover: 0 20px 40px rgba(26,82,118,0.18);
    --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; outline: none; text-decoration: none; -webkit-tap-highlight-color: transparent; }

html { scroll-behavior: smooth; }

body {
    font-family: 'Vazirmatn', sans-serif;
    background-color: var(--bg-body);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
}

/* --- Header --- */
.header {
    background: linear-gradient(135deg, #0e3a52 0%, #1a5276 50%, #2471a3 100%);
    padding: 32px 0 26px;
    position: sticky; top: 0; z-index: 50;
    box-shadow: 0 6px 30px rgba(14,58,82,0.3);
}
.container { max-width: 1320px; margin: 0 auto; padding: 0 24px; width: 100%; }

.header-inner { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }

.brand {
    display: flex; align-items: center; gap: 16px;
    font-size: 1.5rem; font-weight: 900; color: #fff; white-space: nowrap;
}
.brand-icon {
    width: 52px; height: 52px; border-radius: 16px;
    background: rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; color: var(--accent-light);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
}
.brand-text { line-height: 1.3; }
.brand-text small {
    display: block; font-size: 0.72rem; font-weight: 400;
    color: rgba(255,255,255,0.65); letter-spacing: 1.5px;
}

.search-wrapper { flex: 1; max-width: 500px; position: relative; min-width: 200px; }
.search-input {
    width: 100%; padding: 15px 52px 15px 20px;
    background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.18);
    border-radius: 50px; font-family: inherit; font-size: 0.95rem;
    color: #fff; transition: var(--transition);
    backdrop-filter: blur(10px);
}
.search-input::placeholder { color: rgba(255,255,255,0.55); }
.search-input:focus {
    background: rgba(255,255,255,0.22);
    border-color: var(--accent-light);
    box-shadow: 0 0 0 4px rgba(245,176,65,0.15);
}
.search-icon {
    position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
    color: rgba(255,255,255,0.65); pointer-events: none; font-size: 1.1rem;
}

/* --- Stats & Tabs Bar --- */
.stats-bar {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 16px 0;
    position: sticky; top: 112px; z-index: 40;
    box-shadow: var(--shadow-sm);
}
.stats-inner {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
}
.stats-text {
    display: flex; align-items: center; gap: 10px;
    color: var(--text-sub); font-size: 0.9rem; font-weight: 500;
}
.stats-text i { color: var(--accent); font-size: 1.1rem; }
.stats-text strong { color: var(--primary); font-weight: 800; font-size: 1.1rem; }

.tabs-scroll {
    display: flex; gap: 8px; overflow-x: auto;
    scrollbar-width: none; padding: 2px 0;
}
.tabs-scroll::-webkit-scrollbar { display: none; }

.tab-btn {
    padding: 9px 20px; border-radius: 50px;
    background: #eef2f7; border: 1.5px solid transparent;
    color: var(--text-sub); cursor: pointer;
    font-family: inherit; font-size: 0.85rem; font-weight: 700;
    white-space: nowrap; transition: var(--transition); flex-shrink: 0;
}
.tab-btn:hover { background: #dce4ec; color: var(--text-main); }
.tab-btn.active {
    background: var(--primary); color: white;
    box-shadow: 0 6px 16px rgba(26,82,118,0.35);
    border-color: var(--primary);
}

/* --- Main Content --- */
.main-content { padding: 48px 0 80px; flex: 1; }

.books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 28px;
    padding-top: 8px;
}

/* --- Book Card --- */
.book-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: var(--transition);
    position: relative; cursor: pointer;
    box-shadow: var(--shadow-sm);
}
.book-card:hover {
    transform: translateY(-10px) scale(1.01);
    box-shadow: var(--shadow-hover);
    border-color: rgba(26,82,118,0.25);
}

.book-cover-container {
    width: 100%; aspect-ratio: 2/3;
    background: linear-gradient(135deg, #eef2f7, #dce4ec);
    position: relative; overflow: hidden;
    border-bottom: 3px solid #eef2f7;
}
.book-img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform 0.7s ease;
    display: block;
}
.book-card:hover .book-img { transform: scale(1.08); }

.book-body { padding: 20px; flex: 1; display: flex; flex-direction: column; }

.book-cat {
    font-size: 0.7rem; color: #fff;
    background: var(--accent);
    padding: 4px 12px; border-radius: 50px;
    font-weight: 700; margin-bottom: 10px;
    display: inline-block; align-self: flex-start;
    letter-spacing: 0.5px;
}
.book-title {
    font-size: 1.05rem; font-weight: 800; color: var(--text-main);
    margin-bottom: 6px; line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.book-author {
    font-size: 0.82rem; color: var(--text-sub); margin-bottom: 18px;
    font-weight: 500;
}
.book-author i { margin-left: 4px; color: var(--primary-light); }

.book-actions { margin-top: auto; display: flex; gap: 10px; }

.btn {
    flex: 1; padding: 11px; border-radius: 12px; border: none;
    font-size: 0.85rem; font-weight: 700; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: var(--transition); text-decoration: none;
}
.btn-desc {
    background: #eef2f7; color: var(--text-main); border: 1.5px solid var(--border);
}
.btn-desc:hover { background: #dce4ec; border-color: #b0bec5; }

/* --- No Data --- */
.no-data {
    text-align: center; color: var(--text-sub);
    padding: 80px 20px; grid-column: 1/-1;
    font-size: 1.1rem;
}
.no-data i { font-size: 4rem; display: block; margin-bottom: 20px; color: #d5dbdb; }

/* --- Modal --- */
.modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(14, 58, 82, 0.7); backdrop-filter: blur(10px);
    z-index: 2000; display: none; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.35s; padding: 20px;
}
.modal-overlay.active { opacity: 1; }

.modal-box {
    background: var(--bg-card); width: 100%; max-width: 620px;
    border-radius: 24px; padding: 0;
    box-shadow: 0 30px 70px rgba(0,0,0,0.35);
    transform: scale(0.92) translateY(20px);
    transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    display: flex; flex-direction: column; overflow: hidden; max-height: 90vh;
}
.modal-overlay.active .modal-box { transform: scale(1) translateY(0); }

.modal-header {
    padding: 20px 28px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(135deg, #f8fafc, #eef2f7);
}
.modal-title {
    font-size: 1.1rem; font-weight: 800; margin: 0;
    color: var(--primary); display: flex; align-items: center; gap: 10px;
}
.modal-title i { color: var(--accent); }
.modal-close {
    background: none; border: none; font-size: 1.3rem;
    cursor: pointer; color: var(--text-sub); transition: var(--transition);
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { color: #e74c3c; background: rgba(231,76,60,0.1); transform: rotate(90deg); }

.modal-body {
    padding: 32px; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center;
}
.modal-img {
    width: 170px; border-radius: 14px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.2);
    margin-bottom: 26px; transition: transform 0.35s;
}
.modal-img:hover { transform: scale(1.04); }

.modal-info-row { text-align: center; margin-bottom: 22px; }
.m-book-title { font-size: 1.4rem; font-weight: 900; margin-bottom: 8px; color: var(--text-main); }
.m-book-author { font-size: 1rem; color: var(--text-sub); font-weight: 500; }

.modal-desc {
    text-align: justify; line-height: 2.1; color: var(--text-main);
    font-size: 0.95rem; background: #f8fafc; padding: 26px;
    border-radius: 16px; border: 1.5px solid var(--border); width: 100%;
}

/* --- Footer --- */
.footer {
    margin-top: auto; background: linear-gradient(135deg, #0e3a52, #1a5276);
    padding: 32px 24px; text-align: center;
    color: rgba(255,255,255,0.55); font-size: 0.85rem;
}
.footer strong { color: var(--accent-light); }

/* --- Responsive --- */
@media (max-width: 900px) {
    .stats-bar { top: 100px; }
}

@media (max-width: 768px) {
    .header { padding: 20px 0 16px; }
    .header-inner { gap: 14px; }
    .brand { font-size: 1.15rem; }
    .brand-icon { width: 42px; height: 42px; font-size: 1.2rem; border-radius: 12px; }
    .brand-text small { display: none; }
    .stats-bar { top: 86px; padding: 12px 0; }
    .main-content { padding: 30px 0 60px; }
    .books-grid { grid-template-columns: 1fr; gap: 16px; }
    .book-card { flex-direction: row; height: 175px; align-items: stretch; }
    .book-cover-container { width: 120px; height: 100%; aspect-ratio: auto; border-bottom: none; border-left: 3px solid #eef2f7; }
    .book-body { padding: 14px; justify-content: space-between; }
    .book-title { font-size: 0.95rem; margin-bottom: 4px; -webkit-line-clamp: 2; }
    .book-author { margin-bottom: 10px; font-size: 0.78rem; }
    .book-cat { display: none; }
    .btn { padding: 9px; font-size: 0.78rem; border-radius: 10px; }
    .modal-img { width: 130px; }
    .modal-body { padding: 22px; }
    .modal-desc { padding: 18px; font-size: 0.88rem; line-height: 1.95; }
}

@media (max-width: 480px) {
    .container { padding: 0 14px; }
    .search-input { font-size: 0.85rem; padding: 13px 46px 13px 16px; }
    .stats-text { font-size: 0.8rem; }
    .tab-btn { padding: 7px 15px; font-size: 0.78rem; }
    .book-card { height: 160px; }
    .book-cover-container { width: 105px; }
    .m-book-title { font-size: 1.15rem; }
}
</style>
</head>
<body>

<header class="header">
    <div class="container header-inner">
        <div class="brand">
            <div class="brand-icon"><i class="fas fa-book-open"></i></div>
            <div class="brand-text">
                معرفی کتاب تعالی
                <small>گنجینه‌ای برای تحول</small>
            </div>
        </div>
        <div class="search-wrapper">
            <input type="text" class="search-input" id="searchInput" placeholder="جستجو در عنوان، نویسنده یا موضوع...">
            <i class="fas fa-search search-icon"></i>
        </div>
    </div>
</header>

<div class="stats-bar">
    <div class="container stats-inner">
        <div class="stats-text">
            <i class="fas fa-layer-group"></i>
            <span><strong id="bookCount">400</strong> کتاب برای تحول</span>
        </div>
        <div class="tabs-scroll" id="tabsContainer">
            <button class="tab-btn active" data-cat="all">همه</button>
            <button class="tab-btn" data-cat="1">خودسازی</button>
            <button class="tab-btn" data-cat="2">روانشناسی</button>
            <button class="tab-btn" data-cat="3">فلسفه</button>
            <button class="tab-btn" data-cat="4">مالی</button>
            <button class="tab-btn" data-cat="5">علمی</button>
            <button class="tab-btn" data-cat="6">ادبیات</button>
        </div>
    </div>
</div>

<div class="main-content container">
    <div class="books-grid" id="bookContainer"></div>
    <div class="no-data" id="noData" style="display:none;">
        <i class="fas fa-search"></i>
        کتابی با این مشخصات یافت نشد.
    </div>
</div>

<div class="modal-overlay" id="descModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 class="modal-title"><i class="fas fa-bookmark"></i> جزئیات کتاب</h3>
            <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div class="modal-info-row">
                <img src="" alt="Cover" class="modal-img" id="mCover">
                <div class="m-book-title" id="mTitle"></div>
                <div class="m-book-author" id="mAuthor"></div>
            </div>
            <p class="modal-desc" id="mDesc"></p>
        </div>
    </div>
</div>

<footer class="footer">
    <p>ساخته شده با <i class="fas fa-heart" style="color:#e74c3c"></i> برای <strong>معرفی کتاب تعالی</strong> — تمامی حقوق محفوظ است</p>
</footer>

// ============================================================
//  متغیرهای وضعیت
// ============================================================
let currentCategory = 'all';
let currentSearch = '';
let filteredBooks = [...BOOKS];

// ============================================================
//  رندر کتاب‌ها
// ============================================================
function renderBooks() {
    const container = document.getElementById('bookContainer');
    const noData = document.getElementById('noData');
    const countEl = document.getElementById('bookCount');

    filteredBooks = BOOKS.filter(book => {
        const matchCat = currentCategory === 'all' || book.catId === parseInt(currentCategory);
        const matchSearch = !currentSearch ||
            book.title.includes(currentSearch) ||
            book.author.includes(currentSearch) ||
            book.catName.includes(currentSearch);
        return matchCat && matchSearch;
    });

    countEl.textContent = filteredBooks.length;

    if (filteredBooks.length === 0) {
        container.innerHTML = '';
        noData.style.display = 'block';
        return;
    }
    noData.style.display = 'none';

    container.innerHTML = filteredBooks.map((book) => {
        const safeBook = JSON.stringify(book).replace(/'/g, "&#39;").replace(/"/g, "&quot;");
        return `
            <div class="book-card" onclick='openModal(${safeBook})'>
                <div class="book-cover-container">
                    <img src="${book.cover}" alt="${book.title}" class="book-img" loading="lazy"
                         onerror="this.src='https://via.placeholder.com/300x450/e2e8f0/94a3b8?text=Book'">
                </div>
                <div class="book-body">
                    <span class="book-cat">${book.catName}</span>
                    <h3 class="book-title">${book.title}</h3>
                    <span class="book-author"><i class="far fa-user"></i> ${book.author}</span>
                    <div class="book-actions">
                        <button class="btn btn-desc" onclick='event.stopPropagation(); openModal(${safeBook})'>
                            <i class="fas fa-info-circle"></i> توضیحات
                        </button>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

// ============================================================
//  تب‌ها
// ============================================================
document.getElementById('tabsContainer').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCategory = btn.dataset.cat;
    renderBooks();
});

// ============================================================
//  جستجو
// ============================================================
let debounceTimer;
document.getElementById('searchInput').addEventListener('input', (e) => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
        currentSearch = e.target.value.trim();
        renderBooks();
    }, 300);
});

// ============================================================
//  مودال
// ============================================================
const modal = document.getElementById('descModal');

window.openModal = function(book) {
    document.getElementById('mTitle').innerText = book.title;
    document.getElementById('mAuthor').innerText = `نویسنده: ${book.author}`;
    document.getElementById('mCover').src = book.cover;
    document.getElementById('mCover').onerror = function() {
        this.src = 'https://via.placeholder.com/300x450/e2e8f0/94a3b8?text=Book';
    };
    document.getElementById('mDesc').innerText = book.desc;
    modal.style.display = 'flex';
    setTimeout(() => modal.classList.add('active'), 10);
};

window.closeModal = function() {
    modal.classList.remove('active');
    setTimeout(() => modal.style.display = 'none', 300);
};

modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
});

// ============================================================
//  شروع
// ============================================================
renderBooks();
</script>
