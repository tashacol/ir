<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نشریه هوشمند تعالی — علمی پژوهشی هوشمند</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #f0f4ff 0%, #f8fafc 100%);
      color: #0f172a;
      min-height: 100vh;
      line-height: 1.9;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 60px 20px; }
    header {
      text-align: center;
      margin-bottom: 48px;
      padding-bottom: 32px;
      border-bottom: 2px solid #e0e7ff;
    }
    header h1 {
      font-size: 2.2em;
      color: #1e293b;
      margin-bottom: 8px;
      font-weight: bold;
    }
    header .subtitle {
      color: #64748b;
      font-size: 1.05em;
    }
    header .badge {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.85em;
      margin-top: 16px;
    }
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
      font-size: 1.1em;
    }
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #94a3b8;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .empty h2 { color: #475569; margin-bottom: 12px; }
    .articles-list { display: flex; flex-direction: column; gap: 20px; }
    .article-card {
      background: #fff;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      border-right: 4px solid #2563eb;
    }
    .article-card:hover {
      transform: translateX(-4px);
      box-shadow: 0 6px 24px rgba(37, 99, 235, 0.12);
    }
    .article-card .date {
      color: #64748b;
      font-size: 0.9em;
      margin-bottom: 8px;
    }
    .article-card h2 {
      font-size: 1.25em;
      color: #1e293b;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .article-card h2 a {
      color: #1e293b;
      text-decoration: none;
      transition: color 0.2s;
    }
    .article-card h2 a:hover { color: #2563eb; }
    .article-card .summary {
      color: #475569;
      font-size: 0.98em;
      margin-bottom: 16px;
      text-align: justify;
    }
    .article-card .read-more {
      display: inline-block;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95em;
    }
    .article-card .read-more:hover { text-decoration: underline; }
    footer {
      text-align: center;
      margin-top: 60px;
      padding-top: 24px;
      border-top: 1px solid #e2e8f0;
      color: #94a3b8;
      font-size: 0.9em;
    }
    footer a { color: #64748b; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>نشریه هوشمند تعالی</h1>
      <div class="subtitle">علمی — پژوهشی — هوشمند</div>
      <div class="badge">انتشار هفتگی</div>
    </header>

    <main id="content">
      <div class="loading">در حال بارگذاری مقالات...</div>
    </main>

    <footer>
      نشریه هوشمند تعالی — سامانه انتشار خودکار مقالات علمی
    </footer>
  </div>

  <script>
    (function () {
      const content = document.getElementById('content');

      fetch('articles.json', { cache: 'no-store' })
        .then(function (resp) {
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          return resp.json();
        })
        .then(function (articles) {
          if (!Array.isArray(articles) || articles.length === 0) {
            renderEmpty();
            return;
          }
          renderArticles(articles);
        })
        .catch(function (err) {
          console.error('خطا در بارگذاری articles.json:', err);
          content.innerHTML =
            '<div class="empty">' +
            '<h2>هنوز مقاله‌ای منتشر نشده است</h2>' +
            '<p>اولین مقاله به‌زودی منتشر خواهد شد.</p>' +
            '</div>';
        });

      function renderEmpty() {
        content.innerHTML =
          '<div class="empty">' +
          '<h2>هنوز مقاله‌ای منتشر نشده است</h2>' +
          '<p>اولین مقاله به‌زودی منتشر خواهد شد.</p>' +
          '</div>';
      }

      function renderArticles(articles) {
        const list = document.createElement('div');
        list.className = 'articles-list';

        articles.forEach(function (item) {
          const card = document.createElement('div');
          card.className = 'article-card';

          const date = document.createElement('div');
          date.className = 'date';
          date.textContent = '📅 ' + (item.date || '');

          const h2 = document.createElement('h2');
          const link = document.createElement('a');
          link.href = item.url || ('articles/' + (item.date || '') + '.html');
          link.textContent = item.title || '(بدون عنوان)';
          h2.appendChild(link);

          const summary = document.createElement('p');
          summary.className = 'summary';
          summary.textContent = item.summary || '';

          const more = document.createElement('a');
          more.className = 'read-more';
          more.href = item.url || ('articles/' + (item.date || '') + '.html');
          more.textContent = 'مطالعه کامل مقاله ←';

          card.appendChild(date);
          card.appendChild(h2);
          card.appendChild(summary);
          card.appendChild(more);
          list.appendChild(card);
        });

        content.innerHTML = '';
        content.appendChild(list);
      }
    })();
  </script>
</body>
</html>
