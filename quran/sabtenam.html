<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>فرم ثبت نام قرآن‌آموزان</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap');
        
        :root {
            --primary: #198754; --primary-hover: #146c43; --primary-light: #e9f5ec;
            --bg-body: #f8f9fa; --bg-card: #ffffff;
            --text-main: #212529; --text-muted: #6c757d;
            --border: #ced4da; --radius: 12px;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px 15px; }

        .container { background: var(--bg-card); width: 100%; max-width: 600px; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; animation: slideUp 0.5s ease-out; }
        
        .header { background: var(--primary); color: white; padding: 25px 20px; text-align: center; }
        .header h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 5px; }
        .header p { font-size: 0.9rem; opacity: 0.9; }
        
        .form-body { padding: 30px 20px; }
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-weight: 500; margin-bottom: 8px; font-size: 0.9rem; color: #495057; }
        
        .form-control, .form-select { width: 100%; padding: 12px 15px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; transition: border-color 0.3s; background: #fff; color: var(--text-main); }
        .form-control:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(25, 135, 84, 0.15); }
        
        .date-group { display: flex; gap: 10px; direction: ltr; }
        .date-group select { flex: 1; direction: rtl; }
        
        .btn-submit { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; font-size: 1.1rem; font-weight: 700; border-radius: 8px; cursor: pointer; transition: background 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; }
        .btn-submit:hover { background: var(--primary-hover); }
        .btn-submit:disabled { background: #6c757d; cursor: not-allowed; }

        .spinner { width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; display: none; }
        
        .footer-info { background: var(--primary-light); padding: 20px; text-align: center; font-size: 0.95rem; border-top: 1px dashed var(--border); }
        .rubika-link { display: inline-flex; align-items: center; gap: 8px; background: #ffffff; color: #f26622; font-weight: bold; padding: 10px 20px; border-radius: 20px; text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #f26622; margin-top: 15px; transition: transform 0.2s; }
        .rubika-link:hover { transform: translateY(-3px); }
        
        .alert { padding: 12px 15px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; font-weight: 500; display: none; text-align: center; }
        .alert-error { background: #f8d7da; color: #842029; border: 1px solid #f5c2c7; display: block; }
        .alert-success { background: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; display: block; }

        #success-view { display: none; text-align: center; padding: 40px 20px; }
        #success-view i { font-size: 4rem; color: var(--primary); margin-bottom: 15px; }
        #success-view h2 { color: var(--primary); margin-bottom: 10px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <!-- Success State -->
        <div id="success-view">
            <i class="fas fa-check-circle"></i>
            <h2>ثبت‌نام موفق</h2>
            <p>اطلاعات شما با موفقیت در سامانه ثبت گردید.</p>
        </div>

        <!-- Form State -->
        <div id="form-view">
            <div class="header">
                <h1>فرم ثبت نام قرآن‌آموزان</h1>
                <p>لطفاً اطلاعات خود را با دقت وارد نمایید</p>
            </div>
            
            <div class="form-body">
                <div id="msg-box"></div>

                <form id="registrationForm">
                    
                    <div class="form-group">
                        <label class="form-label">ملیت *</label>
                        <select id="nationality" class="form-select" required></select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">کد ملی / کد اتباع *</label>
                        <!-- inputmode="numeric" باعث باز شدن کیبورد عددی در گوشی می‌شود -->
                        <input type="text" id="nationalId" class="form-control" inputmode="numeric" pattern="[0-9]*" placeholder="کد ۱۰ رقمی را وارد کنید" required>
                    </div>

                    <div class="form-group" style="display: flex; gap:15px;">
                        <div style="flex: 1;">
                            <label class="form-label">نام *</label>
                            <input type="text" id="firstName" class="form-control" required>
                        </div>
                        <div style="flex: 1;">
                            <label class="form-label">نام خانوادگی *</label>
                            <input type="text" id="lastName" class="form-control" required>
                        </div>
                    </div>

                    <div class="form-group" style="display: flex; gap:15px;">
                        <div style="flex: 1;">
                            <label class="form-label">جنسیت *</label>
                            <select id="gender" class="form-select" required>
                                <option value="مرد">مرد</option>
                                <option value="زن">زن</option>
                            </select>
                        </div>
                        <div style="flex: 1;">
                            <label class="form-label">نام پدر *</label>
                            <input type="text" id="fatherName" class="form-control" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">محل صدور</label>
                        <input type="text" id="issuePlace" class="form-control">
                    </div>

                    <div class="form-group">
                        <label class="form-label">شماره همراه * (الزاماً با 0 شروع شود)</label>
                        <!-- کیبورد عددی و ولیدیشن سمت مرورگر -->
                        <input type="tel" id="phone" class="form-control" inputmode="numeric" placeholder="مثال: 09123456789" maxlength="11" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">تاریخ تولد *</label>
                        <div class="date-group" id="birthDateContainer"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">استان *</label>
                        <select id="province" class="form-select" required></select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">شهرستان / شهر</label>
                        <input type="text" id="city" class="form-control">
                    </div>

                    <div class="form-group">
                        <label class="form-label">میزان تحصیلات *</label>
                        <select id="education" class="form-select" required></select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">رشته تحصیلی</label>
                        <input type="text" id="studyField" class="form-control">
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">
                        <span id="btnText"><i class="fas fa-paper-plane"></i> ثبت اطلاعات</span>
                        <div class="spinner" id="btnSpinner"></div>
                    </button>
                </form>
            </div>
        </div>

        <div class="footer-info">
            <p><i class="fas fa-headset"></i> پشتیبانی: <strong>09136395562</strong></p>
            <p style="margin-top: 10px; color: var(--text-muted); font-size:0.85rem;">برای اطلاع از اخبار و دوره‌ها در کانال روبیکا عضو شوید:</p>
            <a href="https://rubika.ir/irnasimvahy" target="_blank" class="rubika-link">
                <i class="fas fa-link"></i> عضویت در کانال @irnasimvahy
            </a>
        </div>
    </div>

    <script>
        // ================== CONFIGURATION ==================
        // ⚠️ لینک وب‌اپ گوگل اسکریپت جدید که ساختید را در این قسمت جایگذاری کنید
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx6rUJ6C_8W59TDdyaskWOk9lQu69yuUQGlptsrnXNv7Y3bZyXGlNDgvL1yA289MjHn/exec";
        
        // ================== DATA LISTS ==================
        const NATIONALITIES = ["Iran جمهوری اسلامی ایران","Andorra","United Arab Emirates","Afghanistan","Antigua and Barbuda","Albania","Armenia","Angola","Argentina","Austria","Australia","Azerbaijan","Bosnia and Herzegovina","Bangladesh","Belgium","Bahrain","Brazil","Bahamas","Canada","China","Colombia","Cyprus","Czech Republic","Germany","Denmark","Algeria","Egypt","Spain","Ethiopia","Finland","France","United Kingdom","Georgia","Ghana","Greece","Guatemala","Hong Kong","Croatia","Hungary","Indonesia","Ireland","Israel","India","Iraq","Iceland","Italy","Jamaica","Jordan","Japan","Kenya","Kyrgyzstan","Kuwait","Kazakhstan","Lebanon","Libya","Morocco","Madagascar","Mali","Mongolia","Malta","Mauritius","Maldives","Malawi","Mexico","Malaysia","Nigeria","Nicaragua","Netherlands","Norway","Nepal","New Zealand","Oman","Panama","Peru","Philippines","Pakistan","Poland","Puerto Rico","Palestinian Territories","Portugal","Paraguay","Qatar","Romania","Serbia","Russia","Rwanda","Saudi Arabia","Sudan","Sweden","Singapore","Slovenia","Slovakia","Senegal","Somalia","Syria","Thailand","Tajikistan","Turkmenistan","Tunisia","Turkey","Taiwan","Tanzania","Ukraine","Uganda","United States","Uruguay","Uzbekistan","Venezuela","Vietnam","Yemen","South Africa","Zambia","Zimbabwe"];
        const PROVINCES = ["آذربایجان شرقی","آذربایجان غربی","اردبیل","اصفهان","البرز","ایلام","بوشهر","تهران","شهرستان های تهران","چهارمحال و بختیاری","خراسان جنوبی","خراسان رضوی","خراسان شمالی","خوزستان","زنجان","سمنان","سیستان و بلوچستان","فارس","قزوین","قم","كردستان","كرمان","كرمانشاه","كهگیلویه و بویراحمد","گلستان","گیلان","لرستان","مازندران","مركزی","هرمزگان","همدان","یزد"];
        const EDUCATIONS = ["قبل دیپلم","دیپلم","فوق دیپلم","لیسانس","فوق لیسانس","دکترا","سطح 1 حوزه","سطح 2 حوزه","سطح 3 و بالاتر حوزه"];

        // ================== INITIALIZATION ==================
        function populateSelect(elementId, array, defaultOptionText, selectedIndex = 0) {
            const el = document.getElementById(elementId);
            el.innerHTML = `<option value="">${defaultOptionText}</option>` + 
                array.map((item, index) => `<option value="${item}" ${index === selectedIndex ? 'selected' : ''}>${item}</option>`).join('');
        }

        function buildDateDropdowns() {
            const currentYear = 1403; // سال جاری تقریبی شمسی
            let yOptions = '<option value="">سال</option>';
            for (let y = currentYear; y >= currentYear - 90; y--) yOptions += `<option value="${y}">${y}</option>`;
            
            let mOptions = '<option value="">ماه</option>';
            const pMonths = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
            for (let m = 1; m <= 12; m++) mOptions += `<option value="${m}">${pMonths[m-1]}</option>`;

            let dOptions = '<option value="">روز</option>';
            for (let d = 1; d <= 31; d++) dOptions += `<option value="${d}">${d}</option>`;

            document.getElementById('birthDateContainer').innerHTML = `
                <select id="birth_y" class="form-select" required>${yOptions}</select>
                <select id="birth_m" class="form-select" required>${mOptions}</select>
                <select id="birth_d" class="form-select" required>${dOptions}</select>
            `;
        }

        // مقداردهی اولیه‌ی دراپ‌داون‌ها
        populateSelect('nationality', NATIONALITIES, "-- انتخاب ملیت --", 0); // ایران پیشفرض
        populateSelect('province', PROVINCES, "-- انتخاب استان --", -1);
        populateSelect('education', EDUCATIONS, "-- انتخاب سطح تحصیلات --", -1);
        buildDateDropdowns();

        // ================== VALIDATION & HELPERS ==================
        const showMessage = (msg, isError = true) => {
            const box = document.getElementById('msg-box');
            box.className = isError ? 'alert alert-error' : 'alert alert-success';
            box.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${msg}`;
        };
        const hideMessage = () => document.getElementById('msg-box').style.display = 'none';

        const validateNationalId = (code) => {
            if (!code) return false;
            code = String(code).trim().padStart(10, '0');
            if (code.length === 10) {
                if (!/^\d{10}$/.test(code)) return false;
                if (/^(\d)\1{9}$/.test(code)) return false;
                const d = code.split('').map(Number);
                const check = d[9];
                let sum = 0;
                for (let i = 0; i < 9; i++) sum += d[i] * (10 - i);
                const rem = sum % 11;
                return rem < 2 ? check === rem : check === 11 - rem;
            } else if (code.length > 10) {
                return /^\d+$/.test(code); // اتباع خارجی
            }
            return false;
        };

        const validatePhone = (phone) => {
            if(!phone) return false;
            phone = String(phone).trim().padStart(11, '0');
            return phone.length === 11 && phone.startsWith('0') && /^\d+$/.test(phone);
        };

        // ================== FORM SUBMIT ==================
        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessage();

            const nId = document.getElementById('nationalId').value.trim();
            const phone = document.getElementById('phone').value.trim();
            
            // اعتبارسنجی
            if(!validateNationalId(nId)) {
                showMessage('کد ملی وارد شده نامعتبر است.');
                return;
            }
            if(!validatePhone(phone)) {
                showMessage('شماره همراه باید ۱۱ رقم باشد و با صفر (09) شروع شود.');
                return;
            }

            const y = document.getElementById('birth_y').value;
            const m = document.getElementById('birth_m').value.padStart(2, '0');
            const d = document.getElementById('birth_d').value.padStart(2, '0');
            const birthDate = `${y}/${m}/${d}`;

            const payload = {
                nationality: document.getElementById('nationality').value,
                nationalId: nId.padStart(10, '0'),
                firstName: document.getElementById('firstName').value.trim(),
                lastName: document.getElementById('lastName').value.trim(),
                gender: document.getElementById('gender').value,
                fatherName: document.getElementById('fatherName').value.trim(),
                issuePlace: document.getElementById('issuePlace').value.trim(),
                phone: phone.padStart(11, '0'),
                birthDate: birthDate,
                province: document.getElementById('province').value,
                city: document.getElementById('city').value.trim(),
                education: document.getElementById('education').value,
                studyField: document.getElementById('studyField').value.trim()
            };

            // تغییر وضعیت دکمه
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');
            
            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('form-view').style.display = 'none';
                    document.getElementById('success-view').style.display = 'block';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    showMessage(result.message);
                }
            } catch (error) {
                showMessage('برقراری ارتباط با سرور با خطا مواجه شد. لطفاً دوباره تلاش کنید.');
            } finally {
                btn.disabled = false;
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
