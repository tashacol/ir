<!DOCTYPE html>  
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- دستور دوم: تغییر viewport برای فعال‌سازی حالت واکنش‌گرا -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO: Title Tag - مهم‌ترین تگ سئو -->
    <title>سامانه گروه جهادی طلاب و روحانیون جنوب | ثبت و پیگیری فعالیت‌ها</title>

    <!-- SEO: Meta Description - توضیحاتی که در نتایج گوگل نمایش داده می‌شود -->
    <meta name="description" content="سامانه آنلاین گروه جهادی طلاب و روحانیون جنوب برای ثبت‌نام اعضا، ارسال گزارش فعالیت‌های جهادی، فرهنگی و تبلیغی و پیگیری وضعیت آن‌ها.">

    <!-- SEO: Meta Keywords - کلمات کلیدی مرتبط با صفحه -->
    <meta name="keywords" content="گروه جهادی, طلاب, روحانیون, فعالیت جهادی, ثبت نام گروه جهادی, سامانه جهادی, جنوب کشور, خدمات فرهنگی, محرومیت زدایی">

    <!-- SEO: Author -->
    <meta name="author" content="گروه جهادی طلاب و روحانیون جنوب">

    <!-- SEO: Canonical URL - برای جلوگیری از محتوای تکراری (آدرس اصلی سایت را وارد کنید) -->
    <link rel="canonical" href="https://your-domain.com/">

    <!-- SEO: Open Graph Tags - برای نمایش بهتر هنگام اشتراک‌گذاری در شبکه‌های اجتماعی -->
    <meta property="og:title" content="سامانه گروه جهادی طلاب و روحانیون جنوب | ثبت و پیگیری فعالیت‌ها">
    <meta property="og:description" content="ثبت‌نام و ارسال گزارش فعالیت‌های جهادی، فرهنگی و تبلیغی در سامانه گروه جهادی طلاب و روحانیون جنوب.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://your-domain.com/">
    <meta property="og:site_name" content="گروه جهادی طلاب و روحانیون جنوب">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- اسکریپت Google reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js?render=6Lc1vqkrAAAAAHLHbzPMzlREvKwgHDNSmakrB-aq"></script>
    
    <!-- SEO: JSON-LD Structured Data - برای درک بهتر محتوا توسط موتورهای جستجو -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "گروه جهادی طلاب و روحانیون جنوب",
      "url": "https://your-domain.com/",
      "description": "یک گروه جهادی متشکل از طلاب و روحانیون فعال در مناطق جنوبی کشور با هدف خدمت‌رسانی فرهنگی، عمرانی و رفع محرومیت.",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support"
      }
    }
    </script>

    <style>
        /* دستور هشتم: بهبود ظاهر و رابط کاربری */
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');
        :root {
            /* --- دستور 6: پالت رنگی مدرن‌تر و جذاب‌تر --- */
            --primary: #2962ff; --primary-light: #eaf0ff; --primary-dark: #0039cb;
            --primary-gradient: linear-gradient(135deg, #2962ff 0%, #1e40af 100%);
            --success-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --warning-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --danger-gradient: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            --text-dark: #1a202c; --text-light: #5a6a7b; --text-on-dark: #ffffff;
            --bg-main: #f4f7fa; --bg-card: #ffffff; --bg-soft: #f8fafc; --border-color: #e2e8f0;
            --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --info: #3b82f6;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow: 0 4px 12px -1px rgba(0,0,0,0.08), 0 2px 6px -1px rgba(0,0,0,0.04);
            --shadow-lg: 0 15px 35px -5px rgba(0,0,0,0.12), 0 8px 20px -5px rgba(0,0,0,0.06);
            --shadow-xl: 0 25px 50px -12px rgba(0,0,0,0.18);
            --radius-xl: 18px; --radius-lg: 14px; --radius-md: 10px; --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Vazirmatn', sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-dark); 
            line-height: 1.7; 
            font-size: 16px;
            /* --- دستور دوم: تغییر تصویر پس‌زمینه --- */
            background-image: url('https://tashacol.ir/123.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .hidden { display: none !important; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        /* دستور هفتم: پنهان کردن نشان reCAPTCHA */
        .grecaptcha-badge { visibility: hidden !important; }

        /* Auth View */
        #auth-view { 
            min-height: 100vh; display: flex; align-items: center; justify-content: center; 
            padding: 20px; animation: fadeIn 0.5s; 
        }
        /* --- دستور 6: طراحی مدرن‌تر کارت احراز هویت --- */
        .auth-container { 
            width: 100%; max-width: 500px; 
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.97) 0%, rgba(250, 251, 253, 0.95) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 45px 40px; 
            border-radius: var(--radius-xl); 
            box-shadow: var(--shadow-xl); 
            border: 1px solid rgba(255, 255, 255, 0.6);
            animation: slideUp 0.6s ease-out;
        }
        .auth-header { text-align: center; margin-bottom: 32px; }
        .auth-header h1 { 
            font-size: 2.2rem; font-weight: 800; 
            background: var(--primary-gradient);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; 
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }
        .auth-header p { color: var(--text-light); font-size: 0.98rem; font-weight: 500; }
        .auth-toggle { 
            display: grid; grid-template-columns: 1fr 1fr; 
            border-radius: var(--radius-md); margin-bottom: 30px; 
            background-color: var(--bg-soft); padding: 5px;
            border: 1px solid var(--border-color);
        }
        .auth-toggle button { 
            padding: 12px; font-size: 1rem; font-weight: 600; 
            background: transparent; border: none; cursor: pointer; 
            transition: var(--transition); color: var(--text-light); 
            border-radius: var(--radius-sm);
            font-family: inherit;
        }
        .auth-toggle button.active { 
            background: var(--primary-gradient); 
            color: var(--text-on-dark); 
            box-shadow: 0 4px 12px rgba(41, 98, 255, 0.35); 
        }
        
        .form-group { margin-bottom: 20px; position: relative; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.92rem; color: var(--text-dark); }
        
        .input-wrapper { position: relative; }
        .input-wrapper .input-icon {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 1.05rem;
            pointer-events: none;
            transition: var(--transition);
        }
        .form-input, .form-select { 
            width: 100%; 
            padding: 13px 16px; 
            border-radius: var(--radius-md); 
            border: 1.5px solid var(--border-color); 
            font-size: 1rem; 
            font-family: inherit; 
            transition: var(--transition); 
            background-color: var(--bg-soft);
            color: var(--text-dark);
        }
        /* استایل برای فیلدهایی که آیکون دارند */
        .form-input.with-icon { padding-left: 45px; }

        .form-input:focus, .form-select:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 4px var(--primary-light); 
            outline: none; 
            background-color: #ffffff; 
        }
        .form-input:focus + .input-icon,
        .input-wrapper:focus-within .input-icon { color: var(--primary); }
        .form-input::placeholder { color: #a0aec0; }
        
        .btn { 
            padding: 14px; font-size: 1.05rem; font-weight: 700; 
            border: none; border-radius: var(--radius-md); 
            cursor: pointer; transition: var(--transition); 
            position: relative; display: flex; align-items: center; 
            justify-content: center; min-height: 52px; 
            text-decoration: none;
            font-family: inherit;
            letter-spacing: 0.2px;
        }
        .btn-submit { 
            width: 100%; 
            background: var(--primary-gradient); 
            color: var(--text-on-dark);
            box-shadow: 0 6px 16px rgba(41, 98, 255, 0.28);
        }
        .btn-submit:hover:not(:disabled) { 
            box-shadow: 0 10px 24px rgba(41, 98, 255, 0.4);
            transform: translateY(-2px);
        }
        .btn-submit:active:not(:disabled) { transform: translateY(0); }
        .btn:disabled { background: #a0aec0; cursor: not-allowed; box-shadow: none; }
        .btn .spinner { 
            width: 22px; height: 22px; 
            border: 3px solid rgba(255,255,255,0.3); 
            border-top-color: var(--text-on-dark); 
            border-radius: 50%; 
            animation: spin 0.8s linear infinite; 
            display: none; 
        }
        .btn.loading .btn-text { visibility: hidden; }
        .btn.loading .spinner { display: block; position: absolute; }
        
        /* استایل‌های فرم چندمرحله‌ای */
        #register-form .form-step { display: none; animation: fadeIn 0.4s; }
        #register-form .form-step.active { display: block; }
        .form-navigation-btns { display: flex; justify-content: space-between; gap: 15px; margin-top: 20px; }
        .btn-next, .btn-prev { width: 100%; }
        .btn-prev { 
            background: var(--bg-soft); 
            color: var(--text-dark); 
            border: 1.5px solid var(--border-color);
        }
        .btn-prev:hover { background: #e2e8f0; }

        /* استایل نوار پیشرفت برای فرم ثبت‌نام */
        .progress-bar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; position: relative; }
        .progress-bar::before { content: ''; position: absolute; top: 17px; right: 0; transform: translateY(-50%); height: 4px; width: 100%; background-color: var(--border-color); z-index: 1; border-radius: 2px; }
        #progress-line { content: ''; position: absolute; top: 17px; right: 0; transform: translateY(-50%); height: 4px; background: var(--primary-gradient); z-index: 2; width: 0%; transition: var(--transition); border-radius: 2px; }
        .progress-step { display: flex; flex-direction: column; align-items: center; z-index: 3; text-align: center; }
        .progress-step-circle { 
            width: 36px; height: 36px; 
            background-color: var(--bg-card); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 700; color: var(--text-light); 
            transition: var(--transition); 
            border: 3px solid var(--border-color); 
            font-size: 0.95rem;
        }
        .progress-step-title { font-size: 0.8rem; color: var(--text-light); margin-top: 8px; font-weight: 500; }
        .progress-step.active .progress-step-circle { 
            border-color: var(--primary); color: #fff; 
            background: var(--primary-gradient); 
            box-shadow: 0 4px 10px rgba(41, 98, 255, 0.3);
        }
        .progress-step.active .progress-step-title { color: var(--primary); font-weight: 600; }

        /* --- دستور 6: پاپ‌آپ‌های مدرن --- */
        .popup-overlay {
            position: fixed; inset: 0; background: rgba(26, 32, 44, 0.65);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000; opacity: 0; visibility: hidden; transition: var(--transition);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 20px;
        }
        .popup-overlay.show { opacity: 1; visibility: visible; }
        .popup-box {
            background: #fff; border-radius: var(--radius-xl); 
            box-shadow: var(--shadow-xl);
            width: 100%; max-width: 460px;
            transform: scale(0.9) translateY(20px); transition: var(--transition);
            overflow: hidden; text-align: center;
            border-top: 5px solid var(--info);
        }
        .popup-overlay.show .popup-box { transform: scale(1) translateY(0); }
        .popup-box.success { border-top-color: var(--success); }
        .popup-box.error { border-top-color: var(--danger); }
        .popup-box.warning { border-top-color: var(--warning); }
        .popup-box.info { border-top-color: var(--info); }
        .popup-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 25px; border-bottom: 1px solid var(--border-color);
        }
        .popup-title { font-size: 1.2rem; font-weight: 700; color: var(--text-dark); margin: 0; }
        .popup-close-btn {
            background: transparent; border: none; font-size: 1.8rem; cursor: pointer;
            color: var(--text-light); line-height: 1; padding: 0 5px; transition: var(--transition);
        }
        .popup-close-btn:hover { color: var(--text-dark); transform: rotate(90deg); }
        .popup-body { padding: 30px 25px; }
        .popup-icon { font-size: 4rem; margin-bottom: 18px; line-height: 1; }
        .popup-icon.success { color: var(--success); }
        .popup-icon.error { color: var(--danger); }
        .popup-icon.info { color: var(--info); }
        .popup-icon.warning { color: var(--warning); }
        .popup-message { font-size: 1rem; color: var(--text-light); margin: 0; line-height: 1.7; }

        .date-popup-overlay {
            position: fixed; inset: 0; background: rgba(26, 32, 44, 0.65);
            display: none; align-items: center; justify-content: center;
            z-index: 2001;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0; visibility: hidden; transition: var(--transition);
            padding: 20px;
        }
        .date-popup-overlay.show { display: flex; opacity: 1; visibility: visible; }
        .date-popup-box {
            background: #fff; border-radius: var(--radius-xl); 
            box-shadow: var(--shadow-xl);
            width: 100%; max-width: 420px;
            transform: scale(0.9) translateY(20px); transition: var(--transition);
            border-top: 5px solid var(--primary);
            overflow: hidden;
        }
        .date-popup-overlay.show .date-popup-box { transform: scale(1) translateY(0); }
        .date-popup-box .popup-body { display: flex; flex-direction: column; gap: 20px; text-align: center;}
        .date-selectors { display: flex; gap: 12px; justify-content: center; }
        .date-part { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; }
        .date-part label { font-size: 0.88rem; font-weight: 600; color: var(--text-light); }
        #date-picker-submit { width: 100%; margin-top: 10px; }


        /* Dashboard View */
        #dashboard-view { animation: fadeIn 0.5s; min-height: 100vh; }
        .dashboard-header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 16px 30px; 
            background: linear-gradient(135deg, #ffffff 0%, #fafbfd 100%);
            box-shadow: 0 2px 20px rgba(0,0,0,0.06); 
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }
        .user-info { font-size: 1rem; color: var(--text-dark); font-weight: 500; }
        .user-info span { 
            font-weight: 700; 
            background: var(--primary-gradient);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; 
        }
        .btn-logout { 
            background: var(--danger-gradient); 
            width: auto; padding: 10px 18px; min-height: 42px; 
            color: #fff; font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.28);
            border-radius: var(--radius-md);
        }
        .btn-logout:hover:not(:disabled) { 
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
            transform: translateY(-2px);
        }
        
        .dashboard-container { max-width: 1250px; margin: 30px auto; padding: 0 20px; display: grid; gap: 28px; }
        .card { 
            background: var(--bg-card); 
            border-radius: var(--radius-xl); 
            box-shadow: var(--shadow); 
            padding: 28px; 
            overflow: hidden; 
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .card:hover { box-shadow: var(--shadow-lg); }
        .card-header { 
            display: flex; align-items: center; 
            margin-bottom: 22px; padding-bottom: 18px; 
            border-bottom: 2px solid var(--bg-soft); 
        }
        .card-header .icon { 
            color: var(--primary); font-size: 1.4rem; 
            margin-left: 14px; width: 44px; height: 44px; 
            display: flex; align-items: center; justify-content: center; 
            background: var(--primary-light); 
            border-radius: var(--radius-md);
        }
        .card-header h2 { font-size: 1.22rem; margin: 0; font-weight: 700; color: var(--text-dark); }
        
        textarea.form-input { resize: vertical; min-height: 130px; line-height: 1.7; }
        #word-count { font-size: 0.85rem; color: var(--text-light); margin-top: 6px; text-align: left; font-weight: 500; }
        .date-inputs-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-hint {
            display: block;
            margin-top: -10px;
            margin-bottom: 12px;
            font-size: 0.82rem;
            color: var(--info);
            background: #eff6ff;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            border-right: 3px solid var(--info);
            font-weight: 500;
        }

        /* استایل جدول سوابق */
        .activity-table-container { 
            max-height: 420px; overflow-y: auto; 
            border: 1px solid var(--border-color); 
            border-radius: var(--radius-md); 
            background: #fff;
        }
        .activity-table-container::-webkit-scrollbar { width: 8px; }
        .activity-table-container::-webkit-scrollbar-track { background: #f1f5f9; }
        .activity-table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .activity-table-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .activity-table { width: 100%; border-collapse: collapse; }
        .activity-table th, .activity-table td { padding: 14px 16px; text-align: right; border-bottom: 1px solid var(--border-color); font-size: 0.94rem; }
        .activity-table thead { position: sticky; top: 0; background-color: var(--bg-soft); z-index: 1; }
        .activity-table th { font-weight: 700; color: var(--text-light); font-size: 0.88rem; text-transform: uppercase; letter-spacing: 0.3px; }
        .activity-table tbody tr:last-child td { border-bottom: none; }
        .activity-table tbody tr { transition: var(--transition); }
        .activity-table tbody tr:hover { background-color: var(--primary-light); }
        .activity-table tbody tr:nth-child(even) { background-color: #fcfcfd; }
        .description-icon { 
            cursor: pointer; color: var(--info); font-size: 1.15rem; 
            transition: var(--transition); padding: 6px; border-radius: 6px;
            display: inline-flex;
        }
        .description-icon:hover { 
            color: var(--primary); transform: scale(1.15); 
            background: var(--primary-light);
        }
        .no-records-found { text-align: center; padding: 45px; color: var(--text-light); font-size: 0.95rem; }
        .btn-edit { 
            background: var(--warning-gradient); 
            color: #fff; border: none; 
            padding: 7px 14px; border-radius: var(--radius-sm); 
            cursor: pointer; transition: var(--transition); 
            font-weight: 600; font-size: 0.85rem;
            font-family: inherit;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
        }
        .btn-edit:hover { 
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
            transform: translateY(-1px);
        }

        /* Skeleton Loader */
        @keyframes skeleton-pulse { 0% { background-color: #f0f3f5; } 50% { background-color: #e2e8ed; } 100% { background-color: #f0f3f5; } }
        .skeleton-loader { padding: 10px; }
        .skeleton-item { background-color: #f0f3f5; border-radius: var(--radius-md); margin-bottom: 15px; padding: 20px; animation: skeleton-pulse 1.5s infinite ease-in-out; }
        .skeleton-item .skeleton-line { height: 16px; background-color: #e2e8ed; border-radius: 4px; margin-bottom: 12px; }
        .skeleton-item .skeleton-line.short { width: 60%; }
        .skeleton-item .skeleton-line.medium { width: 85%; }
        .skeleton-item .skeleton-line:last-child { margin-bottom: 0; }
        
        /* --- دستور 6: استایل لینک ورود مدیران --- */
        .admin-link-container {
            text-align: center;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px dashed var(--border-color);
        }
        .admin-link {
            text-decoration: none;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.92rem;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }
        .admin-link:hover { background: var(--primary-light); }
        .admin-link i { font-size: 0.9rem; }
        
        /* --- استایل رسپانسیو --- */
        @media (max-width: 768px) {
            .auth-container {
                padding: 28px 22px;
                margin: 10px;
                border-radius: var(--radius-lg);
            }
            .auth-header h1 {
                font-size: 1.7rem;
            }
            .auth-header p { font-size: 0.9rem; }
            .dashboard-container {
                padding: 0 12px;
                margin: 18px auto;
                gap: 20px;
            }
            .dashboard-header {
                padding: 12px 15px;
            }

</head>
<body>

    <!-- SEO: تگ main محتوای اصلی صفحه را به موتورهای جستجو معرفی می‌کند -->

                        <div class="form-group"><label for="reg-password">رمز عبور (بین ۸ تا ۳۰ کاراکتر)</label><input type="password" id="reg-password" class="form-input" required minlength="8" maxlength="30"></div>
                        <div class="form-navigation-btns"><button type="button" class="btn btn-prev">قبلی</button><button type="submit" class="btn btn-submit"><span class="btn-text">ثبت‌نام</span><div class="spinner"></div></button></div>

                        <!-- --- دستور 2: تغییر متن راهنما برای 4 سال --- -->

                <section class="card">
                    <!-- SEO: استفاده از تیترهای توصیفی‌تر برای درک بهتر محتوا -->

                    <div id="rejected-activities-container" class="activity-table-container"></div>

                <section class="card">

                    <div id="approved-loader" class="skeleton-loader"></div>

    <!-- ساختار مدرن پاپ آپ انتخاب تاریخ -->

                    <div class="date-part"><label for="date-picker-month">ماه</label><select id="date-picker-month" class="form-select"></select></div>

    <!-- ساختار مدرن پاپ آپ اطلاع رسانی -->
    <div id="alert-popup" class="popup-overlay">
        <div class="popup-box">
            <div class="popup-header">
                <h3 class="popup-title"></h3>
                <button class="popup-close-btn">&times;</button>
            </div>
            <div class="popup-body">
                <div class="popup-icon"><i class="fas"></i></div>
                <p class="popup-message"></p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwjYgBi88MwkeNx5VhZLnfHpUr-mNZRgJ92C-6qujLmuAZReVz4wpw_pSH5LitvJt-G/exec"; // آدرس را جایگزین کنید
            const RECAPTCHA_SITE_KEY = '6Lc1vqkrAAAAAHLHbzPMzlREvKwgHDNSmakrB-aq';
            
            const authView = document.getElementById('auth-view');
            const dashboardView = document.getElementById('dashboard-view');
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const showLoginBtn = document.getElementById('show-login-btn');
            const showRegisterBtn = document.getElementById('show-register-btn');
            const logoutBtn = document.getElementById('logout-btn');
            const userNameDisplay = document.getElementById('user-name-display');
            const activityForm = document.getElementById('activity-form');
            const activityDescription = document.getElementById('activity-description');
            const wordCountDisplay = document.getElementById('word-count');
            const alertPopup = document.getElementById('alert-popup');

            let currentActivities = [];

            /**
             * دستور 6: تابع نمایش پاپ‌آپ اطلاع‌رسانی مدرن
             */
            const showAlert = (title, message, type = 'info') => {
                const popupBox = alertPopup.querySelector('.popup-box');
                const iconEl = alertPopup.querySelector('.popup-icon i');
                const iconContainer = alertPopup.querySelector('.popup-icon');
                
                popupBox.classList.remove('success', 'error', 'info', 'warning');
                popupBox.classList.add(type);
                iconContainer.className = `popup-icon ${type}`;
                iconEl.className = 'fas';
                if (type === 'success') iconEl.classList.add('fa-check-circle');
                else if (type === 'error') iconEl.classList.add('fa-exclamation-triangle');
                else if (type === 'warning') iconEl.classList.add('fa-exclamation-circle');
                else iconEl.classList.add('fa-info-circle');

                alertPopup.querySelector('.popup-title').textContent = title;
                alertPopup.querySelector('.popup-message').textContent = message;
                alertPopup.classList.add('show');
            };

            alertPopup.addEventListener('click', (e) => {
                if (e.target.classList.contains('popup-overlay') || e.target.closest('.popup-close-btn')) {
                    alertPopup.classList.remove('show');
                }
            });

            const toggleButtonLoading = (btn, isLoading) => {
                if (!btn) return;
                btn.classList.toggle('loading', isLoading);
                btn.disabled = isLoading;
            };

            const apiRequest = async (params) => {
                const token = sessionStorage.getItem('authToken');
                if (token && params.action !== 'login' && params.action !== 'register') {
                    params.token = token;
                }

                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(params)
                    });

                    if (!response.ok) throw new Error('خطای شبکه.');
                    const result = await response.json();
                    
                    if (!result.success && result.message.includes("نشست شما نامعتبر")) {
                        handleLogout(false);
                        showAlert('خطا', result.message, 'error');
                    }
                    return result;
                } catch (error) {
                    console.error("API Request Error:", error);
                    return { success: false, message: 'خطا در برقراری ارتباط با سرور.' };
                }
            };
            
            const toggleAuthForms = (showLogin) => {
                loginForm.classList.toggle('hidden', !showLogin);
                registerForm.classList.toggle('hidden', showLogin);
                showLoginBtn.classList.toggle('active', showLogin);
                showRegisterBtn.classList.toggle('active', !showLogin);
            };
            showLoginBtn.addEventListener('click', () => toggleAuthForms(true));
            showRegisterBtn.addEventListener('click', () => toggleAuthForms(false));

            // =================================================================================
            // --- دستور 1 و 3: بازنویسی کامل منطق ورود برای جلوگیری از فریز شدن و ثبت نام سریع ---
            // =================================================================================

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button[type="submit"]');
                toggleButtonLoading(btn, true);

                try {
                    // --- شروع ویرایش: روش قوی‌تر برای دریافت توکن reCAPTCHA ---
                    await new Promise(resolve => grecaptcha.ready(resolve));
                    const recaptchaToken = await grecaptcha.execute(RECAPTCHA_SITE_KEY, { action: 'login' });
                    // --- پایان ویرایش ---

                    const params = {
                        action: 'login',
                        nationalId: document.getElementById('login-nid').value,
                        password: document.getElementById('login-password').value,
                        recaptchaToken: recaptchaToken
                    };

                    const result = await apiRequest(params);

                    if (result.success) {
                        showAlert('ورود موفق', result.message, 'success');
                        sessionStorage.setItem('authToken', result.token);
                        sessionStorage.setItem('currentUser', JSON.stringify(result.userData));
                        setTimeout(() => {
                            alertPopup.classList.remove('show');
                            initDashboard(result.userData);
                        }, 1200);
                    } else {
                        showAlert('خطا', result.message, 'error');
                    }
                } catch (error) {
                    console.error("خطا در فرآیند ورود یا reCAPTCHA:", error);
                    showAlert('خطای اساسی', 'مشکلی در اعتبارسنجی یا ارتباط با سرور رخ داد.', 'error');
                } finally {
                    toggleButtonLoading(btn, false);
                }
            });

            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!validateStep(currentStep)) return;
                
                const btn = e.target.querySelector('button[type="submit"]');
                toggleButtonLoading(btn, true);

                try {
                    // --- شروع ویرایش: روش قوی‌تر برای دریافت توکن reCAPTCHA ---
                    await new Promise(resolve => grecaptcha.ready(resolve));
                    const recaptchaToken = await grecaptcha.execute(RECAPTCHA_SITE_KEY, { action: 'register' });
                    // --- پایان ویرایش ---

                    const params = {
                        action: 'register',
                        fullName: document.getElementById('reg-fullname').value, nationalId: document.getElementById('reg-nid').value,
                        dob: document.getElementById('reg-dob').value, gender: document.getElementById('reg-gender').value,
                        education: document.getElementById('reg-education').value, skill: document.getElementById('reg-skill').value,
                        phone: document.getElementById('reg-phone').value, password: document.getElementById('reg-password').value,
                        recaptchaToken: recaptchaToken
                    };
                    
                    const result = await apiRequest(params);

                    if (result.success) {
                        showAlert('ثبت نام موفق', result.message, 'success');
                        registerForm.reset();
                        resetRegistrationForm();
                        
                        // --- دستور 1 و 3: ورود خودکار کاربر بدون نیاز به ورود مجدد یا رفرش ---
                        if (result.token && result.userData) {
                            sessionStorage.setItem('authToken', result.token);
                            sessionStorage.setItem('currentUser', JSON.stringify(result.userData));
                            
                            // بعد از نمایش پیام موفق، مستقیماً وارد داشبورد می‌شویم
                            setTimeout(() => {
                                alertPopup.classList.remove('show');
                                initDashboard(result.userData);
                            }, 1500);
                        } else {
                            // حالت پشتیبان: اگر به هر دلیلی توکن ارسال نشد، به فرم ورود برگردانده می‌شود
                            toggleAuthForms(true);
                            setTimeout(() => alertPopup.classList.remove('show'), 2000);
                        }
                    } else { 
                        showAlert('خطا', result.message, 'error');
                    }
                } catch (error) {
                    console.error("خطا در فرآیند ثبت‌نام یا reCAPTCHA:", error);
                    showAlert('خطای اساسی', 'مشکلی در اعتبارسنجی یا ارتباط با سرور رخ داد.', 'error');
                } finally {
                    toggleButtonLoading(btn, false);
                }
            });


            // منطق فرم چند مرحله ای ثبت نام با نوار پیشرفت
            const registerSteps = Array.from(registerForm.querySelectorAll('.form-step'));
            const progressSteps = Array.from(registerForm.querySelectorAll('.progress-step'));
            const progressLine = document.getElementById('progress-line');
            let currentStep = 0;

            const showStep = (stepIndex) => {
                registerSteps.forEach((step, index) => {
                    step.classList.toggle('active', index === stepIndex);
                });
                progressSteps.forEach((step, index) => {
                    step.classList.toggle('active', index <= stepIndex);
                });
                const progressPercentage = (stepIndex / (progressSteps.length - 1)) * 100;
                progressLine.style.width = `${progressPercentage}%`;
            };

            const resetRegistrationForm = () => {
                currentStep = 0;
                showStep(currentStep);
            };

            registerForm.querySelectorAll('.btn-next').forEach(button => {
                button.addEventListener('click', () => {
                    if (validateStep(currentStep)) {
                        currentStep++;
                        showStep(currentStep);
                    }
                });
            });

            registerForm.querySelectorAll('.btn-prev').forEach(button => {
                button.addEventListener('click', () => {
                    currentStep--;
                    showStep(currentStep);
                });
            });
            
            const validateStep = (stepIndex) => {
                const step = registerSteps[stepIndex];
                const inputs = step.querySelectorAll('input[required], select[required]');
                for (const input of inputs) {
                    if (!input.value.trim()) {
                        showAlert('خطا', `لطفا فیلد "${input.labels[0].textContent}" را پر کنید.`, 'error');
                        return false;
                    }
                }
                if (stepIndex === 0) { // Step 1 validation
                    const nationalId = document.getElementById('reg-nid').value;
                    if (!isValidIranianNationalId(nationalId)) {
                        showAlert('خطا', "کد ملی وارد شده معتبر نیست.", 'error');
                        return false;
                    }
                }
                if (stepIndex === 2) { // Step 3 validation
                    const phone = document.getElementById('reg-phone').value;
                    if (!/^0\d{10}$/.test(phone)) {
                        showAlert('خطا', 'شماره تماس باید ۱۱ رقمی و با صفر شروع شود.', 'error');
                        return false;
                    }
                    const password = document.getElementById('reg-password').value;
                    if (password.length < 8) {
                        showAlert('خطا', "رمز عبور باید حداقل ۸ کاراکتر باشد.", 'error');
                        return false;
                    }
                }
                return true;
            };

            const handleLogout = async (showSuccessMessage = true) => {
                const token = sessionStorage.getItem('authToken');
                toggleButtonLoading(logoutBtn, true);
                if(token) await apiRequest({ action: 'logout' });
                toggleButtonLoading(logoutBtn, false);
                sessionStorage.clear();
                dashboardView.classList.add('hidden');
                authView.classList.remove('hidden');
                loginForm.reset();
                if(showSuccessMessage) showAlert('خروج', 'با موفقیت از حساب کاربری خود خارج شدید.', 'info');
            };
            logoutBtn.addEventListener('click', () => handleLogout(true));

            const initDashboard = async (userData) => {
                if (!userData) return;
                authView.classList.add('hidden');
                dashboardView.classList.remove('hidden');
                userNameDisplay.textContent = userData.name;
                await fetchAndDisplayActivities();
            };

            const toggleActivityLoaders = (show) => {
                const skeletonHTML = `<div class="skeleton-item"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div><div class="skeleton-line"></div></div>`;
                document.getElementById('pending-loader').innerHTML = show ? skeletonHTML : '';
                document.getElementById('rejected-loader').innerHTML = show ? skeletonHTML : '';
                document.getElementById('approved-loader').innerHTML = show ? skeletonHTML : '';
            };

            const fetchAndDisplayActivities = async () => {
                toggleActivityLoaders(true);
                document.getElementById('pending-activities-container').classList.add('hidden');
                document.getElementById('rejected-activities-container').classList.add('hidden');
                document.getElementById('approved-activities-container').classList.add('hidden');

                const result = await apiRequest({ action: 'getActivities' });
                toggleActivityLoaders(false);

                document.getElementById('pending-activities-container').classList.remove('hidden');
                document.getElementById('rejected-activities-container').classList.remove('hidden');
                document.getElementById('approved-activities-container').classList.remove('hidden');

                if (result.success) {
                    currentActivities = result.activities;
                    renderActivities();
                } else { showAlert('خطا', result.message, 'error'); }
            };
            
            const renderActivities = () => {
                const containers = { 
                    pending: document.getElementById('pending-activities-container'), 
                    rejected: document.getElementById('rejected-activities-container'), 
                    approved: document.getElementById('approved-activities-container') 
                };
                Object.values(containers).forEach(container => container.innerHTML = '');
                const activitiesByStatus = { '0': [], '1': [], '5': [] };
                
                if(currentActivities && currentActivities.length > 0){
                    currentActivities.forEach(act => {
                        const statusKey = act.status.toString();
                        if (activitiesByStatus[statusKey]) activitiesByStatus[statusKey].push(act);
                    });
                }
                
                Object.keys(containers).forEach(key => {
                    const statusMap = {'pending': '0', 'rejected': '1', 'approved': '5'};
                    const status = statusMap[key];
                    const activityList = activitiesByStatus[status];
                    containers[key].innerHTML = createActivityTable(activityList, status);
                });

                addTableActionListeners();
            };
            
            const createActivityTable = (activities, status) => {
                if (!activities || activities.length === 0) {
                    return '<div class="no-records-found">موردی برای نمایش وجود ندارد.</div>';
                }

                const canEdit = status === '0' || status === '1';
                let tableHTML = `
                    <table class="activity-table">
                        <thead>
                            <tr>
                                <th>ردیف</th>
                                <th>فعالیت</th>
                                <th>شروع</th>
                                <th>پایان</th>
                                <th>توضیحات</th>
                                ${canEdit ? '<th>ویرایش</th>' : ''}
                            </tr>
                        </thead>
                        <tbody>
                `;

                activities.forEach((activity, index) => {
                    tableHTML += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${escapeHtml(activity.title)}</td>
                            <td>${activity.startDate}</td>
                            <td>${activity.endDate}</td>
                            <td>
                                <i class="fas fa-info-circle description-icon" data-title="${escapeHtml(activity.title)}" data-description="${escapeHtml(activity.description)}"></i>
                            </td>
                            ${canEdit ? `<td><button class="btn-edit" data-row-id="${activity.row}">ویرایش</button></td>` : ''}
                        </tr>
                    `;
                });

                tableHTML += '</tbody></table>';
                return tableHTML;
            };
            
            const escapeHtml = (unsafe) => {
                if(typeof unsafe !== 'string') return '';
                return unsafe
                     .replace(/&/g, "&amp;")
                     .replace(/</g, "&lt;")
                     .replace(/>/g, "&gt;")
                     .replace(/"/g, "&quot;")
                     .replace(/'/g, "&#039;");
            }

            const addTableActionListeners = () => {
                document.querySelectorAll('.description-icon').forEach(icon => {
                    icon.addEventListener('click', (e) => {
                        const title = e.target.dataset.title;
                        const description = e.target.dataset.description;
                        showAlert(title, description, 'info');
                    });
                });
                document.querySelectorAll('.btn-edit').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const rowId = e.target.dataset.rowId;
                        const activityToEdit = currentActivities.find(act => act.row == rowId);
                        if (activityToEdit) {
                            populateActivityForm(activityToEdit);
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        }
                    });
                });
            };

            const populateActivityForm = (activity) => {
                document.getElementById('activity-form-title').textContent = 'ویرایش فعالیت';
                document.getElementById('activity-row-id').value = activity.row;
                document.getElementById('activity-title').value = activity.title;
                document.getElementById('activity-description').value = activity.description;
                document.getElementById('activity-start-date').value = activity.startDate;
                document.getElementById('activity-end-date').value = activity.endDate;
                document.getElementById('activity-submit-btn').querySelector('.btn-text').textContent = 'ویرایش و ارسال مجدد';
                updateWordCount();
            };

            activityForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('.btn-submit');
                const rowId = document.getElementById('activity-row-id').value;
                if(activityDescription.value.trim().split(/\s+/).filter(Boolean).length < 15) {
                    showAlert('خطا', 'توضیحات باید حداقل ۱۵ کلمه باشد.', 'error'); return;
                }
                
                const startDateStr = document.getElementById('activity-start-date').value;
                const endDateStr = document.getElementById('activity-end-date').value;
                if (!startDateStr || !endDateStr) {
                    showAlert('خطا', 'لطفا تاریخ شروع و پایان را انتخاب کنید.', 'error'); return;
                }
                
                // --- شروع ویرایش: اعتبارسنجی نهایی تاریخ قبل از ارسال ---
                if (endDateStr < startDateStr) {
                    showAlert('خطا', 'تاریخ پایان نمی‌تواند قبل از تاریخ شروع باشد.', 'error');
                    return;
                }
                // --- پایان ویرایش ---

                toggleButtonLoading(btn, true);
                const params = {
                    action: rowId ? 'updateActivity' : 'addActivity',
                    row: rowId, title: document.getElementById('activity-title').value,
                    description: activityDescription.value, startDate: startDateStr, endDate: endDateStr
                };
                const result = await apiRequest(params);
                showAlert(result.success ? 'موفق' : 'خطا', result.message, result.success ? 'success' : 'error');
                if (result.success) {
                    resetActivityForm();
                    await fetchAndDisplayActivities();
                }
                toggleButtonLoading(btn, false);
            });
            
            const resetActivityForm = () => {
                activityForm.reset();
                document.getElementById('activity-form-title').textContent = 'ثبت فعالیت جدید';
                document.getElementById('activity-row-id').value = '';
                document.getElementById('activity-submit-btn').querySelector('.btn-text').textContent = 'ارسال فعالیت';
                updateWordCount();
            };

            activityDescription.addEventListener('input', updateWordCount);
            function updateWordCount() { wordCountDisplay.textContent = `تعداد کلمات: ${activityDescription.value.trim().split(/\s+/).filter(Boolean).length}`; }

            // ===================================================================================
            // --- شروع ویرایش اساسی: بازنویسی کامل منطق انتخابگر تاریخ (Date Picker) ---
            // --- دستور 2: بازه 60 روز به 4 سال تغییر کرد ---
            // ===================================================================================

            const datePickerPopup = document.getElementById('date-picker-popup');
            let currentDatePickerInput = null;
            let availableDates = []; // آرایه‌ای برای نگهداری تاریخ‌های معتبر

            const yearSelect = document.getElementById('date-picker-year');
            const monthSelect = document.getElementById('date-picker-month');
            const daySelect = document.getElementById('date-picker-day');
            const datePickerSubmitBtn = document.getElementById('date-picker-submit');

            // تابع کمکی برای تبدیل تاریخ میلادی به شیء تاریخ شمسی
            const toPersianDate = (date) => {
                const parts = new Intl.DateTimeFormat('fa-IR-u-nu-latn', {
                    year: 'numeric', month: '2-digit', day: '2-digit'
                }).format(date).split('/');
                return { year: parseInt(parts[0]), month: parseInt(parts[1]), day: parseInt(parts[2]) };
            };

            const setupDatePicker = (inputElement) => {
                inputElement.addEventListener('click', () => {
                    currentDatePickerInput = inputElement;
                    populateDatePicker();
                    datePickerPopup.classList.add('show');
                });
            };

            const populateDatePicker = () => {
                // پاک کردن و غیرفعال کردن سلکتورها
                [yearSelect, monthSelect, daySelect].forEach(sel => sel.innerHTML = '');
                monthSelect.disabled = true;
                daySelect.disabled = true;
                datePickerSubmitBtn.disabled = true;

                // افزودن گزینه پیش‌فرض
                yearSelect.add(new Option('سال را انتخاب کنید', ''));
                monthSelect.add(new Option('ابتدا سال را انتخاب کنید', ''));
                daySelect.add(new Option('ابتدا ماه را انتخاب کنید', ''));
                
                const isActivity = currentDatePickerInput.id.startsWith('activity-');
                
                if (isActivity) {
                    // --- دستور 2: محدودیت 4 سال گذشته (به جای 60 روز) ---
                    const today = new Date();
                    const fourYearsAgo = new Date();
                    fourYearsAgo.setFullYear(fourYearsAgo.getFullYear() - 4);

                    let minDate = fourYearsAgo;
                    if (currentDatePickerInput.id === 'activity-end-date') {
                        const startDateVal = document.getElementById('activity-start-date').value;
                        if (startDateVal) {
                            minDate = startDateVal;
                        }
                    }

                    availableDates = [];
                    // مقدار اولیه به عنوان تاریخ شروع رنج
                    let rangeStart = (typeof minDate === 'string') ? fourYearsAgo : minDate;
                    
                    // در صورت اعمال محدودیت dateString برای minDate
                    let minDateString = null;
                    if (typeof minDate === 'string') {
                        minDateString = minDate;
                    }

                    for (let d = new Date(rangeStart); d <= today; d.setDate(d.getDate() + 1)) {
                        const pDate = toPersianDate(new Date(d));
                        const dateString = `${pDate.year}/${String(pDate.month).padStart(2, '0')}/${String(pDate.day).padStart(2, '0')}`;
                        
                        if (minDateString && dateString < minDateString) {
                            continue;
                        }
                        availableDates.push(pDate);
                    }
                    
                } else { // برای تاریخ تولد
                    availableDates = [];
                    const currentPersianYear = toPersianDate(new Date()).year;
                    const endYear = currentPersianYear - 10;
                    for (let y = endYear; y >= endYear - 70; y--) {
                        for (let m = 1; m <= 12; m++) {
                            const daysInMonth = m <= 6 ? 31 : (m <= 11 ? 30 : 29); // Approximation for leap year
                            for (let d = 1; d <= daysInMonth; d++) {
                                availableDates.push({ year: y, month: m, day: d });
                            }
                        }
                    }
                }
                
                // پر کردن سال‌ها
                const years = [...new Set(availableDates.map(d => d.year))].sort((a,b) => b-a);
                years.forEach(y => yearSelect.add(new Option(y, y)));
            };

            const updateMonthOptions = () => {
                monthSelect.innerHTML = '';
                monthSelect.add(new Option('ماه را انتخاب کنید', ''));
                daySelect.innerHTML = '';
                daySelect.add(new Option('ابتدا ماه را انتخاب کنید', ''));
                daySelect.disabled = true;
                datePickerSubmitBtn.disabled = true;

                const selectedYear = parseInt(yearSelect.value);
                if (!selectedYear) {
                    monthSelect.disabled = true;
                    return;
                }

                monthSelect.disabled = false;
                const months = [...new Set(availableDates.filter(d => d.year === selectedYear).map(d => d.month))];
                months.sort((a, b) => a - b);
                months.forEach(m => monthSelect.add(new Option(m, m)));
            };
            
            const updateDayOptions = () => {
                daySelect.innerHTML = '';
                daySelect.add(new Option('روز را انتخاب کنید', ''));
                datePickerSubmitBtn.disabled = true;
                
                const selectedYear = parseInt(yearSelect.value);
                const selectedMonth = parseInt(monthSelect.value);

                if (!selectedYear || !selectedMonth) {
                    daySelect.disabled = true;
                    return;
                }

                daySelect.disabled = false;
                const days = availableDates
                    .filter(d => d.year === selectedYear && d.month === selectedMonth)
                    .map(d => d.day);
                days.sort((a, b) => a - b);
                days.forEach(d => daySelect.add(new Option(d, d)));
            };

            yearSelect.addEventListener('change', updateMonthOptions);
            monthSelect.addEventListener('change', updateDayOptions);
            daySelect.addEventListener('change', () => {
                datePickerSubmitBtn.disabled = !daySelect.value;
            });

            datePickerSubmitBtn.addEventListener('click', () => {
                if (currentDatePickerInput && yearSelect.value && monthSelect.value && daySelect.value) {
                    const year = yearSelect.value;
                    const month = monthSelect.value.padStart(2, '0');
                    const day = daySelect.value.padStart(2, '0');
                    const selectedDate = `${year}/${month}/${day}`;
                    currentDatePickerInput.value = selectedDate;

                    if (currentDatePickerInput.id === 'activity-start-date') {
                        const endDateInput = document.getElementById('activity-end-date');
                        if (endDateInput.value && endDateInput.value < selectedDate) {
                            endDateInput.value = '';
                            showAlert('توجه', 'تاریخ پایان نامعتبر شد. لطفا مجددا انتخاب کنید.', 'warning');
                        }
                    }
                }
                datePickerPopup.classList.remove('show');
            });
            
            datePickerPopup.addEventListener('click', (e) => { 
                if(e.target === datePickerPopup || e.target.closest('.popup-close-btn')) {
                    datePickerPopup.classList.remove('show');
                }
            });

            setupDatePicker(document.getElementById('reg-dob'));
            setupDatePicker(document.getElementById('activity-start-date'));
            setupDatePicker(document.getElementById('activity-end-date'));
            
            // ===================================================================================
            // --- پایان ویرایش اساسی: بازنویسی کامل منطق انتخابگر تاریخ (Date Picker) ---
            // ===================================================================================

            function isValidIranianNationalId(code) {
                if (!/^\d{10}$/.test(code)) return false;
                const check = parseInt(code[9], 10);
                let sum = 0;
                for (let i = 0; i < 9; i++) sum += parseInt(code[i], 10) * (10 - i);
                const remainder = sum % 11;
                return (remainder < 2 && check === remainder) || (remainder >= 2 && check === 11 - remainder);
            }

            const checkSession = () => {
                const savedUser = sessionStorage.getItem('currentUser');
                const token = sessionStorage.getItem('authToken');
                if (savedUser && token) initDashboard(JSON.parse(savedUser));
            };
            checkSession();
            showStep(currentStep); // Initialize register form to step 0
        });
    </script>
