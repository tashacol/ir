<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ورود مدیر</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior: none; }
body { font-family: Tahoma, sans-serif; background: #0f172a; color: #e2e8f0; overflow: hidden; min-height: 100vh; }

#fullLoader { position: fixed; inset: 0; background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 70%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; gap: 40px; overflow: hidden; transition: opacity 0.4s; }
#fullLoader.fade-out { opacity: 0; pointer-events: none; }
.loader-ring { position: absolute; width: 180px; height: 180px; border-radius: 50%; border: 2px solid transparent; border-top-color: #2563eb; animation: ringSpin 2s linear infinite; }
.loader-ring-2 { position: absolute; width: 220px; height: 220px; border-radius: 50%; border: 2px solid transparent; border-bottom-color: #10b981; animation: ringSpin 3s linear infinite reverse; }
@keyframes ringSpin { to { transform: rotate(360deg); } }
.rubik-loader { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 7px; width: 110px; height: 110px; perspective: 600px; transform-style: preserve-3d; animation: rubikSpin 3s ease-in-out infinite; z-index: 2; }
.rubik-loader .cube { border-radius: 7px; animation: cubePulse 1.4s ease-in-out infinite; }
.rubik-loader .cube:nth-child(1) { background: #dc2626; animation-delay: 0s; }
.rubik-loader .cube:nth-child(2) { background: #f59e0b; animation-delay: 0.1s; }
.rubik-loader .cube:nth-child(3) { background: #fbbf24; animation-delay: 0.2s; }
.rubik-loader .cube:nth-child(4) { background: #2563eb; animation-delay: 0.3s; }
.rubik-loader .cube:nth-child(5) { background: #10b981; animation-delay: 0.4s; }
.rubik-loader .cube:nth-child(6) { background: #dc2626; animation-delay: 0.5s; }
.rubik-loader .cube:nth-child(7) { background: #f1f5f9; animation-delay: 0.6s; }
.rubik-loader .cube:nth-child(8) { background: #10b981; animation-delay: 0.7s; }
.rubik-loader .cube:nth-child(9) { background: #f59e0b; animation-delay: 0.8s; }
@keyframes rubikSpin { 0%,100% { transform: rotateY(0deg) rotateX(0deg); } 25% { transform: rotateY(90deg) rotateX(15deg); } 50% { transform: rotateY(180deg) rotateX(0deg); } 75% { transform: rotateY(270deg) rotateX(-15deg); } }
@keyframes cubePulse { 0%,100% { transform: scale(1); } 50% { transform: scale(0.85); } }
.loader-text { color: #f1f5f9; font-size: 19px; font-weight: bold; margin-bottom: 8px; }
.loader-subtext { color: #94a3b8; font-size: 13px; }

#loginBox { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; padding: 20px; z-index: 100; }
.box { background: #1e293b; padding: 40px 30px; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; width: 100%; max-width: 420px; border: 1px solid #334155; }
h1 { margin-bottom: 8px; font-size: 22px; color: #f1f5f9; }
.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
input { width: 100%; padding: 14px 16px; margin-bottom: 16px; border: 2px solid #334155; border-radius: 10px; background: #0f172a; color: #fff; font-size: 16px; font-family: inherit; text-align: center; }
input:focus { outline: none; border-color: #2563eb; }
.btn-login { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: bold; font-family: inherit; min-height: 50px; }
.btn-login:hover:not(:disabled) { background: #1d4ed8; }
.btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
.error { color: #f87171; margin-top: 14px; font-size: 14px; min-height: 20px; }

#meet { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 50; }
#meet iframe { width: 100% !important; height: 100% !important; }

/* دکمه پنل مدیریت */
#panelToggle { position: fixed; top: 60px; left: 16px; width: 48px; height: 48px; border-radius: 50%; background: #f59e0b; border: 2px solid #fff; color: #fff; font-size: 22px; cursor: pointer; z-index: 9999; display: none; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
#panelToggle.show { display: flex; }
#panelToggle .notif-dot { position: absolute; top: -2px; right: -2px; width: 16px; height: 16px; background: #dc2626; border-radius: 50%; border: 2px solid #fff; display: none; }
#panelToggle .notif-dot.show { display: block; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.3); } }

#adminPanel { position: fixed; top: 0; right: 0; width: 320px; max-width: 90vw; height: 100vh; background: #0f172a; border-left: 1px solid #334155; z-index: 10000; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s; box-shadow: -4px 0 20px rgba(0,0,0,0.5); }
#adminPanel.open { transform: translateX(0); }
.panel-header { padding: 14px 16px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
.panel-header h2 { font-size: 15px; color: #f1f5f9; }
.panel-close { background: transparent; border: none; color: #94a3b8; font-size: 22px; cursor: pointer; }
.panel-tabs { display: flex; background: #1e293b; border-bottom: 1px solid #334155; }
.panel-tab { flex: 1; padding: 10px 6px; background: transparent; border: none; color: #94a3b8; cursor: pointer; font-size: 12px; font-family: inherit; border-bottom: 2px solid transparent; position: relative; }
.panel-tab.active { color: #2563eb; border-bottom-color: #2563eb; }
.panel-tab .badge { position: absolute; top: 4px; left: 4px; background: #dc2626; color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 10px; display: none; }
.panel-tab .badge.show { display: inline-block; }
.panel-body { flex: 1; overflow-y: auto; padding: 12px; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.empty-msg { text-align: center; color: #64748b; font-size: 12px; padding: 30px 15px; }
.req-item { background: #1e293b; border: 1px solid #f59e0b; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
.req-item .name { color: #fbbf24; font-weight: bold; font-size: 13px; margin-bottom: 10px; }
.req-actions { display: flex; gap: 8px; }
.req-actions button { flex: 1; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: bold; }
.btn-admit { background: #10b981; color: #fff; }
.btn-reject { background: #dc2626; color: #fff; }
.btn-kick-all { width: 100%; margin-bottom: 10px; background: #dc2626; color: #fff; padding: 10px; border: none; border-radius: 8px; font-family: inherit; font-weight: bold; cursor: pointer; font-size: 13px; }
.user-item { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.user-item .user-name { color: #e2e8f0; font-size: 12px; font-weight: bold; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-item .btn-kick { background: transparent; border: 1px solid #dc2626; color: #dc2626; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-family: inherit; }
.event-item { background: #1e293b; border-right: 3px solid #334155; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; font-size: 11px; }
.event-item.join { border-right-color: #10b981; }
.event-item.leave { border-right-color: #64748b; }
.event-item.kick { border-right-color: #dc2626; }
.event-item.admit { border-right-color: #2563eb; }
.event-item.reject { border-right-color: #f59e0b; }
.event-item .event-time { color: #64748b; font-size: 10px; display: block; margin-bottom: 3px; }
.event-item .event-text { color: #cbd5e1; }
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="fullLoader" class="hidden">
  <div class="loader-ring"></div>
  <div class="loader-ring-2"></div>
  <div class="rubik-loader">
    <div class="cube"></div><div class="cube"></div><div class="cube"></div>
    <div class="cube"></div><div class="cube"></div><div class="cube"></div>
    <div class="cube"></div><div class="cube"></div><div class="cube"></div>
  </div>
  <p class="loader-text">در حال اتصال...</p>
  <p class="loader-subtext">لطفاً صبر کنید</p>
</div>

<div id="loginBox">
  <div class="box">
    <h1>🔐 ورود مدیر</h1>
    <p class="subtitle">رمز عبور را وارد کنید</p>
    <input type="password" id="adminPassword" placeholder="رمز عبور">
    <button class="btn-login" id="loginBtn" onclick="adminLogin()">ورود به اتاق مشاوره</button>
    <p class="error" id="errorMsg"></p>
  </div>
</div>

<div id="meet" class="hidden"></div>

<button id="panelToggle" onclick="togglePanel()" title="پنل مدیریت">⚙️<span class="notif-dot" id="notifDot"></span></button>

<div id="adminPanel">
  <div class="panel-header"><h2>🎛️ پنل مدیریت</h2><button class="panel-close" onclick="togglePanel()">✕</button></div>
  <div class="panel-tabs">
    <button class="panel-tab active" onclick="switchTab('requests', this)">درخواست‌ها <span class="badge" id="reqBadge">0</span></button>
    <button class="panel-tab" onclick="switchTab('users', this)">حاضرین <span class="badge" id="userBadge">0</span></button>
    <button class="panel-tab" onclick="switchTab('events', this)">رویدادها</button>
  </div>
  <div class="panel-body">
    <div class="tab-content active" id="tab-requests">
      <div class="empty-msg" id="reqEmpty">🔕<br>هیچ درخواست ورودی وجود ندارد</div>
      <div id="reqList"></div>
    </div>
    <div class="tab-content" id="tab-users">
      <button class="btn-kick-all" onclick="kickAllUsers()">🚫 اخراج همه کاربران</button>
      <div class="empty-msg" id="usersEmpty">👤<br>هنوز کسی در اتاق نیست</div>
      <div id="usersList"></div>
    </div>
    <div class="tab-content" id="tab-events">
      <div id="eventsList"><div class="empty-msg">📋<br>رویدادی ثبت نشده</div></div>
    </div>
  </div>
</div>

<script src="https://8x8.vc/vpaas-magic-cookie-9e86f3c71b2d4fe287d643cfae775d17/external_api.js"></script>
<script>
const SCRIPT_URL = "https://moshverat-api.aboalidadgostar.workers.dev/";
const APP_ID = "vpaas-magic-cookie-9e86f3c71b2d4fe287d643cfae775d17";
const ROOM_NAME = APP_ID + "/taali-andishe-va-roshd";

let jitsiApi = null;
let panelOpen = false;
const pendingRequests = {};
const activeUsers = {};

function showLoader() { document.getElementById('fullLoader').classList.remove('hidden'); document.getElementById('fullLoader').classList.remove('fade-out'); }
function hideLoader() { const l = document.getElementById('fullLoader'); l.classList.add('fade-out'); setTimeout(() => l.classList.add('hidden'), 400); }
function showError(m) { document.getElementById('errorMsg').textContent = m; }
function clearError() { document.getElementById('errorMsg').textContent = ''; }

async function adminLogin() {
  const password = document.getElementById('adminPassword').value;
  clearError();
  if (!password) { showError('رمز عبور را وارد کنید'); return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'در حال ورود...';

  try {
    const r = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'admin_login', password })
    });
    const data = await r.json();
    if (data.success && data.token) {
      document.getElementById('loginBox').classList.add('hidden');
      showLoader();
      startJitsi(data.token);
    } else {
      showError(data.error || 'رمز اشتباه است');
      btn.disabled = false; btn.textContent = 'ورود به اتاق مشاوره';
    }
  } catch (e) {
    showError('خطای ارتباط: ' + e.message);
    btn.disabled = false; btn.textContent = 'ورود به اتاق مشاوره';
  }
}

function startJitsi(token) {
  const options = {
    roomName: ROOM_NAME,
    width: "100%", height: "100%",
    parentNode: document.getElementById("meet"),
    jwt: token,
    lang: 'fa',
    configOverwrite: {
      startWithAudioMuted: false,
      startWithVideoMuted: false,
      prejoinConfig: { enabled: false },
      // ⬇️ تنظیمات layout درست
      toolbar: { alwaysVisible: true, timeout: 0, autoHideWhileChatIsOpen: false },
      filmstrip: { disableStageFilmstrip: false, verticalView: false },
      tileView: { numberOfVisibleTiles: 4 },
      // ⬇️ Lobby
      lobby: { autoKnock: false, enableChat: false },
      enableLobby: true,
      // ⬇️ تنظیمات پایداری
      p2p: { enabled: false },
      disableAudioLevels: true,
      enableAdaptiveMode: true,
      preferredCodec: 'VP8',
      videoQuality: { maxHeight: 480 },
      disableDeepLinking: true,
      enableWelcomePage: false,
      enableClosePage: false,
      notifications: [],
      disablePolls: true,
      disableReactions: true
    },
    interfaceConfigOverwrite: {
      TOOLBAR_ALWAYS_VISIBLE: true,
      TOOLBAR_TIMEOUT: 999999,
      SHOW_JITSI_WATERMARK: false,
      SHOW_WATERMARK_FOR_GUESTS: false,
      SHOW_BRAND_WATERMARK: false,
      MOBILE_APP_PROMO: false,
      DISABLE_JOIN_LEAVE_NOTIFICATIONS: true,
      VERTICAL_FILMSTRIP: false,
      DEFAULT_BACKGROUND: "#0f172a"
    }
  };

  jitsiApi = new JitsiMeetExternalAPI("8x8.vc", options);

  // مخفی کردن لودر بلافاصله با تایم پشتیبان
  setTimeout(() => {
    hideLoader();
    document.getElementById('meet').classList.remove('hidden');
    document.getElementById('panelToggle').classList.add('show');
  }, 1500);

  jitsiApi.addEventListener('videoConferenceJoined', () => {
    hideLoader();
    document.getElementById('meet').classList.remove('hidden');
    document.getElementById('panelToggle').classList.add('show');
    // فعال‌سازی Lobby بعد از ورود
    setTimeout(() => {
      try {
        jitsiApi.executeCommand('toggleLobby', true);
        addEvent('admit', 'اتاق انتظار فعال شد');
      } catch(e) { console.log('toggleLobby error:', e); }
    }, 1000);
  });

  jitsiApi.addEventListener('knockingParticipant', (e) => {
    console.log('Knocking:', e);
    const id = e.id || (e.participant && e.participant.id);
    const name = e.name || (e.participant && e.participant.name) || 'کاربر ناشناس';
    if (id) {
      addJoinRequest(id, name);
      if (!panelOpen) togglePanel();
    }
  });

  jitsiApi.addEventListener('participantJoined', (e) => {
    addEvent('join', `«${e.displayName || 'کاربر'}» وارد اتاق شد`);
    addUser(e.id, e.displayName || 'کاربر', false);
    removeRequest(e.id);
  });

  jitsiApi.addEventListener('participantLeft', (e) => {
    addEvent('leave', `«${e.displayName || 'کاربر'}» اتاق را ترک کرد`);
    removeUser(e.id);
  });

  jitsiApi.addEventListener('readyToClose', () => {
    if (jitsiApi) { try { jitsiApi.executeCommand('hangup'); } catch {} }
    setTimeout(() => window.location.reload(), 500);
  });
}

function togglePanel() {
  panelOpen = !panelOpen;
  document.getElementById('adminPanel').classList.toggle('open', panelOpen);
  if (panelOpen) document.getElementById('notifDot').classList.remove('show');
}
function switchTab(name, btn) {
  document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

function addJoinRequest(id, name) {
  pendingRequests[id] = name;
  document.getElementById('reqEmpty').style.display = 'none';
  const el = document.createElement('div');
  el.className = 'req-item'; el.id = 'req-' + id;
  el.innerHTML = `<div class="name">${name}</div>
    <div class="req-actions">
      <button class="btn-admit" onclick="admitUser('${id}')">✓ اجازه ورود</button>
      <button class="btn-reject" onclick="rejectUser('${id}')">✕ رد کردن</button>
    </div>`;
  document.getElementById('reqList').appendChild(el);
  updateReqBadge();
  document.getElementById('notifDot').classList.add('show');
}
function removeRequest(id) {
  delete pendingRequests[id];
  const el = document.getElementById('req-' + id); if (el) el.remove();
  updateReqBadge();
  if (!Object.keys(pendingRequests).length) document.getElementById('reqEmpty').style.display = 'block';
}
function updateReqBadge() {
  const c = Object.keys(pendingRequests).length;
  const b = document.getElementById('reqBadge');
  b.textContent = c; b.classList.toggle('show', c > 0);
}
function admitUser(id) {
  if (!jitsiApi) return;
  try {
    jitsiApi.executeCommand('answerKnockingParticipant', id, true);
    addEvent('admit', `اجازه ورود به «${pendingRequests[id] || 'کاربر'}»`);
    removeRequest(id);
  } catch (e) { alert('خطا: ' + e.message); }
}
function rejectUser(id) {
  if (!jitsiApi) return;
  try {
    jitsiApi.executeCommand('answerKnockingParticipant', id, false);
    addEvent('reject', `رد درخواست «${pendingRequests[id] || 'کاربر'}»`);
    removeRequest(id);
  } catch {}
}

function addUser(id, name, isMod) {
  activeUsers[id] = { name, isMod };
  document.getElementById('usersEmpty').style.display = 'none';
  const old = document.getElementById('user-' + id); if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'user-item'; el.id = 'user-' + id;
  el.innerHTML = `<div class="user-name">${isMod ? '👑 ' : ''}${name}</div>
    ${!isMod ? `<button class="btn-kick" onclick="kickUser('${id}')">اخراج</button>` : ''}`;
  document.getElementById('usersList').appendChild(el);
  updateUserBadge();
}
function removeUser(id) {
  delete activeUsers[id];
  const el = document.getElementById('user-' + id); if (el) el.remove();
  updateUserBadge();
  if (!Object.keys(activeUsers).length) document.getElementById('usersEmpty').style.display = 'block';
}
function updateUserBadge() {
  const c = Object.keys(activeUsers).length;
  const b = document.getElementById('userBadge');
  b.textContent = c; b.classList.toggle('show', c > 0);
}
function kickUser(id) {
  if (!jitsiApi) return;
  if (!confirm('اخراج این کاربر؟')) return;
  try {
    jitsiApi.executeCommand('kickParticipant', id);
    addEvent('kick', `«${activeUsers[id]?.name || 'کاربر'}» اخراج شد`);
  } catch (e) { console.error(e); }
}
function kickAllUsers() {
  if (!jitsiApi) return;
  const guests = Object.keys(activeUsers).filter(id => !activeUsers[id].isMod);
  if (guests.length === 0) { alert('کاربری برای اخراج وجود ندارد'); return; }
  if (!confirm(`اخراج ${guests.length} کاربر از جلسه؟`)) return;
  guests.forEach(id => {
    try { jitsiApi.executeCommand('kickParticipant', id); } catch {}
  });
  addEvent('kick', `${guests.length} کاربر اخراج شدند`);
}

function addEvent(type, text) {
  const list = document.getElementById('eventsList');
  const empty = list.querySelector('.empty-msg'); if (empty) empty.remove();
  const time = new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const el = document.createElement('div');
  el.className = 'event-item ' + type;
  el.innerHTML = `<span class="event-time">${time}</span><span class="event-text">${text}</span>`;
  list.insertBefore(el, list.firstChild);
  while (list.children.length > 50) list.removeChild(list.lastChild);
}

document.getElementById('adminPassword').addEventListener('keypress', e => {
  if (e.key === 'Enter') adminLogin();
});
window.addEventListener('load', () => document.getElementById('adminPassword').focus());
</script>
</body>
</html>
