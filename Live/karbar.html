 <!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ورود به اتاق مشاوره</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior: none; }
body { font-family: Tahoma, sans-serif; background: #f0f4f8; color: #1a365d; overflow: hidden; min-height: 100vh; }

#fullLoader { position: fixed; inset: 0; background: radial-gradient(circle at 50% 50%, #e2e8f0 0%, #f0f4f8 70%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; gap: 40px; overflow: hidden; transition: opacity 0.4s; }
#fullLoader.fade-out { opacity: 0; pointer-events: none; }
#fullLoader::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(37,99,235,0.15) 0%, transparent 60%); animation: bgPulse 3s ease-in-out infinite; }
@keyframes bgPulse { 0%,100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.3); opacity: 1; } }
.loader-ring { position: absolute; width: 180px; height: 180px; border-radius: 50%; border: 2px solid transparent; border-top-color: #2563eb; border-right-color: #3b82f6; animation: ringSpin 2s linear infinite; }
.loader-ring-2 { position: absolute; width: 220px; height: 220px; border-radius: 50%; border: 2px solid transparent; border-bottom-color: #10b981; border-left-color: #059669; animation: ringSpin 3s linear infinite reverse; }
.loader-ring-3 { position: absolute; width: 260px; height: 260px; border-radius: 50%; border: 1px solid transparent; border-top-color: rgba(245,158,11,0.5); border-right-color: rgba(245,158,11,0.5); animation: ringSpin 4s linear infinite; }
@keyframes ringSpin { to { transform: rotate(360deg); } }
.rubik-loader { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 7px; width: 110px; height: 110px; perspective: 600px; transform-style: preserve-3d; animation: rubikSpin 3s ease-in-out infinite; z-index: 2; }
.rubik-loader .cube { border-radius: 7px; box-shadow: 0 6px 16px rgba(0,0,0,0.3); animation: cubePulse 1.4s ease-in-out infinite; }
.rubik-loader .cube:nth-child(1) { background: linear-gradient(135deg, #dc2626, #991b1b); animation-delay: 0s; }
.rubik-loader .cube:nth-child(2) { background: linear-gradient(135deg, #f59e0b, #b45309); animation-delay: 0.1s; }
.rubik-loader .cube:nth-child(3) { background: linear-gradient(135deg, #fbbf24, #d97706); animation-delay: 0.2s; }
.rubik-loader .cube:nth-child(4) { background: linear-gradient(135deg, #2563eb, #1e40af); animation-delay: 0.3s; }
.rubik-loader .cube:nth-child(5) { background: linear-gradient(135deg, #10b981, #047857); animation-delay: 0.4s; }
.rubik-loader .cube:nth-child(6) { background: linear-gradient(135deg, #dc2626, #991b1b); animation-delay: 0.5s; }
.rubik-loader .cube:nth-child(7) { background: linear-gradient(135deg, #f1f5f9, #cbd5e1); animation-delay: 0.6s; }
.rubik-loader .cube:nth-child(8) { background: linear-gradient(135deg, #10b981, #047857); animation-delay: 0.7s; }
.rubik-loader .cube:nth-child(9) { background: linear-gradient(135deg, #f59e0b, #b45309); animation-delay: 0.8s; }
@keyframes rubikSpin { 0%,100% { transform: rotateY(0deg) rotateX(0deg); } 25% { transform: rotateY(90deg) rotateX(15deg); } 50% { transform: rotateY(180deg) rotateX(0deg); } 75% { transform: rotateY(270deg) rotateX(-15deg); } }
@keyframes cubePulse { 0%,100% { transform: scale(1); } 50% { transform: scale(0.85); } }
.loader-content { text-align: center; z-index: 2; }
.loader-text { color: #1e40af; font-size: 19px; font-weight: bold; margin-bottom: 8px; background: linear-gradient(90deg, #2563eb, #7c3aed, #2563eb); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; background-size: 200% auto; animation: gradientMove 2s linear infinite; }
@keyframes gradientMove { to { background-position: 200% center; } }
.loader-subtext { color: #64748b; font-size: 13px; margin-bottom: 16px; }
.loader-dots { display: flex; justify-content: center; gap: 8px; }
.loader-dots span { width: 8px; height: 8px; border-radius: 50%; background: #2563eb; animation: dotBounce 1.4s ease-in-out infinite; }
.loader-dots span:nth-child(1) { animation-delay: 0s; }
.loader-dots span:nth-child(2) { animation-delay: 0.2s; }
.loader-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotBounce { 0%,80%,100% { transform: scale(0.6); opacity: 0.5; } 40% { transform: scale(1.3); opacity: 1; } }

#loginBox { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; padding: 20px; z-index: 100; }
.box { background: #fff; padding: 40px 30px; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 420px; border: 1px solid #e2e8f0; }
h1 { margin-bottom: 8px; font-size: 22px; color: #1e40af; }
.subtitle { color: #64748b; font-size: 14px; margin-bottom: 24px; line-height: 1.6; }
input { width: 100%; padding: 14px 16px; margin-bottom: 16px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 16px; font-family: inherit; text-align: center; background: #f8fafc; }
input:focus { outline: none; border-color: #2563eb; background: #fff; }
button { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: bold; font-family: inherit; min-height: 50px; transition: 0.2s; }
button:hover:not(:disabled) { background: #1d4ed8; }
button:disabled { opacity: 0.7; cursor: not-allowed; }
.error { color: #dc2626; margin-top: 14px; font-size: 14px; min-height: 20px; line-height: 1.6; }

#meet { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 50; }
#meet iframe { width: 100% !important; height: 100% !important; border: 0; }

.hidden { display: none !important; }
</style>
</head>
<body>

<div id="fullLoader" class="hidden">
  <div class="loader-ring"></div>
  <div class="loader-ring-2"></div>
  <div class="loader-ring-3"></div>
  <div class="rubik-loader">
    <div class="cube"></div><div class="cube"></div><div class="cube"></div>
    <div class="cube"></div><div class="cube"></div><div class="cube"></div>
    <div class="cube"></div><div class="cube"></div><div class="cube"></div>
  </div>
  <div class="loader-content">
    <p class="loader-text">در حال اتصال به اتاق مشاوره...</p>
    <p class="loader-subtext">لطفاً چند لحظه صبر کنید</p>
    <div class="loader-dots"><span></span><span></span><span></span></div>
  </div>
</div>

<div id="loginBox">
  <div class="box">
    <h1>📞 ورود به اتاق مشاوره</h1>
    <p class="subtitle">لطفاً نام خود را وارد کنید و روی دکمه ورود بزنید</p>
    <input type="text" id="guestName" placeholder="نام و نام خانوادگی" maxlength="50">
    <button id="loginBtn" onclick="guestLogin()">ورود به جلسه</button>
    <p class="error" id="errorMsg"></p>
  </div>
</div>

<div id="meet" class="hidden"></div>

<script src="https://8x8.vc/vpaas-magic-cookie-9e86f3c71b2d4fe287d643cfae775d17/external_api.js"></script>
<script>
const SCRIPT_URL = "https://moshverat-api.aboalidadgostar.workers.dev/";
const APP_ID = "vpaas-magic-cookie-9e86f3c71b2d4fe287d643cfae775d17";
const ROOM_NAME = APP_ID + "/taali-andishe-va-roshd";

let jitsiApi = null;

// شناسه پایدار کاربر
function getVisitorId() {
  let id = localStorage.getItem('visitor_id');
  if (!id) {
    id = 'visitor-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('visitor_id', id);
  }
  return id;
}
const VISITOR_ID = getVisitorId();

const savedName = localStorage.getItem('visitor_name');
if (savedName) document.getElementById('guestName').value = savedName;

function showLoader() { 
  const l = document.getElementById('fullLoader');
  l.classList.remove('hidden'); l.classList.remove('fade-out'); 
}
function hideLoader() { 
  const l = document.getElementById('fullLoader');
  l.classList.add('fade-out');
  setTimeout(() => l.classList.add('hidden'), 400);
}
function showError(m) { document.getElementById('errorMsg').textContent = m; }
function clearError() { document.getElementById('errorMsg').textContent = ''; }

async function guestLogin() {
  const userName = document.getElementById('guestName').value.trim();
  clearError();
  if (!userName) { showError('لطفاً نام خود را وارد کنید'); return; }
  if (userName.length < 2) { showError('نام باید حداقل ۲ حرف باشد'); return; }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'در حال بررسی...';

  try {
    const r = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'guest_login', userName, visitorId: VISITOR_ID })
    });
    const data = await r.json();

    if (data.success && data.token) {
      localStorage.setItem('visitor_name', userName);
      document.getElementById('loginBox').classList.add('hidden');
      showLoader();
      startJitsi(data.token, userName);
    } else {
      showError(data.error || 'خطا در ورود به جلسه');
      btn.disabled = false; btn.textContent = 'ورود به جلسه';
    }
  } catch (e) {
    showError('خطای ارتباط: ' + e.message);
    btn.disabled = false; btn.textContent = 'ورود به جلسه';
  }
}

function startJitsi(token, userName) {
  // پاکسازی اتاق قبلی
  document.getElementById('meet').innerHTML = '';

  const options = {
    roomName: ROOM_NAME,
    width: "100%", height: "100%",
    parentNode: document.getElementById("meet"),
    jwt: token,
    lang: 'fa',
    userInfo: { displayName: userName },

    // ⬇️⬇️⬇️ کدک در سطح بالا (اصلاح شده) ⬇️⬇️⬇️
    preferredCodec: 'VP8',

    configOverwrite: {
      startWithAudioMuted: true,
      startWithVideoMuted: true,
      prejoinConfig: { enabled: false },

      // نوار ابزار همیشه
      toolbar: { alwaysVisible: true, timeout: 0, autoHideWhileChatIsOpen: false },

      // اتاق انتظار
      lobby: { autoKnock: false, enableChat: true },
      enableLobby: true,

      // ⬇️⬇️⬇️ پایداری و سرعت (اصلاح‌شده) ⬇️⬇️⬇️
      constraints: {
        video: {
          height: { ideal: 480, max: 480, min: 240 },
          frameRate: { ideal: 20, max: 25 }
        }
      },
      p2p: { enabled: false },
      enableAdaptiveMode: true,      // تطبیق خودکار کیفیت
      enableLayerSuspension: true,   // تعلیق لایه‌های بی‌استفاده
      channelLastN: 2,               // فقط ۲ ویدیو (مدیر + خودش)
      startBitrate: 'low',           // شروع با بیت‌ریت پایین
      // ⬆️⬆️⬆️

      disableDeepLinking: true,
      enableWelcomePage: false,
      enableClosePage: false,
      notifications: [],
      disablePolls: true,
      disableReactions: true
    },
    interfaceConfigOverwrite: {
      TOOLBAR_ALWAYS_VISIBLE: true,
      TOOLBAR_TIMEOUT: 999999,
      SHOW_JITSI_WATERMARK: false,
      SHOW_WATERMARK_FOR_GUESTS: false,
      SHOW_BRAND_WATERMARK: false,
      MOBILE_APP_PROMO: false,
      DISABLE_JOIN_LEAVE_NOTIFICATIONS: true,
      VERTICAL_FILMSTRIP: false,
      DEFAULT_BACKGROUND: "#1a365d"
    }
  };

  jitsiApi = new JitsiMeetExternalAPI("8x8.vc", options);

  jitsiApi.addEventListener('videoConferenceJoined', () => {
    hideLoader();
    document.getElementById('meet').classList.remove('hidden');
  });

  // پشتیبان: بعد از ۲.۵ ثانیه لودر رو مخفی کن
  setTimeout(() => {
    hideLoader();
    document.getElementById('meet').classList.remove('hidden');
  }, 2500);

  // ⬇️⬇️⬇️ خروج بدون رفرش (اصلاح صفحه سفید) ⬇️⬇️⬇️
  jitsiApi.addEventListener('readyToClose', () => {
    try { jitsiApi.dispose(); } catch(e) {}
    jitsiApi = null;
    document.getElementById('meet').innerHTML = '';
    document.getElementById('meet').classList.add('hidden');
    document.getElementById('loginBox').classList.remove('hidden');
    hideLoader();
    const btn = document.getElementById('loginBtn');
    btn.disabled = false;
    btn.textContent = 'ورود به جلسه';
  });
}

document.getElementById('guestName').addEventListener('keypress', e => {
  if (e.key === 'Enter') guestLogin();
});
window.addEventListener('load', () => document.getElementById('guestName').focus());
</script>
</body>
</html>
