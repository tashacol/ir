<!DOCTYPE html> 
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود مدیر</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Tahoma, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .box { background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); text-align: center; width: 90%; max-width: 400px; }
    h1 { margin-bottom: 20px; font-size: 24px; }
    input { width: 100%; padding: 14px; margin-bottom: 16px; border: 2px solid #334155; border-radius: 8px; background: #0f172a; color: #fff; font-size: 16px; }
    button { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
    button:hover { background: #1d4ed8; }
    .error { color: #f87171; margin-top: 12px; font-size: 14px; }
    .hidden { display: none; }
    #meet { width: 100%; height: 100vh; position: fixed; top: 0; left: 0; }
  </style>
</head>
<body>
  <div class="box" id="loginBox">
    <h1>🔐 ورود مدیر</h1>
    <input type="password" id="adminPassword" placeholder="رمز عبور">
    <button onclick="adminLogin()">ورود به اتاق مشاوره</button>
    <p class="error" id="errorMsg"></p>
  </div>
  <div id="meet" class="hidden"></div>

  <script src="https://8x8.vc/external_api.js"></script>
  <script>
    const SCRIPT_URL = "https://moshverat-api.aboalid...workers.dev";

    async function adminLogin() {
      const password = document.getElementById('adminPassword').value;
      const errorMsg = document.getElementById('errorMsg');
      if (!password) { errorMsg.textContent = "رمز را وارد کنید"; return; }

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'admin_login', password: password })
        });
        const data = await response.json();

        if (data.success) {
          document.getElementById('loginBox').classList.add('hidden');
          document.getElementById('meet').classList.remove('hidden');
          startJitsi(data.token);
        } else {
          errorMsg.textContent = data.error || "خطا";
        }
      } catch (err) {
        errorMsg.textContent = "خطای ارتباط: " + err.message;
      }
    }

    function startJitsi(token) {
      const options = {
        roomName: "taali-andishe-va-roshd",
        width: "100%",
        height: "100%",
        parentNode: document.getElementById("meet"),
        jwt: token,
        configOverwrite: {
          startWithAudioMuted: false,
          startWithVideoMuted: false,
          prejoinConfig: { enabled: true }
        }
      };
      const api = new JitsiMeetExternalAPI("8x8.vc", options);
      api.addEventListener('videoConferenceJoined', () => {
        api.executeCommand('toggleLobby', true);
      });
    }

    document.getElementById('adminPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') adminLogin();
    });
  </script>
</body>
</html>
