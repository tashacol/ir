 <!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ورود مدیر</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior: none; touch-action: manipulation; }
body { font-family: Tahoma, sans-serif; background: #0f172a; color: #e2e8f0; overflow: hidden; min-height: 100vh; }

/* ===== لودینگ حرفه‌ای ===== */
#fullLoader { position: fixed; inset: 0; background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 70%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; gap: 40px; overflow: hidden; }
#fullLoader::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(37,99,235,0.15) 0%, transparent 60%); animation: bgPulse 3s ease-in-out infinite; }
@keyframes bgPulse { 0%,100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.3); opacity: 1; } }

.loader-ring { position: absolute; width: 180px; height: 180px; border-radius: 50%; border: 2px solid transparent; border-top-color: #2563eb; border-right-color: #3b82f6; animation: ringSpin 2s linear infinite; }
.loader-ring-2 { position: absolute; width: 220px; height: 220px; border-radius: 50%; border: 2px solid transparent; border-bottom-color: #10b981; border-left-color: #059669; animation: ringSpin 3s linear infinite reverse; }
.loader-ring-3 { position: absolute; width: 260px; height: 260px; border-radius: 50%; border: 1px solid transparent; border-top-color: rgba(245,158,11,0.5); border-right-color: rgba(245,158,11,0.5); animation: ringSpin 4s linear infinite; }
@keyframes ringSpin { to { transform: rotate(360deg); } }

.rubik-loader { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 7px; width: 110px; height: 110px; perspective: 600px; transform-style: preserve-3d; animation: rubikSpin 3s ease-in-out infinite; z-index: 2; }
.rubik-loader .cube { border-radius: 7px; box-shadow: 0 6px 16px rgba(0,0,0,0.6), inset 0 -4px 0 rgba(0,0,0,0.3); animation: cubePulse 1.4s ease-in-out infinite; }
.rubik-loader .cube:nth-child(1) { background: linear-gradient(135deg, #dc2626, #991b1b); animation-delay: 0s; }
.rubik-loader .cube:nth-child(2) { background: linear-gradient(135deg, #f59e0b, #b45309); animation-delay: 0.1s; }
.rubik-loader .cube:nth-child(3) { background: linear-gradient(135deg, #fbbf24, #d97706); animation-delay: 0.2s; }
.rubik-loader .cube:nth-child(4) { background: linear-gradient(135deg, #2563eb, #1e40af); animation-delay: 0.3s; }
.rubik-loader .cube:nth-child(5) { background: linear-gradient(135deg, #10b981, #047857); animation-delay: 0.4s; }
.rubik-loader .cube:nth-child(6) { background: linear-gradient(135deg, #dc2626, #991b1b); animation-delay: 0.5s; }
.rubik-loader .cube:nth-child(7) { background: linear-gradient(135deg, #f1f5f9, #cbd5e1); animation-delay: 0.6s; }
.rubik-loader .cube:nth-child(8) { background: linear-gradient(135deg, #10b981, #047857); animation-delay: 0.7s; }
.rubik-loader .cube:nth-child(9) { background: linear-gradient(135deg, #f59e0b, #b45309); animation-delay: 0.8s; }
@keyframes rubikSpin { 0%,100% { transform: rotateY(0deg) rotateX(0deg); } 25% { transform: rotateY(90deg) rotateX(15deg); } 50% { transform: rotateY(180deg) rotateX(0deg); } 75% { transform: rotateY(270deg) rotateX(-15deg); } }
@keyframes cubePulse { 0%,100% { transform: scale(1); } 50% { transform: scale(0.85); } }

.loader-content { text-align: center; z-index: 2; }
.loader-text { color: #f1f5f9; font-size: 19px; font-weight: bold; letter-spacing: 0.5px; margin-bottom: 8px; background: linear-gradient(90deg, #60a5fa, #a78bfa, #60a5fa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; background-size: 200% auto; animation: gradientMove 2s linear infinite; }
@keyframes gradientMove { to { background-position: 200% center; } }
.loader-subtext { color: #94a3b8; font-size: 13px; margin-bottom: 16px; }
.loader-dots { display: flex; justify-content: center; gap: 8px; }
.loader-dots span { width: 8px; height: 8px; border-radius: 50%; background: #2563eb; animation: dotBounce 1.4s ease-in-out infinite; }
.loader-dots span:nth-child(1) { animation-delay: 0s; }
.loader-dots span:nth-child(2) { animation-delay: 0.2s; }
.loader-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotBounce { 0%,80%,100% { transform: scale(0.6); opacity: 0.5; } 40% { transform: scale(1.3); opacity: 1; } }

/* ===== صفحه ورود ===== */
#loginBox { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; padding: 20px; }
.box { background: #1e293b; padding: 40px 30px; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; width: 100%; max-width: 420px; border: 1px solid #334155; }
h1 { margin-bottom: 8px; font-size: 22px; color: #f1f5f9; }
.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
input { width: 100%; padding: 14px 16px; margin-bottom: 16px; border: 2px solid #334155; border-radius: 10px; background: #0f172a; color: #fff; font-size: 16px; font-family: inherit; text-align: center; }
input:focus { outline: none; border-color: #2563eb; }
.btn-login { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: bold; font-family: inherit; transition: 0.2s; min-height: 50px; }
.btn-login:hover:not(:disabled) { background: #1d4ed8; }
.btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
.error { color: #f87171; margin-top: 14px; font-size: 14px; min-height: 20px; }

/* ===== Jitsi Container ===== */
#meet { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 50; }
#meet iframe { width: 100% !important; height: 100% !important; }

/* ===== نوار ابزار اختصاصی ===== */
#customToolbar { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; padding: 10px 14px; background: rgba(15,23,42,0.95); border: 1px solid #334155; border-radius: 50px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); z-index: 600; backdrop-filter: blur(10px); transition: opacity 0.3s, transform 0.3s; }
#customToolbar.hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(100px); }

.tool-btn { width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; transition: all 0.2s; color: #fff; background: #334155; position: relative; }
.tool-btn:hover { transform: scale(1.1); }
.tool-btn:active { transform: scale(0.95); }
.tool-btn.active { background: #10b981; }
.tool-btn.muted { background: #dc2626; }
.tool-btn.exit-btn { background: #dc2626; }
.tool-btn.exit-btn:hover { background: #b91c1c; }
.tool-btn svg { width: 22px; height: 22px; fill: currentColor; }
.tool-btn.mic-off svg.line, .tool-btn.cam-off svg.line { display: none; }
.tool-btn.mic-on svg.line, .tool-btn.cam-on svg.line { display: block; }

/* ===== دکمه پنل مدیریت ===== */
#panelToggle { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 50%; background: #f59e0b; border: 2px solid #fff; color: #fff; font-size: 24px; cursor: pointer; z-index: 601; display: none; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.2s; }
#panelToggle.show { display: flex; }
#panelToggle:hover { transform: scale(1.1); }
#panelToggle .notif-dot { position: absolute; top: 0; left: 0; width: 16px; height: 16px; background: #dc2626; border-radius: 50%; border: 2px solid #fff; display: none; animation: pulse 1s infinite; }
#panelToggle .notif-dot.show { display: block; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.3); } }

/* ===== پنل مدیریت ===== */
#adminPanel { position: fixed; top: 0; right: 0; width: 340px; height: 100vh; background: #0f172a; border-left: 1px solid #334155; z-index: 700; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s ease; box-shadow: -4px 0 20px rgba(0,0,0,0.5); }
#adminPanel.open { transform: translateX(0); }
.panel-header { padding: 16px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
.panel-header h2 { font-size: 16px; color: #f1f5f9; }
.panel-close { background: transparent; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; padding: 0 8px; }
.panel-tabs { display: flex; background: #1e293b; border-bottom: 1px solid #334155; }
.panel-tab { flex: 1; padding: 12px 8px; background: transparent; border: none; color: #94a3b8; cursor: pointer; font-size: 13px; font-family: inherit; border-bottom: 2px solid transparent; position: relative; }
.panel-tab.active { color: #2563eb; border-bottom-color: #2563eb; }
.panel-tab .badge { position: absolute; top: 6px; left: 6px; background: #dc2626; color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 10px; display: none; }
.panel-tab .badge.show { display: inline-block; }
.panel-body { flex: 1; overflow-y: auto; padding: 12px; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.empty-msg { text-align: center; color: #64748b; font-size: 13px; padding: 40px 20px; }

.req-item { background: #1e293b; border: 1px solid #f59e0b; border-radius: 10px; padding: 12px; margin-bottom: 10px; animation: slideIn 0.3s; }
@keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
.req-item .name { color: #fbbf24; font-weight: bold; font-size: 14px; margin-bottom: 10px; }
.req-actions { display: flex; gap: 8px; }
.req-actions button { flex: 1; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: bold; }
.btn-admit { background: #10b981; color: #fff; }
.btn-reject { background: #dc2626; color: #fff; }

.user-item { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.user-item .user-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.user-item .avatar { width: 36px; height: 36px; border-radius: 50%; background: #2563eb; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 14px; }
.user-item .avatar.moderator { background: #f59e0b; }
.user-item .user-name { color: #e2e8f0; font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-item .user-role { color: #94a3b8; font-size: 11px; }
.user-item .btn-kick { background: transparent; border: 1px solid #dc2626; color: #dc2626; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-family: inherit; }

.event-item { background: #1e293b; border-right: 3px solid #334155; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; font-size: 12px; }
.event-item.join { border-right-color: #10b981; }
.event-item.leave { border-right-color: #64748b; }
.event-item.kick { border-right-color: #dc2626; }
.event-item.admit { border-right-color: #2563eb; }
.event-item.reject { border-right-color: #f59e0b; }
.event-item .event-time { color: #64748b; font-size: 10px; display: block; margin-bottom: 4px; }
.event-item .event-text { color: #cbd5e1; }

@media (max-width: 768px) {
  #adminPanel { width: 100%; }
  .tool-btn { width: 44px; height: 44px; }
}
.hidden { display: none !important; }
</style>
</head>
<body>

<!-- لودینگ -->
<div id="fullLoader" class="hidden">
  <div class="loader-ring"></div>
  <div class="loader-ring-2"></div>
  <div class="loader-ring-3"></div>
  <div class="rubik-loader">
    <div class="cube"></div><div class="cube"></div><div class="cube"></div>
    <div class="cube"></div><div class="cube"></div><div class="cube"></div>
    <div class="cube"></div><div class="cube"></div><div class="cube"></div>
  </div>
  <div class="loader-content">
    <p class="loader-text">در حال اتصال به اتاق مشاوره...</p>
    <p class="loader-subtext">لطفاً چند لحظه صبر کنید</p>
    <div class="loader-dots"><span></span><span></span><span></span></div>
  </div>
</div>

<!-- ورود -->
<div id="loginBox">
  <div class="box">
    <h1>🔐 ورود مدیر</h1>
    <p class="subtitle">برای ورود، رمز عبور خود را وارد کنید</p>
    <input type="password" id="adminPassword" placeholder="رمز عبور" autocomplete="current-password">
    <button class="btn-login" id="loginBtn" onclick="adminLogin()">ورود به اتاق مشاوره</button>
    <p class="error" id="errorMsg"></p>
  </div>
</div>

<!-- Jitsi -->
<div id="meet" class="hidden"></div>

<!-- نوار ابزار اختصاصی -->
<div id="customToolbar" class="hidden">
  <button class="tool-btn mic-btn mic-on" id="micBtn" onclick="toggleMic()" title="میکروفون">
    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/><line class="line" x1="3" y1="3" x2="21" y2="21" stroke="#fff" stroke-width="2.5"/></svg>
  </button>
  <button class="tool-btn cam-btn cam-on" id="camBtn" onclick="toggleCam()" title="دوربین">
    <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/><line class="line" x1="3" y1="3" x2="21" y2="21" stroke="#fff" stroke-width="2.5"/></svg>
  </button>
  <button class="tool-btn" id="chatBtn" onclick="toggleChat()" title="چت">
    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
  </button>
  <button class="tool-btn" id="participantsBtn" onclick="toggleParticipants()" title="شرکت‌کنندگان">
    <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
  </button>
  <button class="tool-btn exit-btn" onclick="confirmExit()" title="خروج">
    <svg viewBox="0 0 24 24"><path d="M12 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm0-4C7.58 5 3.86 7.79 2.32 11.73c-.14.36-.14.75 0 1.11C3.86 16.79 7.58 19 12 19s8.14-2.21 9.68-6.16c.14-.36.14-.75 0-1.11C20.14 7.79 16.42 5 12 5zm0 12c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z" transform="rotate(135 12 12)"/><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
  </button>
</div>

<!-- دکمه پنل مدیریت -->
<button id="panelToggle" onclick="togglePanel()" title="پنل مدیریت">⚙️<span class="notif-dot" id="notifDot"></span></button>

<!-- پنل مدیریت -->
<div id="adminPanel">
  <div class="panel-header"><h2>🎛️ پنل مدیریت</h2><button class="panel-close" onclick="togglePanel()">✕</button></div>
  <div class="panel-tabs">
    <button class="panel-tab active" onclick="switchTab('requests', this)">درخواست‌ها <span class="badge" id="reqBadge">0</span></button>
    <button class="panel-tab" onclick="switchTab('users', this)">حاضرین <span class="badge" id="userBadge">0</span></button>
    <button class="panel-tab" onclick="switchTab('events', this)">رویدادها</button>
  </div>
  <div class="panel-body">
    <div class="tab-content active" id="tab-requests"><div class="empty-msg" id="reqEmpty">🔕<br>هیچ درخواست ورودی وجود ندارد</div><div id="reqList"></div></div>
    <div class="tab-content" id="tab-users"><div class="empty-msg" id="usersEmpty">👤<br>هنوز کسی در اتاق نیست</div><div id="usersList"></div></div>
    <div class="tab-content" id="tab-events"><div id="eventsList"><div class="empty-msg">📋<br>رویدادی ثبت نشده</div></div></div>
  </div>
</div>

<script src="https://8x8.vc/vpaas-magic-cookie-9e86f3c71b2d4fe287d643cfae775d17/external_api.js"></script>
<script>
const SCRIPT_URL = "https://moshverat-api.aboalidadgostar.workers.dev/";
const APP_ID = "vpaas-magic-cookie-9e86f3c71b2d4fe287d643cfae775d17";
const ROOM_NAME = APP_ID + "/taali-andishe-va-roshd";

let jitsiApi = null;
let panelOpen = false;
let heartbeatInterval = null;
let isMicOn = true;
let isCamOn = true;
const pendingRequests = {};
const activeUsers = {};

// ==========================================
// Visitor ID (حفظ نشست)
// ==========================================
function getVisitorId() {
  let id = localStorage.getItem('visitor_id');
  if (!id) {
    id = 'visitor-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('visitor_id', id);
  }
  return id;
}
const VISITOR_ID = getVisitorId();

// ==========================================
// UI Helpers
// ==========================================
function showFullLoader() { document.getElementById('fullLoader').classList.remove('hidden'); }
function hideFullLoader() { document.getElementById('fullLoader').classList.add('hidden'); }
function showError(m) { document.getElementById('errorMsg').textContent = m; }
function clearError() { document.getElementById('errorMsg').textContent = ''; }

// ==========================================
// ورود مدیر
// ==========================================
async function adminLogin() {
  const password = document.getElementById('adminPassword').value;
  clearError();
  if (!password) { showError('رمز عبور را وارد کنید'); return; }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = 'در حال ورود...';

  try {
    const r = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'admin_login', password })
    });
    const data = await r.json();

    if (data.success && data.token) {
      document.getElementById('loginBox').classList.add('hidden');
      showFullLoader();
      startJitsi(data.token);
      startHeartbeat();
    } else {
      showError(data.error || 'رمز اشتباه است');
      btn.disabled = false;
      btn.textContent = 'ورود به اتاق مشاوره';
    }
  } catch (e) {
    showError('خطای ارتباط: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'ورود به اتاق مشاوره';
  }
}

// ==========================================
// Heartbeat برای اطلاع‌دادن آنلاین بودن مدیر
// ==========================================
function startHeartbeat() {
  if (heartbeatInterval) clearInterval(heartbeatInterval);
  const ping = () => fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'admin_heartbeat' })
  }).catch(() => {});
  ping();
  heartbeatInterval = setInterval(ping, 20000);
}

async function stopHeartbeat() {
  if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'admin_logout' })
    });
  } catch {}
}

// ==========================================
// راه‌اندازی Jitsi
// ==========================================
function startJitsi(token) {
  const options = {
    roomName: ROOM_NAME,
    width: "100%", height: "100%",
    parentNode: document.getElementById("meet"),
    jwt: token,
    lang: 'fa',
    configOverwrite: {
      startWithAudioMuted: false,
      startWithVideoMuted: false,
      prejoinConfig: { enabled: false },
      toolbar: { alwaysVisible: true, timeout: 0 },
      disableShortcuts: false,
      hideConferenceSubject: false,
      hideConferenceTimer: false,
      enableWelcomePage: false,
      enableClosePage: false,
      lobby: { autoKnock: false, enableChat: true }
    },
    interfaceConfigOverwrite: {
      TOOLBAR_ALWAYS_VISIBLE: true,
      TOOLBAR_TIMEOUT: 999999,
      SHOW_JITSI_WATERMARK: false,
      SHOW_WATERMARK_FOR_GUESTS: false,
      SHOW_BRAND_WATERMARK: false,
      MOBILE_APP_PROMO: false,
      DISABLE_JOIN_LEAVE_NOTIFICATIONS: true
    }
  };

  jitsiApi = new JitsiMeetExternalAPI("8x8.vc", options);

  jitsiApi.addEventListener('videoConferenceJoined', () => {
    hideFullLoader();
    document.getElementById('meet').classList.remove('hidden');
    document.getElementById('customToolbar').classList.remove('hidden');
    setTimeout(() => {
      document.getElementById('panelToggle').classList.add('show');
      jitsiApi.executeCommand('toggleLobby', true);
      addEvent('admit', 'اتاق انتظار فعال شد');
    }, 500);
  });

  jitsiApi.addEventListener('audioMuteStatusChanged', (e) => updateMicUI(!e.muted));
  jitsiApi.addEventListener('videoMuteStatusChanged', (e) => updateCamUI(!e.muted));

  jitsiApi.addEventListener('knockingParticipant', (e) => {
    const id = e.id || (e.participant && e.participant.id);
    const name = e.name || (e.participant && e.participant.name) || 'کاربر ناشناس';
    if (id) {
      addJoinRequest(id, name);
      if (!panelOpen) togglePanel();
    }
  });

  jitsiApi.addEventListener('participantJoined', (e) => {
    addEvent('join', `«${e.displayName || 'کاربر'}» وارد اتاق شد`);
    addUser(e.id, e.displayName || 'کاربر', false);
    removeRequest(e.id);
  });

  jitsiApi.addEventListener('participantLeft', (e) => {
    addEvent('leave', `«${e.displayName || 'کاربر'}» اتاق را ترک کرد`);
    removeUser(e.id);
  });

  jitsiApi.addEventListener('readyToClose', () => { exitSystem(); });
}

// ==========================================
// کنترل‌های اختصاصی
// ==========================================
function toggleMic() { if (jitsiApi) jitsiApi.executeCommand('toggleAudio'); }
function toggleCam() { if (jitsiApi) jitsiApi.executeCommand('toggleVideo'); }
function toggleChat() { if (jitsiApi) jitsiApi.executeCommand('toggleChat'); }
function toggleParticipants() { if (jitsiApi) jitsiApi.executeCommand('toggleParticipantsPane'); }

function updateMicUI(on) {
  isMicOn = on;
  const btn = document.getElementById('micBtn');
  btn.classList.toggle('mic-on', on);
  btn.classList.toggle('mic-off', !on);
  btn.classList.toggle('active', on);
  btn.classList.toggle('muted', !on);
}
function updateCamUI(on) {
  isCamOn = on;
  const btn = document.getElementById('camBtn');
  btn.classList.toggle('cam-on', on);
  btn.classList.toggle('cam-off', !on);
  btn.classList.toggle('active', on);
  btn.classList.toggle('muted', !on);
}

// ==========================================
// خروج
// ==========================================
function confirmExit() {
  if (confirm('آیا از خروج از اتاق مطمئن هستید؟')) exitSystem();
}
async function exitSystem() {
  await stopHeartbeat();
  if (jitsiApi) {
    try { jitsiApi.executeCommand('hangup'); } catch {}
  }
  setTimeout(() => { window.location.reload(); }, 500);
}

// ==========================================
// پنل مدیریت
// ==========================================
function togglePanel() {
  panelOpen = !panelOpen;
  document.getElementById('adminPanel').classList.toggle('open', panelOpen);
  if (panelOpen) document.getElementById('notifDot').classList.remove('show');
}
function switchTab(name, btn) {
  document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

// ==========================================
// درخواست‌ها
// ==========================================
function addJoinRequest(id, name) {
  pendingRequests[id] = name;
  document.getElementById('reqEmpty').style.display = 'none';
  const el = document.createElement('div');
  el.className = 'req-item'; el.id = 'req-' + id;
  el.innerHTML = `<div class="name">${name}</div>
    <div class="req-actions">
      <button class="btn-admit" onclick="admitUser('${id}')">✓ اجازه ورود</button>
      <button class="btn-reject" onclick="rejectUser('${id}')">✕ رد کردن</button>
    </div>`;
  document.getElementById('reqList').appendChild(el);
  updateReqBadge();
  document.getElementById('notifDot').classList.add('show');
}
function removeRequest(id) {
  delete pendingRequests[id];
  const el = document.getElementById('req-' + id);
  if (el) el.remove();
  updateReqBadge();
  if (!Object.keys(pendingRequests).length) document.getElementById('reqEmpty').style.display = 'block';
}
function updateReqBadge() {
  const c = Object.keys(pendingRequests).length;
  const b = document.getElementById('reqBadge');
  b.textContent = c; b.classList.toggle('show', c > 0);
}
function admitUser(id) {
  if (!jitsiApi) return;
  try {
    jitsiApi.executeCommand('answerKnockingParticipant', id, true);
    addEvent('admit', `اجازه ورود به «${pendingRequests[id] || 'کاربر'}»`);
    removeRequest(id);
  } catch (e) { alert('خطا: ' + e.message); }
}
function rejectUser(id) {
  if (!jitsiApi) return;
  try {
    jitsiApi.executeCommand('answerKnockingParticipant', id, false);
    addEvent('reject', `رد درخواست «${pendingRequests[id] || 'کاربر'}»`);
    removeRequest(id);
  } catch {}
}

// ==========================================
// کاربران
// ==========================================
function addUser(id, name, isMod) {
  activeUsers[id] = { name, isMod };
  document.getElementById('usersEmpty').style.display = 'none';
  const old = document.getElementById('user-' + id); if (old) old.remove();
  const initial = (name || '?').charAt(0).toUpperCase();
  const el = document.createElement('div');
  el.className = 'user-item'; el.id = 'user-' + id;
  el.innerHTML = `<div class="user-info">
      <div class="avatar ${isMod ? 'moderator' : ''}">${initial}</div>
      <div style="min-width:0;flex:1">
        <div class="user-name">${name}</div>
        <div class="user-role">${isMod ? 'مدیر' : 'مراجع'}</div>
      </div>
    </div>
    ${!isMod ? `<button class="btn-kick" onclick="kickUser('${id}')">اخراج</button>` : ''}`;
  document.getElementById('usersList').appendChild(el);
  updateUserBadge();
}
function removeUser(id) {
  delete activeUsers[id];
  const el = document.getElementById('user-' + id);
  if (el) el.remove();
  updateUserBadge();
  if (!Object.keys(activeUsers).length) document.getElementById('usersEmpty').style.display = 'block';
}
function updateUserBadge() {
  const c = Object.keys(activeUsers).length;
  const b = document.getElementById('userBadge');
  b.textContent = c; b.classList.toggle('show', c > 0);
}
function kickUser(id) {
  if (!jitsiApi) return;
  if (!confirm('اخراج این کاربر؟')) return;
  try { jitsiApi.executeCommand('kickParticipant', id); } catch {}
}

// ==========================================
// رویدادها
// ==========================================
function addEvent(type, text) {
  const list = document.getElementById('eventsList');
  const empty = list.querySelector('.empty-msg'); if (empty) empty.remove();
  const time = new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const el = document.createElement('div');
  el.className = 'event-item ' + type;
  el.innerHTML = `<span class="event-time">${time}</span><span class="event-text">${text}</span>`;
  list.insertBefore(el, list.firstChild);
  while (list.children.length > 50) list.removeChild(list.lastChild);
}

// ==========================================
// شروع
// ==========================================
document.getElementById('adminPassword').addEventListener('keypress', e => {
  if (e.key === 'Enter') adminLogin();
});
window.addEventListener('load', () => document.getElementById('adminPassword').focus());

// قبل از بستن، heartbeat رو متوقف کن
window.addEventListener('beforeunload', () => {
  if (heartbeatInterval) clearInterval(heartbeatInterval);
});
</script>
