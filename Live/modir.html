<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود مدیر - اتاق مشاوره</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Tahoma, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .box {
      background: #1e293b;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      text-align: center;
      width: 100%;
      max-width: 420px;
      border: 1px solid #334155;
    }
    h1 { margin-bottom: 8px; font-size: 22px; color: #f1f5f9; }
    .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 16px;
      border: 2px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      font-family: inherit;
      transition: border-color 0.2s;
      text-align: center;
    }
    input:focus { outline: none; border-color: #2563eb; }
    input::placeholder { color: #64748b; }
    button {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      font-family: inherit;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 50px;
    }
    button:hover:not(:disabled) { background: #1d4ed8; transform: translateY(-1px); }
    button:disabled { opacity: 0.7; cursor: not-allowed; }
    .error {
      color: #f87171;
      margin-top: 14px;
      font-size: 14px;
      min-height: 20px;
      padding: 0 5px;
    }
    .hidden { display: none !important; }
    #meet { width: 100%; height: 100vh; position: fixed; top: 0; left: 0; z-index: 100; }

    /* اسپینر لودینگ */
    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* لودینگ تمام‌صفحه */
    #fullLoader {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 200;
      gap: 20px;
    }
    .big-spinner {
      width: 60px;
      height: 60px;
      border: 5px solid #334155;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loader-text { color: #cbd5e1; font-size: 16px; }

    @media (max-width: 480px) {
      .box { padding: 30px 20px; }
      h1 { font-size: 20px; }
    }
  </style>
</head>
<body>

  <!-- لودینگ تمام‌صفحه -->
  <div id="fullLoader" class="hidden">
    <div class="big-spinner"></div>
    <p class="loader-text">در حال اتصال به اتاق مشاوره...</p>
  </div>

  <!-- صفحه ورود -->
  <div class="box" id="loginBox">
    <h1>🔐 ورود مدیر</h1>
    <p class="subtitle">برای ورود، رمز عبور خود را وارد کنید</p>
    <input
      type="password"
      id="adminPassword"
      placeholder="رمز عبور"
      autocomplete="current-password"
    >
    <button id="loginBtn" onclick="adminLogin()">
      <span id="btnText">ورود به اتاق مشاوره</span>
    </button>
    <p class="error" id="errorMsg"></p>
  </div>

  <!-- ظرف Jitsi -->
  <div id="meet" class="hidden"></div>

  <!-- ⚠️ اسکریپت JaaS با App ID اختصاصی -->
  <script src="https://8x8.vc/vpaas-magic-cookie-9e86f3c71b2d4fe287d643cfae775d17/external_api.js"></script>

  <script>
    // ==========================================
    // تنظیمات - در صورت نیاز تغییر بده
    // ==========================================
    const SCRIPT_URL = "https://moshverat-api.aboalidadgostar.workers.dev/";
    const APP_ID = "vpaas-magic-cookie-9e86f3c71b2d4fe287d643cfae775d17";
    const ROOM_NAME = APP_ID + "/taali-andishe-va-roshd";

    // ==========================================
    // توابع کمکی
    // ==========================================
    function showFullLoader() {
      document.getElementById('fullLoader').classList.remove('hidden');
    }
    function hideFullLoader() {
      document.getElementById('fullLoader').classList.add('hidden');
    }
    function setLoading(isLoading) {
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      if (isLoading) {
        btn.disabled = true;
        btnText.innerHTML = '<span class="spinner"></span> در حال ورود...';
      } else {
        btn.disabled = false;
        btnText.textContent = 'ورود به اتاق مشاوره';
      }
    }
    function showError(msg) {
      document.getElementById('errorMsg').textContent = msg;
    }
    function clearError() {
      document.getElementById('errorMsg').textContent = '';
    }

    // ==========================================
    // ورود مدیر
    // ==========================================
    async function adminLogin() {
      const password = document.getElementById('adminPassword').value;
      clearError();

      if (!password) {
        showError('لطفاً رمز عبور را وارد کنید');
        return;
      }

      setLoading(true);

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'admin_login', password: password })
        });

        if (!response.ok) {
          throw new Error('خطا در ارتباط با سرور (کد ' + response.status + ')');
        }

        const data = await response.json();

        if (data.success && data.token) {
          // مخفی کردن صفحه ورود و نمایش لودینگ
          document.getElementById('loginBox').classList.add('hidden');
          showFullLoader();

          // شروع Jitsi
          startJitsi(data.token);
        } else {
          showError(data.error || 'رمز عبور اشتباه است');
          setLoading(false);
        }
      } catch (err) {
        console.error('Login error:', err);
        showError('خطای ارتباط: ' + err.message);
        setLoading(false);
      }
    }

    // ==========================================
    // راه‌اندازی Jitsi
    // ==========================================
    function startJitsi(token) {
      try {
        const options = {
          roomName: ROOM_NAME,
          width: "100%",
          height: "100%",
          parentNode: document.getElementById("meet"),
          jwt: token,
          configOverwrite: {
            startWithAudioMuted: false,
            startWithVideoMuted: false,
            prejoinConfig: { enabled: true },

            // نوار ابزار همیشه نمایش داده شود
            toolbar: {
              alwaysVisible: true,
              timeout: 0,
              autoHideWhileChatIsOpen: false
            },

            // دکمه‌های نوار ابزار
            toolbarButtons: [
              'microphone', 'camera', 'desktop', 'chat',
              'raisehand', 'tileview', 'videoquality',
              'fullscreen', 'settings', 'hangup', 'security',
              'participants-pane', 'toggle-camera'
            ],

            // تنظیمات اضافی
            disableShortcuts: false,
            hideConferenceSubject: false,
            hideConferenceTimer: false,
            enableWelcomePage: false,
            enableClosePage: false
          },
          interfaceConfigOverwrite: {
            TOOLBAR_ALWAYS_VISIBLE: true,
            TOOLBAR_TIMEOUT: 999999,
            VERTICAL_FILMSTRIP: false,
            SHOW_JITSI_WATERMARK: false,
            SHOW_WATERMARK_FOR_GUESTS: false,
            SHOW_BRAND_WATERMARK: false,
            MOBILE_APP_PROMO: false,
            DEFAULT_BACKGROUND: "#0f172a",
            DISABLE_JOIN_LEAVE_NOTIFICATIONS: false,
            SETTINGS_SECTIONS: ['devices', 'language', 'profile']
          }
        };

        const api = new JitsiMeetExternalAPI("8x8.vc", options);

        // مخفی کردن لودینگ وقتی Jitsi آماده شد
        api.addEventListener('videoConferenceJoined', () => {
          hideFullLoader();
          document.getElementById('meet').classList.remove('hidden');
          // فعال‌سازی اتاق انتظار (Lobby)
          api.executeCommand('toggleLobby', true);
        });

        api.addEventListener('readyToClose', () => {
          // بعد از بستن جلسه، به صفحه ورود برگردد
          location.reload();
        });

        // اگر Jitsi تا ۱۵ ثانیه لود نشد
        setTimeout(() => {
          if (!document.getElementById('fullLoader').classList.contains('hidden')) {
            hideFullLoader();
            document.getElementById('meet').classList.remove('hidden');
          }
        }, 15000);

      } catch (err) {
        console.error('Jitsi error:', err);
        hideFullLoader();
        document.getElementById('loginBox').classList.remove('hidden');
        showError('خطا در بارگذاری اتاق: ' + err.message);
        setLoading(false);
      }
    }

    // ==========================================
    // ورود با کلید Enter
    // ==========================================
    document.getElementById('adminPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') adminLogin();
    });

    // فوکوس روی input هنگام بارگذاری
    window.addEventListener('load', () => {
      document.getElementById('adminPassword').focus();
    });
  </script>
</body>
</html>
