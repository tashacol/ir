<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>صدور گواهی سوابق فعالیت</title>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap');
    :root{--bg1:#eef2f3;--bg2:#d6e0e2;--primary:#007bff;--primaryHover:#0056b3;--success:#218838;--danger:#dc3545;--text:#212529;--muted:#6c757d;--card:#fff;--border:#dee2e6;--input:#f8f9fa}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;display:flex;justify-content:center;align-items:flex-start;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif}
    .container{width:100%;max-width:740px;margin-top:20px;padding:30px 40px;background:rgba(255,255,255,.97);border:1px solid var(--border);border-radius:20px;box-shadow:0 15px 40px #00000018;animation:fadeIn .4s ease-out}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}h1{font-size:1.65rem;text-align:center;margin:0 0 26px}.field{position:relative;margin:0 auto 20px;max-width:430px}.field input{width:100%;padding:14px 16px;background:var(--input);border:1px solid var(--border);border-radius:10px;color:var(--text);font:inherit;outline:none}.field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px #007bff20}.field label{display:block;margin-bottom:7px;font-size:.94rem;font-weight:500}.btn{width:100%;min-height:52px;padding:13px 18px;border:0;border-radius:11px;background:var(--primary);color:#fff;font:700 1rem Vazirmatn,sans-serif;cursor:pointer;margin-top:8px}.btn:hover:not(:disabled){background:var(--primaryHover)}.btn:disabled{opacity:.65;cursor:wait}.captcha{display:flex;justify-content:center;margin:18px 0}.status{display:none;padding:12px;border-radius:8px;margin-top:15px;text-align:center}.status.success{display:block;background:#28a74516;color:var(--success)}.status.error{display:block;background:#dc354516;color:var(--danger)}#result{display:none;margin-top:25px;border-top:1px solid var(--border);padding-top:25px}#previewBox{max-width:520px;margin:auto;padding:10px;background:var(--input);border:1px solid var(--border);border-radius:10px}#certificatePreview{width:100%;aspect-ratio:148/210;overflow:hidden;background:#fff;padding:5%;box-shadow:0 4px 12px #00000018}#certificateForPrint{position:fixed;left:-12000px;top:0;width:148mm;height:210mm;padding:15mm;background:#fff;color:#000;box-sizing:border-box}#certificateForPrint:before{content:"";position:absolute;inset:7mm;border:2px solid #000;pointer-events:none}.cert-header{display:flex;gap:8px;justify-content:space-between;margin-bottom:14px}.cert-header>div{width:33.333%}.cert-header p{font-weight:700;margin:2px 0}.cert-header-right{text-align:right}.cert-header-center{text-align:center}.cert-header-left{text-align:left}.cert-content{clear:both;text-align:right}.cert-separator{border:0;border-top:1px solid #000;margin:0 0 16px}.cert-title{text-align:center;font-weight:700;margin:15px 0 20px}.cert-main-paragraph{line-height:2!important;text-align:justify}.cert-table{width:100%;border-collapse:collapse;margin-top:15px;direction:rtl}.cert-table th,.cert-table td{border:1px solid #111;padding:4px;text-align:center;overflow-wrap:anywhere}.cert-signature{position:relative;min-height:135px;margin-top:34px;text-align:center}.signature-image{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:190px;max-height:100px;object-fit:contain}.cert-qrcode-container{position:absolute;bottom:0;left:0;text-align:center}.cert-qrcode-container p{margin:0 0 3px}.qrcode-placeholder-container{width:65px;height:65px;padding:4px;border:1px solid #111;background:white}.qrcode-placeholder-container img,.qrcode-placeholder-container canvas{width:100%!important;height:100%!important}.cert-note{font-size:.8rem;text-align:center;color:var(--muted);margin-top:8px}#certificateForPrint,#certificateForPrint *{font-family:Amiri,serif;font-size:12px;line-height:1.5}#certificateForPrint .cert-main-paragraph{line-height:2!important}#certificateForPrint .cert-table{font-size:9px}#certificateForPrint .cert-table th,#certificateForPrint .cert-table td{padding:3px}#certificateForPrint .cert-title{margin:12px 0 16px}#certificateForPrint .cert-signature{margin-top:28px}#certificatePreview,#certificatePreview *{font-family:Amiri,serif;font-size:clamp(6px,1.7vw,12px);line-height:1.5}#certificatePreview .cert-main-paragraph{line-height:2!important}#downloadControls{margin-top:18px}.modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:#0009;padding:20px}.modal-content{position:relative;width:100%;max-width:400px;padding:30px;background:#fff;border-radius:15px;text-align:center;box-shadow:0 10px 30px #0003}.modal-content p{font-weight:700;margin:0 0 20px;font-size:1.1rem;color:var(--success)}.modal-close{position:absolute;top:6px;left:14px;border:0;background:none;font-size:2rem;color:#888;cursor:pointer}.download-links{display:grid;gap:10px}.download-links a{display:block;padding:12px 20px;color:#fff;text-decoration:none;border-radius:8px}.view-file{background:var(--success)}.share-file{background:#138496}
    @media(max-width:600px){body{padding:0}.container{margin:0;min-height:100vh;padding:25px 18px;border-radius:0;border:0;box-shadow:none}h1{font-size:1.4rem}.captcha{transform:scale(.92);transform-origin:center}}
  </style>
</head>
<body>
  <main class="container">
    <h1>صدور گواهی سوابق فعالیت</h1>
    <form id="certificateForm" autocomplete="off" novalidate>
      <div class="field"><label for="nationalIdInput">کد ملی</label><input type="tel" id="nationalIdInput" inputmode="numeric" autocomplete="off" maxlength="10" required aria-describedby="statusMessage" placeholder="کد ملی ۱۰ رقمی"></div>
      <div class="field"><label for="verificationCode">رمز عبور مدیریت</label><input type="password" id="verificationCode" inputmode="numeric" autocomplete="new-password" maxlength="128" required placeholder="رمز عبور مدیریت"></div>
      <div class="captcha"><div class="g-recaptcha" data-sitekey="6Lc1vqkrAAAAAHLHbzPMzlREvKwgHDNSmakrB-aq"></div></div>
      <button type="submit" id="generateButton" class="btn">صدور و ذخیره گواهی</button>
    </form>
    <div id="statusMessage" class="status" role="status" aria-live="polite"></div>
    <section id="result">
      <div id="previewBox"><div id="certificatePreview"></div></div>
      <div id="downloadControls"><button type="button" id="downloadPdfBtn" class="btn">دانلود مجدد PDF</button></div>
      <p class="cert-note">تاریخ‌ها و مدت سوابق در سمت سرور محاسبه می‌شوند.</p>
    </section>
  </main>
  <div id="certificateForPrint" aria-hidden="true"></div>
  <div class="modal" id="successModal" role="dialog" aria-modal="true" aria-labelledby="successTitle">
    <div class="modal-content"><button type="button" class="modal-close" id="modalCloseBtn" aria-label="بستن">×</button><p id="successTitle">فایل گواهی تولید شد.</p><div class="download-links"><a href="#" id="viewPdfBtn" class="view-file">مشاهده فایل</a><a href="#" id="sharePdfBtn" class="share-file">ارسال فایل</a></div></div>
  </div>
<script>
'use strict';
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxFgslLkR-EHj41k936CI9TxDMfnY9MLQbI5TBrvm0ek_r9vWNG_b6iUhv3V-yK7MtyoQ/exec';
const QR_CODE_URL = 'https://tashacol.ir/enameh.html';
let lastGeneratedPdfBlob = null;
let certificateShareData = null;
const certificateForm = document.getElementById('certificateForm');
const generateButton = document.getElementById('generateButton');
const downloadPdfBtn = document.getElementById('downloadPdfBtn');
const statusMessage = document.getElementById('statusMessage');
const successModal = document.getElementById('successModal');
const resultDiv = document.getElementById('result');

function normalizeDigits(value) {
  const digits = {'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9','٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
  return String(value == null ? '' : value).replace(/[۰-۹٠-٩]/g, ch => digits[ch]);
}
function toPersianDigits(value) { return String(value == null ? '' : value).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[Number(d)]); }
function escapeHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function showMessage(message, type) {
  statusMessage.textContent = String(message || 'خطای نامشخص');
  statusMessage.className = 'status ' + (type === 'success' ? 'success' : 'error');
}
function hideMessage() { statusMessage.textContent = ''; statusMessage.className = 'status'; }
function setLoading(button, loading, loadingText) {
  button.disabled = loading;
  if (!button.dataset.normalText) button.dataset.normalText = button.textContent;
  button.textContent = loading ? (loadingText || 'لطفاً صبر کنید…') : button.dataset.normalText;
}
async function apiRequest(payload) {
  const response = await fetch(SCRIPT_URL, { method: 'POST', mode: 'cors', cache: 'no-store', body: JSON.stringify(payload) });
  if (!response.ok) throw new Error('HTTP ' + response.status);
  return await response.json();
}

certificateForm.addEventListener('submit', async event => {
  event.preventDefault();
  hideMessage();
  const nationalId = normalizeDigits(document.getElementById('nationalIdInput').value).trim();
  const verificationCode = normalizeDigits(document.getElementById('verificationCode').value).trim();
  const captchaToken = window.grecaptcha ? grecaptcha.getResponse() : '';
  if (!/^\d{10}$/.test(nationalId)) { showMessage('کد ملی باید دقیقاً ۱۰ رقم باشد.', 'error'); return; }
  if (!verificationCode) { showMessage('رمز عبور مدیریت را وارد کنید.', 'error'); return; }
  if (!captchaToken) { showMessage('لطفاً کپچا را تکمیل کنید.', 'error'); return; }
  setLoading(generateButton, true, 'در حال بررسی…');
  try {
    const auth = await apiRequest({action:'authenticate', nationalId:nationalId, verificationCode:verificationCode, captchaToken:captchaToken});
    if (auth.status !== 'success_token_generated' || !auth.token) throw new Error(auth.message || 'احراز هویت ناموفق بود.');
    showMessage('احراز هویت موفق بود؛ اطلاعات در حال دریافت است.', 'success');
    const result = await apiRequest({action:'fetchData', token:auth.token});
    if (result.status !== 'success' || !result.data) throw new Error(result.message || 'دریافت اطلاعات ناموفق بود.');
    await renderCertificate(result.data);
  } catch (error) {
    showMessage(error && error.message && !/^HTTP /.test(error.message) ? error.message : 'ارتباط با سرور ناموفق بود. تنظیمات انتشار و نشانی وب‌اپ را بررسی کنید.', 'error');
    console.error('Certificate request failed.');
    if (window.grecaptcha) grecaptcha.reset();
    setLoading(generateButton, false);
  }
});

function formatDuration(totalMonths) {
  const safeTotal = Math.max(0, Number(totalMonths) || 0);
  const years = Math.floor(safeTotal / 12);
  const months = safeTotal % 12;
  if (years && months) return toPersianDigits(years) + ' سال و ' + toPersianDigits(months) + ' ماه';
  if (years) return toPersianDigits(years) + ' سال';
  return toPersianDigits(months) + ' ماه';
}
function getCertificateHTML(data) {
  const user = data.user || {};
  const activities = Array.isArray(data.activities) ? data.activities : [];
  const total = Number(data.totalDurationMonths) || 0;
  const issueDate = toPersianDigits(data.issueDate || '');
  const certificateNumber = toPersianDigits(data.certificateNumber || '');
  const tableRows = activities.map(activity => {
    const endDate = activity.endDate ? activity.endDate : 'تا هم‌اکنون';
    return '<tr><td>' + escapeHtml(activity.activity) + '</td><td>' + escapeHtml(toPersianDigits(activity.startDate)) + '</td><td>' + escapeHtml(toPersianDigits(endDate)) + '</td><td>' + escapeHtml(toPersianDigits(activity.durationMonths)) + ' ماه</td></tr>';
  }).join('');
  const mime = /^(image\/(png|jpeg|webp))$/i.test(data.signatureImageMimeType || '') ? data.signatureImageMimeType : 'image/png';
  const signature = typeof data.signatureImageBase64 === 'string' && /^[A-Za-z0-9+/=\r\n]+$/.test(data.signatureImageBase64)
    ? '<img src="data:' + mime + ';base64,' + data.signatureImageBase64.replace(/[\r\n]/g,'') + '" class="signature-image" alt="مهر و امضا">' : '';
  return '<div class="cert-header">' +
    '<div class="cert-header-right"><p>شناسه ملی: ۱۴۰۱۳۷۷۰۶۱۱</p><p>تلفن: ۰۹۱۳۵۰۷۶۵۸۷</p></div>' +
    '<div class="cert-header-center"><p>گواهی سابقه فعالیت</p><p>مؤسسه تعالی اندیشه و رشد</p></div>' +
    '<div class="cert-header-left"><p>شماره: ' + escapeHtml(certificateNumber) + '</p><p>تاریخ: ' + escapeHtml(issueDate) + '</p></div></div>' +
    '<div class="cert-content"><hr class="cert-separator"><div class="cert-title">بسمه تعالی</div>' +
    '<p class="cert-main-paragraph">به استحضار می‌رساند آقا/خانم <strong>' + escapeHtml(user.name) + '</strong> دارای شماره ملی <strong>' + escapeHtml(toPersianDigits(user.nationalId)) + '</strong> مجموعاً به مدت <strong>' + escapeHtml(formatDuration(total)) + '</strong> در مؤسسه فرهنگی و تبلیغی تعالی اندیشه و رشد فعالیت داشته‌اند. جزئیات فعالیت ایشان به شرح زیر است:</p>' +
    '<table class="cert-table"><thead><tr><th>فعالیت</th><th>تاریخ شروع</th><th>تاریخ پایان</th><th>مدت کامل</th></tr></thead><tbody>' + tableRows + '</tbody></table>' +
    '<div class="cert-signature">' + signature + '<div class="cert-qrcode-container"><p>استعلام</p><div class="qrcode-placeholder-container"></div></div></div></div>';
}
async function renderCertificate(data) {
  certificateShareData = {
    name: String((data.user || {}).name || ''),
    nationalId: toPersianDigits((data.user || {}).nationalId || ''),
    date: toPersianDigits(data.issueDate || ''),
    number: toPersianDigits(data.certificateNumber || '')
  };
  const html = getCertificateHTML(data);
  document.getElementById('certificatePreview').innerHTML = html;
  document.getElementById('certificateForPrint').innerHTML = html;
  document.querySelectorAll('.qrcode-placeholder-container').forEach(node => {
    node.textContent = '';
    if (window.QRCode) new QRCode(node, {text:QR_CODE_URL,width:65,height:65,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
  });
  certificateForm.style.display = 'none';
  resultDiv.style.display = 'block';
  await downloadPdf();
}
async function downloadPdf() {
  setLoading(downloadPdfBtn, true, 'در حال ساخت PDF…');
  try {
    if (!window.html2canvas || !window.jspdf || !window.jspdf.jsPDF) throw new Error('کتابخانه PDF بارگذاری نشده است؛ صفحه را دوباره باز کنید.');
    const target = document.getElementById('certificateForPrint');
    const canvas = await html2canvas(target, {scale:3, useCORS:true, backgroundColor:'#ffffff', logging:false});
    const pdf = new window.jspdf.jsPDF('portrait','mm','a5');
    pdf.addImage(canvas.toDataURL('image/jpeg',0.96),'JPEG',0,0,148,210);
    lastGeneratedPdfBlob = pdf.output('blob');
    const id = normalizeDigits(document.getElementById('nationalIdInput').value).replace(/\D/g,'');
    pdf.save('سوابق_موسسه_' + id + '.pdf');
    successModal.style.display = 'flex';
    showMessage('گواهی آماده شد.', 'success');
  } catch (error) {
    console.error('PDF generation failed.');
    showMessage(error && error.message ? error.message : 'ساخت PDF ناموفق بود.', 'error');
  } finally {
    setLoading(downloadPdfBtn, false);
    setLoading(generateButton, false);
  }
}
downloadPdfBtn.addEventListener('click', downloadPdf);
document.getElementById('viewPdfBtn').addEventListener('click', event => {
  event.preventDefault();
  if (!lastGeneratedPdfBlob) return;
  const url = URL.createObjectURL(lastGeneratedPdfBlob);
  window.open(url, '_blank', 'noopener,noreferrer');
  setTimeout(() => URL.revokeObjectURL(url), 60000);
});
document.getElementById('sharePdfBtn').addEventListener('click', async event => {
  event.preventDefault();
  if (!lastGeneratedPdfBlob || !certificateShareData) return;
  const id = normalizeDigits(document.getElementById('nationalIdInput').value).replace(/\D/g,'');
  const file = new File([lastGeneratedPdfBlob], 'سوابق_موسسه_' + id + '.pdf', {type:'application/pdf'});
  const shareText = 'گواهی سوابق فعالیت ' + certificateShareData.name + '\nکد ملی: ' + certificateShareData.nationalId + '\nتاریخ: ' + certificateShareData.date + '\nشماره: ' + certificateShareData.number;
  const shareData = {files:[file], title:'گواهی سوابق فعالیت', text:shareText};
  try {
    if (navigator.canShare && navigator.canShare(shareData) && navigator.share) await navigator.share(shareData);
    else showMessage('مرورگر شما اشتراک‌گذاری فایل را پشتیبانی نمی‌کند؛ از دانلود PDF استفاده کنید.', 'error');
  } catch (error) { if (!error || error.name !== 'AbortError') showMessage('اشتراک‌گذاری فایل انجام نشد.', 'error'); }
});
document.getElementById('modalCloseBtn').addEventListener('click', () => { successModal.style.display = 'none'; });
successModal.addEventListener('click', event => { if (event.target === successModal) successModal.style.display = 'none'; });
</script>
</body>
</html>
