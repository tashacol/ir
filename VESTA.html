<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه بانکداری مجازی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #f8fafc; }
        .hidden-view { display: none !important; }
        .credit-card { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); }
    </style>
</head>
<body class="text-slate-800">

    <!-- بخش ورود و ثبت نام -->
    <div id="authContainer" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
            <!-- سوئیچ بین ورود و ثبت نام -->
            <div class="flex border-b mb-6 text-center font-bold">
                <button id="tabLoginBtn" onclick="toggleAuth('login')" class="w-1/2 pb-3 border-b-2 border-blue-600 text-blue-600">ورود به حساب</button>
                <button id="tabRegisterBtn" onclick="toggleAuth('register')" class="w-1/2 pb-3 border-b-2 border-transparent text-slate-400">افتتاح حساب</button>
            </div>

            <!-- فرم ورود -->
            <div id="loginSection">
                <input type="text" id="loginNationalCode" placeholder="کد ملی (نام کاربری)" class="w-full mb-3 px-4 py-3 border rounded-xl focus:ring-2 focus:ring-blue-500 text-left outline-none" dir="ltr">
                <input type="password" id="loginPassword" placeholder="رمز عبور" class="w-full mb-5 px-4 py-3 border rounded-xl focus:ring-2 focus:ring-blue-500 text-left outline-none" dir="ltr">
                <button onclick="login()" id="loginBtn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">ورود به پنل بانکی</button>
            </div>

            <!-- فرم ثبت نام -->
            <div id="registerSection" class="hidden-view">
                <div id="regStep1">
                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <input type="text" id="regFirst" placeholder="نام" class="px-3 py-2 border rounded-xl outline-none">
                        <input type="text" id="regLast" placeholder="نام خانوادگی" class="px-3 py-2 border rounded-xl outline-none">
                    </div>
                    <input type="text" id="regNC" placeholder="کد ملی" class="w-full mb-3 px-4 py-2 border rounded-xl outline-none text-left" dir="ltr">
                    <input type="text" id="regMobile" placeholder="شماره موبایل" class="w-full mb-3 px-4 py-2 border rounded-xl outline-none text-left" dir="ltr">
                    <input type="text" id="regDOB" placeholder="تاریخ تولد (مثال: 1375-01-01)" class="w-full mb-3 px-4 py-2 border rounded-xl outline-none text-left" dir="ltr">
                    <input type="email" id="regEmail" placeholder="ایمیل معتبر" class="w-full mb-3 px-4 py-2 border rounded-xl outline-none text-left" dir="ltr">
                    <input type="password" id="regPass" placeholder="رمز عبور دلخواه" class="w-full mb-5 px-4 py-2 border rounded-xl outline-none text-left" dir="ltr">
                    <button onclick="sendOtp()" id="sendOtpBtn" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold hover:bg-emerald-700 transition">دریافت کد تأیید ایمیل</button>
                </div>

                <!-- تایید کد ارسالی -->
                <div id="regStep2" class="hidden-view text-center">
                    <p class="text-sm text-slate-600 mb-4">کد ۶ رقمی ارسال‌شده به ایمیلتان را وارد کنید:</p>
                    <input type="text" id="emailOtp" placeholder="123456" maxlength="6" class="w-48 mx-auto mb-5 text-center tracking-widest text-2xl font-mono py-2 border rounded-xl outline-none" dir="ltr">
                    <button onclick="verifyAndRegister()" id="verifyBtn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">تأیید و تکمیل ثبت‌نام</button>
                </div>
            </div>

            <p id="authMessage" class="text-center text-sm font-bold mt-4 hidden"></p>
        </div>
    </div>

    <!-- داشبورد کاربری پس از لاگین -->
    <div id="dashboardView" class="hidden-view min-h-screen flex flex-col md:flex-row">
        <div class="w-full md:w-64 bg-slate-900 text-white flex flex-col p-6">
            <h2 class="text-xl font-bold mb-8 text-center border-b border-slate-700 pb-4">سامانه بانکداری</h2>
            <button onclick="switchTab('overview')" class="text-right py-3 px-4 rounded-xl hover:bg-slate-800 mb-2">نمای کلی حساب</button>
            <button onclick="switchTab('transfer')" class="text-right py-3 px-4 rounded-xl hover:bg-slate-800 mb-2">انتقال وجه</button>
            <button onclick="switchTab('history')" class="text-right py-3 px-4 rounded-xl hover:bg-slate-800 mb-6">گردش حساب</button>
            <button onclick="logout()" class="mt-auto text-right py-3 px-4 rounded-xl bg-red-600 hover:bg-red-700">خروج</button>
        </div>

        <div class="flex-1 p-6 md:p-10">
            <h1 class="text-2xl font-bold mb-6">سلام، <span id="dashName">...</span></h1>

            <!-- تب اطلاعات کلی -->
            <div id="tab-overview">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div class="credit-card text-white p-6 rounded-2xl shadow-xl flex flex-col justify-between h-52">
                        <div class="flex justify-between">
                            <span class="text-sm opacity-75">کارت مجازی</span>
                            <span class="font-mono tracking-widest text-lg" id="dashCard">---- ---- ---- ----</span>
                        </div>
                        <div>
                            <p class="text-xs opacity-75 mb-1">موجودی قابل برداشت</p>
                            <h2 class="text-3xl font-bold font-mono"><span id="dashAvail">0</span> <span class="text-sm">ریال</span></h2>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-2xl shadow border flex flex-col justify-between">
                        <div>
                            <p class="text-xs text-slate-500 mb-1">شماره حساب ۱۰ رقمی</p>
                            <p class="text-lg font-bold font-mono text-slate-800 mb-4" id="dashAcc">----------</p>
                            <p class="text-xs text-slate-500 mb-1">شناسه Virtual IBAN</p>
                            <p class="text-sm font-bold font-mono text-blue-600" id="dashIban">VX----------------------</p>
                        </div>
                        <div class="border-t pt-3 flex justify-between text-sm">
                            <span class="text-slate-500">موجودی کل دفترکل (Ledger):</span>
                            <span class="font-bold" id="dashReal">0 ریال</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- تب انتقال وجه -->
            <div id="tab-transfer" class="hidden-view">
                <div class="bg-white p-6 rounded-2xl shadow max-w-lg border">
                    <h3 class="text-lg font-bold mb-4">انتقال وجه جدید</h3>
                    <select id="tMethod" class="w-full mb-3 px-3 py-2 border rounded-xl">
                        <option value="CARD_TO_CARD">کارت به کارت</option>
                        <option value="ACCOUNT_TO_ACCOUNT">حساب به حساب</option>
                        <option value="VIRTUAL_IBAN_TRANSFER">شناسه Virtual IBAN</option>
                    </select>
                    <input type="text" id="tTarget" placeholder="شماره کارت / حساب / شبا مقصد" class="w-full mb-3 px-3 py-2 border rounded-xl text-left" dir="ltr">
                    <input type="number" id="tAmount" placeholder="مبلغ به ریال" class="w-full mb-3 px-3 py-2 border rounded-xl text-left" dir="ltr">
                    <input type="text" id="tPurpose" placeholder="بابت / توضیحات" class="w-full mb-4 px-3 py-2 border rounded-xl">
                    <button onclick="doTransfer()" id="tBtn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700">تأیید و اجرای انتقال اتمیک</button>
                    <p id="tMsg" class="mt-3 text-center text-sm font-bold"></p>
                </div>
            </div>

            <!-- تب گردش حساب -->
            <div id="tab-history" class="hidden-view">
                <div class="bg-white rounded-2xl shadow border overflow-hidden">
                    <table class="w-full text-right">
                        <thead class="bg-slate-100 text-slate-600 text-sm">
                            <tr>
                                <th class="p-4">سند</th>
                                <th class="p-4">نوع</th>
                                <th class="p-4">مبلغ</th>
                                <th class="p-4">زمان ثبت</th>
                            </tr>
                        </thead>
                        <tbody id="dashHistory" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // آدرس وب‌اپلیکیشن گوگل اسکریپت خود را در این خط قرار دهید
        const API_URL = "https://script.google.com/macros/s/AKfycbz0TES_V3XYUpaFF2ZhC8M1Jf3fT90vMjCzFpBsgv54d2X7x4iUXDdLEAfgWIl3bTn2/exec";

        let token = localStorage.getItem('bankToken');
        let regDataTemp = {};

        window.onload = function() {
            if(token) { showDash(); loadDash(); }
        };

        const showMsg = (txt, isErr) => {
            const m = document.getElementById('authMessage');
            m.innerText = txt;
            m.className = `text-center text-sm font-bold mt-4 ${isErr ? 'text-red-500' : 'text-green-600'}`;
            m.classList.remove('hidden');
        };

        function toggleAuth(type) {
            document.getElementById('authMessage').classList.add('hidden');
            if(type === 'login') {
                document.getElementById('loginSection').classList.remove('hidden-view');
                document.getElementById('registerSection').classList.add('hidden-view');
                document.getElementById('tabLoginBtn').className = "w-1/2 pb-3 border-b-2 border-blue-600 text-blue-600";
                document.getElementById('tabRegisterBtn').className = "w-1/2 pb-3 border-b-2 border-transparent text-slate-400";
            } else {
                document.getElementById('loginSection').classList.add('hidden-view');
                document.getElementById('registerSection').classList.remove('hidden-view');
                document.getElementById('tabLoginBtn').className = "w-1/2 pb-3 border-b-2 border-transparent text-slate-400";
                document.getElementById('tabRegisterBtn').className = "w-1/2 pb-3 border-b-2 border-blue-600 text-blue-600";
            }
        }

        async function sendOtp() {
            const f = document.getElementById('regFirst').value;
            const l = document.getElementById('regLast').value;
            const nc = document.getElementById('regNC').value;
            const mb = document.getElementById('regMobile').value;
            const dob = document.getElementById('regDOB').value;
            const em = document.getElementById('regEmail').value;
            const pw = document.getElementById('regPass').value;

            if(!f || !l || !nc || !em || !pw) return showMsg("لطفاً تمامی فیلدها را تکمیل نمایید.", true);

            regDataTemp = { firstName: f, lastName: l, nationalCode: nc, mobile: mb, dob: dob, email: em, password: pw };
            document.getElementById('sendOtpBtn').innerText = "در حال ارسال کد...";
            
            const res = await (await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'registerRequest', ...regDataTemp }) })).json();
            document.getElementById('sendOtpBtn').innerText = "دریافت کد تأیید ایمیل";
            
            if(res.status === 'success') {
                showMsg(res.message, false);
                document.getElementById('regStep1').classList.add('hidden-view');
                document.getElementById('regStep2').classList.remove('hidden-view');
            } else {
                showMsg(res.message, true);
            }
        }

        async function verifyAndRegister() {
            const code = document.getElementById('emailOtp').value;
            if(!code) return;
            document.getElementById('verifyBtn').innerText = "در حال بررسی...";

            const res = await (await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'verifyAndRegister', code: code, ...regDataTemp }) })).json();
            document.getElementById('verifyBtn').innerText = "تأیید و تکمیل ثبت‌نام";

            if(res.status === 'success') {
                alert(res.message);
                toggleAuth('login');
                document.getElementById('regStep2').classList.add('hidden-view');
                document.getElementById('regStep1').classList.remove('hidden-view');
            } else {
                showMsg(res.message, true);
            }
        }

        async function login() {
            const nc = document.getElementById('loginNationalCode').value;
            const pw = document.getElementById('loginPassword').value;
            if(!nc || !pw) return;

            const res = await (await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', nationalCode: nc, password: pw }) })).json();
            if(res.status === 'success') {
                token = res.token;
                localStorage.setItem('bankToken', token);
                showDash();
                loadDash();
            } else {
                showMsg(res.message, true);
            }
        }

        function showDash() {
            document.getElementById('authContainer').classList.add('hidden-view');
            document.getElementById('dashboardView').classList.remove('hidden-view');
        }

        function logout() {
            localStorage.removeItem('bankToken');
            location.reload();
        }

        function switchTab(t) {
            document.getElementById('tab-overview').classList.add('hidden-view');
            document.getElementById('tab-transfer').classList.add('hidden-view');
            document.getElementById('tab-history').classList.add('hidden-view');
            document.getElementById('tab-' + t).classList.remove('hidden-view');
        }

        async function loadDash() {
            const res = await (await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getDashboard', nationalCode: token }) })).json();
            if(res.status === 'success') {
                const d = res.data;
                document.getElementById('dashName').innerText = d.name;
                document.getElementById('dashAcc').innerText = d.account;
                document.getElementById('dashIban').innerText = d.iban;
                document.getElementById('dashCard').innerText = d.card ? d.card.replace(/(\d{4})/g, '$1 ').trim() : 'فاقد کارت فعال';
                document.getElementById('dashAvail').innerText = Number(d.availableBalance).toLocaleString('fa-IR');
                document.getElementById('dashReal').innerText = Number(d.realBalance).toLocaleString('fa-IR') + ' ریال';

                let h = '';
                d.history.forEach(row => {
                    let col = row.type === 'CREDIT' ? 'text-green-600' : 'text-red-600';
                    let sign = row.type === 'CREDIT' ? '+' : '-';
                    h += `<tr>
                        <td class="p-4 font-mono text-sm">${row.id}</td>
                        <td class="p-4 font-bold ${col}">${row.type === 'CREDIT' ? 'واریز' : 'برداشت'}</td>
                        <td class="p-4 font-mono">${sign} ${Number(row.amount).toLocaleString('fa-IR')}</td>
                        <td class="p-4 text-xs text-slate-400">${new Date(row.date).toLocaleString('fa-IR')}</td>
                    </tr>`;
                });
                document.getElementById('dashHistory').innerHTML = h;
            } else {
                alert(res.message);
                logout();
            }
        }

        async function doTransfer() {
            const m = document.getElementById('tMethod').value;
            const trg = document.getElementById('tTarget').value;
            const am = document.getElementById('tAmount').value;
            const p = document.getElementById('tPurpose').value;
            const msg = document.getElementById('tMsg');

            if(!trg || !am) return alert("فیلدها را کامل کنید.");
            if(!confirm(`آیا از انتقال ${Number(am).toLocaleString('fa-IR')} ریال مطمئن هستید؟`)) return;

            document.getElementById('tBtn').disabled = true;
            msg.innerText = "در حال پردازش هسته بانکی...";
            msg.className = "mt-3 text-center text-sm font-bold text-slate-500";

            const res = await (await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'transfer', token: token, transferMethod: m, targetId: trg, amount: am, purpose: p })
            })).json();

            document.getElementById('tBtn').disabled = false;
            if(res.status === 'success') {
                msg.innerText = `انتقال موفق! کد پیگیری: ${res.trackCode}`;
                msg.className = "mt-3 text-center text-sm font-bold text-green-600";
                loadDash();
            } else {
                msg.innerText = res.message;
                msg.className = "mt-3 text-center text-sm font-bold text-red-500";
            }
        }
    </script>
</body>
</html>
