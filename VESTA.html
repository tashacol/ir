<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#06b6d4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>نئوبانک VESTA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    
    <!-- PWA Manifest & Service Worker Injection -->
    <link rel="manifest" id="manifest-link">
    <script>
      const manifestJSON = {
        "name": "Vesta Bank",
        "short_name": "Vesta",
        "start_url": window.location.href,
        "display": "standalone",
        "background_color": "#030712",
        "theme_color": "#06b6d4",
        "icons": [
          { "src": "https://tashacol.ir/Bank/icone.png", "sizes": "192x192", "type": "image/png" },
          { "src": "https://tashacol.ir/Bank/icone.png", "sizes": "512x512", "type": "image/png" }
        ]
      };
      const manifestBlob = new Blob([JSON.stringify(manifestJSON)], {type: 'application/json'});
      document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

      if ('serviceWorker' in navigator) {
        const swCode = `
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => self.clients.claim());
          self.addEventListener('fetch', (e) => {});
        `;
        const swBlob = new Blob([swCode], {type: 'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(swBlob));
      }
    </script>

    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #030712; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .glass-panel { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-panel-glow { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(24px); border: 1px solid rgba(56, 189, 248, 0.2); box-shadow: 0 10px 30px -10px rgba(14, 165, 233, 0.15); }
        
        /* Custom Card Background & Ratio */
        .vesta-card-luxury {
            background-image: url('https://tashacol.ir/Bank/kart.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            aspect-ratio: 1.586;
            box-shadow: 0 15px 30px -10px rgba(0,0,0,0.6);
        }
        
        .card-number-singleline { direction: ltr !important; unicode-bidi: isolate !important; white-space: nowrap !important; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .floating-nav { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(14, 165, 233, 0.15); border-radius: 9999px; }
        .bottom-sheet { transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .bottom-sheet.sheet-active { transform: translateY(0); }
        ::-webkit-scrollbar { display: none; } * { scrollbar-width: none; }
        .hidden-view { display: none !important; }
        .loader-ring { border: 4px solid rgba(6, 182, 212, 0.1); border-top: 4px solid #06b6d4; border-radius: 50%; width: 48px; height: 48px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex justify-center min-h-screen selection:bg-cyan-500 selection:text-white relative">

    <div id="toastContainer" class="fixed top-5 left-1/2 -translate-x-1/2 z-[9999] flex flex-col gap-2 pointer-events-none w-11/12 max-w-[400px]"></div>

    <div id="confirmModal" class="hidden-view fixed inset-0 z-[9999] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass-panel p-6 rounded-3xl w-full max-w-sm text-center shadow-[0_0_40px_rgba(6,182,212,0.15)] border border-slate-700">
            <p id="confirmMsg" class="text-white text-sm mb-6 leading-relaxed"></p>
            <div class="flex gap-3">
                <button id="btnConfirmCancel" class="w-1/2 py-3 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold transition">انصراف</button>
                <button id="btnConfirmOk" class="w-1/2 py-3 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-500 text-white text-xs font-bold shadow-lg transition">تأیید</button>
            </div>
        </div>
    </div>

    <div id="bankLoader" class="hidden-view fixed inset-0 z-[10000] bg-[#030712]/90 backdrop-blur-md flex flex-col items-center justify-center">
        <div class="loader-ring mb-4"></div>
        <p class="text-cyan-400 font-bold text-sm tracking-widest font-mono mb-1">VESTA CORE</p>
    </div>

    <div id="appShell" class="w-full max-w-[550px] h-[100dvh] bg-[#030712] relative flex flex-col overflow-hidden sm:border-x sm:border-slate-800 shadow-2xl">

        <!-- AUTH VIEW -->
        <div id="authView" class="absolute inset-0 z-50 flex items-end justify-center transition-opacity duration-300 bg-gradient-to-b from-blue-950/40 via-[#030712] to-[#030712]">
            <div class="glass-panel w-full rounded-t-[36px] p-8 pb-10 border-b-0 shadow-2xl">
                <div class="w-12 h-1.5 bg-slate-700 rounded-full mx-auto mb-6 opacity-60"></div>
                
                <div class="text-center mb-6">
                    <!-- Icon replaced -->
                    <img src="https://tashacol.ir/Bank/icone.png" alt="Vesta Bank" class="w-20 h-20 mx-auto object-contain mb-2 drop-shadow-[0_0_15px_rgba(6,182,212,0.5)]">
                </div>

                <div class="flex bg-slate-900/80 rounded-2xl p-1 mb-6 border border-slate-800">
                    <button id="tabLoginBtn" onclick="toggleAuth('login')" class="w-1/2 py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-cyan-500 text-white text-xs font-bold shadow-lg transition-all duration-200">ورود به حساب</button>
                    <button id="tabRegisterBtn" onclick="toggleAuth('register')" class="w-1/2 py-2.5 rounded-xl text-slate-400 text-xs font-bold transition-all duration-200">افتتاح حساب</button>
                </div>

                <!-- Login -->
                <div id="loginForm" class="space-y-4">
                    <div>
                        <input type="tel" inputmode="numeric" id="lUser" placeholder="کد ملی خود را وارد کنید" maxlength="10" class="w-full px-4 py-3.5 bg-slate-900/90 border border-slate-800 rounded-2xl font-mono text-left outline-none text-slate-100 focus:border-cyan-500 transition shadow-inner" dir="ltr">
                    </div>
                    <div>
                        <input type="password" id="lPass" minlength="8" maxlength="23" placeholder="رمز عبور" class="w-full px-4 py-3.5 bg-slate-900/90 border border-slate-800 rounded-2xl font-mono text-left outline-none text-slate-100 focus:border-cyan-500 transition shadow-inner" dir="ltr">
                        <!-- Forgot Password Button -->
                        <button onclick="forgotPasswordPrompt()" class="text-[10px] text-cyan-400 mt-2 block w-full text-right hover:text-cyan-300">رمز عبور خود را فراموش کرده‌اید؟</button>
                    </div>
                    
                    <div class="flex gap-3 pt-2">
                        <button onclick="biometricLogin()" class="w-14 bg-slate-800 text-cyan-400 flex justify-center items-center rounded-2xl border border-slate-700 transition">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path></svg>
                        </button>
                        <button onclick="login()" id="loginBtn" class="flex-1 bg-gradient-to-r from-blue-600 to-cyan-500 text-white font-bold py-3.5 rounded-2xl shadow-[0_10px_25px_rgba(6,182,212,0.3)] transition">ورود امن به سامانه</button>
                    </div>
                </div>

                <!-- Register Form (kept minimal for space) -->
                <div id="registerForm" class="hidden-view space-y-3.5">
                    <div id="regInputs" class="space-y-3">
                        <input type="text" id="rName" placeholder="نام" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white">
                        <input type="text" id="rFamily" placeholder="نام خانوادگی" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white">
                        <input type="tel" id="rNC" placeholder="کد ملی" maxlength="10" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white" dir="ltr">
                        <input type="tel" id="rMobile" placeholder="موبایل 09" maxlength="11" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white" dir="ltr">
                        <input type="email" id="rEmail" placeholder="ایمیل" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white" dir="ltr">
                        <input type="password" id="rPass" placeholder="رمز عبور" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white" dir="ltr">
                        <!-- simplified Date for display only -->
                        <div class="flex gap-2"><input type="number" id="dobDay" placeholder="روز" class="w-1/3 px-3 py-2 bg-slate-900 border rounded-xl text-xs"><input type="number" id="dobMonth" placeholder="ماه" class="w-1/3 px-3 py-2 bg-slate-900 border rounded-xl text-xs"><input type="number" id="dobYear" placeholder="سال" class="w-1/3 px-3 py-2 bg-slate-900 border rounded-xl text-xs"></div>
                        <button onclick="requestRegisterOtp()" id="regOtpBtn" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl text-xs">دریافت کد</button>
                    </div>
                    <div id="regOtpVerify" class="hidden-view space-y-4">
                        <input type="tel" id="regCode" placeholder="کد 6 رقمی ایمیل" class="w-full px-4 py-3 bg-slate-900 rounded-xl text-center text-emerald-400 font-mono tracking-widest" dir="ltr">
                        <button onclick="verifyRegisterOtp()" class="w-full bg-cyan-600 text-white font-bold py-3 rounded-xl text-xs">تایید و ثبت‌نام</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- MAIN DASHBOARD -->
        <div id="mainDashboard" class="hidden-view flex flex-col h-full w-full relative">
            
            <header class="px-6 py-5 flex justify-between items-center z-20 shrink-0">
                <div class="flex items-center gap-3">
                    <img src="https://tashacol.ir/Bank/icone.png" class="w-10 h-10 object-contain drop-shadow-md" alt="Vesta">
                    <div>
                        <span class="text-xs text-white block font-black font-sans tracking-widest">VESTA BANK</span>
                        <h2 class="font-medium text-[10px] text-slate-400 tracking-wide" id="clientName">...</h2>
                    </div>
                </div>
                <button onclick="logout()" class="text-slate-400 hover:text-red-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </header>

            <main class="flex-1 overflow-y-auto px-5 pb-32 space-y-6 pt-1">

                <!-- HOME -->
                <section id="view-home" class="space-y-6">
                    <!-- New Custom Image Card -->
                    <div class="vesta-card-luxury w-full flex flex-col justify-between select-none p-5" onclick="copyCardNumber()">
                        
                        <div class="h-8"></div> <!-- spacer for top area of image -->

                        <!-- Center: Card Number -->
                        <div class="text-center mt-4">
                            <p class="font-mono text-[22px] sm:text-2xl font-bold tracking-[0.2em] text-white card-number-singleline drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]" id="displayCardNo">9908 90xx xxxx xxxx</p>
                        </div>

                        <!-- Bottom: Details -->
                        <div class="flex justify-between items-end text-white mt-auto pt-2 pb-1 px-1">
                            <div class="text-left flex flex-col">
                                <span class="text-[8px] opacity-80 uppercase tracking-wider mb-0.5" style="text-shadow: 0 1px 3px rgba(0,0,0,0.9);">CVV2</span>
                                <div class="flex items-center gap-1" onclick="event.stopPropagation()">
                                    <span class="font-mono font-bold text-sm" style="text-shadow: 0 1px 3px rgba(0,0,0,0.9);" id="displayCvv">***</span>
                                    <button onclick="toggleCvvView()" class="opacity-80 hover:opacity-100 transition"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg></button>
                                </div>
                            </div>
                            <div class="text-center flex flex-col">
                                <span class="text-[8px] opacity-80 uppercase tracking-wider mb-0.5" style="text-shadow: 0 1px 3px rgba(0,0,0,0.9);">EXPIRES</span>
                                <span class="font-mono font-bold text-sm tracking-widest" style="text-shadow: 0 1px 3px rgba(0,0,0,0.9);" id="displayExpiry">--/--</span>
                            </div>
                            <div class="text-right flex flex-col max-w-[120px]">
                                <span class="text-[8px] opacity-80 uppercase tracking-wider mb-0.5" style="text-shadow: 0 1px 3px rgba(0,0,0,0.9);">HOLDER</span>
                                <span class="font-bold text-xs truncate block" style="text-shadow: 0 1px 3px rgba(0,0,0,0.9);" id="displayHolder">---</span>
                            </div>
                        </div>
                    </div>

                    <!-- Balances Box -->
                    <div class="glass-panel-glow p-5 rounded-3xl relative overflow-hidden">
                        <span class="text-xs text-slate-400 block mb-1">موجودی حساب</span>
                        <div class="flex items-baseline gap-2 mb-1">
                            <span class="text-3xl font-black font-mono tracking-tight text-white" id="displayAvailBal">0</span>
                            <span class="text-xs font-bold text-cyan-400">ریال</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3.5">
                        <div class="glass-panel p-4 rounded-2xl flex flex-col justify-between">
                            <span class="text-[11px] text-slate-400 block mb-1">شماره حساب</span>
                            <span class="font-mono font-bold text-slate-200 text-sm tracking-wider" id="displayAccNo">----------</span>
                        </div>
                        <div class="glass-panel p-4 rounded-2xl flex flex-col justify-between">
                            <span class="text-[11px] text-slate-400 block mb-1">شناسه شبا</span>
                            <span class="font-mono font-bold text-cyan-300 text-xs truncate max-w-[130px]" id="displayIban" dir="ltr">IR----------</span>
                        </div>
                    </div>
                </section>

                <!-- TRANSFER -->
                <section id="view-transfer" class="hidden-view space-y-6">
                    <div class="glass-panel p-6 rounded-3xl space-y-5">
                        <select id="tfMethod" class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl outline-none text-xs text-slate-200">
                            <option value="CARD_TO_CARD">کارت به کارت</option>
                            <option value="ACCOUNT_TO_ACCOUNT">حساب به حساب وستا</option>
                            <option value="VIRTUAL_IBAN_TRANSFER">انتقال با شناسه شبا</option>
                        </select>
                        <input type="tel" id="tfTarget" placeholder="شماره مقصد" class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl font-mono text-left outline-none text-white" dir="ltr">
                        <input type="tel" id="tfAmount" placeholder="مبلغ (ریال)" class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl font-mono text-left outline-none text-white" dir="ltr">
                        <button onclick="startInquiry()" class="w-full bg-cyan-600 text-white font-bold py-3 rounded-xl text-xs">استعلام گیرنده</button>
                    </div>
                    
                    <div id="transferStep2" class="hidden-view glass-panel p-6 rounded-3xl space-y-4 border border-cyan-500/30">
                        <p class="text-xs text-white">نام صاحب مقصد: <span id="inqReceiverName" class="text-cyan-300"></span></p>
                        <input type="password" id="tfPin2" placeholder="رمز ثابت اینترنتی (PIN2)" class="w-full px-4 py-3 bg-slate-900 border rounded-xl font-mono text-center tracking-widest text-amber-300" dir="ltr">
                        <div class="flex gap-2">
                            <button onclick="cancelTransfer()" class="w-1/3 bg-slate-800 text-white font-bold py-3 rounded-xl text-xs">انصراف</button>
                            <button onclick="commitTransfer()" class="w-2/3 bg-emerald-600 text-white font-bold py-3 rounded-xl text-xs">تأیید و انتقال</button>
                        </div>
                    </div>
                </section>

                <!-- STATEMENT -->
                <section id="view-statement" class="hidden-view space-y-4">
                    <div id="statementCardsContainer" class="space-y-3 pb-6"></div>
                </section>

                <!-- SETTINGS (PIN CHANGE requires Current PIN) -->
                <section id="view-settings" class="hidden-view space-y-4">
                    <div class="glass-panel p-5 rounded-3xl space-y-4">
                        <h3 class="text-xs font-bold text-white pb-3 border-b border-slate-800">تغییر پین و کلمه عبور کارت</h3>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-[10px] font-bold text-rose-400 mb-1 mr-1">* رمز اول فعلی کارت (۴ رقم)</label>
                                <input type="password" id="currentPin1" maxlength="4" placeholder="••••" class="w-full px-4 py-3 bg-slate-900 border border-rose-500/30 rounded-xl font-mono text-center tracking-[0.4em] outline-none text-white focus:border-rose-400" dir="ltr">
                            </div>
                            <div class="pt-2 border-t border-slate-800/50">
                                <label class="block text-[11px] font-bold text-slate-400 mb-1 mr-1">رمز اول جدید کارت (۴ رقم)</label>
                                <input type="password" id="newPin1" maxlength="4" placeholder="••••" class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl font-mono text-center tracking-[0.4em] outline-none text-white focus:border-cyan-500" dir="ltr">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-400 mb-1 mr-1">رمز ثابت اینترنتی (PIN2) جدید (۵ تا ۸ رقم)</label>
                                <input type="password" id="newPin2" maxlength="8" placeholder="••••••••" class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl font-mono text-center tracking-[0.4em] outline-none text-white focus:border-cyan-500" dir="ltr">
                            </div>
                            <button onclick="changePinSubmit()" id="changePinBtn" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 text-white font-bold py-3 rounded-xl text-xs transition active:scale-95 mt-2">ثبت تغییر رمزها</button>
                        </div>
                    </div>
                </section>

            </main>

            <!-- BOTTOM NAV -->
            <div class="absolute bottom-5 inset-x-6 z-40 pointer-events-none flex justify-center">
                <nav class="floating-nav pointer-events-auto px-6 py-2.5 flex items-center justify-between w-full max-w-[420px]">
                    <button onclick="switchView('home')" id="nav-home" class="flex flex-col items-center gap-1 text-cyan-400">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
                        <span class="text-[9px] font-bold">خانه</span>
                    </button>
                    <button onclick="switchView('transfer')" id="nav-transfer" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M8 5a1 1 0 100 2h5.586l-1.293 1.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L13.586 5H8zM12 15a1 1 0 100-2H6.414l1.293-1.293a1 1 0 10-1.414-1.414l-3 3a1 1 0 000 1.414l3 3a1 1 0 001.414-1.414L6.414 15H12z"></path></svg>
                        <span class="text-[9px] font-bold">انتقال</span>
                    </button>
                    <button onclick="switchView('statement')" id="nav-statement" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"></path></svg>
                        <span class="text-[9px] font-bold">گردش</span>
                    </button>
                    <button onclick="switchView('settings')" id="nav-settings" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"></path></svg>
                        <span class="text-[9px] font-bold">تنظیمات</span>
                    </button>
                </nav>
            </div>
        </div>

    </div>

    <!-- JS Logic -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxht2J09hNVk1BZkfYUz3gTMWZV2SfhmzbHzMJGZRcklx4wA3hManMcKu74jHspQ3UoFg/exec";

        let clientToken = localStorage.getItem('vestaToken');
        let currentCard = null;
        let isCvvVisible = false;

        window.onload = function() {
            if (clientToken) { showDashboard(); loadBankData(); }
        };

        const fmt = (num) => Number(num).toLocaleString('fa-IR');
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const colorClass = type === 'error' ? 'bg-red-500/90 text-white' : 'bg-cyan-500/90 text-white';
            toast.className = `px-4 py-3 rounded-2xl border backdrop-blur-md shadow-2xl transition-all duration-300 text-xs font-bold text-center ${colorClass}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function showConfirm(msg, onConfirm) {
            const mod = document.getElementById('confirmModal');
            document.getElementById('confirmMsg').innerText = msg;
            mod.classList.remove('hidden-view');
            document.getElementById('btnConfirmOk').onclick = () => { mod.classList.add('hidden-view'); onConfirm(); };
            document.getElementById('btnConfirmCancel').onclick = () => { mod.classList.add('hidden-view'); };
        }

        function showLoader(show) { document.getElementById('bankLoader').classList[show ? 'remove' : 'add']('hidden-view'); }

        async function requestApi(payload) {
            try { return await (await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) })).json(); }
            catch (err) { return { status: 'error', message: 'خطای اتصال به سرور' }; }
        }

        function toggleAuth(type) {
            document.getElementById('loginForm').classList[type === 'login' ? 'remove' : 'add']('hidden-view');
            document.getElementById('registerForm').classList[type === 'register' ? 'remove' : 'add']('hidden-view');
        }

        async function forgotPasswordPrompt() {
            const nc = document.getElementById('lUser').value;
            if (!nc) return showToast("برای فراموشی رمز عبور، لطفاً ابتدا کد ملی خود را در کادر بالا وارد کنید.", 'error');
            
            showConfirm("آیا مطمئن هستید که می‌خواهید رمز عبور جدید ایجاد شده و به ایمیل شما ارسال شود؟", async () => {
                showLoader(true);
                const res = await requestApi({ action: 'forgotPassword', nationalCode: nc });
                showLoader(false);
                showToast(res.message, res.status === 'success' ? 'info' : 'error');
            });
        }

        async function login() {
            const nc = document.getElementById('lUser').value, pass = document.getElementById('lPass').value;
            if (!nc || !pass) return showToast("کد ملی و رمز عبور را وارد کنید.", 'error');
            
            showLoader(true);
            const res = await requestApi({ action: 'login', nationalCode: nc, password: pass });
            showLoader(false);
            
            if (res.status === 'success') {
                clientToken = res.token; localStorage.setItem('vestaToken', clientToken);
                showDashboard(); loadBankData();
            } else showToast(res.message, 'error');
        }

        function showDashboard() {
            document.getElementById('authView').classList.add('hidden-view');
            document.getElementById('mainDashboard').classList.remove('hidden-view');
        }

        function logout() { localStorage.removeItem('vestaToken'); location.reload(); }

        function switchView(viewId) {
            ['home', 'transfer', 'statement', 'settings'].forEach(v => {
                const el = document.getElementById('view-' + v), nav = document.getElementById('nav-' + v);
                if(el) el.classList.add('hidden-view');
                if(nav) nav.className = "flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200";
            });
            document.getElementById('view-' + viewId).classList.remove('hidden-view');
            document.getElementById('nav-' + viewId).className = "flex flex-col items-center gap-1 text-cyan-400";
        }

        async function loadBankData() {
            showLoader(true);
            const res = await requestApi({ action: 'getDashboard', token: clientToken });
            showLoader(false);
            if (res.status === 'success') {
                const d = res.data;
                document.getElementById('clientName').innerText = d.name;
                document.getElementById('displayAccNo').innerText = d.account;
                document.getElementById('displayIban').innerText = d.iban;
                document.getElementById('displayAvailBal').innerText = fmt(d.availableBalance);
                
                if (d.card) {
                    currentCard = d.card;
                    document.getElementById('displayCardNo').innerText = d.card.number.replace(/(\d{4})/g, '$1 ').trim();
                    document.getElementById('displayHolder').innerText = d.card.holderName;
                    document.getElementById('displayExpiry').innerText = d.card.expiryDateJalali;
                    document.getElementById('displayCvv').innerText = '***';
                    isCvvVisible = false;
                }
            } else { logout(); }
        }

        function toggleCvvView() {
            if(!currentCard) return;
            isCvvVisible = !isCvvVisible;
            document.getElementById('displayCvv').innerText = isCvvVisible ? currentCard.cvv2 : '***';
        }

        async function changePinSubmit() {
            const currentPin = document.getElementById('currentPin1').value;
            const p1 = document.getElementById('newPin1').value;
            const p2 = document.getElementById('newPin2').value;

            if (!currentPin) return showToast("وارد کردن رمز اول فعلی کارت (برای احراز هویت) الزامی است.", 'error');
            if (!p1 && !p2) return showToast("حداقل یکی از کادرهای رمز جدید را تکمیل نمایید.", 'error');

            showLoader(true);
            const res = await requestApi({
                action: 'changeCardPin',
                token: clientToken,
                cardNumber: currentCard.number,
                currentPin1: currentPin,
                pin1: p1,
                pin2: p2
            });
            showLoader(false);

            showToast(res.message, res.status === 'success' ? 'info' : 'error');
            if (res.status === 'success') {
                document.getElementById('currentPin1').value = '';
                document.getElementById('newPin1').value = '';
                document.getElementById('newPin2').value = '';
            }
        }
    </script>
</body>
</html>
