    <!DOCTYPE html> 
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دریافت گواهينامه دوره</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <style>
        :root {
            --font-main: 'Vazirmatn', sans-serif;
            --primary-color: #0c4a6e;
            --secondary-color: #075985;
            --accent-color: #38bdf8;
            --container-bg: #ffffff;
            --dark-text: #1e293b;
            --light-text: #64748b;
            --border-color: #e2e8f0;
            --success-color: #16a34a;
            --danger-color: #dc2626;
            --warning-color: #f59e0b;
            --radius-lg: 16px;
            --radius-md: 12px;
            --transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            background-image: url('https://tashacol.ir/123.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            padding: 2rem 1rem;
        }
        .container {
            background-color: var(--container-bg);
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 10px 10px -5px rgba(0,0,0,0.04);
            width: 100%;
            max-width: 720px;
            text-align: center;
            box-sizing: border-box;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInSlideUp 0.8s 0.3s forwards cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        @keyframes fadeInSlideUp { to { opacity: 1; transform: translateY(0); } }
        .main-icon img { width: 80px; height: 80px; margin-bottom: 1rem; }
        h2 { font-size: 1.8rem; margin-top: 0; margin-bottom: 2rem; color: var(--primary-color); font-weight: 700; }
        .form-group { margin-bottom: 20px; }
        .input-wrapper { position: relative; }
        .input-icon { position: absolute; top: 50%; right: 15px; transform: translateY(-50%); color: var(--light-text); }
        .form-control { width: 100%; text-align: center; padding: 12px 15px; border: 1px solid #a8b3c2; border-radius: var(--radius-md); font-size: 1rem; font-family: var(--font-main); outline: none; transition: var(--transition); -webkit-appearance: none; -moz-appearance: none; appearance: none; direction: rtl; }
        .form-control:focus { border-color: var(--secondary-color); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.3); }
        .btn { position:relative; background-color: var(--secondary-color); color: white; padding: 12px 30px; border: none; border-radius: var(--radius-md); cursor: pointer; font-size: 1rem; font-family: var(--font-main); transition: all 0.3s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; width: 100%; }
        .btn:hover:not(:disabled) { background-color: var(--primary-color); transform: translateY(-2px); }
        .btn:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .btn-success { background-color: var(--success-color); }
        .btn-success:hover:not(:disabled) { background-color: #15803d; }
        .btn-secondary { background-color: #64748b; }
        .btn-secondary:hover:not(:disabled) { background-color: #475569; }
        #main-loader-container { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(8px); z-index: 50; display: none; flex-direction: column; justify-content: center; align-items: center; color: white; }
        .loader { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid var(--accent-color); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #main-loader-container p { margin-top: 1rem; font-size: 1.2rem; font-weight: 700; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.6); display: none; align-items: center; justify-content: center; z-index: 40; backdrop-filter: blur(5px); padding: 1rem; }
        .modal-content { background: white; padding: 2rem; border-radius: var(--radius-lg); width: 90%; max-width: 440px; text-align: center; box-shadow: 0 5px 25px rgba(0,0,0,0.2); }
        .modal-content p { font-size: 1.1rem; line-height: 1.8; margin-bottom: 2rem; }
        .modal-buttons { display: flex; gap: 1rem; flex-wrap: wrap; }
        .modal-button { flex: 1 1 100px; padding: 12px; border-radius: var(--radius-md); border: none; font-family: var(--font-main); font-size: 1rem; font-weight: 700; cursor: pointer; transition: transform 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .modal-button:hover { transform: translateY(-2px); }
        #btn-download-pdf { background-color: var(--success-color); color: white; }
        #btn-view-pdf { background-color: var(--accent-color); color: white; }
        #btn-close-modal { background-color: #f1f5f9; color: var(--dark-text); }
        #message-area { margin-top: 1rem; padding: 1rem; border-radius: 12px; font-weight: 500; display: none; line-height: 1.8; animation: fadeInSlideUp 0.5s forwards; text-align: right;}
        .message-success { background-color: #dcfce7; color: #15803d; border: 1px solid #86efac;}
        .message-error { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5;}
        .message-info { background-color: #dbeafe; color: #1e40af; border: 1px solid #93c5fd;}
        .recaptcha-wrapper { display: flex; justify-content: center; margin-bottom: 20px; }
        
        /* کارت‌های گواهی */
        #certificates-area { display: none; flex-direction: column; gap: 1rem; margin-top: 1.5rem; text-align: right; }
        #certificates-area .area-title { font-size: 1.15rem; font-weight: 700; color: var(--primary-color); margin-bottom: 0.5rem; }
        .certificate-card { background: #f8fafc; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1rem 1.2rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; transition: var(--transition); }
        .certificate-card:hover { border-color: var(--accent-color); background: #f0f9ff; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15); }
        .certificate-card .cert-info { flex: 1 1 260px; }
        .certificate-card .cert-info h4 { font-size: 1.05rem; color: var(--primary-color); margin-bottom: 0.4rem; font-weight: 700; }
        .certificate-card .cert-info p { font-size: 0.85rem; color: var(--light-text); margin: 0.15rem 0; }
        .certificate-card .cert-info .score-badge { display: inline-flex; align-items: center; gap: 4px; background: #dcfce7; color: #166534; padding: 3px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; margin-top: 0.4rem; }
        .certificate-card .cert-info .no-exam-badge { display: inline-flex; align-items: center; gap: 4px; background: #f1f5f9; color: #475569; padding: 3px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; margin-top: 0.4rem; }
        .certificate-card .cert-action { flex: 0 0 auto; }
        .certificate-card .cert-action .btn { width: auto; padding: 10px 18px; font-size: 0.9rem; }
        #btn-reset-form { margin-top: 1.5rem; width: auto; padding: 10px 20px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <div id="main-loader-container">
            <div class="loader"></div>
            <p id="loader-text">لطفاً کمی صبر کنید</p>
        </div>
        
        <!-- مودال دانلود/مشاهده PDF -->
        <div class="modal-overlay" id="pdf-modal">
            <div class="modal-content">
                <p id="pdf-modal-message">گواهینامه شما با موفقیت ساخته شد. چه کاری می‌خواهید انجام دهید؟</p>
                <div class="modal-buttons">
                    <button id="btn-download-pdf" class="modal-button"><i class="fa-solid fa-download"></i>دانلود</button>
                    <button id="btn-view-pdf" class="modal-button"><i class="fa-solid fa-eye"></i>مشاهده</button>
                    <button id="btn-close-modal" class="modal-button"><i class="fa-solid fa-xmark"></i>بستن</button>
                </div>
            </div>
        </div>

        <div id="content-wrapper">
            <div class="main-icon">
                 <img src="https://tashacol.ir/1754843708220.png" alt="لوگو موسسه تعالی">
            </div>
            <h2>دریافت گواهينامه دوره</h2>
            <form id="certificate-form">
                <div class="form-group">
                    <div class="input-wrapper">
                        <i class="fa-solid fa-id-card input-icon"></i>
                        <input type="text" id="nationalId" class="form-control" required inputmode="numeric" pattern="[0-9]*" placeholder="کد ملی خود را وارد کنید">
                    </div>
                </div>
                
                <div class="recaptcha-wrapper">
                    <div class="g-recaptcha" data-sitekey="6Lc1vqkrAAAAAHLHbzPMzlREvKwgHDNSmakrB-aq"></div>
                </div>

                <button type="submit" id="btn-submit" class="btn"><i class="fa-solid fa-magnifying-glass"></i>بررسی</button>
            </form>
            
            <div id="message-area"></div>
            
            <div id="certificates-area"></div>
            
            <button id="btn-reset-form" class="btn btn-secondary" style="display: none;"><i class="fa-solid fa-rotate-left"></i>بررسی کد ملی دیگر</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyAwSgCHS706Ksb7d987pKj5vUV7oFyGxY1TR_KUKZPaMoM-RJEOrgN5lSVP7--SsO96g/exec";
        
        let currentSessionToken = null;
        let currentPdfBlob = null;
        let currentPdfFileName = 'certificate.pdf';
        let currentCertificates = [];

        const pdfModal = document.getElementById('pdf-modal');
        const pdfModalMessage = document.getElementById('pdf-modal-message');
        const btnDownloadPdf = document.getElementById('btn-download-pdf');
        const btnViewPdf = document.getElementById('btn-view-pdf');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const mainLoader = document.getElementById('main-loader-container');
        const loaderText = document.getElementById('loader-text');
        const certificateForm = document.getElementById('certificate-form');
        const submitBtn = document.getElementById('btn-submit');
        const messageArea = document.getElementById('message-area');
        const certificatesArea = document.getElementById('certificates-area');
        const btnResetForm = document.getElementById('btn-reset-form');
        const nationalIdInput = document.getElementById('nationalId');
        
        async function apiCall(body) { 
            try { 
                const response = await fetch(SCRIPT_URL, { 
                    method: 'POST', 
                    body: JSON.stringify(body),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                }); 
                if (!response.ok) throw new Error(`خطای شبکه: ${response.status}`); 
                return await response.json(); 
            } catch (error) { 
                console.error("API Call failed:", error); 
                return { status: 'error', message: 'خطا در ارتباط با سرور. لطفاً اتصال اینترنت خود را بررسی کنید.' }; 
            } 
        }
        
        function showMessage(message, type) { 
            messageArea.innerHTML = message; 
            messageArea.className = `message-${type}`; 
            messageArea.style.display = 'block'; 
        }
        function hideMessage() { messageArea.style.display = 'none'; }
        function showLoader(text = "لطفاً کمی صبر کنید...") { loaderText.textContent = text; mainLoader.style.display = 'flex'; }
        function hideLoader() { mainLoader.style.display = 'none'; }
        
        function b64toBlob(b64Data, contentType = '') { 
            const byteCharacters = atob(b64Data); 
            const byteArrays = []; 
            for (let offset = 0; offset < byteCharacters.length; offset += 512) { 
                const slice = byteCharacters.slice(offset, offset + 512); 
                const byteNumbers = new Array(slice.length); 
                for (let i = 0; i < slice.length; i++) { 
                    byteNumbers[i] = slice.charCodeAt(i); 
                } 
                byteArrays.push(new Uint8Array(byteNumbers)); 
            } 
            return new Blob(byteArrays, { type: contentType }); 
        }

        function escapeHtml(value) {
            return String(value === null || value === undefined ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function renderCertificatesList(certificates) {
            currentCertificates = certificates;
            if (!certificates || certificates.length === 0) {
                certificatesArea.style.display = 'none';
                return;
            }
            
            let html = '<div class="area-title"><i class="fa-solid fa-award"></i> دوره‌های قابل دریافت گواهی:</div>';
            
            certificates.forEach((cert, index) => {
                const scoreBadge = cert.hasExam
                    ? `<span class="score-badge"><i class="fa-solid fa-star"></i> نمره: ${escapeHtml(cert.score)} از ۱۰۰</span>`
                    : `<span class="no-exam-badge"><i class="fa-solid fa-check"></i> بدون آزمون</span>`;
                
                const dateInfo = (cert.startDate || cert.endDate)
                    ? `<p><i class="fa-solid fa-calendar-days" style="color:var(--light-text); margin-left:4px;"></i> از ${escapeHtml(cert.startDate) || '—'} تا ${escapeHtml(cert.endDate) || '—'}</p>`
                    : '';
                
                html += `
                    <div class="certificate-card">
                        <div class="cert-info">
                            <h4>${escapeHtml(cert.courseName || 'نام دوره نامشخص')}</h4>
                            ${dateInfo}
                            ${scoreBadge}
                        </div>
                        <div class="cert-action">
                            <button type="button" class="btn btn-success generate-cert-btn" data-row-index="${cert.rowIndex}">
                                <i class="fa-solid fa-file-circle-plus"></i>ساخت گواهینامه
                            </button>
                        </div>
                    </div>
                `;
            });
            
            certificatesArea.innerHTML = html;
            certificatesArea.style.display = 'flex';
            
            certificatesArea.querySelectorAll('.generate-cert-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const rowIndex = btn.dataset.rowIndex;
                    generateCertificate(rowIndex, btn);
                });
            });
        }

        async function generateCertificate(rowIndex, buttonEl) {
            if (!currentSessionToken) {
                showMessage('نشست شما منقضی شده است. لطفاً دوباره کد ملی خود را وارد کنید.', 'error');
                return;
            }
            
            hideMessage();
            showLoader("در حال ساخت گواهینامه، لطفاً شکیبا باشید...");
            
            if (buttonEl) {
                buttonEl.disabled = true;
                buttonEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>در حال ساخت...';
            }
            
            try {
                const response = await apiCall({
                    action: 'generateCertificate',
                    sessionToken: currentSessionToken,
                    rowIndex: rowIndex
                });
                
                hideLoader();
                
                if (response && response.status === 'success') {
                    currentPdfBlob = b64toBlob(response.data, response.mimeType || 'application/pdf');
                    currentPdfFileName = response.fileName || 'certificate.pdf';
                    
                    pdfModalMessage.innerHTML = 'گواهینامه شما با موفقیت ساخته شد. چه کاری می‌خواهید انجام دهید؟';
                    pdfModal.style.display = 'flex';
                } else {
                    const msg = (response && response.message) || 'خطایی در ساخت گواهینامه رخ داد.';
                    showMessage(msg, 'error');
                    if (msg.indexOf('منقضی') !== -1 || msg.indexOf('کد ملی') !== -1) {
                        // session expired - show form again
                        resetForm();
                    }
                }
            } catch (err) {
                hideLoader();
                showMessage('خطای غیرمنتظره: ' + err.message, 'error');
            } finally {
                if (buttonEl) {
                    buttonEl.disabled = false;
                    buttonEl.innerHTML = '<i class="fa-solid fa-file-circle-plus"></i>ساخت گواهینامه';
                }
            }
        }

        function resetForm() {
            currentSessionToken = null;
            currentPdfBlob = null;
            currentCertificates = [];
            certificatesArea.style.display = 'none';
            certificatesArea.innerHTML = '';
            certificateForm.style.display = 'block';
            document.querySelector('.recaptcha-wrapper').style.display = 'flex';
            document.querySelector('.main-icon').style.display = 'block';
            document.querySelector('h2').style.display = 'block';
            btnResetForm.style.display = 'none';
            hideMessage();
            if (window.grecaptcha && grecaptcha.reset) {
                try { grecaptcha.reset(); } catch (e) {}
            }
        }

        certificateForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const recaptchaToken = grecaptcha.getResponse();
            if (!recaptchaToken) {
                showMessage('لطفاً تأیید کنید که ربات نیستید.', 'error');
                return;
            }
            
            const nationalIdValue = nationalIdInput.value.trim();
            if (!nationalIdValue) {
                showMessage('لطفاً کد ملی خود را وارد کنید.', 'error');
                return;
            }
            
            hideMessage();
            showLoader("در حال بررسی کد ملی...");
            submitBtn.disabled = true;
            currentPdfBlob = null;
            
            try {
                const response = await apiCall({
                    action: 'verifyUser',
                    nationalId: nationalIdValue,
                    recaptchaToken: recaptchaToken
                });
                
                hideLoader();
                if (window.grecaptcha && grecaptcha.reset) {
                    try { grecaptcha.reset(); } catch (e) {}
                }
                
                if (response && response.status === 'success' && response.certificates) {
                    currentSessionToken = response.sessionToken;
                    
                    // مخفی کردن فرم
                    certificateForm.style.display = 'none';
                    document.querySelector('.recaptcha-wrapper').style.display = 'none';
                    document.querySelector('.main-icon').style.display = 'none';
                    document.querySelector('h2').style.display = 'none';
                    btnResetForm.style.display = 'inline-flex';
                    
                    renderCertificatesList(response.certificates);
                    showMessage(
                        `تعداد <strong>${response.certificates.length}</strong> گواهی برای کد ملی <strong>${escapeHtml(response.nationalId)}</strong> یافت شد.`,
                        'success'
                    );
                } else {
                    const msg = (response && response.message) || 'پاسخی از سرور دریافت نشد.';
                    showMessage(msg, response && response.status === 'not_found' ? 'info' : 'error');
                }
            } catch (err) {
                hideLoader();
                showMessage('خطای غیرمنتظره: ' + err.message, 'error');
            } finally {
                submitBtn.disabled = false;
            }
        });

        // رویدادهای مودال PDF
        btnDownloadPdf.addEventListener('click', () => {
            if (!currentPdfBlob) return;
            const url = URL.createObjectURL(currentPdfBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = currentPdfFileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 5000);
            pdfModal.style.display = 'none';
        });
        
        btnViewPdf.addEventListener('click', () => {
            if (!currentPdfBlob) return;
            const url = URL.createObjectURL(currentPdfBlob);
            window.open(url, '_blank');
        });
        
        btnCloseModal.addEventListener('click', () => {
            pdfModal.style.display = 'none';
            currentPdfBlob = null;
        });

        // رویداد ریست
        btnResetForm.addEventListener('click', resetForm);

        // مقداردهی اولیه
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const nationalIdFromUrl = urlParams.get('id');
            if (nationalIdFromUrl) {
                nationalIdInput.value = nationalIdFromUrl;
            }
        });
    </script>
</body>
</html>
